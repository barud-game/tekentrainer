<script>
/* oefeningen/arcering.js */
// Arceerveld: vul een vorm met evenwijdige streken (gelijke hoek, afstand en druk).
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;
  const MIN_STREKEN = 5, MAX_STREKEN = 20;
  const CEL = 8;           // px: rasterstap voor dekking
  const GRENS = 6;         // px buiten de vorm = "buiten"
  const MAX_KROM = 0.10;   // maximale afwijking/lengte van een 'rechte' streek (cirkels, bogen en krullen vallen erbuiten)

  // Per niveau: vorm(en), hoeken (graden), afstand als fractie van de vormdiameter,
  // of de voorbeeldlijnen blijven staan, drempelfactor, soort (const/verloop/kruis).
  const NIVEAUS = {
    1: { vormen: ['vierkant'], hoeken: [45], d: 0.14, blijf: true, f: 1, soort: 'const' },
    2: { vormen: ['cirkel'], hoeken: [0, 30, 45, 60, 90], d: 0.11, blijf: false, f: 1, soort: 'const' },
    3: { vormen: ['blob'], hoeken: null, d: 0.085, blijf: false, f: 0.8, soort: 'const' },
    4: { vormen: ['vierkant', 'cirkel'], hoeken: [0, 30, 45, 60, 90, 120, 135, 150], d: 0.11, blijf: false, f: 1, soort: 'verloop' },
    5: { vormen: ['vierkant', 'cirkel', 'blob'], hoeken: [0, 30, 45, 60, 90, 120], d: 0.125, blijf: false, f: 0.7, soort: 'kruis' },
  };

  // ---------- vorm ----------
  function blobR(o, phi) {
    return o.R * (1 + o.a1 * Math.cos(2 * phi + o.p1) + o.a2 * Math.cos(3 * phi + o.p2));
  }
  // Afstand tot de rand in px; > 0 = buiten, <= 0 = binnen (bij benadering voor de blob).
  function buiten(o, x, y) {
    const dx = x - o.cx, dy = y - o.cy;
    if (o.vorm === 'vierkant') {
      const qx = Math.abs(dx) - o.R, qy = Math.abs(dy) - o.R;
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0);
    }
    if (o.vorm === 'cirkel') return Math.hypot(dx, dy) - o.R;
    return Math.hypot(dx, dy) - blobR(o, Math.atan2(dy, dx));
  }
  function pad(ctx, o) {
    ctx.beginPath();
    if (o.vorm === 'vierkant') ctx.rect(o.cx - o.R, o.cy - o.R, 2 * o.R, 2 * o.R);
    else if (o.vorm === 'cirkel') ctx.arc(o.cx, o.cy, o.R, 0, Math.PI * 2);
    else {
      for (let i = 0; i <= 120; i++) {
        const f = i / 120 * Math.PI * 2, r = blobR(o, f);
        const x = o.cx + r * Math.cos(f), y = o.cy + r * Math.sin(f);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
    }
  }

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const half = Math.min(vlak.w * 0.40, vlak.h * 0.38);
    const vorm = rng.kies(n.vormen);
    const o = {
      niveau, vorm, cx: vlak.w / 2, cy: vlak.h * 0.53, f: n.f, soort: n.soort, blijf: n.blijf,
      verbergNa: n.blijf ? 0 : 3000,
    };
    if (vorm === 'blob') {
      o.a1 = rng.tussen(0.07, 0.11); o.a2 = rng.tussen(0.05, 0.09);
      o.p1 = rng.tussen(0, 6.28); o.p2 = rng.tussen(0, 6.28);
      o.R = half / (1 + o.a1 + o.a2);
    } else o.R = half;
    o.D = 2 * o.R;
    const d = n.d * o.D;
    const hoek = (n.hoeken ? rng.kies(n.hoeken) : Math.round(rng.tussen(0, 36)) * 5) * RAD;
    if (n.soort === 'kruis') {
      const verschil = rng.kies([30, 45, 60, 75, 90]) * RAD;
      o.lagen = [{ hoek, d }, { hoek: hoek + verschil, d }];
    } else if (n.soort === 'verloop') {
      const kant = rng.kies([-1, 1]);
      let g = [];
      const dA = 1.55 * d, dB = 0.55 * d;
      // aantal gaten zodat de som ~ 92% van de diameter is
      let m = 2;
      while (m < 40 && m * (dA + dB) / 2 < 0.92 * o.D) m++;
      for (let j = 0; j < m; j++) g.push(dA + (dB - dA) * j / (m - 1));
      const som = g.reduce((s, v) => s + v, 0);
      g = g.map((v) => v * 0.92 * o.D / som);
      if (kant < 0) g.reverse();
      o.lagen = [{ hoek, d: H.gemiddelde(g), verloop: { kant, gaten: g } }];
    } else o.lagen = [{ hoek, d }];
    // Posities (loodrecht op de laag) van de voorbeeldlijnen.
    for (const l of o.lagen) {
      if (l.verloop) {
        l.voorbeeld = [-0.46 * o.D];
        for (const v of l.verloop.gaten) l.voorbeeld.push(l.voorbeeld[l.voorbeeld.length - 1] + v);
        l.ideaal = l.voorbeeld;
      } else {
        l.voorbeeld = [-l.d, 0, l.d];
        const k = Math.floor(0.5 * o.D / l.d);
        l.ideaal = [];
        for (let j = -k; j <= k; j++) l.ideaal.push(j * l.d);
      }
    }
    return o;
  }

  function lijnen(ctx, o, laag, posities) {
    const ux = Math.cos(laag.hoek), uy = Math.sin(laag.hoek), L = o.D;
    ctx.beginPath();
    for (const c of posities) {
      const px = o.cx - uy * c, py = o.cy + ux * c;
      ctx.moveTo(px - ux * L, py - uy * L);
      ctx.lineTo(px + ux * L, py + uy * L);
    }
    ctx.stroke();
  }

  function teken(ctx, o, vlak, info) {
    ctx.save();
    pad(ctx, o);
    ctx.fillStyle = vlak.kleur.hulpZacht;
    ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (!info.verborgen) {
      pad(ctx, o);
      ctx.clip();
      ctx.strokeStyle = vlak.kleur.accent;
      ctx.lineWidth = 2.5;
      for (const l of o.lagen) lijnen(ctx, o, l, l.voorbeeld);
    }
    ctx.restore();
  }

  // ---------- nakijken ----------
  const wrap = (rad) => { let d = rad % Math.PI; if (d > Math.PI / 2) d -= Math.PI; if (d <= -Math.PI / 2) d += Math.PI; return d; };

  // Eindig getal binnen 0..100 (NaN/Infinity worden 0), zodat de motor nooit een kapotte score krijgt.
  const fin = (v) => (Number.isFinite(v) ? H.clamp(v, 0, 100) : 0);
  const eindig = (v, standaard) => (Number.isFinite(v) ? v : standaard);

  // Geeft de rechte streken terug; de te kromme (cirkels, bogen) worden geteld in uit.krom.
  function geldigeStreken(o, streken) {
    const uit = [];
    uit.krom = 0;
    (streken || []).forEach((s, idx) => {
      const ruw = s && Array.isArray(s.punten) ? s.punten.filter((p) => p && Number.isFinite(p.x) && Number.isFinite(p.y)) : null;
      if (!ruw || ruw.length < 2) return;
      const len = H.lengte(ruw);
      if (!(len >= 0.15 * o.D)) return; // tikjes
      const pts = H.herbemonster(ruw, 4);
      if (pts.length < 3) return;
      const fit = H.lijnFit(pts);
      let maxAfw = 0;
      for (const p of pts) maxAfw = Math.max(maxAfw, Math.abs(H.lijnAfstand(p, { x: fit.mx, y: fit.my }, fit.dx, fit.dy)));
      const a = ruw[0], b = ruw[ruw.length - 1];
      if (!Number.isFinite(maxAfw) || maxAfw / len > MAX_KROM) { uit.krom++; return; }
      uit.push({
        idx, pts, len, hoek: fit.hoek, r: maxAfw / len,
        mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
        dx: b.x - a.x, dy: b.y - a.y,
        druk: H.gemiddelde(ruw.map((p) => (Number.isFinite(p.p) ? p.p : 0.5))),
      });
    });
    return uit;
  }

  function regressie(ys) {
    const m = ys.length, xm = (m - 1) / 2, ym = H.gemiddelde(ys);
    let sxy = 0, sxx = 0;
    for (let j = 0; j < m; j++) { sxy += (j - xm) * (ys[j] - ym); sxx += (j - xm) ** 2; }
    const b = sxx ? sxy / sxx : 0, a = ym - b * xm;
    return { a, b, fit: (j) => a + b * j };
  }

  function analyseLaag(o, laag, st, cellen) {
    const f = o.f;
    const L = (x, g, s) => H.lin(x, g * f, s * f);
    const res = { n: st.length, fout: new Set(), gaten: [] };
    if (st.length < 3) { res.leeg = true; res.hoekScore = res.afstandScore = 0; res.dek = 0; res.onbedekt = cellen.map(() => true); return res; }

    // Criterium 1: hoek (evenwijdig, juiste schuinte, recht).
    const diffs = st.map((s) => wrap(s.hoek - laag.hoek) / RAD);
    const sdHoek = H.sd(diffs), gemDiff = H.gemiddelde(diffs);
    res.sdHoek = sdHoek; res.gemDiff = gemDiff;
    res.r = H.gemiddelde(st.map((s) => s.r));
    res.hoekScore = 100 * (0.4 * L(sdHoek, 2, 8) + 0.35 * L(Math.abs(gemDiff), 3, 12) + 0.25 * L(res.r, 0.02, 0.07));
    st.forEach((s, i) => { if (Math.abs(diffs[i]) > 6) res.fout.add(s.idx); });

    // Criterium 2: afstand (gelijkmatig, geen gaten). Loodrecht op de gemiddelde hoek.
    const th = laag.hoek + gemDiff * RAD, nx = -Math.sin(th), ny = Math.cos(th);
    const gesorteerd = st.map((s) => ({ s, q: s.mid.x * nx + s.mid.y * ny })).sort((a, b) => a.q - b.q);
    const gaten = [];
    for (let i = 1; i < gesorteerd.length; i++) gaten.push(gesorteerd[i].q - gesorteerd[i - 1].q);
    const mu = H.gemiddelde(gaten);
    res.mu = mu; res.doel = laag.d; res.th = th;
    const reg = regressie(gaten), m = gaten.length;
    res.cv = mu > 0 ? H.sd(gaten) / mu : 1;
    // Ondergrens voor de 'hoort-te-zijn' ruimte: voorkomt delen door (bijna) nul bij lijnen op één plek.
    const vloer = 0.3 * (laag.verloop ? Math.min(...laag.verloop.gaten) : laag.d);
    let ref;
    if (laag.verloop) {
      const kant = laag.verloop.kant;
      const f0 = reg.fit(0), f1 = reg.fit(m - 1);
      const groot = kant > 0 ? f0 : f1, klein = kant > 0 ? f1 : f0;
      res.verloopF = groot > 0 ? (groot - klein) / groot : 0;
      const resid = gaten.map((g, j) => g - reg.fit(j));
      res.residCv = mu > 0 ? H.sd(resid) / mu : 1;
      ref = (j) => Math.max(vloer, reg.fit(j));
    } else {
      res.afwDoel = Math.abs(mu - laag.d) / laag.d;
      const f0 = reg.fit(0), f1 = reg.fit(m - 1), groot = Math.max(f0, f1), klein = Math.min(f0, f1);
      res.trend = m >= 4 && groot > 0 ? (groot - klein) / groot : 0;
      const resid = gaten.map((g, j) => g - reg.fit(j));
      res.residCv = mu > 0 ? H.sd(resid) / mu : 1;
      const med = H.mediaan(gaten);
      const refMed = Math.max(vloer, med);
      ref = () => refMed;
    }
    // Grootste afwijking van één tussenruimte t.o.v. wat hij hoort te zijn.
    let maxAfw = 0;
    res.gatTeGroot = res.gatTeKlein = false;
    for (let j = 0; j < m; j++) {
      const r = ref(j), v = (gaten[j] - r) / r;
      maxAfw = Math.max(maxAfw, Math.abs(v));
      if (v > 0.4) { res.gatTeGroot = true; res.gaten.push({ q0: gesorteerd[j].q, q1: gesorteerd[j + 1].q }); }
      else if (v < -0.4) { res.gatTeKlein = true; res.fout.add(gesorteerd[j + 1].s.idx); }
    }
    res.maxAfw = maxAfw;
    if (laag.verloop) res.afstandScore = 100 * (0.4 * L(res.residCv, 0.08, 0.35) + 0.25 * H.lin(res.verloopF, 0.4, 0.05) + 0.35 * L(maxAfw, 0.3, 0.8));
    else res.afstandScore = 100 * (0.4 * L(res.cv, 0.08, 0.30) + 0.25 * L(res.afwDoel, 0.15, 0.5) + 0.35 * L(maxAfw, 0.3, 0.8));

    // Criterium 3 (deels): dekking van het vak door deze laag.
    // Ruime tolerantie: kleine onregelmaat telt bij Afstand, hier telt alleen echt leeg gebied.
    const tol = laag.verloop
      ? 0.75 * Math.max(...laag.verloop.gaten)
      : 0.75 * laag.d;
    res.onbedekt = cellen.map(([x, y]) => {
      for (const s of st) if (H.polyAfstand({ x, y }, s.pts) <= tol) return false;
      return true;
    });
    res.dek = 1 - res.onbedekt.filter(Boolean).length / Math.max(1, cellen.length);
    return res;
  }

  function groepeer(o, st) {
    const groepen = o.lagen.map(() => []);
    for (const s of st) {
      let best = 0, bd = Infinity;
      o.lagen.forEach((l, i) => { const d = H.lijnHoekVerschil(s.hoek, l.hoek); if (d < bd) { bd = d; best = i; } });
      groepen[best].push(s);
    }
    return groepen;
  }

  // Score = deels gemiddelde, deels zwakste criterium: één slecht onderdeel kun je niet wegpoetsen.
  function nakijken(o, streken) {
    const st = geldigeStreken(o, streken);
    if (st.length < MIN_STREKEN && st.krom >= st.length && st.krom > 0)
      return { ongeldig: 'Teken rechte, evenwijdige lijnen in het vlak', behoud: true };
    if (st.length < MIN_STREKEN)
      return { ongeldig: 'Nog ' + st.length + ' lijnen; teken er minstens ' + MIN_STREKEN + ' en tik dan op Klaar.', behoud: true };
    const groepen = groepeer(o, st);
    if (groepen.some((g) => g.length < 3))
      return { ongeldig: o.lagen.length > 1 ? 'Teken in beide richtingen minstens 3 lijnen en tik dan op Klaar.' : 'Teken minstens 3 lijnen onder de juiste hoek.', behoud: true };

    // Raster van cellen binnen de vorm.
    const cellen = [];
    for (let y = o.cy - o.R; y <= o.cy + o.R; y += CEL)
      for (let x = o.cx - o.R; x <= o.cx + o.R; x += CEL)
        if (buiten(o, x, y) <= 0) cellen.push([x, y]);

    const lagen = o.lagen.map((l, i) => analyseLaag(o, l, groepen[i], cellen));
    const gem = (k) => H.gemiddelde(lagen.map((l) => l[k]));

    // Buiten de vorm: aandeel punten > GRENS px buiten.
    let tot = 0, bui = 0;
    for (const s of st) for (const p of s.pts) { tot++; if (buiten(o, p.x, p.y) > GRENS) bui++; }
    const buitenPct = 100 * bui / Math.max(1, tot);
    const dek = gem('dek');
    const dekScore = Math.max(0, 100 * H.lin(dek, 0.85, 0.45) - 4 * buitenPct);

    const hoek = Math.round(fin(gem('hoekScore'))), afstand = Math.round(fin(gem('afstandScore'))), dekking = Math.round(fin(dekScore));
    const crit = [hoek, afstand, dekking];
    const score = Math.round(fin(0.6 * H.gemiddelde(crit) + 0.4 * Math.min(...crit)));

    // Gemarkeerde (foute) streken, gaten en onbedekte cellen.
    const fout = new Set();
    lagen.forEach((l) => l.fout.forEach((i) => fout.add(i)));
    const gaten = [];
    lagen.forEach((l) => l.gaten.forEach((g) => gaten.push({ th: l.th, q0: g.q0, q1: g.q1 })));
    const onbedekt = [];
    cellen.forEach((c, i) => { if (lagen.some((l) => l.onbedekt[i])) onbedekt.push(c); });

    const u = { score, hoek, afstand, dekking, fout: Array.from(fout), gaten, onbedekt, buitenPct: eindig(buitenPct, 0), dek: eindig(dek, 0) };
    u.tip = tip(lagen, u);
    return u;
  }

  function tip(lagen, u) {
    const max = (k) => Math.max(0, ...lagen.map((l) => (Number.isFinite(l[k]) ? l[k] : 0)));
    const kop = 'Hoek ' + u.hoek + ' · Afstand ' + u.afstand + ' · Dekking ' + u.dekking + ' — ';
    const zwak = [['hoek', u.hoek], ['afstand', u.afstand], ['dekking', u.dekking]].sort((a, b) => a[1] - b[1])[0];
    if (zwak[1] >= 85) return kop + 'mooie, gelijkmatige arcering.';
    let t;
    if (zwak[0] === 'hoek') {
      const kand = [
        [max('sdHoek') / 6, 'Je lijnen zijn niet evenwijdig; de rode lijnen staan scheef. Beweeg vanuit je schouder.'],
        [Math.max(0, ...lagen.map((l) => (Number.isFinite(l.gemDiff) ? Math.abs(l.gemDiff) : 0))) / 8, 'Al je lijnen wijken af van de hoek van het voorbeeld; kijk goed naar de schuine lijnen.'],
        [max('r') / 0.05, 'Je lijnen buigen; trek ze in één vlotte beweging.'],
      ].sort((a, b) => b[0] - a[0]);
      t = 'Hoek is je zwakste punt. ' + kand[0][1];
    } else if (zwak[0] === 'afstand') {
      const g = lagen.find((l) => l.gatTeGroot), k = lagen.find((l) => l.gatTeKlein);
      const tr = lagen.find((l) => l.trend > 0.3 && l.residCv < 0.25);
      const vl = lagen.find((l) => l.verloopF !== undefined && l.verloopF < 0.2);
      const afw = lagen.find((l) => l.afwDoel > 0.3);
      if (vl) t = 'Laat de afstand tussen de lijnen geleidelijk kleiner worden naar één kant.';
      else if (g) t = 'Er zitten gaten tussen je lijnen (rode vlakken); houd de ruimte overal gelijk.';
      else if (k) t = 'Sommige lijnen staan te dicht op elkaar (rood); houd de ruimte overal gelijk.';
      else if (tr) t = 'Je lijnen kruipen steeds dichter naar elkaar toe.';
      else if (afw) t = afw.mu > afw.doel ? 'Je lijnen staan te ver uit elkaar; zet ze dichter bij elkaar.' : 'Je lijnen staan te dicht op elkaar; geef meer ruimte.';
      else t = 'De ruimte tussen je lijnen is wisselend; kijk naar het voorbeeld.';
      t = 'Afstand is je zwakste punt. ' + t;
    } else {
      t = 'Dekking is je zwakste punt. ' + (u.buitenPct > 4 ? 'Je gaat buiten de vorm (rood); stop je streek bij de rand.' : 'Er blijven stukken leeg (rood); vul de hele vorm.');
    }
    return kop + t;
  }

  // ---------- uitslag ----------
  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    pad(ctx, o);
    ctx.clip();
    // Onbedekte delen licht gemarkeerd.
    ctx.fillStyle = vlak.kleur.fout;
    ctx.globalAlpha = 0.16;
    for (const [x, y] of u.onbedekt) ctx.fillRect(x - CEL / 2, y - CEL / 2, CEL, CEL);
    // Te grote gaten tussen twee lijnen: duidelijker rood vlak (q = positie loodrecht op de lijnrichting).
    ctx.globalAlpha = 0.28;
    for (const g of u.gaten) {
      const ux = Math.cos(g.th), uy = Math.sin(g.th), nx = -uy, ny = ux, L = o.D, s0 = o.cx * ux + o.cy * uy;
      ctx.beginPath();
      ctx.moveTo(nx * g.q0 + ux * (s0 + L), ny * g.q0 + uy * (s0 + L));
      ctx.lineTo(nx * g.q1 + ux * (s0 + L), ny * g.q1 + uy * (s0 + L));
      ctx.lineTo(nx * g.q1 + ux * (s0 - L), ny * g.q1 + uy * (s0 - L));
      ctx.lineTo(nx * g.q0 + ux * (s0 - L), ny * g.q0 + uy * (s0 - L));
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Doelhoek als dunne lijnen.
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 1.5;
    for (const l of o.lagen) lijnen(ctx, o, l, l.verloop ? l.ideaal : l.voorbeeld);
    ctx.restore();
    // Streken met afwijkende hoek of te dicht op de buurman: rood.
    ctx.strokeStyle = vlak.kleur.fout;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.8;
    for (const i of u.fout) {
      const p = streken[i] && streken[i].punten;
      if (!p || p.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(p[0].x, p[0].y);
      for (let k = 1; k < p.length; k++) ctx.lineTo(p[k].x, p[k].y);
      ctx.stroke();
    }
    // Stukken buiten de vorm: rood.
    ctx.lineWidth = 5;
    for (const s of streken) {
      const p = s.punten;
      if (!p || p.length < 2) continue;
      ctx.beginPath();
      for (let k = 1; k < p.length; k++) {
        if (buiten(o, p[k].x, p[k].y) > GRENS && buiten(o, p[k - 1].x, p[k - 1].y) > GRENS) { ctx.moveTo(p[k - 1].x, p[k - 1].y); ctx.lineTo(p[k].x, p[k].y); }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  Tekentrainer.registreer({
    id: 'arcering',
    naam: 'Arcering',
    uitleg: 'Vul de vorm met evenwijdige lijnen. Je score hangt af van drie dingen: Hoek (alle lijnen even schuin als het voorbeeld en recht), Afstand (overal dezelfde ruimte, geen gaten) en Dekking (de hele vorm gevuld, niet erbuiten). Pauzeren mag; tik op Klaar als je klaar bent.',
    fundament: 'Ritme en consistentie in evenwijdige lijnen; de basis voor schaduw, textuur en toon.',
    meerdereStreken: true,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar: (o, streken) => {
      const st = geldigeStreken(o, streken);
      return st.length >= MAX_STREKEN && groepeer(o, st).every((g) => g.length >= 3);
    },
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

</script>
<script>
/* oefeningen/proporties.js */
// Deel & Kopieer: meten op het oog. Een lijn of vlak eerlijk verdelen en lengtes herhalen.
(function () {
  const H = window.Hulp;
  const GRAAD = Math.PI / 180;
  const TOL = { 1: 0.15, 2: 0.15, 3: 0.12, 4: 0.10, 5: 0.10 };
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  // ---------- opgave ----------

  function kiesSoort(niveau, rng) {
    const schuin = (a) => rng.tussen(-a, a);
    const gelijk = (n) => ({ soort: 'verdeel', fracs: Array.from({ length: n - 1 }, (_, i) => (i + 1) / n), gelijk: true });
    switch (niveau) {
      case 1: return Object.assign(gelijk(2), { hoek: 0 });
      case 2:
        return rng() < 0.55 ? Object.assign(gelijk(3), { hoek: 0 }) : { soort: 'kopieer', k: 1, hoek: 0 };
      case 3: {
        const hoek = rng.kies([0, 90, schuin(35)]);
        return rng() < 0.6 ? Object.assign(gelijk(rng.kies([4, 5, 5])), { hoek }) : { soort: 'kopieer', k: rng.kies([2, 2, 0.5]), hoek };
      }
      case 4: {
        const r = rng();
        const hoek = rng.kies([0, 90, schuin(25)]);
        if (r < 0.4) {
          const as = rng.kies([0, 90]);
          return Object.assign(gelijk(rng.kies([2, 3, 4])), { soort: 'rechthoek', hoek: as, zijde: as === 0 ? 'breedte' : 'hoogte' });
        }
        if (r < 0.7) return Object.assign(gelijk(rng.kies([3, 4, 5])), { hoek });
        return { soort: 'kopieer', k: rng.kies([1, 2, 1.5]), hoek };
      }
      default: {
        const hoek = rng() < 0.15 ? 90 : rng.tussen(-70, 70);
        const r = rng();
        if (r < 0.55) {
          const ratio = rng.kies([[2, 3], [3, 5], [2, 3]]);
          const s = ratio[0] + ratio[1];
          return { soort: rng() < 0.3 ? 'rechthoek' : 'verdeel', fracs: [ratio[0] / s], gelijk: false, ratio, hoek, zijde: 'dikke zijde' };
        }
        return { soort: 'kopieer', k: rng.kies([1.5, 1.5, 0.5, 2]), hoek };
      }
    }
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const sp = kiesSoort(niveau, rng);
    const w = vlak.w, h = vlak.h, m = Math.min(w, h);
    const th = sp.hoek * GRAAD;
    const u = { x: Math.cos(th), y: Math.sin(th) };
    let v = { x: -u.y, y: u.x };
    if (v.y < -1e-9 || (Math.abs(v.y) < 1e-9 && v.x < 0)) v = { x: -v.x, y: -v.y };
    if (Math.abs(u.x) < 1e-9) u.x = 0;
    if (Math.abs(v.x) < 1e-9) v.x = 0;

    // Lokale uitgebreidheid (in eenheden van L): langs u en langs v.
    const r = sp.soort === 'rechthoek' ? 0.5 + rng() * 0.35 : 0;
    const gap = 0.3;
    const a1 = sp.soort === 'kopieer' ? Math.max(1, sp.k) : 1;
    const b1 = sp.soort === 'kopieer' ? gap : r;
    const hoeken = [[0, 0], [a1, 0], [a1, b1], [0, b1]].map(([a, b]) => ({ x: a * u.x + b * v.x, y: a * u.y + b * v.y }));
    const bx0 = Math.min(...hoeken.map((p) => p.x)), bx1 = Math.max(...hoeken.map((p) => p.x));
    const by0 = Math.min(...hoeken.map((p) => p.y)), by1 = Math.max(...hoeken.map((p) => p.y));

    const pad = 0.1 * m;
    const vx0 = 0.05 * w, vx1 = 0.95 * w, vy0 = 0.17 * h, vy1 = 0.95 * h;
    const Lmax = Math.min((vx1 - vx0 - 2 * pad) / Math.max(bx1 - bx0, 1e-6), (vy1 - vy0 - 2 * pad) / Math.max(by1 - by0, 1e-6));
    const L = Math.min(Lmax, 1.3 * m) * rng.tussen(0.75, 0.97);
    const vrijX = Math.max(0, vx1 - vx0 - 2 * pad - (bx1 - bx0) * L);
    const vrijY = Math.max(0, vy1 - vy0 - 2 * pad - (by1 - by0) * L);
    const A = {
      x: vx0 + pad + rng() * vrijX - bx0 * L,
      y: vy0 + pad + rng() * vrijY - by0 * L,
    };
    const B = { x: A.x + u.x * L, y: A.y + u.y * L };
    const Q = r * L;

    const o = {
      soort: sp.soort, niveau, A, B, u, v, L, Q, hoek: sp.hoek, tol: TOL[niveau],
      bbox: { x0: vx0 + 0, x1: vx1, y0: 0, y1: 0 },
    };
    o.bbox = {
      x0: A.x + bx0 * L - pad, x1: A.x + bx1 * L + pad,
      y0: A.y + by0 * L - pad, y1: A.y + by1 * L + pad,
    };
    if (sp.soort === 'kopieer') {
      o.k = sp.k;
      o.T = sp.k * L;
      o.S = { x: A.x + v.x * gap * L, y: A.y + v.y * gap * L };
      o.E = { x: o.S.x + u.x * o.T, y: o.S.y + u.y * o.T };
    } else {
      o.fracs = sp.fracs;
      o.gelijk = sp.gelijk;
      o.ratio = sp.ratio;
      o.zijde = sp.zijde;
    }
    if (niveau === 4) o.verbergNa = 3000;
    o.tekst = tekstVoor(o);
    return o;
  }

  function tekstVoor(o) {
    if (o.soort === 'kopieer') {
      if (o.k === 1) {
        const ah = Math.abs(o.hoek);
        return 'Teken dezelfde lengte ' + (ah < 10 ? 'eronder' : ah === 90 ? 'ernaast' : 'evenwijdig') + ', vanaf de stip';
      }
      const w = o.k === 2 ? 'een lijn van 2× deze lengte' : o.k === 0.5 ? 'een lijn van de helft van deze lengte' : 'een lijn van 1,5× deze lengte';
      return 'Teken ' + w + ', vanaf de stip';
    }
    const N = o.fracs.length;
    const wat = o.soort === 'rechthoek' ? 'de ' + o.zijde : 'de lijn';
    if (!o.gelijk) return 'Zet 1 streepje dat ' + wat + ' verdeelt in ' + o.ratio[0] + ' : ' + o.ratio[1];
    if (N === 1) return 'Zet 1 streepje dat ' + wat + ' in 2 gelijke delen verdeelt';
    return 'Zet ' + N + ' streepjes die ' + wat + ' in ' + (N + 1) + ' gelijke delen verdelen';
  }

  // ---------- tekenen ----------

  const punt = (o, a, b) => ({ x: o.A.x + o.u.x * a + o.v.x * b, y: o.A.y + o.u.y * a + o.v.y * b });

  function lijn(ctx, p, q) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }

  function tick(ctx, o, P, half) {
    lijn(ctx, { x: P.x - o.v.x * half, y: P.y - o.v.y * half }, { x: P.x + o.v.x * half, y: P.y + o.v.y * half });
  }

  // Taaksymbool: groot pictogram linksboven (vaste plek), tekst wordt een kleine ondertitel ernaast.
  function symboolLabel(o) {
    if (o.soort === 'kopieer') return o.k === 1 ? '=' : o.k === 0.5 ? '½×' : String(o.k).replace('.', ',') + '×';
    if (!o.gelijk) return o.ratio[0] + ':' + o.ratio[1];
    return o.fracs.length === 1 ? '½' : '1/' + (o.fracs.length + 1);
  }

  function tekenSymbool(ctx, o, vlak, x, y, S) {
    const kl = vlak.kleur;
    const p = S * 0.13, x0 = x + p, W = S - 2 * p, x1 = x0 + W;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([]);
    ctx.strokeStyle = kl.hulp;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, S, S);
    ctx.strokeStyle = kl.tekst;
    ctx.lineWidth = Math.max(2.5, S * 0.05);
    const tk = S * 0.1;
    const verticaal = (px, cy, h) => lijn(ctx, { x: px, y: cy - h }, { x: px, y: cy + h });
    if (o.soort === 'kopieer') {
      // bovenste referentielijn, eronder de te tekenen lijn (k× zo lang) vanaf de stip
      const eenheid = W * 0.4, yr = y + S * 0.2, yc = y + S * 0.48;
      lijn(ctx, { x: x0, y: yr }, { x: x0 + eenheid, y: yr });
      verticaal(x0, yr, tk); verticaal(x0 + eenheid, yr, tk);
      ctx.strokeStyle = kl.hulp;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      lijn(ctx, { x: x0 + eenheid, y: yr + tk }, { x: x0 + eenheid, y: yc - tk });
      ctx.setLineDash([]);
      ctx.strokeStyle = kl.accent;
      ctx.lineWidth = Math.max(2.5, S * 0.05);
      lijn(ctx, { x: x0, y: yc }, { x: x0 + o.k * eenheid, y: yc });
      verticaal(x0 + o.k * eenheid, yc, tk);
      ctx.fillStyle = kl.accent;
      ctx.beginPath(); ctx.arc(x0, yc, S * 0.055, 0, Math.PI * 2); ctx.fill();
    } else if (o.soort === 'rechthoek') {
      const yt = y + S * 0.12, yb = y + S * 0.58;
      ctx.strokeRect(x0, yt, W, yb - yt);
      ctx.strokeStyle = kl.accent;
      for (const f of o.fracs) {
        if (o.zijde === 'hoogte') lijn(ctx, { x: x0, y: yt + (yb - yt) * f }, { x: x1, y: yt + (yb - yt) * f });
        else lijn(ctx, { x: x0 + W * f, y: yt }, { x: x0 + W * f, y: yb });
      }
    } else {
      const cy = y + S * 0.36;
      if (o.gelijk) {
        lijn(ctx, { x: x0, y: cy }, { x: x1, y: cy });
        verticaal(x0, cy, tk); verticaal(x1, cy, tk);
        ctx.strokeStyle = kl.accent;
        const n = o.fracs.length + 1;
        for (let i = 1; i < n; i++) verticaal(x0 + W * i / n, cy, n === 2 ? tk * 1.7 : tk * 1.3);
      } else {
        const xd = x0 + W * o.fracs[0];
        ctx.lineWidth = Math.max(4, S * 0.09);
        ctx.strokeStyle = kl.accent;
        lijn(ctx, { x: x0, y: cy }, { x: xd, y: cy });
        ctx.lineWidth = Math.max(2.5, S * 0.05);
        ctx.strokeStyle = kl.tekst;
        lijn(ctx, { x: xd, y: cy }, { x: x1, y: cy });
        verticaal(x0, cy, tk); verticaal(x1, cy, tk);
        ctx.strokeStyle = kl.accent;
        verticaal(xd, cy, tk * 1.6);
      }
    }
    ctx.fillStyle = kl.tekst;
    ctx.font = '700 ' + Math.round(S * 0.24) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(symboolLabel(o), x + S / 2, y + S * 0.83);
    ctx.restore();
  }

  function tekenOpdracht(ctx, o, vlak) {
    const m = Math.min(vlak.w, vlak.h);
    const S = Math.round(H.clamp(m * 0.1, 48, 60));
    const x = 10, y = 8;
    tekenSymbool(ctx, o, vlak, x, y, S);
    // korte ondertitel rechts van het symbool, maximaal 2 regels
    const tx = x + S + 10, breed = Math.max(40, vlak.w - tx - 10);
    let px = Math.round(H.clamp(m * 0.032, 12, 16));
    let regels;
    for (;;) {
      ctx.font = '500 ' + px + 'px ' + FONT;
      regels = [];
      let huidig = '';
      for (const wrd of o.tekst.split(' ')) {
        const proef = huidig ? huidig + ' ' + wrd : wrd;
        if (huidig && ctx.measureText(proef).width > breed) { regels.push(huidig); huidig = wrd; } else huidig = proef;
      }
      regels.push(huidig);
      if (regels.length <= 2 || px <= 11) break;
      px--;
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = vlak.kleur.tekst;
    const lh = px * 1.25, y0 = y + S / 2 - (regels.length - 1) * lh / 2;
    regels.forEach((r, i) => ctx.fillText(r, tx, y0 + i * lh));
  }

  // Referentie (lijn/rechthoek); bij verborgen alleen de eindmarkeringen van een verdeel-opgave.
  function tekenReferentie(ctx, o, vlak, verborgen) {
    const m = Math.min(vlak.w, vlak.h);
    const tk = Math.max(8, 0.035 * m);
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineCap = 'round';
    if (o.soort === 'kopieer') {
      if (!verborgen) {
        ctx.lineWidth = 3;
        lijn(ctx, o.A, o.B);
        ctx.lineWidth = 2.5;
        tick(ctx, o, o.A, tk);
        tick(ctx, o, o.B, tk);
      }
      return;
    }
    if (o.soort === 'rechthoek' && !verborgen) {
      ctx.lineWidth = 2;
      const c = [punt(o, 0, 0), punt(o, o.L, 0), punt(o, o.L, o.Q), punt(o, 0, o.Q)];
      ctx.beginPath();
      ctx.moveTo(c[0].x, c[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
      ctx.closePath();
      ctx.stroke();
    }
    if (!verborgen) { ctx.lineWidth = o.soort === 'rechthoek' ? 3.5 : 3; lijn(ctx, o.A, o.B); }
    ctx.lineWidth = 3;
    const h = o.soort === 'rechthoek' ? Math.max(tk, 0.5 * o.Q * 0.35) : tk * 1.3;
    tick(ctx, o, o.A, h);
    tick(ctx, o, o.B, h);
  }

  function teken(ctx, o, vlak, info) {
    tekenOpdracht(ctx, o, vlak);
    tekenReferentie(ctx, o, vlak, !!(info && info.verborgen));
    if (o.soort === 'kopieer') {
      const r = Math.max(5, 0.014 * Math.min(vlak.w, vlak.h));
      ctx.fillStyle = vlak.kleur.accent;
      ctx.beginPath();
      ctx.arc(o.S.x, o.S.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- nakijken ----------

  // Streken die een markering zijn: kort langs de as. Positie = zwaartepunt op de as (px vanaf A).
  function markeringen(o, streken) {
    const uit = [];
    for (const st of streken) {
      const pts = st.punten;
      if (!pts || !pts.length) continue;
      const pad = H.lengte(pts);
      const rs = pts.length > 1 && pad > 0 ? H.herbemonster(pts, 2) : pts;
      const pr = rs.map((q) => (q.x - o.A.x) * o.u.x + (q.y - o.A.y) * o.u.y);
      const span = Math.max(...pr) - Math.min(...pr);
      if (span <= 0.12 * o.L && pad <= 0.12 * o.L + 1.6 * o.Q) uit.push({ p: H.gemiddelde(pr) });
    }
    uit.sort((a, b) => a.p - b.p);
    return uit;
  }

  function nakijkenVerdeel(o, streken) {
    const N = o.fracs.length, L = o.L;
    const mk = markeringen(o, streken);
    if (!mk.length) return { ongeldig: 'Zet kleine streepjes dwars op de lijn.' };
    const ideaal = o.fracs.map((f) => f * L);
    const juist = mk.length === N;
    let paren;
    if (juist) paren = ideaal.map((id, i) => ({ ideal: id, p: mk[i].p }));
    else {
      const gebruikt = new Set();
      paren = ideaal.map((id) => {
        let best = -1, bd = Infinity;
        mk.forEach((x, j) => { if (!gebruikt.has(j) && Math.abs(x.p - id) < bd) { bd = Math.abs(x.p - id); best = j; } });
        if (best < 0) return { ideal: id, p: null };
        gebruikt.add(best);
        return { ideal: id, p: mk[best].p };
      });
    }
    for (const q of paren) {
      q.d = q.p === null ? null : (q.p - q.ideal) / L;
      q.e = q.p === null ? 0.1 : Math.abs(q.d);
      q.s = 100 * H.lin(q.e, 0.005, o.tol);
    }
    let score = H.gemiddelde(paren.map((q) => q.s)) - (juist ? 0 : 30);
    score = Math.round(H.clamp(score, 0, 100));

    let tip;
    if (!juist) {
      tip = (N === 1 ? 'Het moet 1 streepje zijn' : 'Het moeten ' + N + ' streepjes zijn') + ', je zette er ' + mk.length + '.';
    } else if (score >= 90) {
      tip = 'Goed gezien.';
    } else {
      tip = verdeelTip(o, paren, L);
    }
    return { score, tip, soort: 'verdeel', paren, aantal: mk.length };
  }

  function verdeelTip(o, paren, L) {
    const N = paren.length;
    const pos = paren.map((q) => q.p);
    if (o.gelijk && N >= 2) {
      const ideaalDeel = L / (N + 1);
      const laatste = L - pos[N - 1];
      if ((laatste - ideaalDeel) / ideaalDeel < -0.15) return 'Het laatste deel wordt kleiner; verdeel eerst in het midden.';
    }
    if (o.gelijk && N >= 2) {
      const naar = [];
      for (const q of paren) {
        const richting = Math.sign(L / 2 - q.ideal);
        if (Math.abs(q.ideal - L / 2) > 0.05 * L) naar.push((q.p - q.ideal) * richting / L);
      }
      if (naar.length >= 2 && naar.every((x) => x > 0.01) && H.gemiddelde(naar) > 0.03) return 'Je streepjes liggen te dicht bij het midden.';
    }
    const delen = [];
    let vorig = 0, vorigIdeaal = 0;
    for (const q of paren) {
      delen.push(((q.p - vorig) - (q.ideal - vorigIdeaal)) / (q.ideal - vorigIdeaal));
      vorig = q.p; vorigIdeaal = q.ideal;
    }
    const gem = H.gemiddelde(delen);
    if (gem > 0.08) return 'Je maakt het stuk te lang. Vergelijk met de referentie.';
    if (gem < -0.08) return 'Je maakt het stuk te kort. Vergelijk met de referentie.';
    return o.gelijk ? 'Vergelijk de delen met elkaar; ze moeten even lang zijn.' : 'Schat de verhouding nog eens: vergelijk het korte en het lange stuk.';
  }

  function nakijkenKopieer(o, streken) {
    const pts = streken[streken.length - 1].punten;
    if (pts.length < 2 || H.lengte(pts) < 0.15 * o.T) return { ongeldig: 'Te kort, probeer opnieuw.' };
    const a = pts[0], b = pts[pts.length - 1];
    const vx = b.x - a.x, vy = b.y - a.y;
    let M = vx * o.u.x + vy * o.u.y;
    const teken = M < 0 ? -1 : 1;
    M = Math.abs(M);
    const verschil = Math.hypot(vx, vy);
    const alfa = verschil > 0 ? Math.atan2(Math.abs(vx * o.u.y - vy * o.u.x), M) / GRAAD : 90;
    const signed = (M - o.T) / o.T;
    const e = Math.abs(signed);
    const strafRichting = 2 * Math.max(0, alfa - 3);
    const score = Math.round(H.clamp(100 * H.lin(e, 0.005, o.tol) - strafRichting, 0, 100));
    let tip;
    if (score >= 90) tip = 'Goed gezien.';
    else if (Math.abs(signed) > 0.08) tip = 'Je maakt het stuk te ' + (signed < 0 ? 'kort' : 'lang') + '. Vergelijk met de referentie.';
    else if (alfa > 8) tip = 'Je lijn loopt scheef. Houd dezelfde richting als de referentie.';
    else tip = 'Bijna: vergelijk de lengte nog eens met de referentie.';
    return { score, tip, soort: 'kopieer', M, signed, alfa, teken };
  }

  function nakijken(o, streken) {
    if (o.soort === 'kopieer') return nakijkenKopieer(o, streken);
    return nakijkenVerdeel(o, streken);
  }

  function isKlaar(o, streken) {
    if (o.soort === 'kopieer') return streken.length >= 1;
    return markeringen(o, streken).length >= o.fracs.length;
  }

  // ---------- uitslag ----------

  function pct(d) { const x = Math.round(d * 100); return (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x) + '%'; }

  function label(ctx, vlak, tekst, P, kleur) {
    const px = Math.round(H.clamp(Math.min(vlak.w, vlak.h) * 0.032, 11, 18));
    ctx.font = '700 ' + px + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = vlak.kleur.papier || 'transparent';
    ctx.strokeText(tekst, P.x, P.y);
    ctx.fillStyle = kleur;
    ctx.fillText(tekst, P.x, P.y);
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const m = Math.min(vlak.w, vlak.h);
    ctx.save();
    if (o.niveau === 4) { ctx.globalAlpha = 0.45; tekenReferentie(ctx, o, vlak, false); ctx.globalAlpha = 1; }
    ctx.lineCap = 'round';
    if (u.soort === 'verdeel') {
      const half = o.soort === 'rechthoek' ? null : 0.06 * m;
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 2.5;
      for (const q of u.paren) {
        const P = punt(o, q.ideal, 0);
        if (half === null) lijn(ctx, punt(o, q.ideal, -0.03 * m), punt(o, q.ideal, o.Q + 0.03 * m));
        else tick(ctx, o, P, half);
      }
      ctx.setLineDash([]);
      const buiten = (o.soort === 'rechthoek' ? 0.03 * m : half) + 0.04 * m;
      for (const q of u.paren) {
        if (q.p === null) continue;
        const slecht = q.e > o.tol / 2;
        const kl = slecht ? vlak.kleur.fout : vlak.kleur.goed;
        if (slecht) {
          ctx.strokeStyle = vlak.kleur.fout;
          ctx.lineWidth = 4;
          lijn(ctx, punt(o, q.ideal, 0), punt(o, q.p, 0));
        }
        ctx.fillStyle = kl;
        const P = punt(o, q.p, 0);
        ctx.beginPath();
        ctx.arc(P.x, P.y, 5, 0, Math.PI * 2);
        ctx.fill();
        if (slecht) label(ctx, vlak, pct(q.d), punt(o, q.p, -buiten), vlak.kleur.fout);
      }
    } else {
      const S = o.S, E = o.E;
      const tk = Math.max(8, 0.035 * m);
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 3;
      lijn(ctx, S, E);
      ctx.setLineDash([]);
      ctx.lineWidth = 3;
      tick(ctx, o, E, tk);
      const slecht = Math.abs(u.signed) > o.tol / 2;
      const Ep = { x: S.x + o.u.x * u.M, y: S.y + o.u.y * u.M };
      if (slecht) {
        ctx.strokeStyle = vlak.kleur.fout;
        ctx.lineWidth = 5;
        lijn(ctx, E, Ep);
      }
      ctx.fillStyle = slecht ? vlak.kleur.fout : vlak.kleur.goed;
      ctx.beginPath();
      ctx.arc(Ep.x, Ep.y, 5, 0, Math.PI * 2);
      ctx.fill();
      if (slecht) label(ctx, vlak, pct(u.signed), { x: E.x + o.v.x * 0.07 * m, y: E.y + o.v.y * 0.07 * m }, vlak.kleur.fout);
      if (u.alfa > 8) label(ctx, vlak, Math.round(u.alfa) + '° scheef', { x: S.x + o.v.x * 0.07 * m, y: S.y + o.v.y * 0.07 * m }, vlak.kleur.fout);
    }
    ctx.restore();
  }

  // Lege plek boven of onder de opgave (anders links/rechts ervan).
  function scorePlek(o, vlak) {
    const b = o.bbox, m = Math.min(vlak.w, vlak.h);
    const top0 = 0.13 * vlak.h;
    const boven = b.y0 - top0, onder = vlak.h - b.y1;
    if (Math.max(boven, onder) >= 0.2 * m) {
      return boven >= onder
        ? { x: vlak.w / 2, y: top0 + boven / 2 }
        : { x: vlak.w / 2, y: b.y1 + onder / 2 };
    }
    const links = b.x0, rechts = vlak.w - b.x1;
    if (Math.max(links, rechts) >= 0.25 * vlak.w) {
      return links >= rechts ? { x: links / 2, y: vlak.h / 2 } : { x: b.x1 + rechts / 2, y: vlak.h / 2 };
    }
    return { x: vlak.w / 2, y: boven >= onder ? top0 + Math.max(boven, 0) / 2 : b.y1 + Math.max(onder, 0) / 2 };
  }

  Tekentrainer.registreer({
    id: 'proporties',
    naam: 'Proporties',
    uitleg: 'Verdeel lijnen en vlakken eerlijk en kopieer lengtes, op het oog.',
    fundament: 'Meten op het oog: elke goede tekening begint met proporties.',
    meerdereStreken: true,
    stilNa: 1500,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();

</script>
<script>
/* oefeningen/perspectief.js */
// Richting verdwijnpunt: schat de richting naar een verdwijnpunt (VP) en trek vanuit elk kruisje
// één rechte lijn die erheen wijst. Basis van perspectief.
(function () {
  const H = window.Hulp;
  const RAD = 180 / Math.PI;

  // Per niveau: aantal startpunten, hoek-tolerantie (graden), afstand startpunt-VP (fractie van min(w,h)),
  // aantal VP's, hulpstraal, VP buiten beeld.
  const NIVEAUS = {
    1: { n: [3, 3], thetaMax: 12, afstand: [0.45, 0.8], vps: 1, hulp: true, buiten: false },
    2: { n: [3, 4], thetaMax: 9, afstand: [0.4, 0.8], vps: 1, hulp: false, buiten: false },
    3: { n: [4, 4], thetaMax: 7, afstand: [0.35, 0.75], vps: 2, hulp: false, buiten: false },
    4: { n: [4, 5], thetaMax: 5, afstand: [0.25, 0.45], vps: 2, hulp: false, buiten: false },
    5: { n: [4, 5], thetaMax: 4, afstand: [0.3, 3], vps: 1, hulp: false, buiten: true },
  };

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const cfg = NIVEAUS[niveau];
    const w = vlak.w, h = vlak.h, m = Math.min(w, h);
    const marge = 0.07 * m;
    const n = Math.floor(rng.tussen(cfg.n[0], cfg.n[1] + 1 - 1e-9));
    const vps = [];
    if (cfg.buiten) {
      for (let poging = 0; poging < 200; poging++) {
        const a = rng.tussen(0, 2 * Math.PI), d = rng.tussen(0.75, 1.5) * w;
        const x = w / 2 + Math.cos(a) * d, y = h / 2 + Math.sin(a) * d;
        if (x < -0.08 * m || x > w + 0.08 * m || y < -0.08 * m || y > h + 0.08 * m) { vps.push({ x, y, vorm: 'rond' }); break; }
      }
      if (!vps.length) vps.push({ x: w * 1.4, y: h * 0.3, vorm: 'rond' });
    } else if (cfg.vps === 1) {
      vps.push({ x: rng.tussen(0.35, 0.65) * w, y: rng.tussen(0.28, 0.5) * h, vorm: 'rond' });
    } else {
      const yl = rng.tussen(0.3, 0.5) * h, yr = rng.tussen(0.3, 0.5) * h;
      vps.push({ x: rng.tussen(0.1, 0.2) * w, y: yl, vorm: 'rond' });
      vps.push({ x: rng.tussen(0.8, 0.9) * w, y: yr, vorm: 'vierkant' });
    }

    const starts = [];
    for (let i = 0; i < n; i++) {
      const vp = cfg.vps === 2 ? i % 2 : 0;
      let relax = 1, gelukt = false, kies = null;
      for (let poging = 0; poging < 900 && !gelukt; poging++) {
        if (poging % 150 === 149) relax *= 0.8;
        const x = rng.tussen(marge, w - marge), y = rng.tussen(0.14 * h, h - marge);
        const V = vps[vp], d = Math.hypot(V.x - x, V.y - y);
        kies = { x, y, vp };
        if (d < cfg.afstand[0] * m * relax || d > cfg.afstand[1] * m) continue;
        if (vps.some((q) => Math.hypot(q.x - x, q.y - y) < 0.14 * m)) continue;
        if (starts.some((s) => Math.hypot(s.x - x, s.y - y) < 0.2 * m * relax)) continue;
        // Lijnen naar hetzelfde VP niet bijna op elkaar.
        const hoek = Math.atan2(V.y - y, V.x - x);
        if (starts.some((s) => s.vp === vp && H.lijnHoekVerschil(hoek, Math.atan2(V.y - s.y, V.x - s.x)) < 7 * relax)) continue;
        gelukt = true;
      }
      starts.push(kies);
    }
    return { niveau, vps, starts, thetaMax: cfg.thetaMax, hulp: cfg.hulp, buiten: cfg.buiten, m, w, h };
  }

  // ---------- meetkunde ----------
  function eenheid(o, k) {
    const s = o.starts[k], V = o.vps[s.vp];
    const d = Math.hypot(V.x - s.x, V.y - s.y) || 1;
    return { ux: (V.x - s.x) / d, uy: (V.y - s.y) / d, d };
  }

  // Eindpunt van de ideale lijn: het VP, of (buiten beeld) de rand van het vlak.
  function eindpunt(o, k) {
    const s = o.starts[k], { ux, uy, d } = eenheid(o, k);
    let t = d;
    if (o.buiten) {
      t = Infinity;
      if (ux > 1e-9) t = Math.min(t, (o.w - s.x) / ux); else if (ux < -1e-9) t = Math.min(t, -s.x / ux);
      if (uy > 1e-9) t = Math.min(t, (o.h - s.y) / uy); else if (uy < -1e-9) t = Math.min(t, -s.y / uy);
      t = Math.min(d, Math.max(0, t));
    }
    return { x: s.x + ux * t, y: s.y + uy * t };
  }

  function geldig(o, st) {
    return st.punten.length >= 12 && H.lengte(st.punten) >= Math.min(60, 0.2 * o.m);
  }

  // Koppel elke geldige streek aan het dichtstbijzijnde nog vrije startpunt. Geeft per streek de index (of -1).
  function toewijzing(o, streken) {
    const vrij = o.starts.map(() => true);
    return streken.map((st) => {
      if (!geldig(o, st)) return -1;
      const p0 = st.punten[0];
      let best = -1, bd = Infinity;
      o.starts.forEach((s, k) => {
        const d = Math.hypot(s.x - p0.x, s.y - p0.y);
        if (vrij[k] && d < bd) { bd = d; best = k; }
      });
      if (best >= 0) vrij[best] = false;
      return best;
    });
  }

  // ---------- tekenen ----------
  function vpKleur(o, vlak, i) {
    return o.vps.length === 2 && i === 1 ? vlak.kleur.tekst : vlak.kleur.accent;
  }

  function vorm(ctx, vorm, x, y, r, vul) {
    ctx.beginPath();
    if (vorm === 'rond') ctx.arc(x, y, r, 0, 2 * Math.PI);
    else ctx.rect(x - r, y - r, 2 * r, 2 * r);
    if (vul) ctx.fill(); else ctx.stroke();
  }

  function teken(ctx, o, vlak, info) {
    const m = o.m, K = vlak.kleur;
    const gedaan = new Set();
    toewijzing(o, (info && info.streken) || []).forEach((k) => { if (k >= 0) gedaan.add(k); });
    ctx.save();
    ctx.lineCap = 'round';

    // Hulpstralen (niveau 1).
    if (o.hulp) {
      ctx.strokeStyle = K.hulp;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.5;
      o.starts.forEach((s, k) => {
        const e = eindpunt(o, k);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // Verdwijnpunt(en).
    const r = Math.max(7, 0.022 * m);
    o.vps.forEach((V, i) => {
      if (o.buiten) return;
      ctx.fillStyle = vpKleur(o, vlak, i);
      vorm(ctx, V.vorm, V.x, V.y, r, true);
      ctx.strokeStyle = K.hulp; ctx.lineWidth = 2;
      vorm(ctx, V.vorm, V.x, V.y, r + 4, false);
    });
    if (o.buiten) pijl(ctx, o, vlak);

    // Startkruisjes.
    const c = Math.max(8, 0.028 * m);
    o.starts.forEach((s, k) => {
      const klaar = gedaan.has(k);
      const kl = o.vps.length === 2 ? vpKleur(o, vlak, s.vp) : K.hulp;
      ctx.strokeStyle = klaar ? K.tekstZacht : kl;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(s.x - c, s.y); ctx.lineTo(s.x + c, s.y);
      ctx.moveTo(s.x, s.y - c); ctx.lineTo(s.x, s.y + c);
      ctx.stroke();
      if (o.vps.length === 2) {
        ctx.fillStyle = vpKleur(o, vlak, s.vp);
        vorm(ctx, o.vps[s.vp].vorm, s.x + c * 0.9, s.y - c * 0.9, Math.max(4, c * 0.4), true);
      }
      if (klaar) {
        ctx.strokeStyle = K.goed; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, c * 1.25, 0, 2 * Math.PI); ctx.stroke();
      }
    });
    ctx.restore();
  }

  // Pijl aan de rand van het vlak in de richting van het VP buiten beeld.
  function pijl(ctx, o, vlak) {
    const V = o.vps[0], cx = o.w / 2, cy = o.h / 2, m = o.m;
    const dx = V.x - cx, dy = V.y - cy, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const ins = 0.06 * m;
    let t = Infinity;
    if (ux > 1e-9) t = Math.min(t, (o.w - ins - cx) / ux); else if (ux < -1e-9) t = Math.min(t, (ins - cx) / ux);
    if (uy > 1e-9) t = Math.min(t, (o.h - ins - cy) / uy); else if (uy < -1e-9) t = Math.min(t, (ins - cy) / uy);
    const px = cx + ux * t, py = cy + uy * t, s = Math.max(10, 0.035 * m);
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath();
    ctx.moveTo(px + ux * s, py + uy * s);
    ctx.lineTo(px - ux * s * 0.6 - uy * s * 0.8, py - uy * s * 0.6 + ux * s * 0.8);
    ctx.lineTo(px - ux * s * 0.6 + uy * s * 0.8, py - uy * s * 0.6 - ux * s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- nakijken ----------
  function snelheidsProfiel(pts) {
    // Snelheid per ~40 ms venster, tegen jitter van losse events.
    const v = [];
    let a = pts[0];
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - a.t;
      if (dt >= 40) { v.push(H.afstand(a, pts[i]) / dt); a = pts[i]; }
    }
    return v;
  }

  // Aantal pauzes (>120 ms nagenoeg stilstaan) midden in de streek.
  function pauzes(pts) {
    let n = 0, anker = 0;
    for (let i = 1; i < pts.length; i++) {
      if (H.afstand(pts[anker], pts[i]) > 2.5) {
        const eind = H.afstand(pts[i - 1], pts[i]) < 8 ? pts[i].t : pts[i - 1].t;
        if (anker > 0 && eind - pts[anker].t > 120) n++;
        anker = i;
      }
    }
    return n;
  }

  function meetStreek(o, st, k) {
    const s = o.starts[k], { ux, uy } = eenheid(o, k);
    const pts = st.punten;
    const dS = H.afstand(pts[0], s);
    const rest = pts.slice(Math.floor(pts.length * 0.1));
    const f = H.lijnFit(rest);
    let fx = f.dx, fy = f.dy;
    if (fx * ux + fy * uy < 0) { fx = -fx; fy = -fy; }
    const theta = Math.atan2(ux * fy - uy * fx, ux * fx + uy * fy) * RAD; // + = kloksgewijs (scherm)
    // Kant waarop de lijn langs het VP loopt.
    const horizontaal = Math.abs(ux) >= Math.abs(uy);
    const kantWaarde = theta * Math.sign(horizontaal ? ux || 1 : uy || 1); // + = onder / links
    const kant = horizontaal ? (kantWaarde > 0 ? 'onder' : 'boven') : (kantWaarde > 0 ? 'links' : 'rechts');

    const L = H.lengte(rest) || 1;
    const e = rest.map((p) => H.lijnAfstand(p, { x: f.mx, y: f.my }, f.dx, f.dy));
    const rms = Math.sqrt(H.gemiddelde(e.map((v) => v * v)));
    const derde = Math.max(1, Math.floor(e.length / 3));
    const bow = H.gemiddelde(e.slice(derde, e.length - derde)) -
      0.5 * (H.gemiddelde(e.slice(0, derde)) + H.gemiddelde(e.slice(e.length - derde)));
    const recht = rms / L;
    const krom = recht > 0.02 && Math.abs(bow) > 0.5 * rms;

    const sp = snelheidsProfiel(pts);
    const gem = H.gemiddelde(sp);
    const cv = gem > 0 ? H.sd(sp) / gem : 0;
    const pauze = pauzes(pts);

    const sHoek = 100 * H.lin(Math.abs(theta), 0, o.thetaMax);
    const sRecht = 100 * H.lin(recht, 0, 0.03);
    const sVloei = Math.max(0, 100 - 40 * Math.max(0, cv - 0.5) - 15 * pauze);
    const sStart = 100 * H.lin(dS, 25, 75);
    const score = 0.6 * sHoek + 0.25 * sRecht + 0.1 * sVloei + 0.05 * sStart;
    return { k, theta, kant, horizontaal, dS, recht, krom, cv, pauze, score };
  }

  function nakijken(o, streken) {
    const wijs = toewijzing(o, streken);
    const details = [];
    wijs.forEach((k, si) => { if (k >= 0) details.push(Object.assign(meetStreek(o, streken[si], k), { si })); });
    if (!details.length) return { ongeldig: 'Te kort: trek een lange lijn vanuit het kruisje.' };

    const n = o.starts.length;
    const ontbreekt = n - details.length;
    const score = Math.round(details.reduce((s, d) => s + d.score, 0) / n);

    // Tips met een ernst; de ergste wint.
    const kandidaten = [];
    if (ontbreekt > 0) kandidaten.push([10, 'Trek een lijn vanuit elk kruisje.']);
    const krom = details.filter((d) => d.krom);
    if (krom.length) {
      const zelfde = krom.length;
      kandidaten.push([H.gemiddelde(krom.map((d) => d.recht)) / 0.02 * (zelfde > 1 ? 1.1 : 0.9), 'Je lijnen buigen: trek sneller en vanuit je schouder.']);
    }
    for (const kant of ['boven', 'onder', 'links', 'rechts']) {
      const g = details.filter((d) => d.kant === kant && Math.abs(d.theta) > 1);
      if (g.length < 3 || g.length < 0.6 * details.length) continue;
      const gemAbs = H.gemiddelde(g.map((d) => Math.abs(d.theta)));
      if (gemAbs > 3) kandidaten.push([gemAbs / 3, 'Je lijnen wijzen steeds te ver ' + kant + (kant === 'links' || kant === 'rechts' ? ' van' : '') + ' het punt.']);
    }
    const aarzel = details.filter((d) => d.pauze > 0 || d.cv > 0.8);
    if (aarzel.length) kandidaten.push([1.5 * aarzel.length / details.length + 0.3, 'Je aarzelt halverwege: kijk naar het verdwijnpunt, niet naar je pen.']);
    const ver = details.filter((d) => d.dS > 25);
    if (ver.length) kandidaten.push([H.gemiddelde(ver.map((d) => d.dS)) / 25 * (ver.length / details.length), 'Begin precies op het kruisje.']);

    let tip;
    if (kandidaten.length) {
      kandidaten.sort((x, y) => y[0] - x[0]);
      tip = kandidaten[0][1];
    } else if (score >= 85) tip = 'Mooi: rechte lijnen die naar het punt wijzen.';
    else tip = 'Schat de richting eerst: kijk naar het verdwijnpunt en trek dan in één beweging.';
    return { score, tip, details, ontbreekt };
  }

  // ---------- uitslag ----------
  function tekenUitslag(ctx, o, streken, u, vlak) {
    const K = vlak.kleur, m = o.m;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = K.goed;
    ctx.lineWidth = 2.5;
    o.starts.forEach((s, k) => {
      const e = eindpunt(o, k);
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
    });
    ctx.setLineDash([]);
    const fs = Math.round(H.clamp(m * 0.032, 11, 15));
    ctx.font = '600 ' + fs + 'px ' + (getComputedStyle(document.body).fontFamily || 'sans-serif');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const d of u.details || []) {
      const slecht = Math.abs(d.theta) > o.thetaMax / 2;
      const pts = streken[d.si].punten;
      if (slecht) {
        ctx.strokeStyle = K.fout; ctx.lineWidth = 1.5;
        ctx.beginPath();
        pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
      const a = pts[pts.length - 1], b = pts[Math.max(0, pts.length - 6)];
      const L = H.afstand(a, b) || 1;
      ctx.fillStyle = slecht ? K.fout : K.tekstZacht;
      ctx.fillText(Math.abs(d.theta).toFixed(1) + '°', a.x + (a.x - b.x) / L * 18, a.y + (a.y - b.y) / L * 14);
    }
    ctx.restore();
  }

  // Lege plek weg van de ideale lijnen, VP's en kruisjes (bij voorkeur onderin).
  function scorePlek(o, vlak) {
    const w = vlak.w, h = vlak.h, m = o.m;
    const lijnen = o.starts.map((s, k) => [s, eindpunt(o, k)]);
    const punten = o.starts.concat(o.vps.filter(() => !o.buiten));
    let beste = { x: w / 2, y: h * 0.8 }, bw = -Infinity;
    for (let i = 0; i <= 6; i++) {
      for (let j = 0; j <= 5; j++) {
        const p = { x: w * (0.2 + 0.6 * i / 6), y: h * (0.35 + 0.5 * j / 5) };
        let c = Infinity;
        for (const [a, b] of lijnen) c = Math.min(c, H.segmentAfstand(p, a, b));
        for (const q of punten) c = Math.min(c, H.afstand(p, q));
        const waarde = Math.min(c, 0.3 * m) + 0.25 * p.y;
        if (waarde > bw) { bw = waarde; beste = p; }
      }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'perspectief',
    naam: 'Richting verdwijnpunt',
    uitleg: 'Trek vanuit elk kruisje in één beweging een rechte lijn richting het verdwijnpunt.',
    fundament: 'Lijnrichting naar een verdwijnpunt inschatten en rechttrekken vanuit je schouder; de basis van perspectief.',
    meerdereStreken: true,
    stilNa: 0,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar(o, streken) { return toewijzing(o, streken).filter((k) => k >= 0).length >= o.starts.length; },
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();

</script>
<script>
/* oefeningen/dozen.js */
// Doos afmaken: een 3D-doos in perspectief; teken de ontbrekende ribben vanaf het gemarkeerde hoekpunt.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: draaihoeken (graden), camera-afstand (in doosgroottes; klein = sterke convergentie),
  // aantal ontbrekende ribben, hulplijnen, en of verborgen ribben meedoen.
  const NIVEAUS = {
    1: { yaw: [38, 52], pitch: [26, 36], roll: [0, 0], cam: 14, mist: 3, aantal: 3, gids: true, verborgen: false },
    2: { yaw: [38, 52], pitch: [26, 36], roll: [0, 0], cam: 14, mist: 3, aantal: 3, gids: false, verborgen: false },
    3: { yaw: [20, 62], pitch: [14, 38], roll: [-14, 14], cam: 4.6, mist: 5, aantal: 5, gids: false, verborgen: false },
    4: { yaw: [22, 58], pitch: [0, 7], roll: [0, 0], cam: 3.2, mist: 7, aantal: 7, gids: false, verborgen: true },
    5: { yaw: [0, 360], pitch: [-55, 55], roll: [-40, 40], cam: 2.7, mist: 6, aantal: 6, gids: false, verborgen: true },
  };

  // Hoekpunt i: bit0 = x, bit1 = y, bit2 = z. Rib = twee hoekpunten die in precies één bit verschillen.
  const RIBBEN = [];
  for (let i = 0; i < 8; i++) for (let k = 0; k < 3; k++) if (!(i & (1 << k))) RIBBEN.push({ a: i, b: i | (1 << k), as: k });

  function shuffle(lijst, rng) {
    const l = lijst.slice();
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
    return l;
  }

  function projecteer(n, rng, dims) {
    const yaw = rng.tussen(n.yaw[0], n.yaw[1]) * RAD * (rng() < 0.5 ? -1 : 1);
    const pitch = rng.tussen(n.pitch[0], n.pitch[1]) * RAD * (rng() < 0.5 ? -1 : 1);
    const roll = rng.tussen(n.roll[0], n.roll[1]) * RAD;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch), cz = Math.cos(roll), sz = Math.sin(roll);
    const diag = Math.hypot(dims[0], dims[1], dims[2]);
    const cam = n.cam * diag / 1.7;
    const pts = [];
    for (let i = 0; i < 8; i++) {
      let x = ((i & 1) ? 0.5 : -0.5) * dims[0], y = ((i & 2) ? 0.5 : -0.5) * dims[1], z = ((i & 4) ? 0.5 : -0.5) * dims[2];
      let t = x * cy + z * sy; z = -x * sy + z * cy; x = t;      // yaw (om y)
      t = y * cx - z * sx; z = y * sx + z * cx; y = t;           // pitch (om x)
      t = x * cz - y * sz; y = x * sz + y * cz; x = t;           // roll (om z)
      const zc = cam + z;                                         // z > 0 = verder weg
      pts.push({ x: x * cam / zc, y: -y * cam / zc, z });
    }
    return pts;
  }

  const gebied = (vlak) => vlak.w >= vlak.h * 1.15
    ? { x0: vlak.w * 0.04, x1: vlak.w * 0.60, y0: vlak.h * 0.10, y1: vlak.h * 0.92, score: { x: vlak.w * 0.80, y: vlak.h * 0.5 } }
    : { x0: vlak.w * 0.05, x1: vlak.w * 0.95, y0: vlak.h * 0.08, y1: vlak.h * 0.70, score: { x: vlak.w * 0.5, y: vlak.h * 0.86 } };

  const vlakArea = (v, ids) => {
    let s = 0;
    for (let i = 0; i < ids.length; i++) { const p = v[ids[i]], q = v[ids[(i + 1) % ids.length]]; s += p.x * q.y - q.x * p.y; }
    return Math.abs(s) / 2;
  };

  function bouw(n, rng, vlak) {
    const dims = [rng.tussen(0.8, 1.25), rng.tussen(0.8, 1.25), rng.tussen(0.8, 1.25)];
    for (let poging = 0; poging < 30; poging++) {
      const v = projecteer(n, rng, dims);
      // Voorvlak: per as de nabije kant, daarvan het vlak met de grootste oppervlakte.
      let front = null, besteArea = -1;
      for (let k = 0; k < 3; k++) {
        const kant = [0, 1].map((s) => { const ids = []; for (let i = 0; i < 8; i++) if (((i >> k) & 1) === s) ids.push(i); return ids; });
        const diep = kant.map((ids) => H.gemiddelde(ids.map((i) => v[i].z)));
        const ids = diep[0] <= diep[1] ? kant[0] : kant[1];
        const ordered = [ids[0], ids[1], ids[3], ids[2]];
        const a = vlakArea(v, ordered);
        if (a > besteArea) { besteArea = a; front = ids; }
      }
      let verborgen = 0;
      for (let i = 1; i < 8; i++) if (v[i].z > v[verborgen].z) verborgen = i;
      if (front.includes(verborgen)) continue;

      // Naar het vlak schalen en centreren.
      const g = gebied(vlak);
      const minx = Math.min(...v.map((p) => p.x)), maxx = Math.max(...v.map((p) => p.x));
      const miny = Math.min(...v.map((p) => p.y)), maxy = Math.max(...v.map((p) => p.y));
      const k = Math.min((g.x1 - g.x0) / (maxx - minx), (g.y1 - g.y0) / (maxy - miny));
      const cx = (g.x0 + g.x1) / 2, cy = (g.y0 + g.y1) / 2, mx = (minx + maxx) / 2, my = (miny + maxy) / 2;
      const punten = v.map((p) => ({ x: cx + (p.x - mx) * k, y: cy + (p.y - my) * k, z: p.z }));
      let D = 0;
      for (const a of front) for (const b of front) D = Math.max(D, H.afstand(punten[a], punten[b]));
      if (D < Math.min(vlak.w, vlak.h) * 0.12) continue;
      // Geen bijna-samenvallende hoekpunten (dan is een rib niet te tekenen).
      let kort = Infinity;
      for (const r of RIBBEN) kort = Math.min(kort, H.afstand(punten[r.a], punten[r.b]));
      if (kort < D * 0.18) continue;
      return { punten, front, verborgen, D };
    }
    return null;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    let doos = null;
    while (!doos) doos = bouw(n, rng, vlak);
    const { punten, front, verborgen, D } = doos;

    const ribben = RIBBEN.map((r, i) => {
      const inFront = front.includes(r.a) && front.includes(r.b);
      const verb = r.a === verborgen || r.b === verborgen;
      return { i, a: r.a, b: r.b, as: r.as, inFront, verb, status: inFront ? 'gegeven' : 'weg' };
    });
    const zichtbaar = shuffle(ribben.filter((r) => !r.inFront && !r.verb), rng);
    const kandidaten = n.verborgen ? shuffle(ribben.filter((r) => !r.inFront), rng) : zichtbaar;
    // Op niveau 4/5 blijven er alleen zichtbare ribben als gegeven over.
    let mist = [];
    if (n.verborgen) {
      const gegeven = zichtbaar.slice(0, kandidaten.length - n.aantal);
      mist = kandidaten.filter((r) => !gegeven.includes(r));
    } else mist = kandidaten.slice(0, n.aantal);
    for (const r of ribben) if (!r.inFront) r.status = mist.includes(r) ? 'mist' : (r.verb ? 'verborgen' : 'gegeven');

    // Beginpunt: een hoekpunt dat al bestaat (voorvlak of eind van een gegeven rib); anders het nabije uiteinde.
    const bekend = new Set(front);
    for (const r of ribben) if (r.status === 'gegeven') { bekend.add(r.a); bekend.add(r.b); }
    for (const r of mist) {
      let s = r.a, e = r.b;
      const ak = bekend.has(r.a), bk = bekend.has(r.b);
      if (ak && !bk) { s = r.a; e = r.b; }
      else if (bk && !ak) { s = r.b; e = r.a; }
      else if (punten[r.a].z > punten[r.b].z) { s = r.b; e = r.a; }
      r.s = s; r.e = e;
    }
    return {
      niveau, punten, ribben, mist: mist.slice().sort((x, y) => x.i - y.i), front, D, gids: n.gids,
      gebied: gebied(vlak),
    };
  }

  const P = (o, i) => o.punten[i];
  const lijn = (ctx, a, b) => { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };

  function teken(ctx, o, vlak, info) {
    const m = Math.min(vlak.w, vlak.h);
    ctx.save();
    ctx.lineCap = 'round';
    if (o.gids) {
      // Dunne hulplijnen: de gegeven ribben doorgetrokken richting hun verdwijnpunt.
      const assen = new Set(o.mist.map((r) => r.as));
      ctx.strokeStyle = vlak.kleur.hulpZacht;
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      const L = Math.hypot(vlak.w, vlak.h);
      for (const r of o.ribben) {
        if (r.status !== 'gegeven' || !assen.has(r.as)) continue;
        const a = P(o, r.a), b = P(o, r.b), d = H.afstand(a, b);
        const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
        lijn(ctx, { x: a.x - ux * L, y: a.y - uy * L }, { x: a.x + ux * L, y: a.y + uy * L });
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2.2;
    for (const r of o.ribben) if (r.status === 'gegeven' || r.inFront) lijn(ctx, P(o, r.a), P(o, r.b));
    // Beginpunten van de ontbrekende ribben.
    ctx.fillStyle = vlak.kleur.accent;
    const rad = Math.max(5, m * 0.012);
    const gezet = new Set();
    for (const r of o.mist) {
      if (gezet.has(r.s)) continue;
      gezet.add(r.s);
      ctx.beginPath(); ctx.arc(P(o, r.s).x, P(o, r.s).y, rad, 0, Math.PI * 2); ctx.fill();
    }
    // Teller.
    const n = Math.min(o.mist.length, (info && info.streken ? info.streken.length : 0));
    ctx.fillStyle = vlak.kleur.tekstZacht;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '600 ' + Math.round(H.clamp(m * 0.045, 16, 30)) + 'px sans-serif';
    ctx.fillText(n + '/' + o.mist.length, 14, 12);
    ctx.restore();
  }

  function isKlaar(o, streken) { return streken.length >= o.mist.length; }

  // ---------- nakijken ----------
  function hoekVan(v) { return Math.atan2(v.y, v.x); }
  function wikkel(h) { while (h > Math.PI / 2) h -= Math.PI; while (h <= -Math.PI / 2) h += Math.PI; return h; }

  function koppel(o, streken) {
    const paren = [];
    streken.forEach((st, si) => {
      const p0 = st.punten[0], pn = st.punten[st.punten.length - 1];
      o.mist.forEach((r, ri) => {
        const b = P(o, r.s), e = P(o, r.e);
        // Begin (en bij gedeelde hoekpunten ook het eind) bepaalt bij welke rib de streek hoort.
        const d = Math.min(H.afstand(p0, b) + 0.5 * H.afstand(pn, e), H.afstand(pn, b) + 0.5 * H.afstand(p0, e));
        paren.push({ si, ri, d });
      });
    });
    paren.sort((x, y) => x.d - y.d);
    const sGebruikt = new Set(), rGebruikt = new Set(), uit = [];
    for (const p of paren) {
      if (sGebruikt.has(p.si) || rGebruikt.has(p.ri)) continue;
      sGebruikt.add(p.si); rGebruikt.add(p.ri);
      let pts = streken[p.si].punten;
      const b = P(o, o.mist[p.ri].s);
      if (H.afstand(pts[pts.length - 1], b) < H.afstand(pts[0], b)) pts = pts.slice().reverse();
      uit.push({ ri: p.ri, rib: o.mist[p.ri], pts });
    }
    return uit;
  }

  function nakijken(o, streken) {
    const D = o.D;
    for (const st of streken) if (st.punten.length < 3 || H.lengte(st.punten) < D * 0.1) return { ongeldig: 'Te kort: trek elke rib in één lange streek.' };
    const gekoppeld = koppel(o, streken);
    const per = [];
    for (const g of gekoppeld) {
      const b = P(o, g.rib.s), e = P(o, g.rib.e);
      const p0 = g.pts[0], pn = g.pts[g.pts.length - 1];
      const L = H.afstand(p0, pn) || 1;
      const s = H.afstand(p0, b) / D;
      let dx = (pn.x - p0.x) / L, dy = (pn.y - p0.y) / L, r = 0;
      for (const p of g.pts) r = Math.max(r, Math.abs(H.lijnAfstand(p, p0, dx, dy)));
      r /= L;
      const ideaal = { x: e.x - b.x, y: e.y - b.y };
      const iL = Math.hypot(ideaal.x, ideaal.y);
      const cos = ((pn.x - p0.x) * ideaal.x + (pn.y - p0.y) * ideaal.y) / (L * iL);
      const alfa = Math.acos(H.clamp(cos, -1, 1)) / RAD;
      const eind = H.afstand(pn, e) / D;
      const sn = H.snelheden(g.pts);
      const mid = sn.slice(Math.floor(sn.length * 0.15), Math.ceil(sn.length * 0.85));
      const cv = mid.length >= 4 && H.gemiddelde(mid) > 0 ? H.sd(mid) / H.gemiddelde(mid) : 0;
      let score = 100 * (0.15 * H.lin(s, 0, 0.10) + 0.15 * H.lin(r, 0.01, 0.06) + 0.40 * H.lin(alfa, 2, 14) + 0.30 * H.lin(eind, 0.03, 0.20));
      if (cv > 0.6) score *= 0.9;
      per.push({ ri: g.ri, rib: g.rib, pts: g.pts, s, r, alfa, eind, cv, lenFout: L / iL - 1, score });
    }

    // Parallelcontrole per as: gegeven + getekende ribben die evenwijdig/convergerend horen te zijn.
    const getekend = new Map(per.map((x) => [x.rib.i, x]));
    let som = 0, aantal = 0, signed = 0;
    for (let k = 0; k < 3; k++) {
      const leden = [];
      let u = null, beste = -1;
      for (const r of o.ribben) {
        if (r.as !== k) continue;
        const d = getekend.get(r.i);
        if (!(d || r.status === 'gegeven' || r.inFront)) continue;
        const a = P(o, r.a), b = P(o, r.b);
        const nab = a.z <= b.z ? a : b, ver = a.z <= b.z ? b : a;
        const diep = Math.abs(a.z - b.z);
        if (diep > beste) { beste = diep; u = { x: ver.x - nab.x, y: ver.y - nab.y }; }
        leden.push({ r, d, a, b });
      }
      if (leden.length < 2) continue;
      const ul = Math.hypot(u.x, u.y); u = { x: u.x / ul, y: u.y / ul };
      const ori = (v) => (v.x * u.x + v.y * u.y < 0 ? { x: -v.x, y: -v.y } : v);
      for (const l of leden) {
        l.ideaal = ori({ x: P(o, l.r.b).x - P(o, l.r.a).x, y: P(o, l.r.b).y - P(o, l.r.a).y });
        l.mid = { x: (P(o, l.r.a).x + P(o, l.r.b).x) / 2, y: (P(o, l.r.a).y + P(o, l.r.b).y) / 2 };
        l.dir = l.d ? ori({ x: l.d.pts[l.d.pts.length - 1].x - l.d.pts[0].x, y: l.d.pts[l.d.pts.length - 1].y - l.d.pts[0].y }) : l.ideaal;
        if (l.d) l.mid = { x: (l.d.pts[0].x + l.d.pts[l.d.pts.length - 1].x) / 2, y: (l.d.pts[0].y + l.d.pts[l.d.pts.length - 1].y) / 2 };
      }
      // Uiteen/naar elkaar (langs u, weg van de kijker): positief = uiteen.
      const uiteen = (x, y, imid, jmid) => {
        const zijde = Math.sign(u.x * (jmid.y - imid.y) - u.y * (jmid.x - imid.x));
        return zijde * Math.atan2(x.x * y.y - x.y * y.x, x.x * y.x + x.y * y.y);
      };
      for (let i = 0; i < leden.length; i++) for (let j = i + 1; j < leden.length; j++) {
        if (!leden[i].d && !leden[j].d) continue;
        // De zijde bepalen we op de ideale middens (stabiel), de hoeken op de getekende richtingen.
        const im = { x: (P(o, leden[i].r.a).x + P(o, leden[i].r.b).x) / 2, y: (P(o, leden[i].r.a).y + P(o, leden[i].r.b).y) / 2 };
        const jm = { x: (P(o, leden[j].r.a).x + P(o, leden[j].r.b).x) / 2, y: (P(o, leden[j].r.a).y + P(o, leden[j].r.b).y) / 2 };
        const ex = uiteen(leden[i].dir, leden[j].dir, im, jm) - uiteen(leden[i].ideaal, leden[j].ideaal, im, jm);
        som += Math.abs(ex) / RAD; aantal++; signed += ex / RAD;
      }
    }
    const par = aantal ? som / aantal : 0;
    const parSigned = aantal ? signed / aantal : 0;
    const straf = 15 * (1 - H.lin(par, 3, 14));

    const totaal = per.reduce((t, x) => t + x.score, 0) / o.mist.length;
    const score = Math.round(H.clamp(totaal - straf, 0, 100));

    // Tips: de grootste afwijking t.o.v. haar drempel wint.
    const gem = (f) => H.gemiddelde(per.map(f));
    const lenGem = gem((x) => x.lenFout);
    const zelfde = per.filter((x) => Math.sign(x.lenFout) === Math.sign(lenGem)).length / Math.max(1, per.length);
    const onrust = per.filter((x) => x.cv > 0.6).length / Math.max(1, per.length);
    const kand = [
      [par / 6, parSigned < 0 ? 'Je ribben lopen te veel naar elkaar toe.' : 'Je ribben lopen te veel uit elkaar.'],
      [Math.max(gem((x) => x.r) / 0.03, onrust >= 0.4 ? 1.3 : 0), 'Trek in één vloeiende beweging vanuit je schouder.'],
      [zelfde >= 0.7 ? Math.abs(lenGem) / 0.12 : 0, lenGem > 0 ? 'Je ribben worden te lang; kijk vooruit naar het eindpunt.' : 'Je ribben worden te kort; kijk vooruit naar het eindpunt.'],
      [gem((x) => x.s) / 0.06, 'Begin precies op de hoek.'],
      [gem((x) => x.alfa) / 8, 'Let op de richting: laat elke rib meelopen met de evenwijdige ribben.'],
    ].filter((k) => k[0] > 1).sort((a, b) => b[0] - a[0]);
    const tip = kand.length ? kand[0][1] : (score >= 85 ? 'Mooi: rechte, stevige ribben.' : 'Kijk nog even naar de richting en het eindpunt.');

    return { score, tip, per, par, straf };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.5;
    for (const r of o.ribben) {
      if (r.status === 'mist') continue;
      ctx.setLineDash(r.status === 'verborgen' ? [4, 6] : []);
      lijn(ctx, P(o, r.a), P(o, r.b));
    }
    ctx.globalAlpha = 1;
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2.5;
    for (const r of o.mist) lijn(ctx, P(o, r.s), P(o, r.e));
    ctx.setLineDash([]);
    ctx.strokeStyle = vlak.kleur.fout;
    ctx.lineWidth = 3;
    for (const x of u.per) {
      if (x.score >= 60) continue;
      ctx.beginPath();
      x.pts.forEach((p, k) => (k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'dozen',
    naam: 'Dozen',
    uitleg: 'Maak de doos af: trek elke ontbrekende rib in één streek vanaf de stip.',
    fundament: 'Evenwijdige ribben convergeren naar dezelfde verdwijnpunten; trek rechte, zelfverzekerde lijnen.',
    meerdereStreken: true,
    stilNa: 0,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.gebied.score,
  });
})();
