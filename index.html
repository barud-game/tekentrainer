<script>
/* oefeningen/geheugen.js */
// Kijk, verberg, teken: een vorm even zien, die verdwijnt, en dan uit je hoofd natekenen.
(function () {
  const H = window.Hulp;
  const N = 64;                     // punten per vorm na herbemonstering
  const D2R = Math.PI / 180;

  // Per niveau: toontijd in ms en of het ankerkruis (startpunt) getoond wordt.
  const TOON = { 1: 4000, 2: 3000, 3: 3000, 4: 3000, 5: 2000 };
  const ANKER = { 1: true, 2: true, 3: false, 4: false, 5: false };

  // ---------- meetkunde ----------
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const hoekTussen = (a, b) => {
    const la = Math.hypot(a.x, a.y), lb = Math.hypot(b.x, b.y);
    if (!la || !lb) return 0;
    const c = H.clamp((a.x * b.x + a.y * b.y) / (la * lb), -1, 1);
    return Math.acos(c) / D2R;
  };

  // Herbemonster een gesloten lijn (laatste punt sluit terug naar het eerste) naar n punten.
  function resSluit(pts, n) {
    const p = [];
    for (const q of pts) if (!p.length || H.afstand(p[p.length - 1], q) > 1e-9) p.push({ x: q.x, y: q.y });
    if (p.length < 2) return Array.from({ length: n }, () => ({ x: p[0].x, y: p[0].y }));
    p.push({ x: p[0].x, y: p[0].y });
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + H.afstand(p[i - 1], p[i]));
    const L = cum[cum.length - 1];
    const uit = [];
    let j = 1;
    for (let k = 0; k < n; k++) {
      const s = L * k / n;
      while (j < p.length - 1 && cum[j] < s) j++;
      const d = cum[j] - cum[j - 1] || 1;
      const f = (s - cum[j - 1]) / d;
      uit.push({ x: p[j - 1].x + (p[j].x - p[j - 1].x) * f, y: p[j - 1].y + (p[j].y - p[j - 1].y) * f });
    }
    return uit;
  }

  const omtrekGesloten = (pts) => H.lengte(pts) + H.afstand(pts[pts.length - 1], pts[0]);

  function middelpunt(pts) {
    return { x: H.gemiddelde(pts.map((p) => p.x)), y: H.gemiddelde(pts.map((p) => p.y)) };
  }
  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  // Centroïde naar de oorsprong en schaal naar eenheids-RMS-straal.
  function normaliseer(pts) {
    const c = middelpunt(pts);
    const s = Math.sqrt(H.gemiddelde(pts.map((p) => (p.x - c.x) ** 2 + (p.y - c.y) ** 2))) || 1;
    return pts.map((p) => ({ x: (p.x - c.x) / s, y: (p.y - c.y) / s }));
  }

  // Hoekpunten: richtingswijziging > 40 graden in een venster van 5 punten (gesloten lijn).
  // De hoek zelf wordt gemeten uit de richtingen vlak voor en na de piek, zodat de meting
  // niet afhangt van waar de herbemonstering toevallig valt.
  function detecteerHoeken(P) {
    const n = P.length, at = (i) => P[((i % n) + n) % n];
    const w = [];
    for (let i = 0; i < n; i++) w.push(hoekTussen(sub(at(i), at(i - 2)), sub(at(i + 2), at(i))));
    const uit = [];
    for (let i = 0; i < n; i++) {
      if (w[i] <= 40) continue;
      let top = true;
      for (let d = -2; d <= 2 && top; d++) {
        if (!d) continue;
        const v = w[((i + d) % n + n) % n];
        if (d < 0 ? v >= w[i] : v > w[i]) top = false;
      }
      if (!top) continue;
      const draai = hoekTussen(sub(at(i - 2), at(i - 5)), sub(at(i + 5), at(i + 2)));
      uit.push({ i, x: at(i).x, y: at(i).y, draai });
    }
    return uit;
  }

  // ---------- vormen (rond de oorsprong, grootste afmeting = s) ----------
  const cirkel = (s) => Array.from({ length: 96 }, (_, k) => ({ x: s / 2 * Math.cos(k / 96 * 2 * Math.PI - Math.PI / 2), y: s / 2 * Math.sin(k / 96 * 2 * Math.PI - Math.PI / 2) }));
  const rechthoek = (w, h) => [{ x: -w / 2, y: -h / 2 }, { x: w / 2, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }];
  const driehoek = (b, h) => [{ x: 0, y: -h / 2 }, { x: b / 2, y: h / 2 }, { x: -b / 2, y: h / 2 }];
  function druppel(s) {
    const uit = [];
    for (let k = 0; k < 96; k++) {
      const t = k / 96 * 2 * Math.PI;
      uit.push({ x: Math.sin(t) * Math.sin(t / 2), y: -Math.cos(t) });
    }
    const b = bbox(uit), f = s / Math.max(b.w, b.h);
    return uit.map((p) => ({ x: p.x * f, y: p.y * f }));
  }
  function ster(s) {
    const uit = [];
    for (let k = 0; k < 10; k++) {
      const r = k % 2 ? 0.45 : 1, a = -Math.PI / 2 + k * Math.PI / 5;
      uit.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
    }
    const b = bbox(uit), f = s / Math.max(b.w, b.h);
    return uit.map((p) => ({ x: p.x * f, y: p.y * f }));
  }

  // Controle voor onregelmatige veelhoeken: elke hoek scherp genoeg en geen te korte zijde.
  function veelhoekGoed(v) {
    const n = v.length, omtrek = omtrekGesloten(v);
    for (let i = 0; i < n; i++) {
      const a = v[(i + n - 1) % n], b = v[i], c = v[(i + 1) % n];
      if (hoekTussen(sub(b, a), sub(c, b)) < 55) return false;
      if (H.afstand(b, c) < 0.1 * omtrek) return false;
    }
    return true;
  }
  function onregelmatig(s, rng) {
    for (let poging = 0; poging < 300; poging++) {
      const n = rng.kies([5, 6]), stap = 2 * Math.PI / n;
      const v = [];
      for (let k = 0; k < n; k++) {
        const a = k * stap + rng.tussen(-0.25, 0.25) * stap - Math.PI / 2, r = rng.tussen(0.55, 1);
        v.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
      }
      if (!veelhoekGoed(v)) continue;
      const b = bbox(v), f = s / Math.max(b.w, b.h);
      return v.map((p) => ({ x: p.x * f, y: p.y * f }));
    }
    const v = Array.from({ length: 5 }, (_, k) => ({ x: Math.cos(k * 2 * Math.PI / 5 - Math.PI / 2), y: Math.sin(k * 2 * Math.PI / 5 - Math.PI / 2) }));
    const b = bbox(v), f = s / Math.max(b.w, b.h);
    return v.map((p) => ({ x: p.x * f, y: p.y * f }));
  }

  // Basisvorm kiezen: s = grootste afmeting.
  function basis(soort, s, rng) {
    switch (soort) {
      case 'cirkel': return { naam: 'cirkel', pts: cirkel(s) };
      case 'vierkant': return { naam: 'vierkant', pts: rechthoek(s, s) };
      case 'driehoek': return { naam: 'driehoek', pts: driehoek(s, s * 0.87) };
      case 'rechthoek2:1': return rng.kies([0, 1]) ? { naam: 'rechthoek', pts: rechthoek(s, s / 2) } : { naam: 'rechthoek', pts: rechthoek(s / 2, s) };
      case 'rechthoek1:3': return rng.kies([0, 1]) ? { naam: 'rechthoek', pts: rechthoek(s, s / 3) } : { naam: 'rechthoek', pts: rechthoek(s / 3, s) };
      case 'driehoek2:1': return rng.kies([0, 1]) ? { naam: 'driehoek', pts: driehoek(s, s / 2) } : { naam: 'driehoek', pts: driehoek(s / 2.2, s) };
      case 'driehoek1:3': return { naam: 'driehoek', pts: driehoek(s / 3, s) };
      case 'onregelmatig': return { naam: 'veelhoek', pts: onregelmatig(s, rng) };
      case 'druppel': return { naam: 'druppel', pts: druppel(s) };
      case 'ster': return { naam: 'ster', pts: ster(s) };
    }
    throw new Error('onbekende vorm ' + soort);
  }

  // Zet een vorm op een plek (bbox-midden op cx, cy) en bereken alles wat nakijken nodig heeft.
  function maakVorm(pts, cx, cy, naam) {
    const b = bbox(pts), mx = (b.x0 + b.x1) / 2, my = (b.y0 + b.y1) / 2;
    const dicht = pts.map((p) => ({ x: p.x - mx + cx, y: p.y - my + cy }));
    const p64 = resSluit(dicht, N);
    const c = middelpunt(p64);
    return { naam, dicht, p64, c, bb: bbox(p64), norm: normaliseer(p64), hoeken: detecteerHoeken(normaliseer(p64)), omtrek: omtrekGesloten(dicht) };
  }

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const kader = { x: vlak.w * 0.03, y: vlak.h * 0.05, w: vlak.w * 0.94, h: vlak.h * 0.66 };
    const u = Math.min(kader.w, kader.h);
    const mid = { x: kader.x + kader.w / 2, y: kader.y + kader.h / 2 };
    const lang = kader.w >= kader.h ? 'x' : 'y';
    const vormen = [];

    // Positie langs de lange as (fractie) en de korte as (jitter).
    const op = (t, jit) => {
      const j = rng.tussen(-jit, jit);
      return lang === 'x'
        ? { x: kader.x + kader.w * t, y: mid.y + j * kader.h }
        : { x: mid.x + j * kader.w, y: kader.y + kader.h * t };
    };

    if (niveau === 1) {
      const soort = rng.kies(['cirkel', 'vierkant', 'driehoek']);
      const v = basis(soort, rng.tussen(0.5, 0.62) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.06, 0.06) * u, mid.y + rng.tussen(-0.05, 0.05) * u, v.naam));
    } else if (niveau === 2) {
      const soort = rng.kies(['rechthoek2:1', 'rechthoek1:3', 'driehoek2:1', 'driehoek1:3']);
      const v = basis(soort, rng.tussen(0.66, 0.8) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.06, 0.06) * u, mid.y + rng.tussen(-0.04, 0.04) * u, v.naam));
    } else if (niveau === 3) {
      const soort = rng.kies(['onregelmatig', 'onregelmatig', 'druppel', 'ster']);
      const v = basis(soort, rng.tussen(0.6, 0.76) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.05, 0.05) * u, mid.y + rng.tussen(-0.04, 0.04) * u, v.naam));
    } else if (niveau === 4) {
      const pool = ['cirkel', 'vierkant', 'driehoek', 'rechthoek2:1'];
      const a = rng.kies(pool);
      let b = rng.kies(pool);
      if (b === a) b = pool[(pool.indexOf(a) + 1 + Math.floor(rng() * 3)) % pool.length];
      const pa = op(rng.tussen(0.25, 0.3), 0.1), pb = op(rng.tussen(0.7, 0.75), 0.1);
      for (const [soort, p] of [[a, pa], [b, pb]]) {
        const v = basis(soort, rng.tussen(0.28, 0.4) * u, rng);
        vormen.push(maakVorm(v.pts, p.x, p.y, v.naam));
      }
    } else if (rng() < 0.5) {
      // Huisje: muur (vierkant), dak (driehoek) en deur (rechthoek).
      const w = rng.tussen(0.42, 0.52) * u, dakH = w * 0.45, dh = w * 0.5, dw = w * 0.24;
      const totH = w + dakH, cx = mid.x + rng.tussen(-0.05, 0.05) * u, top = mid.y - totH / 2 + rng.tussen(-0.03, 0.03) * u;
      vormen.push(maakVorm(rechthoek(w, w), cx, top + dakH + w / 2, 'muur'));
      vormen.push(maakVorm(driehoek(w * 1.18, dakH), cx, top + dakH / 2, 'dak'));
      vormen.push(maakVorm(rechthoek(dw, dh), cx, top + dakH + w - dh / 2, 'deur'));
    } else {
      const pool = ['cirkel', 'vierkant', 'driehoek', 'rechthoek2:1'];
      const ts = [0.2, 0.5, 0.8];
      for (let k = 0; k < 3; k++) {
        const p = op(ts[k] + rng.tussen(-0.02, 0.02), 0.1);
        const v = basis(rng.kies(pool), rng.tussen(0.22, 0.27) * u, rng);
        vormen.push(maakVorm(v.pts, p.x, p.y, v.naam));
      }
    }

    // Het score-blok komt in de lege strook onder het kader.
    const plek = { x: vlak.w / 2, y: kader.y + kader.h + (vlak.h - kader.y - kader.h) * 0.42 };
    return {
      niveau, kader, u, vormen, plek,
      verbergNa: TOON[niveau],
      anker: ANKER[niveau] ? { x: vormen[0].dicht[0].x, y: vormen[0].dicht[0].y } : null,
      animeer: true,
    };
  }

  // ---------- tekenen ----------
  function pad(ctx, pts) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
  }

  function teken(ctx, o, vlak, info) {
    const k = o.kader, kl = vlak.kleur;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = kl.hulpZacht;
    ctx.lineWidth = 2;
    ctx.strokeRect(k.x, k.y, k.w, k.h);
    ctx.setLineDash([]);

    if (!info.verborgen) {
      o.animeer = true;
      ctx.strokeStyle = kl.hulp;
      ctx.lineWidth = 3;
      for (const v of o.vormen) { pad(ctx, v.dicht); ctx.stroke(); }
      // Aftelbalk boven het kader.
      const f = H.clamp(1 - info.sinds / o.verbergNa, 0, 1);
      const bw = k.w * 0.5, bx = k.x + (k.w - bw) / 2, by = Math.max(4, k.y * 0.4);
      ctx.lineWidth = 5;
      ctx.strokeStyle = kl.hulpZacht;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();
      if (f > 0) {
        ctx.strokeStyle = kl.accent;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw * f, by); ctx.stroke();
      }
    } else {
      o.animeer = false;
    }

    if (o.anker) {
      const s = 0.025 * o.u;
      ctx.strokeStyle = kl.accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(o.anker.x - s, o.anker.y); ctx.lineTo(o.anker.x + s, o.anker.y);
      ctx.moveTo(o.anker.x, o.anker.y - s); ctx.lineTo(o.anker.x, o.anker.y + s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- klaar? ----------
  function strekenGesloten(streek, o) {
    const p = streek.punten;
    if (p.length < 8) return false;
    const b = bbox(p), diag = Math.hypot(b.w, b.h);
    const kleinste = Math.min(...o.vormen.map((v) => Math.hypot(v.bb.w, v.bb.h)));
    if (diag < 0.5 * kleinste) return false;
    return H.afstand(p[0], p[p.length - 1]) <= 0.08 * diag;
  }

  function wijsToe(o, streken) {
    const groepen = o.vormen.map(() => []);
    for (const s of streken) {
      const c = middelpunt(H.herbemonster(s.punten, 4));
      let best = 0, bd = Infinity;
      o.vormen.forEach((v, i) => { const d = H.afstand(c, v.c); if (d < bd) { bd = d; best = i; } });
      groepen[best].push(s);
    }
    return groepen;
  }

  function isKlaar(o, streken) {
    if (!streken.length || !strekenGesloten(streken[streken.length - 1], o)) return false;
    const groepen = wijsToe(o, streken);
    return groepen.every((g) => g.some((s) => strekenGesloten(s, o)));
  }

  // ---------- nakijken ----------
  function vergelijkVorm(v, groep, o) {
    const kd = Math.hypot(o.kader.w, o.kader.h);
    const gesorteerd = groep.slice().sort((a, b) => a.punten[0].t - b.punten[0].t);
    const ruw = [];
    for (const s of gesorteerd) for (const p of s.punten) ruw.push(p);
    const D = resSluit(ruw, N);
    const dc = middelpunt(D), bD = bbox(D);

    const dx = dc.x - v.c.x, dy = dc.y - v.c.y;
    const pos = H.lin(Math.hypot(dx, dy) / kd, 0.01, 0.15);

    const r = Math.sqrt(Math.max(bD.w * bD.h, 1) / Math.max(v.bb.w * v.bb.h, 1));
    const maat = H.lin(Math.abs(Math.log(r)), 0.03, 0.5);
    const q = (Math.max(bD.w, 1) / Math.max(bD.h, 1)) / (v.bb.w / v.bb.h);

    const Dn = normaliseer(D);
    let best = Infinity;
    for (const dir of [1, -1]) {
      for (let k = 0; k < N; k++) {
        let som = 0;
        for (let i = 0; i < N; i++) {
          const a = Dn[(((dir * i + k) % N) + N) % N], b = v.norm[i];
          som += Math.hypot(a.x - b.x, a.y - b.y);
        }
        if (som / N < best) best = som / N;
      }
    }
    const vorm = H.lin(best, 0.02, 0.12);

    let hoek = null;
    if (v.hoeken.length) {
      const gez = detecteerHoeken(Dn);
      let tot = 0;
      for (const e of v.hoeken) {
        let bk = null, bd = 0.4;
        for (const g of gez) { const d = Math.hypot(g.x - e.x, g.y - e.y); if (d < bd) { bd = d; bk = g; } }
        tot += bk ? H.lin(Math.abs(bk.draai - e.draai), 3, 25) : 0;
      }
      hoek = tot / v.hoeken.length;
    }

    const w = hoek === null ? [0.30, 0.25, 0.45, 0] : [0.25, 0.20, 0.35, 0.20];
    const som = w[0] * pos + w[1] * maat + w[2] * vorm + w[3] * (hoek || 0);
    // Een vorm die op de verkeerde plek of maat staat kan niet hoog scoren, ook al klopt de vorm.
    const score = 100 * som * (0.55 + 0.45 * Math.min(pos, maat));

    // Grote afwijkingen voor de uitslag.
    const grens = 0.1 * Math.hypot(v.bb.w, v.bb.h), dichtGesloten = v.dicht.concat([v.dicht[0]]);
    const fouten = D.filter((p) => H.polyAfstand(p, dichtGesloten) > grens).map((p) => ({ x: p.x, y: p.y }));

    return { score, pos, maat, vorm, hoek, r, q, dx, dy, fouten, ontbreekt: false };
  }

  function nakijken(o, streken) {
    const bruikbaar = streken.filter((s) => s.punten.length >= 2);
    const kleinsteOmtrek = Math.min(...o.vormen.map((v) => v.omtrek));
    const totaal = bruikbaar.reduce((s, st) => s + H.lengte(st.punten), 0);
    if (bruikbaar.length < 1 || totaal < 0.4 * kleinsteOmtrek) return { ongeldig: 'Te kort, teken de hele vorm opnieuw.' };

    const groepen = wijsToe(o, bruikbaar);
    const res = o.vormen.map((v, i) => groepen[i].length && groepen[i].reduce((s, st) => s + H.lengte(st.punten), 0) > 0.2 * v.omtrek
      ? vergelijkVorm(v, groepen[i], o)
      : { score: 0, ontbreekt: true, fouten: [] });
    const score = Math.round(H.clamp(H.gemiddelde(res.map((x) => x.score)), 0, 100));
    return { score, tip: kiesTip(res, o, score), res, fouten: [].concat(...res.map((x) => x.fouten)) };
  }

  function kiesTip(res, o, score) {
    const slecht = res.reduce((a, b) => (b.score < a.score ? b : a));
    if (slecht.ontbreekt) return o.vormen.length > 1 ? 'Een vorm ontbreekt. Onthoud alle ' + o.vormen.length + ' vormen.' : 'Teken de hele vorm.';
    const kand = [];
    const rel = Math.max(Math.abs(slecht.dx) / o.kader.w, Math.abs(slecht.dy) / o.kader.h);
    if (slecht.r < 0.8 || slecht.r > 1.25) kand.push([(1 - slecht.maat) * 0.2 + 0.3, slecht.r < 1 ? 'Te klein: teken groter, de vorm was ruimer.' : 'Te groot: teken kleiner, de vorm was compacter.']);
    if (rel > 0.06) {
      const horiz = Math.abs(slecht.dx) / o.kader.w >= Math.abs(slecht.dy) / o.kader.h;
      const tekst = horiz
        ? (slecht.dx < 0 ? 'Te ver naar links: begin verder naar rechts.' : 'Te ver naar rechts: begin verder naar links.')
        : (slecht.dy < 0 ? 'Te ver naar boven: teken lager.' : 'Te ver naar onder: teken hoger.');
      kand.push([(1 - slecht.pos) * 0.25 + 0.3, tekst]);
    }
    if (slecht.q < 0.85 || slecht.q > 1.18) kand.push([Math.min(1, Math.abs(Math.log(slecht.q)) / 0.5) * 0.35 + 0.2, 'Verhouding scheef: de vorm was ' + (slecht.q < 1 ? 'breder' : 'hoger') + ' dan jij tekende.']);
    if (slecht.hoek !== null && slecht.hoek < 0.6) kand.push([(1 - slecht.hoek) * 0.2 + 0.25, 'Hoeken te rond of ontbrekend: zet scherp om in de hoek.']);
    if (kand.length) { kand.sort((a, b) => b[0] - a[0]); return kand[0][1]; }
    if (score >= 85) return slecht.hoek !== null ? 'Sterk, je hoekpunten zaten erop.' : 'Sterk, plek en maat kloppen.';
    return 'Vorm wijkt af: let op de verhoudingen tussen de zijden.';
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    for (const v of o.vormen) { pad(ctx, v.dicht); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.fillStyle = vlak.kleur.fout;
    for (const p of (u.fouten || [])) { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'geheugen',
    naam: 'Kijk, verberg, teken',
    uitleg: 'Onthoud de vorm voordat hij verdwijnt en teken hem op dezelfde plek na.',
    fundament: 'Observatie en visueel geheugen: plek, maat, verhoudingen en hoeken van een vorm inschatten.',
    meerdereStreken: true,
    stilNa: 2500,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();

  const TOLFRAC = { 1: 0.05, 2: 0.042, 3: 0.036, 4: 0.03 };

    } else if (isFinite(f.x1) && isFinite(f.x2)) p.push([f.x1, f.y1], [f.x2, f.y2]);

    const laatste = st.idx === st.stappen.length - 1;
    const o = {
      naam: st.t.naam || 'Tekening', stap: st.idx, totaal: st.stappen.length, soort: stap.soort, niveau: st.niveau,
      lay, laatste, klaar: st.eind, toonUitslag: 900, meerdereStreken: stap.soort === 'arceren',
      animeer: st.niveau === 2 || st.niveau === 4,
    };
    if (stap.soort === 'arceren') {
      const s = st.t.schaduw;
      // schaduwvlak minstens ~25% van de breedte en ~10% van de hoogte, binnen beeld
      const a = H.clamp(Math.max(s.a * lay.s, vlak.w * 0.125), 10, vlak.w / 2 - 12);
      const b = Math.max(s.b * lay.s, 18, vlak.h * 0.05);
      const ruimte = vlak.h - TOP - ONDER;
      const bb = Math.min(b, ruimte / 2);
      const cy = H.clamp(lay.oy + s.cy * lay.s, TOP + bb + 4, vlak.h - ONDER - bb - 4);
      o.hatch = { cx: H.clamp(lay.ox + s.cx * lay.s, a + 8, vlak.w - a - 8), cy, a, b: bb };
    } else {
      let d = naarPx(lay, stap.punten);
      if ((stap.soort === 'cirkel' || stap.soort === 'ellips') && H.afstand(d[0], d[d.length - 1]) > 0.5) d.push(Object.assign({}, d[0]));
      o.doel = d;
    }
    // alle doelpunten (ruw bemonsterd) voor scorePlek
    o.alle = [];
    for (const s of st.stappen) {
      if (s.punten) for (const q of s.punten) o.alle.push({ x: lay.ox + q[0] * lay.s, y: lay.oy + q[1] * lay.s });
    }
    if (o.hatch) for (let i = 0; i < 16; i++) { const w = i / 16 * Math.PI * 2; o.alle.push({ x: o.hatch.cx + o.hatch.a * Math.cos(w), y: o.hatch.cy + o.hatch.b * Math.sin(w) }); }
    return o;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const zelfde = Math.abs(vlak.w - laatsteVlak.w) < 1 && Math.abs(vlak.h - laatsteVlak.h) < 1;
    laatsteVlak = { w: vlak.w, h: vlak.h };
    const stand = leesStand();
    // handmatig niveau (knoppen van de motor): alleen als de motor-waarde veranderd is
    if (laatsteNiv !== null && niveau !== laatsteNiv) { stand.niveau = H.clamp(niveau, 1, 4); stand.sindsWissel = 0; schrijf(SLEUTEL, stand); if (st && !st.eind) st.niveau = stand.niveau; }
    laatsteNiv = niveau;

    if (st && st.eind) { if (zelfde) st = null; }           // tik: nieuwe tekening; resize: eindscherm blijft
    else if (st && st.wacht) { st.idx++; st.poging = 0; st.wacht = false; }
    if (!st) st = nieuweTekening(H.clamp(stand.niveau, 1, 4), rng);
    if (!st) return { geenData: true, soort: 'vrij', niveau: 1, toonUitslag: 900, meerdereStreken: false, alle: [] };
    if (st.idx >= st.stappen.length) st.idx = st.stappen.length - 1;
    return maakOpgave(vlak);
  }

  // ---------- scoren: algemeen ----------
  const draaiing = (p) => {
    let s = 0;
    for (let i = 1; i < p.length - 1; i++) {
      let d = Math.atan2(p[i + 1].y - p[i].y, p[i + 1].x - p[i].x) - Math.atan2(p[i].y - p[i - 1].y, p[i].x - p[i - 1].x);
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      s += Math.abs(d);
    }
    return s;
  };
  const scherpsteHoek = (p) => {   // grootste richtingsverandering (graden) over een venster van 2 stappen
    let m = 0;
    for (let i = 2; i < p.length - 2; i++) {
      let d = Math.atan2(p[i + 2].y - p[i].y, p[i + 2].x - p[i].x) - Math.atan2(p[i].y - p[i - 2].y, p[i].x - p[i - 2].x);
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      m = Math.max(m, Math.abs(d) * 180 / Math.PI);
    }
    return m;
  };
  const kaderPx = (pts) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const q of pts) { x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    return { w: x1 - x0, h: y1 - y0 };
  };
  const rmsRecht = (pts) => {
    const f = H.lijnFit(pts);
    return Math.sqrt(H.gemiddelde(pts.map((q) => H.lijnAfstand(q, { x: f.mx, y: f.my }, f.dx, f.dy) ** 2)));
  };
  const rondheidCv = (pts) => {
    const mx = H.gemiddelde(pts.map((q) => q.x)), my = H.gemiddelde(pts.map((q) => q.y));
    const r = pts.map((q) => Math.hypot(q.x - mx, q.y - my));
    const m = H.gemiddelde(r);
    return m > 0 ? H.sd(r) / m : 1;
  };

  function beoordeelLijn(o, streek, vlak) {
    const S0 = streek.punten, D = o.doel;
    const lenS = H.lengte(S0), L = Math.max(H.lengte(D), 1);
    if (S0.length < 3 || lenS < 8) return { ongeldig: 'Teken de lijn in één doorlopende streek' };
    const kd = kaderPx(D);
    const R = Math.max(Math.hypot(kd.w, kd.h), 40);
    const pxMm = vlak.pxPerMm || 96 / 25.4;
    let tol = Math.max(R * (TOLFRAC[o.niveau] || 0.07), 2.5 * pxMm);
    if (o.soort === 'vrij') tol *= 1.6;
    const stap = Math.max(2, R / 60);
    const S = H.herbemonster(S0, stap), Dd = H.herbemonster(D, stap);
    const dSD = S.map((q) => H.polyAfstand(q, D)), dDS = Dd.map((q) => H.polyAfstand(q, S0));
    const gem = (H.gemiddelde(dSD) + H.gemiddelde(dDS)) / 2 / tol;
    const mx = Math.max(Math.max.apply(null, dSD), Math.max.apply(null, dDS)) / tol;
    const dekking = dDS.filter((d) => d <= 1.8 * tol).length / dDS.length;
    const precisie = dSD.filter((d) => d <= 1.8 * tol).length / dSD.length;
    const pos = 100 * (0.4 * H.lin(gem, 0.25, 1.6) + 0.2 * H.lin(mx, 1, 4.5) + 0.25 * H.lin(1 - dekking, 0.05, 0.5) + 0.15 * H.lin(1 - precisie, 0.05, 0.5));

    // extra's per soort (0..1) met bijpassende tip
    let ex = 1, exTip = '';
    const stap2 = Math.max(4, R / 25), S2 = H.herbemonster(S0, stap2), D2 = H.herbemonster(D, stap2);
    const gap = H.afstand(S0[0], S0[S0.length - 1]);
    const dm = Math.max((kd.w + kd.h) / 2, 1);
    const soort = o.soort;
    if (soort === 'lijn') {
      const dev = Math.max(0, rmsRecht(S) - rmsRecht(Dd)) / Math.max(lenS, 1);
      ex = H.lin(dev, 0.012, 0.06); exTip = 'Trek de lijn in één vlotte, rechte beweging';
    } else if (soort === 'cirkel') {
      const sl = H.lin(gap / dm, 0.06, 0.3), rd = H.lin(Math.max(0, rondheidCv(S) - rondheidCv(Dd)), 0.04, 0.16);
      ex = 0.5 * sl + 0.5 * rd; exTip = sl <= rd ? 'Sluit de cirkel: eindig waar je begon' : 'Maak de cirkel ronder';
    } else if (soort === 'ellips') {
      const sl = H.lin(gap / dm, 0.06, 0.3);
      const gl = H.lin(Math.max(0, draaiing(S2) - draaiing(D2) * 1.15 - 0.3) / (draaiing(D2) + 1), 0.25, 1.2);
      ex = 0.6 * sl + 0.4 * gl; exTip = sl <= gl ? 'Sluit de ellips: eindig waar je begon' : 'Maak de ellips gladder, zonder knikken';
    } else if (soort === 'curve' || soort === 'slinger') {
      const v = H.snelheden(S0), a = Math.floor(v.length * 0.08), vv = v.slice(a, v.length - a);
      const cv = vv.length >= 6 && H.gemiddelde(vv) > 0 ? H.sd(vv) / H.gemiddelde(vv) : 0;
      const sn = H.lin(cv, 0.5, 1.2);
      const gl = H.lin(Math.max(0, draaiing(S2) - draaiing(D2) * 1.15 - 0.3) / (draaiing(D2) + 1), 0.25, 1.2);
      ex = 0.5 * sn + 0.5 * gl; exTip = sn <= gl ? 'Teken in één gelijkmatige beweging, niet stotteren' : 'Maak de bocht vloeiender, zonder wiebels';
    } else if (soort === 'hoek') {
      ex = H.lin(Math.abs(scherpsteHoek(S2) - scherpsteHoek(D2)), 12, 50); exTip = 'Maak de hoek scherper, met een duidelijke punt';
    }
    let score = pos * (0.65 + 0.35 * ex);
    const lenG = H.lengte(S2), teKort = lenG < 0.6 * L, teLang = lenG > 1.8 * L && soort !== 'cirkel' && soort !== 'ellips';
    if (teKort) score = Math.min(score, 55);
    if (teLang) score = Math.min(score, 70);
    score = H.clamp(score, 0, 100);

    let tip;
    if (teKort) tip = 'Je lijn is te kort, trek hem helemaal door';
    else if (teLang) tip = 'Je lijn schiet door, stop op het eindpunt';
    else if (dekking < 0.7) tip = 'Volg de lijn over de hele lengte';
    else if (gem > 1.1 || mx > 3) tip = 'Blijf dichter bij de doellijn';
    else if (ex < 0.6 && exTip) tip = exTip;
    else if (score >= 85) tip = ['Netjes gevolgd', 'Mooie lijn', 'Goed gedaan, door naar de volgende'][Math.floor(score) % 3];
    else tip = 'Nog iets nauwkeuriger langs de lijn';
    return { score, tip, positie: pos, extra: ex * 100, dekking };
  }

  // ---------- scoren: arceren ----------
  function beoordeelArcering(o, streken) {
    const e = o.hatch;
    const lijsten = streken.map((s) => H.herbemonster(s.punten, 4)).filter((p) => p.length >= 2 && H.lengte(p) >= 8);
    if (lijsten.length < 4) return { ongeldig: 'Zet nog wat arceerlijnen en tik op Klaar', behoud: true };
    const hoeken = lijsten.map((p) => H.lijnFit(p).hoek);
    const cs = H.gemiddelde(hoeken.map((a) => Math.cos(2 * a))), sn = H.gemiddelde(hoeken.map((a) => Math.sin(2 * a)));
    const Rr = Math.min(1, Math.hypot(cs, sn));
    const sdHoek = Rr > 0 ? Math.sqrt(-2 * Math.log(Rr)) * 90 / Math.PI : 90;
    const mean = 0.5 * Math.atan2(sn, cs), phi = mean + Math.PI / 2;
    const hw = Math.sqrt((e.a * Math.cos(phi)) ** 2 + (e.b * Math.sin(phi)) ** 2);
    const offs = lijsten.map((p) => {
      const mx = H.gemiddelde(p.map((q) => q.x)), my = H.gemiddelde(p.map((q) => q.y));
      return (mx - e.cx) * Math.cos(phi) + (my - e.cy) * Math.sin(phi);
    }).sort((a, b) => a - b);
    const BAKS = 6, bak = new Set();
    for (const f of offs) if (Math.abs(f) <= hw) bak.add(Math.min(BAKS - 1, Math.floor((f + hw) / (2 * hw) * BAKS)));
    const cov = bak.size / BAKS;
    const gaten = [];
    for (let i = 1; i < offs.length; i++) gaten.push(offs[i] - offs[i - 1]);
    const cv = gaten.length >= 2 && H.gemiddelde(gaten) > 0 ? H.sd(gaten) / H.gemiddelde(gaten) : 1;
    let bin = 0, tot = 0;
    for (const p of lijsten) for (const q of p) { tot++; if (((q.x - e.cx) / (e.a * 1.1)) ** 2 + ((q.y - e.cy) / (e.b * 1.1)) ** 2 <= 1) bin++; }
    const binnen = tot ? bin / tot : 0;
    const dek = H.lin(1 - cov, 0.15, 0.65), par = H.lin(sdHoek, 6, 25), gap = H.lin(cv, 0.3, 1), inn = H.lin(1 - binnen, 0.1, 0.5);
    const score = 100 * (0.3 * dek + 0.25 * par + 0.2 * gap + 0.25 * inn);
    const w = [[dek, 'Vul het hele schaduwvlak met lijntjes'], [par, 'Houd je arceerlijnen evenwijdig'], [gap, 'Zet de lijntjes op gelijke afstand'], [inn, 'Blijf binnen het schaduwvlak']];
    w.sort((a, b) => a[0] - b[0]);
    const tip = w[0][0] < 0.7 ? w[0][1] : 'Mooi gearceerd';
    return { score, tip, dekking: cov * 100, evenwijdig: par * 100, afstand: gap * 100, binnen: binnen * 100 };
  }

  // ---------- nakijken ----------
  function nakijken(o, streken, vlak) {
    if (o.geenData) return { ongeldig: 'Er zijn nog geen krabbels geladen' };
    if (o.klaar) return { score: Math.round(st ? st.totaal : 0), tip: 'Tik voor een nieuwe tekening', geenNiveau: true };
    let u;
    if (o.soort === 'arceren') u = beoordeelArcering(o, streken);
    else {
      let streek = streken[0];
      for (const s of streken) if (H.lengte(s.punten) > H.lengte(streek.punten)) streek = s;
      u = beoordeelLijn(o, streek, vlak);
    }
    if (u.ongeldig) return u;
    if (u.score < SLECHT && st && st.poging < 1 && o.soort !== 'arceren') { st.poging++; return { ongeldig: 'Probeer deze lijn nog eens' }; }
    u.geenNiveau = true;
    if (st && o.stap === st.idx && !st.wacht) {
      const lay = o.lay;
      if (o.soort === 'arceren') {
        st.hatch = { score: u.score, strepen: streken.map((s) => naarData(lay, dunnen(s.punten, 24))) };
      } else {
        const s = streken.reduce((a, b) => (H.lengte(b.punten) > H.lengte(a.punten) ? b : a));
        st.gedaan[o.stap] = { soort: o.soort, score: u.score, punten: naarData(lay, H.herbemonsterN(s.punten, 60)) };
      }
      st.wacht = true;
      if (o.laatste) afronden();
    }
    return u;
  }

  function afronden() {
    const scores = st.gedaan.map((g) => g.score);
    if (st.hatch) scores.push(st.hatch.score);
    st.totaal = scores.length ? H.gemiddelde(scores) : 0;
    st.eind = true;
    const stand = leesStand();
    stand.klaar++; stand.sindsWissel++;
    stand.scores.push(Math.round(st.totaal)); stand.scores = stand.scores.slice(-10);
    const l3 = stand.scores.slice(-3);
    if (stand.sindsWissel >= 2 && stand.niveau < 4 && l3.length >= 2 && H.gemiddelde(l3) >= 70) { stand.niveau++; stand.sindsWissel = 0; }
    else if (stand.sindsWissel >= 2 && stand.niveau > 1 && l3.length >= 3 && H.gemiddelde(l3) < 40) { stand.niveau--; stand.sindsWissel = 0; }
    schrijf(SLEUTEL, stand);
    bewaarGalerij();
  }

  function bewaarGalerij() {
    const rec = {
      id: st.t.id, naam: st.t.naam, datum: new Date().toISOString(), score: Math.round(st.totaal), b: st.kd.w, h: st.kd.h,
      lijnen: st.gedaan.map((g) => ({ s: Math.round(g.score), z: g.soort, p: rond3(dunnen(g.punten, 30)) })),
      arceer: st.hatch ? st.hatch.strepen.map((p) => rond3(dunnen(p, 4))) : [],
    };
    let g = lees(GALERIJ, []);
    if (!Array.isArray(g)) g = [];
    g.push(rec);
    g = g.slice(-20);
    if (!schrijf(GALERIJ, g)) { g = g.slice(-8); schrijf(GALERIJ, g); }
  }

  // ---------- tekenen ----------
  function lettertype() {
    try { return getComputedStyle(document.body).fontFamily || 'sans-serif'; } catch (e) { return 'sans-serif'; }
  }
  function kortTekst(ctx, tekst, maxB) {
    if (ctx.measureText(tekst).width <= maxB) return tekst;
    while (tekst.length > 1 && ctx.measureText(tekst + '…').width > maxB) tekst = tekst.slice(0, -1);
    return tekst + '…';
  }
  function pictogram(ctx, soort, x, y, k) {   // klein symbool voor de techniek, 14 px breed
    ctx.save();
    ctx.strokeStyle = k; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (soort === 'lijn') { ctx.moveTo(x, y + 5); ctx.lineTo(x + 14, y - 5); }
    else if (soort === 'hoek') { ctx.moveTo(x, y - 5); ctx.lineTo(x + 3, y + 5); ctx.lineTo(x + 14, y + 1); }
    else if (soort === 'cirkel') ctx.arc(x + 7, y, 6, 0, Math.PI * 2);
    else if (soort === 'ellips') ctx.ellipse(x + 7, y, 7, 4, 0, 0, Math.PI * 2);
    else if (soort === 'curve') { ctx.moveTo(x, y + 5); ctx.quadraticCurveTo(x + 7, y - 10, x + 14, y + 5); }
    else if (soort === 'slinger') { ctx.moveTo(x, y); ctx.bezierCurveTo(x + 2, y - 7, x + 5, y - 7, x + 7, y); ctx.bezierCurveTo(x + 9, y + 7, x + 12, y + 7, x + 14, y); }
    else if (soort === 'arceren') { for (let i = 0; i < 4; i++) { ctx.moveTo(x + i * 4, y + 5); ctx.lineTo(x + i * 4 + 4, y - 5); } }
    else { ctx.moveTo(x, y + 2); ctx.lineTo(x + 5, y - 4); ctx.lineTo(x + 9, y + 4); ctx.lineTo(x + 14, y - 3); }
    ctx.stroke();
    ctx.restore();
  }
  const kleurVoor = (vlak, s) => (s >= 75 ? vlak.kleur.goed : s >= 50 ? vlak.kleur.waarschuwing : vlak.kleur.fout);

  function polylijn(ctx, pts) {
    ctx.beginPath();
    pts.forEach((q, i) => { if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); });
    ctx.stroke();
  }
  function stip(ctx, x, y, r, k) { ctx.fillStyle = k; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function raakpunten(d) {
    let a = d[0], b = d[0], c = d[0], e = d[0];
    for (const q of d) { if (q.x < a.x) a = q; if (q.x > b.x) b = q; if (q.y < c.y) c = q; if (q.y > e.y) e = q; }
    return [a, b, c, e];
  }

  function hud(ctx, o, vlak, fam) {
    const m = Math.min(28, vlak.w * 0.05), k = vlak.kleur;
    ctx.save();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const gedaan = st ? st.gedaan.filter(Boolean).map((g) => g.score) : [];
    const gemTxt = gedaan.length ? 'gem. ' + Math.round(H.gemiddelde(gedaan)) : '';
    ctx.font = '500 12px ' + fam;
    const gemB = gemTxt ? ctx.measureText(gemTxt).width + 10 : 0;
    ctx.font = '700 15px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText(kortTekst(ctx, o.naam, vlak.w - 2 * m - gemB), m, 15);
    ctx.font = '500 12px ' + fam; ctx.fillStyle = k.tekstZacht;
    if (gemTxt) { ctx.textAlign = 'right'; ctx.fillText(gemTxt, vlak.w - m, 15); ctx.textAlign = 'left'; }
    pictogram(ctx, o.soort, m, 33, k.accent);
    ctx.fillStyle = k.tekstZacht;
    ctx.fillText((SOORTEN[o.soort] || '') + '  ·  stap ' + (o.stap + 1) + '/' + o.totaal, m + 20, 33);
    const b = bron();
    if (b) {
      ctx.font = '400 10px ' + fam; ctx.textAlign = 'center'; ctx.fillStyle = k.tekstZacht; ctx.globalAlpha = 0.8;
      ctx.fillText(kortTekst(ctx, b, vlak.w - 2 * m), vlak.w / 2, vlak.h - 9);
    }
    ctx.restore();
  }

  function eindscherm(ctx, o, vlak, fam) {
    const k = vlak.kleur, lay = o.lay;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
    st.gedaan.forEach((g) => {
      if (!g) return;
      ctx.strokeStyle = kleurVoor(vlak, g.score);
      polylijn(ctx, naarPx(lay, g.punten));
    });
    if (st.hatch) {
      ctx.strokeStyle = kleurVoor(vlak, st.hatch.score); ctx.lineWidth = 1.6;
      st.hatch.strepen.forEach((p) => polylijn(ctx, naarPx(lay, p)));
    }
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const m = Math.min(28, vlak.w * 0.05), tot = Math.round(st.totaal);
    ctx.font = '700 16px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText(kortTekst(ctx, o.naam, vlak.w - 2 * m - 90), m, 15);
    ctx.font = '800 22px ' + fam; ctx.fillStyle = kleurVoor(vlak, tot); ctx.textAlign = 'right';
    ctx.fillText(String(tot), vlak.w - m, 16);
    ctx.textAlign = 'left'; ctx.font = '500 11px ' + fam;
    let x = m;
    [['goed', k.goed], ['matig', k.waarschuwing], ['fout', k.fout]].forEach((e) => {
      stip(ctx, x + 4, 34, 4, e[1]); ctx.fillStyle = k.tekstZacht; ctx.fillText(e[0], x + 12, 34);
      x += 14 + ctx.measureText(e[0]).width + 12;
    });
    ctx.textAlign = 'center'; ctx.font = '600 14px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText('tik voor een nieuwe tekening', vlak.w / 2, vlak.h - 26);
    ctx.restore();
  }

  function teken(ctx, o, vlak, info) {
    const fam = lettertype(), k = vlak.kleur;
    info = info || { sinds: 0 };
    if (o.geenData) {
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = k.tekstZacht; ctx.font = '600 16px ' + fam;
      ctx.fillText('Krabbelkunst heeft nog geen krabbels geladen', vlak.w / 2, vlak.h / 2 - 12);
      ctx.font = '500 13px ' + fam; ctx.fillText('(QuickDrawData ontbreekt)', vlak.w / 2, vlak.h / 2 + 12);
      ctx.restore();

<script>
/* extra/ontwerpschets.js */
// Ontwerpschets: de zware versie van Krabbelkunst. Teken een echte schets van een productontwerper
// (OpenSketch) na in de volgorde van de ontwerper: eerst de opzet (hulplijnen), dan de vorm.
// Elke stap is een groepje van 2-4 lijnen in perspectief; je tekent ze allemaal en dan wordt nagekeken.
// Alle spelstatus zit in een closure; de motor vraagt na elke geldige uitslag om de volgende stap.
(function () {
  const H = window.Hulp;
  const FASEN = { opzet: 'Opzet', vorm: 'Vorm' };
  const FASE_TIP = { opzet: 'hulplijnen: licht en vlot, door tot het eind', vorm: 'de echte randen: stevig en in één streek' };
  const TOLFRAC = { 1: 0.026, 2: 0.022, 3: 0.019, 4: 0.016 };   // deel van de tekengrootte
  const ZIEN = { 2: 2500, 4: 2000 };                             // ms dat de lijnen zichtbaar blijven
  const SLECHT = 35;            // eronder: één keer opnieuw
  const SLEUTEL = 'tt.ontwerpschets', RECENT = 'tt.ontwerpschets.recent', GALERIJ = 'tt.ontwerpschets.galerij';
  const TOP = 46, ONDER = 40;   // ruimte voor HUD en voor tik-tekst/bronvermelding

  // ---------- opslag ----------
  function lees(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  const leesStand = () => Object.assign({ niveau: 1, klaar: 0, scores: [], sindsWissel: 0 }, lees(SLEUTEL, {}));

  // ---------- data ----------
  const goedePunten = (p) => (Array.isArray(p) ? p.filter((q) => Array.isArray(q) && isFinite(q[0]) && isFinite(q[1])) : []);
  function dataTekeningen() {
    const D = window.OpenSketchData;
    if (!D || !Array.isArray(D.tekeningen)) return [];
    return D.tekeningen.filter((t) => t && Array.isArray(t.stappen) && t.stappen.some((s) => s && Array.isArray(s.lijnen) && s.lijnen.some((l) => goedePunten(l.punten).length >= 2)));
  }
  function bron() { const D = window.OpenSketchData; return D && D.bron ? String(D.bron) : ''; }

  function maakStappen(t) {
    const st = [];
    for (const s of t.stappen) {
      if (!s || !Array.isArray(s.lijnen)) continue;
      const lijnen = s.lijnen.map((l) => ({ soort: l.soort === 'lijn' || l.soort === 'ellips' ? l.soort : 'curve', punten: goedePunten(l.punten) })).filter((l) => l.punten.length >= 2);
      if (lijnen.length) st.push({ fase: s.fase === 'opzet' ? 'opzet' : 'vorm', lijnen });
    }
    return st;
  }
  function kader(stappen) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of stappen) for (const l of s.lijnen) for (const q of l.punten) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
    if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }
    return { x0, y0, w: Math.max(x1 - x0, 0.05), h: Math.max(y1 - y0, 0.05) };
  }
  function indeling(kd, vlak) {
    const m = Math.min(28, vlak.w * 0.05);
    const bw = Math.max(vlak.w - 2 * m, 10), bh = Math.max(vlak.h - TOP - ONDER - m * 0.5, 10);
    const s = Math.min(bw / kd.w, bh / kd.h);
    return { s, ox: (vlak.w - kd.w * s) / 2 - kd.x0 * s, oy: TOP + (bh - kd.h * s) / 2 - kd.y0 * s };
  }
  const naarPx = (lay, pts) => pts.map((q) => ({ x: lay.ox + q[0] * lay.s, y: lay.oy + q[1] * lay.s, p: 0.5, t: 0 }));
  const naarData = (lay, pts) => pts.map((q) => [(q.x - lay.ox) / lay.s, (q.y - lay.oy) / lay.s]);
  const dunnen = (pts, n) => { if (pts.length <= n) return pts; const u = []; for (let i = 0; i < n; i++) u.push(pts[Math.round(i * (pts.length - 1) / (n - 1))]); return u; };
  const rond3 = (pts) => pts.map((q) => [Math.round(q[0] * 1000) / 1000, Math.round(q[1] * 1000) / 1000]);

  // ---------- spelstatus ----------
  let st = null;              // lopende schets
  let laatsteVlak = { w: 0, h: 0 };
  let laatsteNiv = null;

  function kiesTekening(rng) {
    const alle = dataTekeningen();
    if (!alle.length) return null;
    let recent = lees(RECENT, []);
    if (!Array.isArray(recent)) recent = [];
    let kand = alle.filter((t) => recent.indexOf(t.id) < 0);
    if (!kand.length) kand = alle;
    const t = kand[Math.min(kand.length - 1, Math.floor(rng() * kand.length))];
    recent.push(t.id);
    recent = recent.slice(-Math.min(15, Math.max(1, alle.length - 1)));
    schrijf(RECENT, recent);
    return t;
  }

  function nieuweTekening(niveau, rng) {
    const t = kiesTekening(rng);
    if (!t) return null;
    const stappen = maakStappen(t);
    if (!stappen.length) return null;
    return { t, stappen, kd: kader(stappen), idx: 0, gedaan: [], niveau, poging: 0, wacht: false, eind: false, totaal: 0 };
  }

  function maakOpgave(vlak) {
    const lay = indeling(st.kd, vlak);
    const stap = st.stappen[st.idx];
    const o = {
      naam: st.t.naam || 'Schets', ontwerper: st.t.ontwerper || '', stap: st.idx, totaal: st.stappen.length, fase: stap.fase,
      niveau: st.niveau, lay, laatste: st.idx === st.stappen.length - 1, klaar: st.eind, toonUitslag: 1100,
      meerdereStreken: true, animeer: !!ZIEN[st.niveau],
      tol: Math.max(lay.s * Math.max(st.kd.w, st.kd.h) * (TOLFRAC[st.niveau] || 0.02), 2.2 * (vlak.pxPerMm || 96 / 25.4)),
    };
    o.doelen = stap.lijnen.map((l) => {
      const d = naarPx(lay, l.punten);
      if (l.soort === 'ellips' && H.afstand(d[0], d[d.length - 1]) > 0.5) d.push(Object.assign({}, d[0]));
      return { soort: l.soort, punten: d, fijn: H.herbemonster(d, 3) };
    });
    o.alle = [];
    for (const s of st.stappen) for (const l of s.lijnen) for (const q of l.punten) o.alle.push({ x: lay.ox + q[0] * lay.s, y: lay.oy + q[1] * lay.s });
    return o;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const zelfde = Math.abs(vlak.w - laatsteVlak.w) < 1 && Math.abs(vlak.h - laatsteVlak.h) < 1;
    laatsteVlak = { w: vlak.w, h: vlak.h };
    const stand = leesStand();
    // handmatig niveau (knoppen van de motor): alleen als de motor-waarde veranderd is
    if (laatsteNiv !== null && niveau !== laatsteNiv) { stand.niveau = H.clamp(niveau, 1, 4); stand.sindsWissel = 0; schrijf(SLEUTEL, stand); if (st && !st.eind) st.niveau = stand.niveau; }
    laatsteNiv = niveau;

    if (st && st.eind) { if (zelfde) st = null; }           // tik: nieuwe schets; resize: eindscherm blijft
    else if (st && st.wacht) { st.idx++; st.poging = 0; st.wacht = false; }
    if (!st) st = nieuweTekening(H.clamp(stand.niveau, 1, 4), rng);
    if (!st) return { geenData: true, niveau: 1, toonUitslag: 900, meerdereStreken: false, alle: [], doelen: [] };
    if (st.idx >= st.stappen.length) st.idx = st.stappen.length - 1;
    return maakOpgave(vlak);
  }

  // ---------- scoren ----------
  const rmsRecht = (pts) => {
    const f = H.lijnFit(pts);
    return Math.sqrt(H.gemiddelde(pts.map((q) => H.lijnAfstand(q, { x: f.mx, y: f.my }, f.dx, f.dy) ** 2)));
  };
  const bruikbaar = (streken) => streken.map((s) => s.punten).filter((p) => p.length >= 2 && H.lengte(p) >= 6);
  const minAfstand = (q, lijsten) => { let m = Infinity; for (const l of lijsten) m = Math.min(m, H.polyAfstand(q, l)); return m; };

  // dekking per doellijn: welk deel ervan ligt dicht bij een van je streken
  function dekkingen(o, lijsten, f) {
    return o.doelen.map((d) => {
      const ds = d.fijn.map((q) => minAfstand(q, lijsten));
      return { ds, dek: ds.filter((x) => x <= f * o.tol).length / Math.max(ds.length, 1) };
    });
  }

  // na elke pen-op: als alle lijnen van deze stap getekend zijn, meteen nakijken
  function isKlaar(o, streken) {
    if (o.geenData || o.klaar) return true;
    const lijsten = bruikbaar(streken);
    if (!lijsten.length) return false;
    return dekkingen(o, lijsten, 1.5).every((d) => d.dek >= 0.85);
  }

  // wiebel: hoe ver de streek gemiddeld van een gladgestreken versie van zichzelf ligt (in tol)
  function wiebel(p, tol) {
    const S = H.herbemonster(p, 3);
    if (S.length < 9) return 0;
    let som = 0, n = 0;
    for (let i = 3; i < S.length - 3; i++) {
      let mx = 0, my = 0;
      for (let j = i - 3; j <= i + 3; j++) { mx += S[j].x; my += S[j].y; }
      som += (S[i].x - mx / 7) ** 2 + (S[i].y - my / 7) ** 2; n++;
    }
    return Math.sqrt(som / n) / tol;
  }

  // kwaliteit van één streek bij zijn doellijn (0..1) met bijpassende tip
  function kwaliteit(doel, p, tol) {
    const gl = H.lin(wiebel(p, tol), 0.08, 0.3);
    if (doel.soort === 'lijn') {
      const dev = rmsRecht(H.herbemonster(p, 3)) / Math.max(H.lengte(p), 1);
      const re = H.lin(dev, 0.008, 0.04);
      return [Math.min(re, gl), 'Trek rechte lijnen in één vlotte beweging vanuit je schouder'];
    }
    if (doel.soort === 'ellips') {
      const D = doel.punten;
      const kd = D.reduce((a, q) => ({ x0: Math.min(a.x0, q.x), x1: Math.max(a.x1, q.x), y0: Math.min(a.y0, q.y), y1: Math.max(a.y1, q.y) }), { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity });
      const dm = Math.max((kd.x1 - kd.x0 + kd.y1 - kd.y0) / 2, 1);
      const sl = H.lin(H.afstand(p[0], p[p.length - 1]) / dm, 0.06, 0.3);
      return sl <= gl ? [0.5 * sl + 0.5 * gl, 'Sluit de ellips: eindig waar je begon'] : [0.5 * sl + 0.5 * gl, 'Maak de ellips gladder, zonder knikken'];
    }
    return [gl, 'Maak de bochten vloeiender, zonder wiebels'];
  }

  function beoordeelStap(o, streken) {
    const lijsten = bruikbaar(streken);
    if (!lijsten.length) return { ongeldig: 'Teken de lijnen van deze stap en tik op Klaar', behoud: true };
    const tol = o.tol;
    const dk = dekkingen(o, lijsten, 1.2);
    const dekking = H.gemiddelde(dk.map((d) => d.dek));
    const slechtsteDek = Math.min.apply(null, dk.map((d) => d.dek));
    // nauwkeurigheid alleen over de stukken die je getekend hebt; een gemiste lijn telt bij dekking
    const raak = [].concat.apply([], dk.map((d) => d.ds.filter((x) => x <= 3 * tol)));
    const nauw = raak.length ? H.gemiddelde(raak) / tol : 3;

    // precisie: welk deel van je inkt ligt op een lijn van deze stap
    const doelLijnen = o.doelen.map((d) => d.punten);
    const fijnS = lijsten.map((p) => H.herbemonster(p, 4));
    const alleS = [].concat.apply([], fijnS);
    const precisie = alleS.filter((q) => minAfstand(q, doelLijnen) <= 1.8 * tol).length / Math.max(alleS.length, 1);

    // elke streek hoort bij de doellijn waar hij gemiddeld het dichtst bij ligt
    const perDoel = o.doelen.map(() => []);
    fijnS.forEach((p, j) => {
      let beste = -1, bd = Infinity;
      o.doelen.forEach((d, k) => { const g = H.gemiddelde(p.map((q) => H.polyAfstand(q, d.punten))); if (g < bd) { bd = g; beste = k; } });
      if (beste >= 0 && bd <= 2.5 * tol && H.lengte(lijsten[j]) >= 0.15 * H.lengte(o.doelen[beste].punten)) perDoel[beste].push(lijsten[j]);
    });
    const getekend = perDoel.filter((l) => l.length);
    const eenStreek = getekend.length ? getekend.filter((l) => l.length === 1).length / getekend.length : 0;
    let kw = 1, kwTip = '';
    o.doelen.forEach((d, k) => {
      if (perDoel[k].length !== 1) return;
      const r = kwaliteit(d, perDoel[k][0], tol);
      if (r[0] < kw) { kw = r[0]; kwTip = r[1]; }
    });

    const sDek = H.lin(1 - dekking, 0.05, 0.5), sNauw = H.lin(nauw, 0.25, 1), sPrec = H.lin(1 - precisie, 0.05, 0.4);
    let score = H.clamp(100 * (0.25 * sDek + 0.25 * sNauw + 0.1 * sPrec + 0.15 * eenStreek + 0.25 * kw), 0, 100);
    if (slechtsteDek < 0.5) score = Math.min(score, 55);        // een lijn (bijna) overgeslagen
    else if (slechtsteDek < 0.75) score = Math.min(score, 70);  // een lijn maar half getekend
    if (precisie < 0.7) score = Math.min(score, 75);            // veel inkt naast de lijnen
    const w = [
      [sDek, slechtsteDek < 0.5 ? 'Je mist een lijn: teken alle lijnen van deze stap' : 'Trek de lijnen helemaal door, van eind tot eind'],
      [sNauw, 'Blijf dichter bij de lijnen'],
      [sPrec, 'Teken alleen de lijnen van deze stap, geen losse streken'],
      [eenStreek, 'Zet elke lijn in één vaste streek, niet in stukjes'],
      [kw, kwTip],
    ];
    w.sort((a, b) => a[0] - b[0]);
    let tip;
    if (slechtsteDek < 0.5) tip = w.find((x) => x[1].indexOf('mist') >= 0)[1];
    else if (w[0][0] < 0.7 && w[0][1]) tip = w[0][1];
    else if (score >= 85) tip = ['Strak, zoals een ontwerper', 'Mooi neergezet', 'Vaste lijnen, door naar de volgende'][Math.floor(score) % 3];
    else tip = 'Nog iets nauwkeuriger en vaster';
    return { score, tip, dekking: dekking * 100, nauwkeurig: sNauw * 100, precisie: precisie * 100, eenStreek: eenStreek * 100, lijnkwaliteit: kw * 100 };
  }

  // ---------- nakijken ----------
  function nakijken(o, streken) {
    if (o.geenData) return { ongeldig: 'Er zijn nog geen schetsen geladen' };
    if (o.klaar) return { score: Math.round(st ? st.totaal : 0), tip: 'Tik voor een nieuwe schets', geenNiveau: true };
    const u = beoordeelStap(o, streken);
    if (u.ongeldig) return u;
    if (u.score < SLECHT && st && st.poging < 1) { st.poging++; return { ongeldig: 'Probeer deze stap nog eens' }; }
    u.geenNiveau = true;
    if (st && o.stap === st.idx && !st.wacht) {
      st.gedaan[o.stap] = { fase: o.fase, score: u.score, streken: bruikbaar(streken).map((p) => naarData(o.lay, H.herbemonsterN(p, Math.min(40, Math.max(2, p.length))))) };
      st.wacht = true;
      if (o.laatste) afronden();
    }
    return u;
  }

  function afronden() {
    const scores = st.gedaan.filter(Boolean).map((g) => g.score);
    st.totaal = scores.length ? H.gemiddelde(scores) : 0;
    st.eind = true;
    const stand = leesStand();
    stand.klaar++; stand.sindsWissel++;
    stand.scores.push(Math.round(st.totaal)); stand.scores = stand.scores.slice(-10);
    const l3 = stand.scores.slice(-3);
    if (stand.sindsWissel >= 2 && stand.niveau < 4 && l3.length >= 2 && H.gemiddelde(l3) >= 72) { stand.niveau++; stand.sindsWissel = 0; }
    else if (stand.sindsWissel >= 2 && stand.niveau > 1 && l3.length >= 3 && H.gemiddelde(l3) < 40) { stand.niveau--; stand.sindsWissel = 0; }
    schrijf(SLEUTEL, stand);
    bewaarGalerij();
  }

  function bewaarGalerij() {
    const rec = {
      id: st.t.id, naam: st.t.naam, datum: new Date().toISOString(), score: Math.round(st.totaal), b: st.kd.w, h: st.kd.h,
      stappen: st.gedaan.filter(Boolean).map((g) => ({ s: Math.round(g.score), f: g.fase, p: g.streken.map((p) => rond3(dunnen(p, 10))) })),
    };
    let g = lees(GALERIJ, []);
    if (!Array.isArray(g)) g = [];
    g.push(rec);
    g = g.slice(-10);
    if (!schrijf(GALERIJ, g)) { g = g.slice(-5); schrijf(GALERIJ, g); }
  }

  // ---------- tekenen ----------
  function lettertype() {
    try { return getComputedStyle(document.body).fontFamily || 'sans-serif'; } catch (e) { return 'sans-serif'; }
  }
  function kortTekst(ctx, tekst, maxB) {
    if (ctx.measureText(tekst).width <= maxB) return tekst;
    while (tekst.length > 1 && ctx.measureText(tekst + '…').width > maxB) tekst = tekst.slice(0, -1);
    return tekst + '…';
  }
  function pictogram(ctx, fase, x, y, k) {   // klein symbool voor de fase, 14 px breed
    ctx.save();
    ctx.strokeStyle = k; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (fase === 'opzet') { ctx.moveTo(x, y + 5); ctx.lineTo(x + 14, y - 1); ctx.moveTo(x, y - 1); ctx.lineTo(x + 14, y + 5); ctx.moveTo(x + 7, y - 6); ctx.lineTo(x + 7, y + 6); }
    else { ctx.moveTo(x, y - 2); ctx.lineTo(x + 7, y - 6); ctx.lineTo(x + 14, y - 2); ctx.lineTo(x + 14, y + 5); ctx.lineTo(x, y + 5); ctx.closePath(); }
    ctx.stroke();
    ctx.restore();
  }
  const kleurVoor = (vlak, s) => (s >= 75 ? vlak.kleur.goed : s >= 50 ? vlak.kleur.waarschuwing : vlak.kleur.fout);

  function polylijn(ctx, pts) {
    ctx.beginPath();
    pts.forEach((q, i) => { if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); });
    ctx.stroke();

  function stip(ctx, x, y, r, k) { ctx.fillStyle = k; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function raakpunten(d) {
    let a = d[0], b = d[0], c = d[0], e = d[0];
    for (const q of d) { if (q.x < a.x) a = q; if (q.x > b.x) b = q; if (q.y < c.y) c = q; if (q.y > e.y) e = q; }
    return [a, b, c, e];
  }

  function hud(ctx, o, vlak, fam) {
    const m = Math.min(28, vlak.w * 0.05), k = vlak.kleur;
    ctx.save();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const gedaan = st ? st.gedaan.filter(Boolean).map((g) => g.score) : [];
    const gemTxt = gedaan.length ? 'gem. ' + Math.round(H.gemiddelde(gedaan)) : '';
    ctx.font = '500 12px ' + fam;
    const gemB = gemTxt ? ctx.measureText(gemTxt).width + 10 : 0;
    ctx.font = '700 15px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText(kortTekst(ctx, o.naam + (o.ontwerper ? '  ·  ' + o.ontwerper : ''), vlak.w - 2 * m - gemB), m, 15);
    ctx.font = '500 12px ' + fam; ctx.fillStyle = k.tekstZacht;
    if (gemTxt) { ctx.textAlign = 'right'; ctx.fillText(gemTxt, vlak.w - m, 15); ctx.textAlign = 'left'; }
    pictogram(ctx, o.fase, m, 33, k.accent);
    const n = o.doelen.length;
    ctx.fillText(kortTekst(ctx, FASEN[o.fase] + '  ·  stap ' + (o.stap + 1) + '/' + o.totaal + '  ·  ' + n + (n === 1 ? ' lijn' : ' lijnen') + ': ' + FASE_TIP[o.fase], vlak.w - 2 * m - 20), m + 20, 33);
    const b = bron();
    if (b) {
      ctx.font = '400 10px ' + fam; ctx.textAlign = 'center'; ctx.fillStyle = k.tekstZacht; ctx.globalAlpha = 0.8;
      ctx.fillText(kortTekst(ctx, b, vlak.w - 2 * m), vlak.w / 2, vlak.h - 9);
    }
    ctx.restore();
  }

  // eigen streken van eerdere stappen: opzet dun en licht, vorm in volle inkt (of in scorekleur)
  function eigenWerk(ctx, vlak, lay, tot, kleurig) {
    const k = vlak.kleur;
    st.gedaan.forEach((g, i) => {
      if (!g || i >= tot) return;
      const opzet = g.fase === 'opzet';
      ctx.strokeStyle = kleurig ? kleurVoor(vlak, g.score) : opzet ? k.hulp : k.inkt;
      ctx.lineWidth = opzet ? 1.5 : 2.6;

      g.streken.forEach((p) => polylijn(ctx, naarPx(lay, p)));

    ctx.globalAlpha = 1;
  }

  function eindscherm(ctx, o, vlak, fam) {
    const k = vlak.kleur, lay = o.lay;
    ctx.save();

    ctx.globalAlpha = 0.3; ctx.strokeStyle = k.hulpZacht; ctx.lineWidth = 1.4;
    st.stappen.forEach((s) => s.lijnen.forEach((l) => polylijn(ctx, naarPx(lay, l.punten))));
    eigenWerk(ctx, vlak, lay, st.stappen.length, true);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const m = Math.min(28, vlak.w * 0.05), tot = Math.round(st.totaal);
    ctx.font = '700 16px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText(kortTekst(ctx, o.naam + (o.ontwerper ? '  ·  naar ' + o.ontwerper : ''), vlak.w - 2 * m - 90), m, 15);
    ctx.font = '800 22px ' + fam; ctx.fillStyle = kleurVoor(vlak, tot); ctx.textAlign = 'right';
    ctx.fillText(String(tot), vlak.w - m, 16);
    ctx.textAlign = 'left'; ctx.font = '500 11px ' + fam;
    let x = m;
    [['goed', k.goed], ['matig', k.waarschuwing], ['fout', k.fout]].forEach((e) => {
      stip(ctx, x + 4, 34, 4, e[1]); ctx.fillStyle = k.tekstZacht; ctx.fillText(e[0], x + 12, 34);
      x += 14 + ctx.measureText(e[0]).width + 12;
    });
    ctx.fillText('dun = opzet, dik = vorm, grijs = origineel', x + 4, 34);
    ctx.textAlign = 'center'; ctx.font = '600 14px ' + fam; ctx.fillStyle = k.tekst;
    ctx.fillText('tik voor een nieuwe schets', vlak.w / 2, vlak.h - 26);
    ctx.restore();
  }

  function teken(ctx, o, vlak, info) {
    const fam = lettertype(), k = vlak.kleur;
    info = info || { sinds: 0 };
    if (o.geenData) {
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = k.tekstZacht; ctx.font = '600 16px ' + fam;
      ctx.fillText('Ontwerpschets heeft nog geen schetsen geladen', vlak.w / 2, vlak.h / 2 - 12);
      ctx.font = '500 13px ' + fam; ctx.fillText('(OpenSketchData ontbreekt)', vlak.w / 2, vlak.h / 2 + 12);
      ctx.restore();
      return;
    }
    if (o.klaar && st) { eindscherm(ctx, o, vlak, fam); return; }
    const lay = o.lay;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // vorige stappen: vaag het origineel, daarover je eigen streken
    if (st) {
      ctx.globalAlpha = 0.22; ctx.strokeStyle = k.hulpZacht; ctx.lineWidth = 1.4;
      st.stappen.forEach((s, i) => { if (i < o.stap) s.lijnen.forEach((l) => polylijn(ctx, naarPx(lay, l.punten))); });
      eigenWerk(ctx, vlak, lay, o.stap, false);
    }
    // huidige doellijnen
    const sinds = info.sinds || 0, niv = o.niveau;
    let a = 1;
    if (niv === 2) a = H.clamp(1 - (sinds - ZIEN[2]) / 500, 0.15, 1);
    else if (niv === 4) a = H.clamp(1 - (sinds - ZIEN[4]) / 400, 0, 1);
    o.doelen.forEach((d) => {
      const p = d.punten, dicht = d.soort === 'ellips';
      if (niv === 3) {   // alleen een vage schaduw van de lijn, zodat je ziet welke stippen bij elkaar horen
        ctx.globalAlpha = 0.16; ctx.strokeStyle = k.hulp; ctx.lineWidth = 1.5;
        polylijn(ctx, p);
      } else if (a > 0) {
        ctx.globalAlpha = 0.85 * a; ctx.strokeStyle = k.accent; ctx.lineWidth = o.fase === 'opzet' ? 1.8 : 2.4;
        ctx.setLineDash(o.fase === 'opzet' ? [4, 6] : [8, 7]);
        polylijn(ctx, p); ctx.setLineDash([]);
      }
      // stippen: niveau 1-2 begin, niveau 3 begin en eind (ellips: 4 raakpunten), niveau 4 alleen zolang zichtbaar
      const sa = niv === 4 ? a : 1;
      if (sa <= 0) return;
      ctx.globalAlpha = sa;
      if (dicht && niv >= 3) raakpunten(p).forEach((q) => stip(ctx, q.x, q.y, 4, k.accent));
      else {
        stip(ctx, p[0].x, p[0].y, 5, k.goed);
        if (niv >= 3 && !dicht) { const e = p[p.length - 1]; ctx.strokeStyle = k.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI * 2); ctx.stroke(); }
      }
    });
    ctx.restore();
    hud(ctx, o, vlak, fam);
  }

  function tekenUitslag(ctx, o, streken, uitslag, vlak) {
    if (o.klaar || !o.doelen || !o.doelen.length) return;
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = vlak.kleur.accent; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]); ctx.lineCap = 'round';
    o.doelen.forEach((d) => polylijn(ctx, d.punten));
    ctx.restore();
  }

  function scorePlek(o, vlak) {
    const m = 24, pts = o && o.alle ? o.alle : [];
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bd = -1;
    for (let i = 0; i < 7; i++) {
      for (let j = 0; j < 5; j++) {
        const x = m + (vlak.w - 2 * m) * (i + 0.5) / 7, y = TOP + (vlak.h - TOP - ONDER) * (j + 0.5) / 5;
        let dm = Infinity;
        for (const q of pts) { const d = Math.hypot(q.x - x, q.y - y); if (d < dm) dm = d; }
        if (dm > bd) { bd = dm; beste = { x, y }; }
      }
    }
    return beste;
  }

  // na de laatste stap wacht de motor op een tik; het eindscherm wordt dan door teken() getoond
  function naUitslag(o) {
    if (o.klaar) return 'stop';
    if (o.laatste && st && st.eind) { o.klaar = true; return 'stop'; }
    return undefined;
  }

  Tekentrainer.registreer({
    id: 'ontwerpschets',
    naam: 'Ontwerpschets',
    uitleg: 'Zware Krabbelkunst: teken een echte ontwerpersschets na, eerst de opzet, dan de vorm. Teken alle lijnen van een stap, elk in één streek; daarna wordt vanzelf nagekeken (of tik op Klaar).',
    fundament: 'Perspectief, opzet en vaste lijnen, zoals een ontwerper',
    meerdereStreken: true,
    toonUitslag: 1100,
    nieuweOpgave, teken, isKlaar, nakijken, tekenUitslag, scorePlek, naUitslag,
  });
})();

<script>
(function () {
  const H = window.Hulp;
  const $ = (id) => document.getElementById(id);
  const doek = $('doek'), ctx = doek.getContext('2d');

  // ---------- opslag (alleen gemak op dit apparaat) ----------
  const opslag = {
    lees(k, d) { try { const v = localStorage.getItem('tt.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    schrijf(k, v) { try { localStorage.setItem('tt.' + k, JSON.stringify(v)); } catch (e) { /* geen opslag */ } },
  };
  const stand = (id) => opslag.lees('stand.' + id, { niveau: 1, scores: [], sindsWissel: 0, beste: 0, uitslagen: 0 });

  // ---------- analytics (lokaal in tt.log; daarnaast in de Artifact-db als die er is) ----------
  const LOGMAX = 2000, SESMAX = 500;
  let logLijst = null, sesLijst = null;
  const iso = () => new Date().toISOString();
  const nieuweId = () => iso().replace(/[:.]/g, '-') + '-' + Math.random().toString(36).slice(2, 8);
  function ring(naam, lijst, rec, max) {
    lijst.push(rec);
    if (lijst.length > max) lijst.splice(0, lijst.length - max);
    opslag.schrijf(naam, lijst);
  }
  // asynchroon en nooit blokkerend; null = alleen localStorage
  const dbBelofte = (async () => {
    try { return (window.claude && window.claude.use && await window.claude.use('db')) || null; }
    catch (e) { return null; }
  })();
  let dbUit = false;
  const dbWachtrij = [];
  let dbBezig = false;
  async function dbPomp() {
    if (dbBezig) return;
    dbBezig = true;
    try {
      const db = await dbBelofte;
      while (dbWachtrij.length) {
        const w = dbWachtrij.shift();
        if (!db || dbUit) { dbWachtrij.length = 0; break; }
        try { await db.collection(w.coll).doc(nieuweId()).set(w.rec); }
        catch (e) {
          console.warn('db-schrijven mislukt', e);
          // geen rechten (niet de eigenaar) of niet beschikbaar: stop met proberen
          if (!e || (e.code !== 'unavailable' && e.code !== 'resource_exhausted')) dbUit = true;
        }
      }
    } catch (e) { console.warn(e); }
    dbBezig = false;
  }
  function logPoging(rec) {
    try { if (!logLijst) logLijst = opslag.lees('log', []); ring('log', logLijst, rec, LOGMAX); } catch (e) { console.warn(e); }
    dbWachtrij.push({ coll: 'pogingen', rec }); dbPomp();
  }
  function logSessie(rec) {
    try { if (!sesLijst) sesLijst = opslag.lees('sessies', []); ring('sessies', sesLijst, rec, SESMAX); } catch (e) { console.warn(e); }
    dbWachtrij.push({ coll: 'sessies', rec }); dbPomp();
  }
  function stopSessie(h) {
    if (!h || h.sessieKlaar) return;
    h.sessieKlaar = true;

  }
  function maakRecord(h, u, wissel) {
    let n = 0, som = 0, t0 = Infinity, t1 = -Infinity;
    const typen = new Set();
    for (const st of h.streken) {
      if (st.type) typen.add(st.type);
      for (const p of st.punten) { n++; som += (p.p == null ? 0.5 : p.p); if (p.t < t0) t0 = p.t; if (p.t > t1) t1 = p.t; }
    }
    const deel = {};
    if (u && !u.ongeldig) {
      let c = 0;
      for (const k of Object.keys(u)) {
        if (k === 'score' || c >= 20) continue;
        if (typeof u[k] === 'number' && isFinite(u[k])) { deel[k] = Math.round(u[k] * 1000) / 1000; c++; }
      }
    }
    h.pogingen = (h.pogingen || 0) + 1;
    return {
      t: iso(), oefening: h.o.id, niveau: h.s.niveau,
      score: u && !u.ongeldig ? u.score : null,
      ongeldig: u && u.ongeldig ? String(u.ongeldig) : null,
      tip: u && u.tip ? String(u.tip) : null,
      duurMs: n ? Math.round(t1 - t0) : 0, aantalStreken: h.streken.length, aantalPunten: n,
      gemDruk: n ? Math.round(som / n * 1000) / 1000 : null,
      penType: typen.size === 1 ? [...typen][0] : typen.size ? 'gemengd' : null,
      vlakW: Math.round(vlak.w), vlakH: Math.round(vlak.h),
      deelscores: deel, niveauWissel: wissel || 0, uitslagLeesMs: null,

  }
  // de uitslag is klaar met lezen: nu pas loggen, met leestijd (idempotent)
  function afrondRec(h) {
    if (!h || !h.rec) return;
    const rec = h.rec;
    h.rec = null;
    rec.uitslagLeesMs = Math.round(performance.now() - (h.uitslagT || performance.now()));
    logPoging(rec);
  }

  let dl = null;
  Promise.resolve(window.claude?.use?.('downloads')).then(d => { dl = d || null; }).catch(() => {});
  $('exportLog').addEventListener('click', async () => {
    try {
      if (!logLijst) logLijst = opslag.lees('log', []);
      if (!sesLijst) sesLijst = opslag.lees('sessies', []);
      const json = JSON.stringify({ geexporteerd: iso(), pogingen: logLijst, sessies: sesLijst }, null, 1);
      const filename = 'oefendata-' + iso().slice(0, 10) + '.json';
      if (dl) {
        try { await dl.save({ filename, data: json }); } catch (e) { console.warn('export geweigerd', e); }
        return;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));

      document.body.appendChild(a); a.click(); a.remove();

    } catch (e) { console.warn(e); }
