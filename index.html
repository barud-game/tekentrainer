<style>

    --kaart: #171b20; --kaart-rand: #3a424c; --knop-tekst: #101317; color-scheme: dark; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- menu ---- */
  #menu { max-width: 820px; margin: 0 auto; min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(36px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #menu header { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; margin-bottom: 22px; }
  #menu .kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); margin: 0 0 4px; }
  #menu h1 { font-size: 1.75rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  #menu p.sub { color: var(--fg-soft); margin: 0; font-size: 0.95rem; line-height: 1.4; max-width: 46ch; }
  .groep { margin: 0 0 24px; }
  .groep h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 0.8rem; font-weight: 500;
    font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); }
  .groep h2::after { content: ""; flex: 1; border-top: 1px dashed var(--kaart-rand); transform: translateY(-3px); }
  .groep h2 small { font-size: inherit; color: var(--fg-soft); order: 3; }
  .groep .rij { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

    transition: transform .12s ease, border-color .12s ease; }
  .kaart:hover { border-color: var(--fg); }
  .kaart:active { transform: translateY(1px); }
  .kaart b { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .kaart .fund { grid-column: 1 / -1; color: var(--fg-soft); font-size: 0.86rem; line-height: 1.35; }
  .kaart .ico { width: 30px; height: 30px; color: var(--fg); grid-row: 1; grid-column: 2; }
  .kaart .onder { grid-column: 1 / -1; margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 0.74rem; color: var(--fg-soft); }
  .niv { display: inline-flex; gap: 3px; align-items: flex-end; }
  .niv i { display: block; width: 7px; background: var(--guide-soft); border: 1px solid var(--guide); border-radius: 1px; }
  .niv i:nth-child(1) { height: 7px; } .niv i:nth-child(2) { height: 10px; } .niv i:nth-child(3) { height: 13px; }
  .niv i:nth-child(4) { height: 16px; } .niv i:nth-child(5) { height: 19px; }
  .niv i.aan { background: var(--fg); border-color: var(--fg); }
  .kaart .cijfers { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
  .kaart .cijfers em { font-style: normal; color: var(--fg-soft); }
  #instellingen { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--fg-soft); font-size: 0.88rem; display: flex; gap: 10px; align-items: center; }
  #instellingen input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  #instellingen label { padding: 6px 0; }

  /* ---- tekenscherm ---- */
  #oefening { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--bg); }
  #balk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto; align-items: center; gap: 4px 6px;
    padding: calc(5px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 5px max(8px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--kaart-rand); background: var(--bg); }
  #balk button:not(.uitleg) { padding: 0; min-width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.15rem; line-height: 1; background: var(--kaart); border-color: var(--kaart-rand); }
  #balk .titel { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }

    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #balk .uitleg.open { -webkit-line-clamp: unset; display: block; }
  #vlak { flex: 1; position: relative; background: var(--paper); min-height: 0; }
  #vlak canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #melding { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); max-width: 90%; text-align: center;
    padding: 7px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #melding.zicht { opacity: 1; }
  #klaar { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--knop-tekst);
    border: 0; border-radius: 4px 16px 4px 16px; min-width: 112px; min-height: 52px; padding: 0 24px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #klaar:active { transform: translateY(1px); box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { #melding, .kaart { transition: none; } }

<script>
/* hulp.js */
// Gedeelde rekenhulpjes voor alle oefeningen. Alles werkt met punten {x, y, p, t}
// (x/y in CSS-pixels van het tekenvlak, p = druk 0..1, t = tijd in ms).
window.Hulp = (function () {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // 1 bij x <= goed, 0 bij x >= slecht, lineair ertussen (werkt ook als goed > slecht).
  function lin(x, goed, slecht) {
    if (goed === slecht) return x <= goed ? 1 : 0;
    return clamp((slecht - x) / (slecht - goed), 0, 1);
  }

  const afstand = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function lengte(pts) {
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += afstand(pts[i - 1], pts[i]);
    return s;
  }

  // Herbemonster op gelijke afstand 'stap' (px); p en t worden meegeïnterpoleerd.
  function herbemonster(pts, stap) {
    if (pts.length < 2) return pts.slice();
    const uit = [Object.assign({}, pts[0])];
    let rest = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const d = afstand(a, b);
      if (d === 0) continue;
      let pos = stap - rest;
      while (pos <= d) {
        const f = pos / d;
        uit.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, p: a.p + (b.p - a.p) * f, t: a.t + (b.t - a.t) * f });
        pos += stap;
      }
      rest = d - (pos - stap);
    }
    const last = pts[pts.length - 1];
    if (afstand(uit[uit.length - 1], last) > stap * 0.3) uit.push(Object.assign({}, last));
    return uit;
  }

  // Herbemonster naar precies n punten.
  function herbemonsterN(pts, n) {
    const L = lengte(pts);
    if (L === 0 || n < 2) return pts.slice(0, n);
    const r = herbemonster(pts, L / (n - 1));
    while (r.length > n) r.pop();
    while (r.length < n) r.push(Object.assign({}, pts[pts.length - 1]));
    return r;
  }

  function gemiddelde(arr) { return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0; }
  function sd(arr) { const m = gemiddelde(arr); return Math.sqrt(gemiddelde(arr.map((v) => (v - m) ** 2))); }
  function mediaan(arr) {
    if (!arr.length) return 0;
    const s = arr.slice().sort((a, b) => a - b), k = s.length >> 1;
    return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2;
  }

  // Beste rechte lijn door de punten (PCA). Geeft midden, eenheidsrichting en hoek (rad).
  function lijnFit(pts) {
    const mx = gemiddelde(pts.map((p) => p.x)), my = gemiddelde(pts.map((p) => p.y));
    let sxx = 0, syy = 0, sxy = 0;
    for (const p of pts) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    const hoek = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    return { mx, my, dx: Math.cos(hoek), dy: Math.sin(hoek), hoek };
  }

  // Loodrechte (gesigneerde) afstand van punt tot lijn door a met richting (dx, dy).
  function lijnAfstand(p, a, dx, dy) { return (p.x - a.x) * -dy + (p.y - a.y) * dx; }

  // Afstand van punt tot lijnstuk a-b.
  function segmentAfstand(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
    const f = L2 ? clamp(((p.x - a.x) * vx + (p.y - a.y) * vy) / L2, 0, 1) : 0;
    return Math.hypot(p.x - (a.x + vx * f), p.y - (a.y + vy * f));
  }

  // Kleinste afstand van punt tot een polylijn.
  function polyAfstand(p, poly) {
    let m = Infinity;
    for (let i = 1; i < poly.length; i++) m = Math.min(m, segmentAfstand(p, poly[i - 1], poly[i]));
    return m;
  }

  // Snelheden (px/ms) tussen opeenvolgende punten, met tijd > 0.
  function snelheden(pts) {
    const v = [];
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - pts[i - 1].t;
      if (dt > 0) v.push(afstand(pts[i - 1], pts[i]) / dt);
    }
    return v;
  }

  // Hoekverschil tussen twee richtingen in graden, voor lijnen zonder richting (0..90).
  function lijnHoekVerschil(a, b) {
    let d = Math.abs(a - b) % Math.PI;
    if (d > Math.PI / 2) d = Math.PI - d;
    return d * 180 / Math.PI;
  }

  // Kleine voorspelbare random-generator: rng() -> 0..1. Met rng.tussen(a, b) en rng.kies(lijst).
  function maakRng(seed) {
    let s = (seed >>> 0) || 1;
    const rng = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; };
    rng.tussen = (a, b) => a + (b - a) * rng();
    rng.kies = (lijst) => lijst[Math.floor(rng() * lijst.length)];
    return rng;
  }

  return { clamp, lin, afstand, lengte, herbemonster, herbemonsterN, gemiddelde, sd, mediaan,
    lijnFit, lijnAfstand, segmentAfstand, polyAfstand, snelheden, lijnHoekVerschil, maakRng };
})();

</script>

<script>
/* oefeningen/ellipsen.js */
// Ellipsen in een kader, van bijna-cirkel (niveau 1) tot smal en gedraaid (niveau 5).
(function () {
  const H = window.Hulp;
  const BINS = 72;

  // Per niveau: verhouding lange/korte as, draaiing, grootte (fractie van het vlak), hulp.
  const NIVEAUS = {
    1: { ratio: [1.0, 1.3], draai: [0, 0], maat: [0.62, 0.72], ghost: 0.5, streepjes: true },
    2: { ratio: [1.25, 1.7], draai: [0, 90], maat: [0.55, 0.7], ghost: 0.25, streepjes: true },
    3: { ratio: [1.4, 2.1], draai: [-35, 35], maat: [0.5, 0.68], ghost: 0, streepjes: true },
    4: { ratio: [1.6, 2.6], draai: [-90, 90], maat: [0.4, 0.62], ghost: 0, streepjes: true },
    5: { ratio: [2.0, 3.4], draai: [-90, 90], maat: [0.32, 0.58], ghost: 0, streepjes: false },
  };

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const ratio = rng.tussen(n.ratio[0], n.ratio[1]);
    const draai = niveau === 2 ? rng.kies([0, 90]) : rng.tussen(n.draai[0], n.draai[1]);
    const t = draai * Math.PI / 180;
    // Lange as zo groot als past: de gedraaide omhullende moet binnen het vlak blijven.
    const want = rng.tussen(n.maat[0], n.maat[1]);
    let a = want * Math.min(vlak.w, vlak.h) * 0.5 * Math.sqrt(ratio);
    let b = a / ratio;
    const halfW = Math.abs(a * Math.cos(t)) + Math.abs(b * Math.sin(t));
    const halfH = Math.abs(a * Math.sin(t)) + Math.abs(b * Math.cos(t));
    const k = Math.min(1, (vlak.w * 0.44) / halfW, (vlak.h * 0.40) / halfH);
    a *= k; b *= k;
    return {
      cx: vlak.w / 2 + rng.tussen(-0.04, 0.04) * vlak.w,
      cy: vlak.h * 0.53 + rng.tussen(-0.03, 0.03) * vlak.h,
      a, b, t, ghost: n.ghost, streepjes: n.streepjes,
    };
  }

  function inLokaal(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.rotate(o.t);
    fn();
    ctx.restore();
  }

  function teken(ctx, o, vlak) {
    inLokaal(ctx, o, () => {
      ctx.strokeStyle = vlak.kleur.hulp;
      ctx.lineWidth = 2;
      ctx.strokeRect(-o.a, -o.b, 2 * o.a, 2 * o.b);
      if (o.streepjes) {
        const s = 12;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-o.a - s, 0); ctx.lineTo(-o.a + s, 0);
        ctx.moveTo(o.a - s, 0); ctx.lineTo(o.a + s, 0);
        ctx.moveTo(0, -o.b - s); ctx.lineTo(0, -o.b + s);
        ctx.moveTo(0, o.b - s); ctx.lineTo(0, o.b + s);
        ctx.stroke();
      }
      if (o.ghost > 0) {
        ctx.globalAlpha = o.ghost;
        ctx.strokeStyle = vlak.kleur.hulpZacht;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(0, 0, o.a, o.b, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
  }

  // Punt naar ellips-assenstelsel.
  function lokaal(o, p) {
    const dx = p.x - o.cx, dy = p.y - o.cy, c = Math.cos(o.t), s = Math.sin(o.t);
    return { u: dx * c + dy * s, v: -dx * s + dy * c };
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 8 || H.lengte(ruw) < (o.a + o.b) * 1.5) return { ongeldig: 'Te kort: teken de hele ellips in één streek.' };
    const pts = H.herbemonster(ruw, 2);
    const size = (o.a + o.b) / 2;
    const bins = Array.from({ length: BINS }, () => []);
    let stray = 0;
    for (const p of pts) {
      const { u, v } = lokaal(o, p);
      const r = Math.hypot(u / o.a, v / o.b);
      if (r < 0.5 || r > 1.7) { stray++; continue; }
      // Afstand tot de ideale ellips langs de straal vanuit het midden (+ = buiten).
      const d = Math.hypot(u, v) * (1 - 1 / r);
      const phi = Math.atan2(v / o.b, u / o.a);
      bins[Math.floor((phi + Math.PI) / (2 * Math.PI) * BINS) % BINS].push(d);
    }
    const offs = bins.map((b) => (b.length ? H.gemiddelde(b) : null));
    const gedekt = offs.filter((x) => x !== null);
    if (!gedekt.length) return { ongeldig: 'Teken de ellips in het kader.' };

    const dekking = gedekt.length / BINS;
    const fout = H.gemiddelde(gedekt.map(Math.abs)) / size;
    const strayFrac = stray / pts.length;
    const score = Math.round(100 * H.lin(fout, 0.012, 0.11) * Math.pow(dekking, 2) * (1 - Math.min(0.5, strayFrac)));

    return { score, tip: tip(offs, dekking, strayFrac, size, score), offs };
  }

  function tip(offs, dekking, strayFrac, size, score) {
    const waar = (cond) => {
      const v = offs.filter((o, k) => o !== null && cond(-Math.PI + (k + 0.5) * 2 * Math.PI / BINS));
      return v.length ? H.gemiddelde(v) : 0;
    };
    const zij = waar((f) => Math.abs(Math.cos(f)) > 0.95);
    const bovenOnder = waar((f) => Math.abs(Math.sin(f)) > 0.95);
    const diag = waar((f) => Math.abs(Math.cos(f)) > 0.55 && Math.abs(Math.cos(f)) < 0.85) - (zij + bovenOnder) / 2;
    const opties = [
      [diag, 'Puntige uiteinden (een oog). Houd je tempo in de bocht en draai rond.', 'Te hoekig. Laat de bochten soepeler verlopen.'],
      [zij, 'Raakt de korte zijden niet. Ga verder door naar de streepjes.', 'Schiet over de korte zijden heen.'],
      [bovenOnder, 'Raakt de lange zijden niet. Maak hem boller.', 'Steekt over de lange zijden heen.'],
    ];
    const tips = [];
    if (dekking < 0.9) tips.push([1, 'Niet gesloten. Ga door tot voorbij je beginpunt.']);
    for (const [v, neg, pos] of opties) if (Math.abs(v) > 0.035 * size) tips.push([Math.abs(v) / size, v < 0 ? neg : pos]);
    if (strayFrac > 0.1) tips.push([strayFrac, 'Een deel van je lijn ligt ver naast de vorm.']);
    if (!tips.length) return score >= 85 ? 'Mooi rond en gesloten.' : 'Lijn wiebelt. Trek sneller vanuit je schouder.';
    tips.sort((x, y) => y[0] - x[0]);
    return tips[0][1];
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const size = (o.a + o.b) / 2;
    inLokaal(ctx, o, () => {
      ctx.setLineDash([10, 8]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, o.a, o.b, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let k = 0; k < BINS; k++) {
        const off = u.offs[k];
        const phi = -Math.PI + (k + 0.5) * 2 * Math.PI / BINS;
        const x = o.a * Math.cos(phi), y = o.b * Math.sin(phi);
        if (off === null) { ctx.fillStyle = vlak.kleur.tekstZacht; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
        else if (Math.abs(off) > 0.06 * size) { ctx.fillStyle = vlak.kleur.fout; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); }
      }
    });
  }

  Tekentrainer.registreer({
    id: 'ellipsen',
    naam: 'Ellipsen',
    uitleg: 'Teken in één streek een ellips die alle vier de zijden van het kader raakt.',
    fundament: 'Gesloten, ronde vormen vanuit je schouder; de basis van elk 3D-object.',
    meerdereStreken: false,
    toonUitslag: 1300,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

<script>
/* oefeningen/lijnen.js */
// Stip naar stip: trek een rechte lijn van A naar B in één vloeiende armbeweging.
(function () {
  const H = window.Hulp;
  const START_TOL = 24; // px: verder van A starten = ongeldig

  // Per niveau: lengte als fractie van de vlakbreedte, hoekregel, gids, grootte van stip B, tolerantie, tempo.
  const NIVEAUS = {
    1: { len: [[0.35, 0.55]], hoeken: 'hv', gids: 'aan', bR: 1, eind: [8, 0.12], tempo: false },
    2: { len: [[0.35, 0.55]], hoeken: '45', gids: 'aan', bR: 1, eind: [8, 0.12], tempo: false },
    3: { len: [[0.35, 0.55]], hoeken: 'vrij', gids: 'vervaag', bR: 0.85, eind: [8, 0.12], tempo: false },
    4: { len: [[0.10, 0.20], [0.60, 0.80]], hoeken: 'vrij', gids: 'uit', bR: 0.6, eind: [8, 0.12], tempo: false },
    5: { len: [[0.10, 0.20], [0.35, 0.55], [0.60, 0.80]], hoeken: 'vrij', gids: 'uit', bR: 0.5, eind: [5, 0.07], tempo: true },
  };

  let laatsteHoek = null; // vorige looprichting (rad), om herhaling te voorkomen

  const hoekVerschil = (a, b) => {
    let d = Math.abs(a - b) % (2 * Math.PI);
    return d > Math.PI ? 2 * Math.PI - d : d;
  };

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const mn = Math.min(vlak.w, vlak.h);
    const marge = Math.max(14, mn * 0.08);

    // Hoek kiezen, niet gelijk aan de vorige.
    let hoek;
    for (let poging = 0; poging < 30; poging++) {
      if (n.hoeken === 'hv') hoek = rng.kies([0, 90, 180, 270]) * Math.PI / 180;
      else if (n.hoeken === '45') hoek = rng.kies([0, 45, 90, 135, 180, 225, 270, 315]) * Math.PI / 180;
      else hoek = rng.tussen(0, 360) * Math.PI / 180;
      if (laatsteHoek === null || hoekVerschil(hoek, laatsteHoek) > (n.hoeken === 'vrij' ? 0.26 : 0.1)) break;
    }
    laatsteHoek = hoek;
    const ux = Math.cos(hoek), uy = Math.sin(hoek);

    // Lengte, begrensd zodat de lijn in het vlak past.
    const band = rng.kies(n.len);
    let L = rng.tussen(band[0], band[1]) * vlak.w;
    const kx = Math.abs(ux) > 1e-6 ? (vlak.w - 2 * marge) / Math.abs(ux) : Infinity;
    const ky = Math.abs(uy) > 1e-6 ? (vlak.h - 2 * marge) / Math.abs(uy) : Infinity;
    L = Math.min(L, kx, ky);

    // Midden zo kiezen dat beide uiteinden binnen de marge liggen.
    const hx = Math.abs(ux) * L / 2, hy = Math.abs(uy) * L / 2;
    const cx = rng.tussen(marge + hx, vlak.w - marge - hx);
    const cy = rng.tussen(marge + hy, vlak.h - marge - hy);
    const A = { x: cx - ux * L / 2, y: cy - uy * L / 2 };
    const B = { x: cx + ux * L / 2, y: cy + uy * L / 2 };
    const r = H.clamp(mn * 0.014, 6, 11);
    return {
      A, B, L, hoek, ux, uy, niveau,
      rA: r, rB: r * n.bR,
      gids: n.gids,
      eind: n.eind,
      tempo: n.tempo,
      animeer: n.gids === 'vervaag',
    };
  }

  function teken(ctx, o, vlak, info) {
    let alpha = 1;
    if (o.gids === 'uit') alpha = 0;
    else if (o.gids === 'vervaag') alpha = 1 - H.clamp((info.sinds - 500) / 400, 0, 1);
    if (alpha > 0) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = vlak.kleur.hulp;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(o.A.x, o.A.y);
      ctx.lineTo(o.B.x, o.B.y);
      ctx.stroke();
      ctx.restore();
    }
    // B: ring met stip
    ctx.save();
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.fillStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.B.x, o.B.y, o.rB, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(o.B.x, o.B.y, Math.max(1.5, o.rB * 0.3), 0, Math.PI * 2); ctx.fill();
    // A: gevulde accentstip
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath(); ctx.arc(o.A.x, o.A.y, o.rA, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Snelheden (px/ms): punten minstens 12 ms uit elkaar, daarna 3-punts gladding.
  function gladdeSnelheden(pts) {
    const dun = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].t - dun[dun.length - 1].t >= 12 || i === pts.length - 1) dun.push(pts[i]);
    }
    const v = H.snelheden(dun);
    return v.map((x, i) => {
      const a = v[Math.max(0, i - 1)], c = v[Math.min(v.length - 1, i + 1)];
      return (a + x + c) / 3;
    });
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    const A = o.A, B = o.B, L = o.L;
    if (ruw.length < 8 || H.lengte(ruw) < 0.25 * L) return { ongeldig: 'Te kort. Trek de hele lijn van A naar B.' };
    if (H.afstand(ruw[0], A) > START_TOL) return { ongeldig: 'Start op stip A en trek dan naar B.' };

    const eerste = ruw[0], laatste = ruw[ruw.length - 1];
    const sx = laatste.x - eerste.x, sy = laatste.y - eerste.y;
    const sl = Math.hypot(sx, sy);
    if (sl < 0.2 * L) return { ongeldig: 'Te kort. Trek de hele lijn van A naar B.' };
    const dx = sx / sl, dy = sy / sl;

    // Rechtheid: gesigneerde afstand tot de lijn eerste -> laatste punt (herbemonsterd op 3 px).
    const pts = H.herbemonster(ruw, 3);
    const d = pts.map((p) => H.lijnAfstand(p, eerste, dx, dy));
    let dmax = 0, imax = 0;
    d.forEach((x, i) => { if (Math.abs(x) > dmax) { dmax = Math.abs(x); imax = i; } });
    const rms = Math.sqrt(H.gemiddelde(d.map((x) => x * x)));
    const dm = Math.max(0, dmax - 1), rm = Math.max(0, rms - 0.5);
    const sRecht = 100 * H.lin(0.6 * dm / L + 0.6 * rm / L, 0.01, 0.08);

    // Eindpunten.
    const e = (H.afstand(eerste, A) + H.afstand(laatste, B)) / 2;
    const sEind = 100 * H.lin(e, o.eind[0], o.eind[0] + o.eind[1] * L);

    // Vloeiendheid.
    const v = gladdeSnelheden(ruw);
    const lo = Math.floor(v.length * 0.15), hi = Math.ceil(v.length * 0.85);
    const mid = v.slice(lo, hi);
    let cv = 0, hapers = 0;
    if (mid.length >= 3) {
      const gem = H.gemiddelde(mid);
      cv = gem > 0 ? H.sd(mid) / gem : 1;
      let in_ = false;
      for (const x of mid) {
        const laag = x < 0.2 * gem;
        if (laag && !in_) hapers++;
        in_ = laag;
      }
    }
    const sVloei = H.clamp(100 * H.lin(cv, 0.25, 0.85) - 10 * hapers, 0, 100);

    // Tempo (niveau 5).
    const duur = laatste.t - eerste.t;
    const maxDuur = 500 + 1.5 * L;
    const traag = o.tempo ? Math.max(0, duur / maxDuur - 1) : 0;

    const w = o.tempo ? [0.40, 0.35, 0.25] : [0.45, 0.30, 0.25];
    let score = w[0] * sRecht + w[1] * sEind + w[2] * sVloei;
    score *= 1 - 0.4 * H.clamp(traag, 0, 1);
    score = Math.round(H.clamp(score, 0, 100));

    // Tips: kandidaten met ernst (1 = net over de drempel).
    const mid3 = d.slice(Math.floor(d.length * 0.1), Math.ceil(d.length * 0.9));
    const med = H.mediaan(mid3);
    const zelfdeKant = mid3.filter((x) => Math.sign(x) === Math.sign(med)).length / Math.max(1, mid3.length);
    const proj = ((laatste.x - A.x) * o.ux + (laatste.y - A.y) * o.uy) / L;
    let trilling = 0;
    const dd = d;
    if (dd.length > 4) {
      let s = 0;
      for (let i = 1; i < dd.length - 1; i++) s += Math.abs(dd[i] - (dd[i - 1] + dd[i + 1]) / 2);
      trilling = s / (dd.length - 2);
    }
    const tips = [];
    if (Math.abs(med) > 0.02 * L && zelfdeKant > 0.75) {
      tips.push([Math.abs(med) / (0.02 * L), 'Je lijn buigt naar ' + (med > 0 ? 'rechts' : 'links') + '; trek vanuit je schouder.']);
    }
    if (hapers >= 2 || cv > 0.6) tips.push([Math.max(hapers / 2, cv / 0.6), 'Je stopt halverwege; trek in één vloeiende beweging.']);
    if (proj < 0.9) tips.push([(1 - proj) / 0.1,'Je schiet te kort; kijk naar B, niet naar je pen.']);
    else if (proj > 1.1) tips.push([(proj - 1) / 0.1, 'Je schiet te ver door; kijk naar B, niet naar je pen.']);
    if (trilling > 0.8) tips.push([trilling / 0.8, 'Je lijn trilt; ontspan je greep.']);
    if (traag > 0.1) tips.push([traag / 0.1, 'Te traag; trek in één snelle beweging.']);
    tips.sort((a, b) => b[0] - a[0]);
    const tip = tips.length ? tips[0][1] : (score >= 85 ? 'Mooi recht, in één beweging.' : 'Let op je eindpunten: begin en eindig op de stippen.');

    return { score, tip, sRecht, sEind, sVloei, cv, hapers, dmax, maxPunt: pts[imax], maxD: d[imax], proj, trilling, duur };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(o.A.x, o.A.y);
    ctx.lineTo(o.B.x, o.B.y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (u.maxPunt && Math.abs(u.maxD) > Math.max(4, 0.02 * o.L)) {
      const p = u.maxPunt;
      const k = H.clamp(((p.x - o.A.x) * o.ux + (p.y - o.A.y) * o.uy), 0, o.L);
      const q = { x: o.A.x + o.ux * k, y: o.A.y + o.uy * k };
      ctx.strokeStyle = vlak.kleur.fout;
      ctx.fillStyle = vlak.kleur.fout;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Zoek een plek voor score + tip die de lijn zo min mogelijk bedekt.
  function scorePlek(o, vlak) {
    const mn = Math.min(vlak.w, vlak.h);
    const g = H.clamp(mn * 0.14, 40, 96);
    const hw = Math.min(vlak.w * 0.45, 200);
    const boven = g / 2 + 4, onder = g * 0.62 + 18;
    const midX = (o.A.x + o.B.x) / 2, midY = (o.A.y + o.B.y) / 2;
    const xs = [], ys = [];
    const xlo = Math.min(hw, vlak.w / 2), xhi = Math.max(vlak.w - hw, vlak.w / 2);
    for (let i = 0; i <= 8; i++) xs.push(xlo + (xhi - xlo) * i / 8);
    const ylo = boven, yhi = Math.max(boven, vlak.h - onder);
    for (let i = 0; i <= 12; i++) ys.push(ylo + (yhi - ylo) * i / 12);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bestScore = -Infinity;
    for (const x of xs) for (const y of ys) {
      const r = { l: x - hw, r: x + hw, t: y - g / 2, b: y + onder };
      let dmin = Infinity;
      for (let i = 0; i <= 40; i++) {
        const f = i / 40, px = o.A.x + (o.B.x - o.A.x) * f, py = o.A.y + (o.B.y - o.A.y) * f;
        const ddx = Math.max(r.l - px, 0, px - r.r), ddy = Math.max(r.t - py, 0, py - r.b);
        dmin = Math.min(dmin, Math.hypot(ddx, ddy));
      }
      const s = Math.min(dmin, 50) - 0.02 * Math.hypot(x - midX, y - midY);
      if (s > bestScore) { bestScore = s; beste = { x, y }; }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'lijnen',
    naam: 'Lijnen',
    uitleg: 'Trek in één vloeiende beweging een rechte lijn van stip A naar stip B.',
    fundament: 'Rechte lijnen vanuit je schouder en elleboog; de basis van contouren, perspectief en arcering.',
    meerdereStreken: false,
    toonUitslag: 1400,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();

<script>
/* oefeningen/cirkels.js */
// Cirkels: één vloeiende, gesloten boog met de juiste maat en plek ("Rond sluiten").
(function () {
  const H = window.Hulp;
  const TAU = Math.PI * 2;

  // Per niveau: types, straal (fractie van korte zijde), tolerantie (fractie van doelstraal), hulp.
  const NIVEAUS = {
    1: { types: ['kader'], r: [0.27, 0.32], tol: 0.30, ghost: 0.4 },
    2: { types: ['middelpunt'], r: [0.2, 0.3], tol: 0.20, ghost: 0 },
    3: { types: ['punten'], r: [0.15, 0.33], tol: 0.15, ghost: 0 },
    4: { types: ['middelpunt'], r: [0.1, 0.2], tol: 0.11, ghost: 0, verbergNa: 1000 },
    5: { types: ['kader', 'middelpunt', 'punten'], r: [0.1, 0.34], tol: 0.08, ghost: 0 },
  };

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const kort = Math.min(vlak.w, vlak.h);
    const type = rng.kies(n.types);
    const r = rng.tussen(n.r[0], n.r[1]) * kort;
    const m = 0.04 * kort + 4;
    const ruimteX = Math.max(0, vlak.w / 2 - r - m), ruimteY = Math.max(0, vlak.h / 2 - r - m);
    const cx = vlak.w / 2 + rng.tussen(-1, 1) * Math.min(ruimteX, niveau === 1 ? 0.05 * vlak.w : ruimteX);
    const cy = vlak.h * 0.52 + rng.tussen(-1, 1) * Math.min(ruimteY * 0.9, niveau === 1 ? 0.03 * vlak.h : ruimteY);
    const o = { type, cx: Math.min(vlak.w - r - m, Math.max(r + m, cx)), cy: Math.min(vlak.h - r - m, Math.max(r + m, cy)),
      r, tol: n.tol, ghost: n.ghost, niveau };
    if (n.verbergNa) o.verbergNa = n.verbergNa;
    if (type === 'middelpunt') o.hoek = rng.tussen(0, TAU);
    if (type === 'punten') {
      // Drie punten met minstens ~70 graden tussenruimte.
      for (let poging = 0; poging < 50; poging++) {
        const a = [rng.tussen(0, TAU), rng.tussen(0, TAU), rng.tussen(0, TAU)].sort((x, y) => x - y);
        const gaten = [a[1] - a[0], a[2] - a[1], TAU - (a[2] - a[0])];
        o.hoeken = a;
        if (Math.min(...gaten) > 1.2) break;
      }
      o.punten = o.hoeken.map((h) => ({ x: o.cx + r * Math.cos(h), y: o.cy + r * Math.sin(h) }));
    }
    return o;
  }

  function stip(ctx, x, y, rad, kleur) {
    ctx.fillStyle = kleur;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  }

  function teken(ctx, o, vlak, info) {
    const k = vlak.kleur;
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = k.hulp;
    if (o.type === 'kader') {
      ctx.strokeRect(o.cx - o.r, o.cy - o.r, 2 * o.r, 2 * o.r);
      if (o.ghost > 0) {
        ctx.globalAlpha = o.ghost; ctx.strokeStyle = k.hulpZacht; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = k.hulp; ctx.lineWidth = 3;
      const s = 10;
      ctx.beginPath();
      ctx.moveTo(o.cx - o.r - s, o.cy); ctx.lineTo(o.cx - o.r + s, o.cy);
      ctx.moveTo(o.cx + o.r - s, o.cy); ctx.lineTo(o.cx + o.r + s, o.cy);
      ctx.moveTo(o.cx, o.cy - o.r - s); ctx.lineTo(o.cx, o.cy - o.r + s);
      ctx.moveTo(o.cx, o.cy + o.r - s); ctx.lineTo(o.cx, o.cy + o.r + s);
      ctx.stroke();
    } else if (o.type === 'middelpunt') {
      if (!(info && info.verborgen)) {
        ctx.setLineDash([8, 7]);
        ctx.beginPath();
        ctx.moveTo(o.cx, o.cy);
        ctx.lineTo(o.cx + o.r * Math.cos(o.hoek), o.cy + o.r * Math.sin(o.hoek));
        ctx.stroke();
        ctx.setLineDash([]);
        stip(ctx, o.cx + o.r * Math.cos(o.hoek), o.cy + o.r * Math.sin(o.hoek), 3.5, k.hulp);
        stip(ctx, o.cx, o.cy, 6, k.accent);
      }
    } else {
      for (const p of o.punten) stip(ctx, p.x, p.y, 7, k.accent);
    }
    ctx.restore();
  }

  // Kåsa-fit: kleinste kwadraten cirkel door de punten.
  function kasaFit(pts) {
    const n = pts.length;
    const mx = H.gemiddelde(pts.map((p) => p.x)), my = H.gemiddelde(pts.map((p) => p.y));
    let suu = 0, svv = 0, suv = 0, suuu = 0, svvv = 0, suuv = 0, suvv = 0;
    for (const p of pts) {
      const u = p.x - mx, v = p.y - my;
      suu += u * u; svv += v * v; suv += u * v;
      suuu += u * u * u; svvv += v * v * v; suuv += u * u * v; suvv += u * v * v;
    }
    const det = suu * svv - suv * suv;
    if (!isFinite(det) || Math.abs(det) < 1e-9) return null;
    const b1 = 0.5 * (suuu + suvv), b2 = 0.5 * (svvv + suuv);
    const uc = (b1 * svv - b2 * suv) / det, vc = (suu * b2 - suv * b1) / det;
    const r = Math.sqrt(uc * uc + vc * vc + (suu + svv) / n);
    if (!isFinite(r) || r <= 0) return null;
    return { x: mx + uc, y: my + vc, r };
  }

  // Verhouding lange/korte as (PCA) van de punten.
  function asRatio(pts) {
    const mx = H.gemiddelde(pts.map((p) => p.x)), my = H.gemiddelde(pts.map((p) => p.y));
    let sxx = 0, syy = 0, sxy = 0;
    for (const p of pts) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    const tr = sxx + syy, det = sxx * syy - sxy * sxy;
    const d = Math.sqrt(Math.max(0, tr * tr / 4 - det));
    const l1 = tr / 2 + d, l2 = Math.max(1e-9, tr / 2 - d);
    return Math.sqrt(l1 / l2);
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 15 || H.lengte(ruw) < o.r * 1.5) return { ongeldig: 'Te kort: teken de hele cirkel in één streek.' };
    const duur = ruw[ruw.length - 1].t - ruw[0].t;
    const pts = H.herbemonsterN(ruw, 64);
    const c = kasaFit(pts);
    if (!c) return { ongeldig: 'Dat was geen cirkel, probeer opnieuw.' };
    const r = c.r;

    // Rondheid.
    const e = pts.map((p) => Math.hypot(p.x - c.x, p.y - c.y) - r);
    const rms = Math.sqrt(H.gemiddelde(e.map((v) => v * v)));
    const R = H.lin(rms / r, 0.01, 0.12);

    // Hoek-sweep rond het midden (gesigneerd) en richtingswissel.
    const hoeken = pts.map((p) => Math.atan2(p.y - c.y, p.x - c.x));
    const stappen = [];
    for (let i = 1; i < hoeken.length; i++) {
      let d = hoeken[i] - hoeken[i - 1];
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      stappen.push(d);
    }
    const som = stappen.reduce((s, v) => s + v, 0);
    const sweep = Math.abs(som) * 180 / Math.PI;
    const teken = som >= 0 ? 1 : -1;
    const terug = stappen.filter((d) => d * teken < 0).reduce((s, d) => s + Math.abs(d), 0) * 180 / Math.PI;
    const wissel = terug > 15;

    // Sluiting.
    const gap = H.afstand(pts[0], pts[pts.length - 1]);
    let G = H.lin(gap, 0.05 * r, 0.25 * r);
    if (sweep < 330) G = Math.min(G, 0.5);

    // Doelmatch.
    let fout, dx = 0, dy = 0, dr = 0;
    if (o.type === 'punten') {
      const afw = o.punten.map((p) => Math.abs(Math.hypot(p.x - c.x, p.y - c.y) - r));
      fout = H.gemiddelde(afw) / r;
      // Voor de tip: maat/positie t.o.v. de cirkel door de drie punten.
      dx = c.x - o.cx; dy = c.y - o.cy; dr = r - o.r;
    } else {
      dx = c.x - o.cx; dy = c.y - o.cy; dr = r - o.r;
      fout = Math.max(Math.abs(dr) / o.r, Math.hypot(dx, dy) / o.r);
    }
    const D = H.lin(fout, 0.04, o.tol);

    // Vloeiendheid.
    const sn = H.snelheden(H.herbemonster(ruw, 3));
    const gl = [];
    for (let i = 0; i + 3 <= sn.length; i += 1) gl.push((sn[i] + sn[i + 1] + sn[i + 2]) / 3);
    const cv = gl.length > 3 && H.gemiddelde(gl) > 0 ? H.sd(gl) / H.gemiddelde(gl) : 0.5;
    let V = H.lin(cv, 0.2, 0.8);
    if (wissel) V *= 0.7;

    let score = 100 * (0.40 * R + 0.20 * G + 0.25 * D + 0.15 * V);
    let traag = 0;
    if (o.niveau === 5 && duur > 1500) { traag = Math.min(25, (duur - 1500) / 100); score -= traag; }
    if (gap > 0.25 * r) score = Math.min(score, 55); // duidelijk open: nooit een voldoende
    score = Math.round(H.clamp(score, 0, 100));

    const ratio = asRatio(pts);
    const info = { ratio, gap, r, dx, dy, dr, V, wissel, traag, R, D, score, tol: o.tol };
    return { score, tip: tip(o, info), c, r, gap, ratio, e, begin: pts[0], eind: pts[pts.length - 1], pts };
  }

  function tip(o, i) {
    const r = i.r;
    if (i.gap > 0.25 * r) return 'Sluit de cirkel: ga door tot voorbij je beginpunt.';
    if (i.ratio > 1.15) return 'Je cirkel is een ei: draai je hele arm mee, niet alleen je pols.';
    if (i.V < 0.35 || i.wissel) return 'Je haperde. Maak één rustige beweging; oefen eerst in de lucht.';
    const lim = Math.max(0.08, i.tol * 0.45) * o.r;
    const delen = [];
    const maatFout = Math.abs(i.dr) > lim;
    if (maatFout) delen.push(i.dr < 0 ? 'te klein' : 'te groot');
    const pos = [];
    if (Math.abs(i.dx) > lim) pos.push(i.dx < 0 ? 'links' : 'rechts');
    if (Math.abs(i.dy) > lim) pos.push(i.dy < 0 ? 'boven' : 'onder');
    if (delen.length || pos.length) {
      let s = 'Iets ' + (delen[0] || 'verschoven');
      if (pos.length) s += (delen.length ? ' en ' : ' ') + 'naar ' + pos.join('-');
      return s.replace('verschoven naar', 'te ver naar') + '.';
    }
    if (i.traag > 5) return 'Te traag: maak de cirkel in minder dan 1,5 seconde.';
    if (i.score >= 85) return 'Mooi rond en gesloten.';
    return 'Bijna: trek rustiger en gelijkmatiger door.';
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const k = vlak.kleur;
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = k.goed; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (u && u.c) {
      ctx.strokeStyle = k.tekstZacht; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(u.c.x, u.c.y, u.r, 0, TAU); ctx.stroke();
      if (u.ratio > 1.15 && u.pts) {
        u.pts.forEach((p, idx) => { if (Math.abs(u.e[idx]) > 0.08 * u.r) stip(ctx, p.x, p.y, 4, k.fout); });
      }
      if (u.gap > 0.12 * u.r) {
        ctx.strokeStyle = k.fout; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(u.begin.x, u.begin.y); ctx.lineTo(u.eind.x, u.eind.y); ctx.stroke();
        stip(ctx, u.begin.x, u.begin.y, 5, k.fout);
        stip(ctx, u.eind.x, u.eind.y, 5, k.fout);
      }
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'cirkels',
    naam: 'Cirkels',
    uitleg: 'Teken in één vloeiende streek een gesloten cirkel die past bij het doel.',
    fundament: 'Eén vloeiende, gesloten boog vanuit je schouder met juiste maat en plek; de basis voor wielen, hoofden en organische vormen.',
    meerdereStreken: false,
    toonUitslag: 1400,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

<script>
/* oefeningen/curves.js */
// Eén vloeiende lijn: C-, S- en golfcurves in één streek door stippen en ringen.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: type, aantal ringen, tolerantie r (fractie van W), gids, oriëntatie, minimumtempo.
  const NIVEAUS = {
    1: { type: 'C', ringen: 1, r: 0.08, gids: 'vol', draai: false },
    2: { type: 'C', ringen: 2, r: 0.07, gids: 'uiteinden', draai: true },
    3: { type: 'S', ringen: 2, r: 0.06, gids: 'geen', draai: true },
    4: { type: 'S2', ringen: 3, r: 0.05, gids: 'geen', draai: true },
    5: { type: 'golf', ringen: 4, r: 0.04, gids: 'geen', draai: true, snel: true },
  };
  const WENDINGEN = { C: 0, S: 1, S2: 1, golf: 2 };
  const HOEK_A = 4;           // graden: minimale amplitude voor een tekenwisseling van de kromming
  const TRAAG = 0.12;         // mediane snelheid in W per seconde: daaronder is het "zeer traag"
  const TRAAG_N5 = 0.3;       // idem voor het minimumtempo van niveau 5

  // ---------- opgave ----------
  // Bogen: lijst {R, hoek} (hoek in rad, teken = draairichting). Geeft een dichte polyline in eenheidsruimte.
  function bogen(type, rng) {
    if (type === 'C') return [{ R: 1, hoek: rng.tussen(150, 200) * RAD }];
    if (type === 'S') { const h = rng.tussen(85, 115) * RAD; return [{ R: 1, hoek: h }, { R: 1, hoek: -h }]; }
    if (type === 'S2') {
      const f = rng.kies([rng.tussen(0.5, 0.65), rng.tussen(1.5, 1.9)]);
      return [{ R: 1, hoek: rng.tussen(100, 130) * RAD }, { R: f, hoek: -rng.tussen(90, 120) * RAD }];
    }
    return [
      { R: 1, hoek: rng.tussen(80, 105) * RAD },
      { R: rng.tussen(0.8, 1.2), hoek: -rng.tussen(150, 190) * RAD },
      { R: rng.tussen(0.8, 1.2), hoek: rng.tussen(80, 105) * RAD },
    ];
  }

  function bouwPolyline(segs) {
    const pts = [{ x: 0, y: 0 }];
    let x = 0, y = 0, th = 0;
    const stap = 0.01;
    for (const s of segs) {
      const L = s.R * Math.abs(s.hoek), n = Math.max(2, Math.ceil(L / stap));
      const dth = s.hoek / n, ds = L / n;
      for (let i = 0; i < n; i++) {
        const mid = th + dth / 2;
        x += Math.cos(mid) * ds; y += Math.sin(mid) * ds; th += dth;
        pts.push({ x, y });
      }
    }
    return pts;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const W = Math.min(vlak.w, vlak.h);
    let pts = bouwPolyline(bogen(n.type, rng));
    // Oriëntatie: niveau 1 vast (alleen gespiegeld), daarna willekeurig draaien.
    const spiegel = rng() < 0.5 ? -1 : 1;
    const t = n.draai ? rng.tussen(0, 2 * Math.PI) : 0;
    const c = Math.cos(t), s = Math.sin(t);
    pts = pts.map((p) => { const x = p.x * spiegel; return { x: x * c - p.y * s, y: x * s + p.y * c }; });
    // Passen in het vlak.
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    const marge = n.r * W + 0.04 * W;
    const k = Math.min((vlak.w - 2 * marge) / (x1 - x0 || 1), (vlak.h - 2 * marge) / (y1 - y0 || 1));
    const ox = vlak.w / 2 - k * (x0 + x1) / 2, oy = vlak.h / 2 - k * (y0 + y1) / 2;
    const ideaal = pts.map((p) => ({ x: ox + k * p.x, y: oy + k * p.y }));
    // Tangent, normaal en gesigneerde kromming (+ = middelpunt aan de kant van de normaal).
    const m = ideaal.length, vk = 3;
    for (let i = 0; i < m; i++) {
      const a = ideaal[Math.max(0, i - 1)], b = ideaal[Math.min(m - 1, i + 1)];
      const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      ideaal[i].tx = (b.x - a.x) / l; ideaal[i].ty = (b.y - a.y) / l;
    }
    for (let i = 0; i < m; i++) {
      const a = ideaal[Math.max(0, i - vk)], b = ideaal[Math.min(m - 1, i + vk)];
      let d = Math.atan2(b.ty, b.tx) - Math.atan2(a.ty, a.tx);
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      ideaal[i].k = d / len;
    }
    let lengte = 0;
    const cum = [0];
    for (let i = 1; i < m; i++) { lengte += H.afstand(ideaal[i - 1], ideaal[i]); cum.push(lengte); }
    const ringen = [];
    for (let j = 1; j <= n.ringen; j++) {
      const doel = lengte * j / (n.ringen + 1);
      let i = 0; while (i < m - 1 && cum[i] < doel) i++;
      ringen.push({ x: ideaal[i].x, y: ideaal[i].y, i });
    }
    const opgave = {
      niveau, type: n.type, wendingen: WENDINGEN[n.type], r: n.r * W, W,
      gids: n.gids, snel: !!n.snel, ideaal, cum, lengte, ringen,
      start: { x: ideaal[0].x, y: ideaal[0].y }, eind: { x: ideaal[m - 1].x, y: ideaal[m - 1].y },
    };
    opgave.plek = legePlek(opgave, vlak);
    return opgave;
  }

  // Punt in het vlak met de grootste afstand tot de curve (voor de score).
  function legePlek(o, vlak) {
    const mx = vlak.w * 0.3, my = Math.min(vlak.h * 0.18, 70);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bd = -1;
    const stap = Math.max(8, o.W / 40);
    for (let y = my; y <= vlak.h - my; y += stap) {
      for (let x = mx; x <= vlak.w - mx; x += stap) {
        const d = H.polyAfstand({ x, y }, o.ideaal);
        if (d > bd) { bd = d; beste = { x, y }; }
      }
    }
    return beste;
  }

  // ---------- tekenen ----------
  function pad(ctx, pts, van, tot) {
    ctx.beginPath();
    ctx.moveTo(pts[van].x, pts[van].y);
    for (let i = van + 1; i <= tot; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function teken(ctx, o, vlak) {
    const kl = vlak.kleur, m = o.ideaal.length;
    ctx.save();
    if (o.gids !== 'geen') {
      ctx.strokeStyle = kl.hulp; ctx.lineWidth = 2; ctx.setLineDash([4, 9]); ctx.lineCap = 'round';
      if (o.gids === 'vol') pad(ctx, o.ideaal, 0, m - 1);
      else {
        let a = 0; while (a < m - 1 && o.cum[a] < o.lengte * 0.14) a++;
        let b = m - 1; while (b > 0 && o.cum[b] > o.lengte * 0.86) b--;
        pad(ctx, o.ideaal, 0, a); pad(ctx, o.ideaal, b, m - 1);
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = kl.hulp; ctx.lineWidth = 2;
    for (const r of o.ringen) { ctx.beginPath(); ctx.arc(r.x, r.y, o.r, 0, Math.PI * 2); ctx.stroke(); }
    const dot = Math.max(6, o.r * 0.5);
    ctx.fillStyle = kl.accent;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, dot, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = kl.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, o.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = kl.tekst;
    ctx.beginPath(); ctx.arc(o.eind.x, o.eind.y, dot, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = kl.tekst; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.eind.x, o.eind.y, o.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // ---------- nakijken ----------
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

  // Herbemonsteren op ds en 3-punts gemiddelde (begin/eind blijven staan; tijd blijft behouden).
  function opschonen(ruw, ds) {
    const r = H.herbemonster(ruw, ds);
    const uit = r.map((p, i) => {
      if (i === 0 || i === r.length - 1) return { x: p.x, y: p.y, t: p.t };
      return { x: (r[i - 1].x + p.x + r[i + 1].x) / 3, y: (r[i - 1].y + p.y + r[i + 1].y) / 3, t: p.t };
    });
    return uit;
  }

  function dichtstbij(p, ideaal) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < ideaal.length; i++) {
      const d = (p.x - ideaal[i].x) ** 2 + (p.y - ideaal[i].y) ** 2;
      if (d < bd) { bd = d; bi = i; }
    }
    return { i: bi, d: Math.sqrt(bd) };
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 12 || H.lengte(ruw) < 0.5 * o.lengte) return { ongeldig: 'Te kort: teken de hele lijn in één streek.' };
    const W = o.W, ds = 0.01 * W, r = o.r;
    const P = opschonen(ruw, ds);
    const n = P.length;
    if (n < 12) return { ongeldig: 'Te kort: teken de hele lijn in één streek.' };

    // --- Doorgang ---
    const si = (d) => H.clamp(1 - (d - 0.5 * r) / (1.5 * r), 0, 1);
    const dStart = H.afstand(P[0], o.start), dEind = H.afstand(P[n - 1], o.eind);
    const ringD = o.ringen.map((g) => H.polyAfstand(g, P));
    const sRing = ringD.map(si);
    const sStart = dStart <= 1.5 * r ? si(dStart) : 0;
    const sEind = dEind <= 1.5 * r ? si(dEind) : 0;
    const doorgang = 100 * H.gemiddelde([sStart, ...sRing, sEind]);
    const gemist = o.ringen.filter((g, k) => sRing[k] < 0.5);

    // --- Hoeken en kromming ---
    const phi = [];
    for (let j = 0; j < n - 1; j++) phi.push(Math.atan2(P[j + 1].y - P[j].y, P[j + 1].x - P[j].x));
    const theta = [0];                       // theta[j] = draaihoek in vertex j (j=1..n-2), rad
    for (let j = 1; j < n - 1; j++) theta.push(wrap(phi[j] - phi[j - 1]));
    theta.push(0);
    const kappa = theta.map((t) => t / ds);
    const absK = theta.slice(1, n - 1).map((t) => Math.abs(t / ds));
    const medK = H.mediaan(absK);
    const flag = new Array(n).fill(false);
    for (let j = 1; j < n - 1; j++) {
      const t = Math.abs(theta[j]) / RAD;
      const k = Math.abs(kappa[j]);
      if (t > 30 || (k > 3 * medK && t > 20)) flag[j] = true;
      if (j < n - 3) {
        const s3 = Math.abs(theta[j] + theta[j + 1] + theta[j + 2]) / RAD;
        if (s3 > 55) { flag[j] = flag[j + 1] = flag[j + 2] = true; }
      }
    }
    const hoekjes = [];                      // clusters van aaneengesloten (gap ≤ 1) vlaggen
    for (let j = 1; j < n - 1; j++) {
      if (!flag[j]) continue;
      let e = j;
      while (e + 2 < n - 1 && (flag[e + 1] || flag[e + 2])) e++;
      let mx = j; for (let q = j; q <= e; q++) if (Math.abs(theta[q]) > Math.abs(theta[mx])) mx = q;
      hoekjes.push({ x: P[mx].x, y: P[mx].y });
      j = e;
    }

    // --- Tekenwisselingen van de kromming (hysterese op cumulatieve hoek) ---
    const cumA = [];
    { let c = 0; for (let j = 1; j < n - 1; j++) { c += theta[j] / RAD; cumA.push(c); } }
    const glad = cumA.map((_, j) => {            // 5-punts gemiddelde tegen meetruis
      let s = 0, k = 0;
      for (let q = Math.max(0, j - 2); q <= Math.min(cumA.length - 1, j + 2); q++) { s += cumA[q]; k++; }
      return s / k;
    });
    let dir = 0, ext = 0, mn = 0, mxv = 0, wissels = 0;
    for (const cum of glad) {
      if (dir === 0) {
        mn = Math.min(mn, cum); mxv = Math.max(mxv, cum);
        if (cum - mn >= HOEK_A) { dir = 1; ext = cum; } else if (mxv - cum >= HOEK_A) { dir = -1; ext = cum; }
      } else if (dir === 1) {
        ext = Math.max(ext, cum);
        if (ext - cum >= HOEK_A) { dir = -1; ext = cum; wissels++; }
      } else {
        ext = Math.min(ext, cum);
        if (cum - ext >= HOEK_A) { dir = 1; ext = cum; wissels++; }
      }
    }
    const extra = Math.max(0, wissels - o.wendingen);
    const verkeerdeWendingen = wissels !== o.wendingen;

    // --- Ruwheid ---
    const dK = [];
    for (let j = 2; j < n - 1; j++) dK.push(kappa[j] - kappa[j - 1]);
    const gemK = H.gemiddelde(absK);
    const ruwheid = gemK > 0 ? H.sd(dK) / gemK : 0;
    const ruwPen = 20 * H.clamp((ruwheid - 1) / 2, 0, 1);

    let vloeiend = 100 - 10 * hoekjes.length - 8 * extra - ruwPen;
    vloeiend = H.clamp(vloeiend, 0, 100);

    // --- Tempo ---
    // Groepen segmenten van ≥ 6 ms zodat gelijke tijdstempels geen oneindige snelheid geven.
    const groepen = [];
    let gd = 0, gt = 0, g0 = 0, afgelegd = 0;
    const totaal = H.lengte(P) || 1;
    for (let j = 0; j < n - 1; j++) {
      const d = H.afstand(P[j], P[j + 1]);
      const dt = Math.max(0, P[j + 1].t - P[j].t);
      gd += d; gt += dt;
      if (gt >= 6 || j === n - 2) {
        if (gt > 0) groepen.push({ v: gd / gt, dt: gt, f: (afgelegd + gd / 2) / totaal, j0: g0, j1: j });
        afgelegd += gd; gd = 0; gt = 0; g0 = j + 1;
      }
    }
    let tempo = 70, haperingen = [], cv = 0, vMed = 0, traag = false;
    if (groepen.length >= 4) {
      vMed = H.mediaan(groepen.map((g) => g.v));
      const mid = groepen.filter((g) => g.f >= 0.1 && g.f <= 0.9);
      let run = [];
      const sluit = () => {
        if (run.length && H.gemiddelde([run.reduce((s, g) => s + g.dt, 0)]) >= 80) {
          const g = run[Math.floor(run.length / 2)];
          haperingen.push({ x: P[g.j0].x, y: P[g.j0].y });
        }
        run = [];
      };
      for (const g of mid) { if (g.v < 0.2 * vMed) run.push(g); else sluit(); }
      sluit();
      const vs = mid.map((g) => g.v);
      const gv = H.gemiddelde(vs);
      cv = gv > 0 ? H.sd(vs) / gv : 0;
      tempo = 100 - 25 * haperingen.length - 25 * H.clamp((cv - 0.5) / 0.5, 0, 1);
      const grens = (o.snel ? TRAAG_N5 : TRAAG) * W / 1000;
      traag = vMed < grens;
      if (traag) tempo = Math.min(tempo, 60);
      tempo = H.clamp(tempo, 0, 100);
    }

    // --- Bocht afgesneden (afwijking naar de binnenkant van de bocht) ---
    const afgesneden = [];
    let reeks = [];
    const kMin = 0.4 / o.lengte;             // negeer bijna rechte stukken (kromming in 1/px)
    for (let j = 0; j < n; j++) {
      const q = dichtstbij(P[j], o.ideaal), id = o.ideaal[q.i];
      let binnen = 0;
      if (Math.abs(id.k) > kMin) {
        const nx = -id.ty, ny = id.tx, sg = Math.sign(id.k);
        binnen = ((P[j].x - id.x) * nx + (P[j].y - id.y) * ny) * sg;
      }
      if (binnen > 0.5 * r) reeks.push(P[j]);
      else { if (reeks.length >= 3) afgesneden.push(reeks[Math.floor(reeks.length / 2)]); reeks = []; }
    }
    if (reeks.length >= 3) afgesneden.push(reeks[Math.floor(reeks.length / 2)]);

    let score = 0.35 * doorgang + 0.40 * vloeiend + 0.25 * tempo;
    if (verkeerdeWendingen) score = Math.min(score, 60);
    score = Math.round(H.clamp(score, 0, 100));

    // --- Tip: de oorzaak met de grootste puntenverlies ---
    const nabijRing = (p) => [o.start, o.eind, ...o.ringen].some((g) => H.afstand(p, g) < 2.5 * r);
    const knikRing = hoekjes.filter(nabijRing).length;
    const kandidaten = [];
    const grensV = (o.snel ? TRAAG_N5 : TRAAG) * W / 1000;
    const trillerig = (ruwPen >= 6 || hoekjes.length >= 3) && vMed > 0 && vMed < Math.max(2 * grensV, 0.4 * W / 1000);
    if (hoekjes.length && !trillerig) {
      kandidaten.push(knikRing
        ? [20 * knikRing + 10, 'Je knikt bij de stip. Kijk al naar de volgende stip en haal de lijn in één beweging door.']
        : [20 * hoekjes.length + 10, 'Je lijn heeft een knik. Trek de bocht in één vloeiende beweging.']);
    }
    if (haperingen.length) kandidaten.push([25 * haperingen.length + 5, 'Je stokt halverwege. Trek sneller, vanuit je schouder.']);
    if (trillerig) kandidaten.push([100, 'Trillerige lijn. Teken sneller; een snelle lijn wordt gladder.']);
    if (traag) kandidaten.push([40, 'Je tekent te langzaam. Trek de lijn sneller, vanuit je schouder.']);
    if (afgesneden.length) kandidaten.push([30, 'Je snijdt de bocht af. Maak hem ruimer.']);
    if (dStart > 1.5 * r || dEind > 1.5 * r) kandidaten.push([60, 'Begin op de gekleurde stip en eindig op de laatste stip.']);
    else if (gemist.length) kandidaten.push([(100 - doorgang) * 1.2, 'Je mist een ring. Laat de lijn door het midden van de ringen lopen.']);
    if (verkeerdeWendingen) {
      kandidaten.push([hoekjes.length ? 15 : wissels < o.wendingen ? 45 : 35,
        o.wendingen === 0 ? 'Dit is één C-bocht: wissel niet van richting.'
          : wissels < o.wendingen ? 'Je lijn mist een wending. Buig na het midden de andere kant op.'
            : 'Te veel wendingen. Houd de bochten ruim en rustig.']);
    }
    let tip;
    if (kandidaten.length) { kandidaten.sort((a, b) => b[0] - a[0]); tip = kandidaten[0][1]; }
    else tip = score >= 85 ? 'Mooie, vloeiende lijn.' : 'Trek gelijkmatiger door, vanuit je schouder.';

    return {
      score, tip, hoekjes: hoekjes.length, ruwPen, doorgang, vloeiend, tempo, wissels, ruwheid, cv, vMed,
      markers: { knikken: hoekjes, haperingen, afgesneden, gemist },
    };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const kl = vlak.kleur;
    ctx.save();
    ctx.setLineDash([10, 8]); ctx.strokeStyle = kl.goed; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    pad(ctx, o.ideaal, 0, o.ideaal.length - 1);
    ctx.setLineDash([]);
    ctx.strokeStyle = kl.fout; ctx.lineWidth = 2.5;
    for (const g of u.markers.gemist) { ctx.beginPath(); ctx.arc(g.x, g.y, o.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = kl.fout;
    const m = u.markers;
    for (const p of [...m.knikken, ...m.haperingen, ...m.afgesneden]) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'curves',
    naam: 'Eén vloeiende lijn',
    uitleg: 'Teken in één vloeiende streek van de startstip door alle ringen naar de eindstip.',
    fundament: 'Zelfverzekerde C- en S-curves vanuit schouder en elleboog; de basis voor lineart en schetsen.',
    meerdereStreken: false,
    toonUitslag: 1500,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();

<script>
/* oefeningen/slingerlijn.js */
// De Slingerlijn: één vloeiende streek met constant tempo langs een slingerende contour.
(function () {
  const H = window.Hulp;

  // T = tolerantie (mm), tempo = streefsnelheid van de stip (mm/s), bereik = goed tempo (mm/s).
  const NIVEAUS = {
    1: { T: 6.0, tempo: 45, bereik: [30, 80], stip: true, gew: [0.45, 0.20, 0.15, 0.10, 0.10] },
    2: { T: 5.0, tempo: 60, bereik: [40, 100], stip: true, gew: [0.45, 0.20, 0.15, 0.10, 0.10] },
    3: { T: 4.0, tempo: 0, bereik: [40, 120], stip: false, gew: [0.45, 0.20, 0.15, 0.10, 0.10] },
    4: { T: 3.0, tempo: 0, bereik: [35, 110], stip: false, gew: [0.45, 0.20, 0.15, 0.10, 0.10] },
    5: { T: 2.5, tempo: 0, bereik: [35, 110], stip: false, gew: [0.40, 0.17, 0.15, 0.10, 0.18] },
  };

  // ---------- meetkunde ----------
  function chaikin(pts, n) {
    for (let k = 0; k < n; k++) {
      const u = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        u.push({ x: 0.75 * a.x + 0.25 * b.x, y: 0.75 * a.y + 0.25 * b.y });
        u.push({ x: 0.25 * a.x + 0.75 * b.x, y: 0.25 * a.y + 0.75 * b.y });
      }
      u.push(pts[pts.length - 1]);
      pts = u;
    }
    return pts;
  }

  // Ruwe vorm (eenheden willekeurig) per niveau.
  function ruweVorm(niveau, rng) {
    const j = (a) => rng.tussen(-a, a);
    if (niveau === 1) {
      return chaikin([{ x: 0, y: 0.7 + j(0.08) }, { x: 1.0 + j(0.1), y: 0.1 + j(0.08) }, { x: 2.0, y: 0.6 + j(0.08) }], 5)
        .map((p) => ({ x: p.x * 1.0, y: p.y }));
    }
    if (niveau === 2) {
      return chaikin([{ x: 0, y: 0.9 + j(0.1) }, { x: 0.7, y: 0.1 + j(0.1) }, { x: 1.3, y: 0.9 + j(0.1) }, { x: 2.0, y: 0.1 + j(0.1) }], 5);
    }
    if (niveau === 3) {
      const n = rng.kies([5, 6]), w = 2.0, v = [];
      for (let i = 0; i < n; i++) {
        v.push({ x: w * i / (n - 1) + (i && i < n - 1 ? j(0.05) : 0), y: (i % 2 ? 0.1 : 0.9) + j(0.12) });
      }
      return chaikin(v, 5);
    }
    if (niveau === 4) {
      if (rng() < 0.5) { // spiraal naar binnen
        const draaien = rng.tussen(1.35, 1.6), th = draaien * 2 * Math.PI, r = [];
        for (let k = 0; k <= 400; k++) {
          const a = th * k / 400, rr = 1 - 0.78 * (a / th);
          r.push({ x: rr * Math.cos(a), y: rr * Math.sin(a) });
        }
        return r;
      }
      const a = 1, b = rng.tussen(2.1, 2.6), tm = Math.PI * 1.1, r = []; // lus (trochoïde)
      for (let k = 0; k <= 400; k++) {
        const t = -tm + 2 * tm * k / 400;
        r.push({ x: a * t - b * Math.sin(t), y: -b * Math.cos(t) });
      }
      return r;
    }
    // niveau 5: scherpe bochten, wisselende kromming
    const n = rng.kies([7, 8]), v = [];
    let x = 0;
    for (let i = 0; i < n; i++) {
      v.push({ x, y: i % 2 ? 0.08 + rng.tussen(0, 0.3) : 0.92 - rng.tussen(0, 0.3) });
      x += rng.tussen(0.2, 0.42);
    }
    return chaikin(v, 2);
  }

  // Zet een polylijn om naar punten op gelijke afstand (px).
  function gelijkeStap(pts, stap) { return H.herbemonster(pts.map((p) => ({ x: p.x, y: p.y, p: 0, t: 0 })), stap).map((p) => ({ x: p.x, y: p.y })); }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const mm = vlak.pxPerMm;
    const k = H.clamp(Math.min(vlak.w, vlak.h) / (mm * 100), 0.55, 1);
    const Tpx = n.T * mm * k;
    let ruw = ruweVorm(niveau, rng);
    // Passend maken in het vlak (uniform schalen, midden).
    const marge = Math.max(Tpx * 2, 30);
    const bx = [marge + 8, vlak.w - marge - 8], by = [Math.max(marge, 34) + 20, vlak.h - Math.max(marge, 34)];
    const minx = Math.min(...ruw.map((p) => p.x)), maxx = Math.max(...ruw.map((p) => p.x));
    const miny = Math.min(...ruw.map((p) => p.y)), maxy = Math.max(...ruw.map((p) => p.y));
    const s = Math.min((bx[1] - bx[0]) / Math.max(1e-6, maxx - minx), (by[1] - by[0]) / Math.max(1e-6, maxy - miny));
    const ox = (bx[0] + bx[1]) / 2 - s * (minx + maxx) / 2, oy = (by[0] + by[1]) / 2 - s * (miny + maxy) / 2;
    const spiegelX = rng() < 0.5, spiegelY = rng() < 0.5;
    ruw = ruw.map((p) => {
      let x = ox + s * p.x, y = oy + s * p.y;
      if (spiegelX) x = vlak.w - x;
      if (spiegelY) y = vlak.h - y;
      return { x, y };
    });
    const pts = gelijkeStap(ruw, mm); // 1 mm
    const N = pts.length;
    const tang = [], kr = [];
    const hoek = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
    for (let i = 0; i < N; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
      const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      tang.push({ x: (b.x - a.x) / d, y: (b.y - a.y) / d });
      const i0 = Math.max(0, i - 4), i1 = Math.min(N - 1, i + 4);
      if (i1 - i0 < 3 || i === i0 || i === i1) { kr.push(0); continue; }
      let dh = hoek(pts[i], pts[i1]) - hoek(pts[i0], pts[i]);
      while (dh > Math.PI) dh -= 2 * Math.PI;
      while (dh < -Math.PI) dh += 2 * Math.PI;
      kr.push(dh / (i1 - i0));
    }
    const o = {
      niveau, T: n.T, Tpx, k, pts, tang, kr, gew: n.gew, bereik: n.bereik,
      start: pts[0], eind: pts[N - 1], lengteMm: N - 1,
      tempo: n.tempo, animeer: n.stip, stip: n.stip,
    };
    o.plek = vindPlek(o, vlak);
    return o;
  }

  // Lege plek in het vlak, ver van de lijn, voor de score.
  function vindPlek(o, vlak) {
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bw = -Infinity;
    const stap = Math.max(1, Math.floor(o.pts.length / 300));
    const sub = o.pts.filter((p, i) => i % stap === 0);
    for (let i = 0; i <= 20; i++) {
      for (let j = 0; j <= 12; j++) {
        const x = vlak.w * (0.25 + 0.5 * i / 20), y = vlak.h * (0.2 + 0.6 * j / 12);
        let m = Infinity;
        for (const p of sub) m = Math.min(m, Math.hypot(p.x - x, p.y - y));
        const w = Math.min(m, 140) - 0.05 * Math.hypot(x - vlak.w / 2, y - vlak.h / 2);
        if (w > bw) { bw = w; beste = { x, y }; }
      }
    }
    return beste;
  }

  function teken(ctx, o, vlak, info) {
    const c = vlak.kleur, P = o.pts;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
    ctx.strokeStyle = c.hulpZacht;
    ctx.lineWidth = 2 * o.Tpx;
    ctx.stroke();
    ctx.strokeStyle = c.hulp;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // eindvlag
    const e = o.eind;
    ctx.strokeStyle = c.hulp;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x, e.y - 28); ctx.stroke();
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.moveTo(e.x, e.y - 28); ctx.lineTo(e.x + 18, e.y - 21); ctx.lineTo(e.x, e.y - 14); ctx.closePath(); ctx.fill();
    // startstip
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, 8, 0, Math.PI * 2); ctx.fill();
    // meelopende tempo-stip (lus als voorbeeldtempo)
    if (o.stip && !(info && info.verborgen)) {
      const L = P.length - 1;
      const s = (((info && info.nu) || 0) / 1000 * o.tempo) % (L + 0.9 * o.tempo); // 1 punt = 1 mm
      const idx = H.clamp(Math.floor(s), 0, L);
      ctx.fillStyle = c.accent;
      ctx.strokeStyle = c.hulp;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P[idx].x, P[idx].y, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- nakijken ----------
  function gladMaken(r) {
    const n = r.length, s = [];
    for (let i = 0; i < n; i++) {
      const h = Math.min(2, i, n - 1 - i);
      let x = 0, y = 0;
      for (let j = i - h; j <= i + h; j++) { x += r[j].x; y += r[j].y; }
      s.push({ x: x / (2 * h + 1), y: y / (2 * h + 1), p: r[i].p, t: r[i].t });
    }
    return s;
  }

  function nakijken(o, streken, vlak) {
    const mm = vlak.pxPerMm, T = o.Tpx, C = o.pts, NC = C.length;
    const ruwP = streken[streken.length - 1].punten;
    if (ruwP.length < 8 || H.lengte(ruwP) < o.lengteMm * mm * 0.4) return { ongeldig: 'Te kort: trek in één streek van de stip naar de vlag.' };
    const r = H.herbemonster(ruwP, mm);
    const n = r.length;
    const dur = r[n - 1].t - r[0].t;
    if (n < 8 || !(dur > 150)) return { ongeldig: 'Te kort of te snel: probeer opnieuw.' };
    const sm = gladMaken(r);

    // snelheid (mm/s) per punt op de gladde lijn, over venster van +-2
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - 2), b = Math.min(n - 1, i + 2);
      const dt = sm[b].t - sm[a].t;
      v.push(dt > 0 ? H.afstand(sm[a], sm[b]) / mm / (dt / 1000) : 0);
    }
    const w = []; // tijdsgewicht per punt (ms)
    for (let i = 0; i < n; i++) w.push((sm[Math.min(n - 1, i + 1)].t - sm[Math.max(0, i - 1)].t) / 2);
    const t0 = sm[0].t, t1 = sm[n - 1].t;
    const kern = []; // indices in de middelste 80% van de tijd
    for (let i = 0; i < n; i++) if (sm[i].t >= t0 + 0.1 * dur && sm[i].t <= t1 - 0.1 * dur) kern.push(i);

    // afstand tot contour, gesigneerd + richting
    const af = [], dev = [], inw = [], terug = [], dichtbij = new Array(NC).fill(false);
    let tegen = 0, stappen = 0;
    for (let i = 0; i < n; i++) {
      let m = Infinity, mj = 0;
      for (let j = 0; j < NC; j++) {
        const d = Math.hypot(C[j].x - sm[i].x, C[j].y - sm[i].y);
        if (d < m) { m = d; mj = j; }
      }
      af.push(m);
      const nx = -o.tang[mj].y, ny = o.tang[mj].x;
      const d = (sm[i].x - C[mj].x) * nx + (sm[i].y - C[mj].y) * ny;
      dev.push(d);
      const kk = o.kr[mj];
      inw.push(Math.abs(kk) > 0.008 ? d * Math.sign(kk) : null);
      if (i > 0 && H.afstand(sm[i], sm[i - 1]) > 0.3 * mm) {
        stappen++;
        const dx = sm[i].x - sm[i - 1].x, dy = sm[i].y - sm[i - 1].y;
        if (dx * o.tang[mj].x + dy * o.tang[mj].y < 0) tegen++;
      }
    }
    // dekking: contourpunten met een streekpunt binnen 1.5T
    let gedekt = 0;
    for (let j = 0; j < NC; j++) {
      let m = Infinity;
      for (let i = 0; i < n; i += 1) { const d = Math.hypot(C[j].x - sm[i].x, C[j].y - sm[i].y); if (d < m) m = d; if (m <= 1.5 * T) break; }
      if (m <= 1.5 * T) gedekt++;
    }
    const dekking = gedekt / NC;
    const gem = H.gemiddelde(af) / T;
    const sorted = af.slice().sort((a, b) => a - b);
    const p90 = sorted[Math.min(n - 1, Math.floor(0.9 * n))] / T;
    let A = 100 * (H.lin(gem, 0.3, 1.5) + H.lin(p90, 0.6, 2)) / 2;
    if (dekking < 0.9) A = Math.min(A, 60);
    const startFout = H.afstand(sm[0], o.start) > 2 * T;
    const eindFout = H.afstand(sm[n - 1], o.eind) > 2 * T;
    const pen = (startFout || eindFout) ? 10 : 0;

    // bibber
    let ss = 0;
    for (let i = 0; i < n; i++) ss += ((r[i].x - sm[i].x) ** 2 + (r[i].y - sm[i].y) ** 2);
    const rms = Math.sqrt(ss / n) / mm;
    const B = 100 * H.lin(rms, 0.15, 0.6);

    // stoppen
    const med = H.mediaan(kern.map((i) => v[i]));
    let slow = 0, tot = 0;
    const stops = [];
    let run = null;
    for (const i of kern) {
      tot += w[i];
      if (v[i] < 0.15 * med) {
        slow += w[i];
        if (run && run.last === i - 1) { run.last = i; run.ms += w[i]; } else { run = { first: i, last: i, ms: w[i] }; stops.push(run); }
      }
    }
    const stopFrac = tot > 0 ? slow / tot : 0;
    const S = 100 * H.lin(stopFrac, 0, 0.10);

    // tempo
    let dist = 0;
    for (let a = 1; a < kern.length; a++) dist += H.afstand(sm[kern[a]], sm[kern[a - 1]]);
    const kernTijd = kern.length > 1 ? (sm[kern[kern.length - 1]].t - sm[kern[0]].t) / 1000 : 0;
    const vGem = kernTijd > 0 ? dist / mm / kernTijd : 0;
    const [lo, hi] = o.bereik;
    const bereikS = vGem >= lo && vGem <= hi ? 1 : vGem < lo ? H.lin(vGem, lo, lo / 2) : H.lin(vGem, hi, hi * 1.6);
    const vk = kern.map((i) => v[i]);
    const cvV = H.gemiddelde(vk) > 0 ? H.sd(vk) / H.gemiddelde(vk) : 1;
    const Tm = 100 * (bereikS + H.lin(cvV, 0.25, 0.6)) / 2;

    // druk
    const p = r.map((q) => q.p);
    const lo5 = Math.floor(n * 0.1), pm = p.slice(lo5, n - lo5);
    const mono = Math.max(...p) - Math.min(...p) < 1e-3;
    const pg = H.gemiddelde(pm);
    const cvP = pg > 0 ? H.sd(pm) / pg : 0;
    const D = mono ? 100 : 100 * H.lin(cvP, 0.15, 0.5);

    // kriebel
    const pad = H.lengte(sm) / mm;
    const kriebel = pad / o.lengteMm > 1.25 || (stappen > 0 && tegen / stappen > 0.05);

    const g = o.gew;
    let score = g[0] * A + g[1] * B + g[2] * S + g[3] * Tm + g[4] * D - pen - (kriebel ? 15 : 0);
    score = Math.round(H.clamp(score, 0, 100));

    // bochten afgesneden?
    const iw = inw.filter((x) => x !== null);
    const snijdt = iw.length > 20 && H.gemiddelde(iw) > 0.35 * T && iw.filter((x) => x > 0.3 * T).length / iw.length > 0.5;

    let tip;
    if (kriebel) tip = 'Trek één lijn zonder te corrigeren.';
    else if (stopFrac > 0.05) tip = 'Je stopt halverwege, houd je tempo vast tot de vlag.';
    else if (B < 60 && vGem < lo) tip = 'Te voorzichtig. Trek sneller en gebruik je arm.';
    else if (vGem > hi && A < 70) tip = 'Te snel. Zoek een rustiger ritme.';
    else if (snijdt && A < 90) tip = 'Je snijdt de bochten af, kijk vooruit langs de lijn.';
    else if (dekking < 0.9 || startFout || eindFout) tip = 'Begin bij de stip en trek door tot de vlag.';
    else if (A < 75) tip = 'Blijf in de band. Kijk vooruit langs de lijn.';
    else if (B < 60) tip = vGem < lo ? 'Te voorzichtig. Trek sneller en gebruik je arm.' : 'Lijn trilt. Trek ontspannen vanuit je schouder.';
    else if (Tm < 60) tip = vGem < lo ? 'Te traag. Trek met meer vaart.' : vGem > hi ? 'Te snel. Zoek een rustiger ritme.' : 'Houd je snelheid gelijk van begin tot eind.';
    else if (D < 60 && !mono) tip = 'Houd je pendruk gelijkmatig.';
    else tip = score >= 85 ? 'Mooi vloeiend en gelijkmatig.' : 'Goed bezig. Blijf dichter bij het midden van de band.';

    // voor de uitslag: stukken buiten T en stoppunten
    const buiten = [];
    let cur = null;
    for (let i = 0; i < n; i++) {
      if (af[i] > T) { if (!cur) { cur = []; buiten.push(cur); if (i > 0) cur.push({ x: sm[i - 1].x, y: sm[i - 1].y }); } cur.push({ x: sm[i].x, y: sm[i].y }); } else cur = null;
    }
    const stopPlek = stops.filter((s) => s.ms > 80).map((s) => ({ x: sm[s.first].x, y: sm[s.first].y }));

    return {
      score, tip, A: Math.round(A), B: Math.round(B), S: Math.round(S), tempoScore: Math.round(Tm), druk: Math.round(D),
      stopFrac, vGem, rms, dekking, kriebel, snijdt, buiten, stopPlek,
    };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const c = vlak.kleur, P = o.pts;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = c.goed;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = c.fout;
    ctx.lineWidth = 4;
    for (const seg of u.buiten || []) {
      if (seg.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(seg[0].x, seg[0].y);
      for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
      ctx.stroke();
    }
    ctx.fillStyle = c.fout;
    for (const s of u.stopPlek || []) { ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'slingerlijn',
    naam: 'Slingerlijn',
    uitleg: 'Trek in één vloeiende streek van de stip naar de vlag, binnen de band, zonder te stoppen.',
    fundament: 'Zelfverzekerde lijnen met constant tempo vanuit schouder en elleboog; de basis van schone lineart.',
    meerdereStreken: false,
    toonUitslag: 1500,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();
