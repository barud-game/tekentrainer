<script>
/* oefeningen/cirkels.js */
// Cirkels: één vloeiende, gesloten boog met de juiste maat en plek ("Rond sluiten").
(function () {
  const H = window.Hulp;
  const TAU = Math.PI * 2;

  // Per niveau: types, straal (fractie van korte zijde), tolerantie (fractie van doelstraal), hulp.
  const NIVEAUS = {
    1: { types: ['kader'], r: [0.27, 0.32], tol: 0.30, ghost: 0.4 },
    2: { types: ['middelpunt'], r: [0.2, 0.3], tol: 0.20, ghost: 0 },
    3: { types: ['punten'], r: [0.15, 0.33], tol: 0.15, ghost: 0 },
    4: { types: ['middelpunt'], r: [0.1, 0.2], tol: 0.11, ghost: 0, verbergNa: 1000 },
    5: { types: ['kader', 'middelpunt', 'punten'], r: [0.1, 0.34], tol: 0.08, ghost: 0 },
  };

  // Toegestane opening (fractie van r) waarbij de cirkel nog 'gesloten' heet; strenger op hogere niveaus.
  // Vanaf SLUIT_OPEN * tol geldt de cirkel als duidelijk open (score-cap, tip, rode markering).
  const SLUIT_TOL = { 1: 0.20, 2: 0.18, 3: 0.15, 4: 0.13, 5: 0.10 };
  const SLUIT_OPEN = 1.7;

  // Sluiting: kleinste afstand tussen eind en begin, óók als de streek voorbij het beginpunt doortekent
  // (eind tegen het begin-deel, begin tegen het eind-deel). Geeft {afstand, begin, eind} van de kleinste opening.
  function sluiting(ruw, stap) {
    const fijn = H.herbemonster(ruw, stap);
    const n = fijn.length, deel = Math.max(2, Math.round(n * 0.3));
    const begin = fijn[0], eind = fijn[n - 1];
    let beste = { afstand: H.afstand(begin, eind), begin, eind };
    for (let i = 0; i < deel; i++) {          // eind t.o.v. punten uit het begin-deel
      const d = H.afstand(fijn[i], eind);
      if (d < beste.afstand) beste = { afstand: d, begin: fijn[i], eind };
    }
    for (let i = n - deel; i < n; i++) {      // begin t.o.v. punten uit het eind-deel
      const d = H.afstand(fijn[i], begin);
      if (d < beste.afstand) beste = { afstand: d, begin, eind: fijn[i] };
    }
    return beste;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const kort = Math.min(vlak.w, vlak.h);
    const type = rng.kies(n.types);
    const r = rng.tussen(n.r[0], n.r[1]) * kort;
    const m = 0.04 * kort + 4;
    const ruimteX = Math.max(0, vlak.w / 2 - r - m), ruimteY = Math.max(0, vlak.h / 2 - r - m);
    const cx = vlak.w / 2 + rng.tussen(-1, 1) * Math.min(ruimteX, niveau === 1 ? 0.05 * vlak.w : ruimteX);
    const cy = vlak.h * 0.52 + rng.tussen(-1, 1) * Math.min(ruimteY * 0.9, niveau === 1 ? 0.03 * vlak.h : ruimteY);
    const o = { type, cx: Math.min(vlak.w - r - m, Math.max(r + m, cx)), cy: Math.min(vlak.h - r - m, Math.max(r + m, cy)),
      r, tol: n.tol, ghost: n.ghost, niveau };
    if (n.verbergNa) o.verbergNa = n.verbergNa;
    if (type === 'middelpunt') o.hoek = rng.tussen(0, TAU);
    if (type === 'punten') {
      // Drie punten met minstens ~70 graden tussenruimte.
      for (let poging = 0; poging < 50; poging++) {
        const a = [rng.tussen(0, TAU), rng.tussen(0, TAU), rng.tussen(0, TAU)].sort((x, y) => x - y);
        const gaten = [a[1] - a[0], a[2] - a[1], TAU - (a[2] - a[0])];
        o.hoeken = a;
        if (Math.min(...gaten) > 1.2) break;
      }
      o.punten = o.hoeken.map((h) => ({ x: o.cx + r * Math.cos(h), y: o.cy + r * Math.sin(h) }));
    }
    return o;
  }

  function stip(ctx, x, y, rad, kleur) {
    ctx.fillStyle = kleur;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  }

  function teken(ctx, o, vlak, info) {
    const k = vlak.kleur;
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = k.hulp;
    if (o.type === 'kader') {
      ctx.strokeRect(o.cx - o.r, o.cy - o.r, 2 * o.r, 2 * o.r);
      if (o.ghost > 0) {
        ctx.globalAlpha = o.ghost; ctx.strokeStyle = k.hulpZacht; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = k.hulp; ctx.lineWidth = 3;
      const s = 10;
      ctx.beginPath();
      ctx.moveTo(o.cx - o.r - s, o.cy); ctx.lineTo(o.cx - o.r + s, o.cy);
      ctx.moveTo(o.cx + o.r - s, o.cy); ctx.lineTo(o.cx + o.r + s, o.cy);
      ctx.moveTo(o.cx, o.cy - o.r - s); ctx.lineTo(o.cx, o.cy - o.r + s);
      ctx.moveTo(o.cx, o.cy + o.r - s); ctx.lineTo(o.cx, o.cy + o.r + s);
      ctx.stroke();
    } else if (o.type === 'middelpunt') {
      if (!(info && info.verborgen)) {
        ctx.setLineDash([8, 7]);
        ctx.beginPath();
        ctx.moveTo(o.cx, o.cy);
        ctx.lineTo(o.cx + o.r * Math.cos(o.hoek), o.cy + o.r * Math.sin(o.hoek));
        ctx.stroke();
        ctx.setLineDash([]);
        stip(ctx, o.cx + o.r * Math.cos(o.hoek), o.cy + o.r * Math.sin(o.hoek), 3.5, k.hulp);
        stip(ctx, o.cx, o.cy, 6, k.accent);
      }
    } else {
      for (const p of o.punten) stip(ctx, p.x, p.y, 7, k.accent);
    }
    ctx.restore();
  }

  // Kåsa-fit: kleinste kwadraten cirkel door de punten.
  function kasaFit(pts) {
    const n = pts.length;
    const mx = H.gemiddelde(pts.map((p) => p.x)), my = H.gemiddelde(pts.map((p) => p.y));
    let suu = 0, svv = 0, suv = 0, suuu = 0, svvv = 0, suuv = 0, suvv = 0;
    for (const p of pts) {
      const u = p.x - mx, v = p.y - my;
      suu += u * u; svv += v * v; suv += u * v;
      suuu += u * u * u; svvv += v * v * v; suuv += u * u * v; suvv += u * v * v;
    }
    const det = suu * svv - suv * suv;
    if (!isFinite(det) || Math.abs(det) < 1e-9) return null;
    const b1 = 0.5 * (suuu + suvv), b2 = 0.5 * (svvv + suuv);
    const uc = (b1 * svv - b2 * suv) / det, vc = (suu * b2 - suv * b1) / det;
    const r = Math.sqrt(uc * uc + vc * vc + (suu + svv) / n);
    if (!isFinite(r) || r <= 0) return null;
    return { x: mx + uc, y: my + vc, r };
  }

  // Verhouding lange/korte as (PCA) van de punten.
  function asRatio(pts) {
    const mx = H.gemiddelde(pts.map((p) => p.x)), my = H.gemiddelde(pts.map((p) => p.y));
    let sxx = 0, syy = 0, sxy = 0;
    for (const p of pts) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    const tr = sxx + syy, det = sxx * syy - sxy * sxy;
    const d = Math.sqrt(Math.max(0, tr * tr / 4 - det));
    const l1 = tr / 2 + d, l2 = Math.max(1e-9, tr / 2 - d);
    return Math.sqrt(l1 / l2);
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 15 || H.lengte(ruw) < o.r * 1.5) return { ongeldig: 'Te kort: teken de hele cirkel in één streek.' };
    const duur = ruw[ruw.length - 1].t - ruw[0].t;
    const pts = H.herbemonsterN(ruw, 64);
    const c = kasaFit(pts);
    if (!c) return { ongeldig: 'Dat was geen cirkel, probeer opnieuw.' };
    const r = c.r;

    // Rondheid.
    const e = pts.map((p) => Math.hypot(p.x - c.x, p.y - c.y) - r);
    const rms = Math.sqrt(H.gemiddelde(e.map((v) => v * v)));
    const R = H.lin(rms / r, 0.01, 0.12);

    // Hoek-sweep rond het midden (gesigneerd) en richtingswissel.
    const hoeken = pts.map((p) => Math.atan2(p.y - c.y, p.x - c.x));
    const stappen = [];
    for (let i = 1; i < hoeken.length; i++) {
      let d = hoeken[i] - hoeken[i - 1];
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      stappen.push(d);
    }
    const som = stappen.reduce((s, v) => s + v, 0);
    const sweep = Math.abs(som) * 180 / Math.PI;
    const teken = som >= 0 ? 1 : -1;
    const terug = stappen.filter((d) => d * teken < 0).reduce((s, d) => s + Math.abs(d), 0) * 180 / Math.PI;
    const wissel = terug > 15;

    // Sluiting.
    // Doortekenen voorbij het beginpunt (sweep >= 355 graden of eind raakt het begin-deel) telt als gesloten.
    const sl = sluiting(ruw, Math.max(1, r / 25));
    const sluitTol = SLUIT_TOL[o.niveau] || 0.12;
    const gap = sweep >= 355 ? 0 : sl.afstand;
    const gapRel = gap / r;
    const open = gapRel > sluitTol * SLUIT_OPEN;
    const G = H.lin(gapRel, sluitTol * 0.5, sluitTol * SLUIT_OPEN);

    // Doelmatch.
    let fout, dx = 0, dy = 0, dr = 0;
    if (o.type === 'punten') {
      const afw = o.punten.map((p) => Math.abs(Math.hypot(p.x - c.x, p.y - c.y) - r));
      fout = H.gemiddelde(afw) / r;
      // Voor de tip: maat/positie t.o.v. de cirkel door de drie punten.
      dx = c.x - o.cx; dy = c.y - o.cy; dr = r - o.r;
    } else {
      dx = c.x - o.cx; dy = c.y - o.cy; dr = r - o.r;
      fout = Math.max(Math.abs(dr) / o.r, Math.hypot(dx, dy) / o.r);
    }
    const D = H.lin(fout, 0.04, o.tol);

    // Vloeiendheid.
    const sn = H.snelheden(H.herbemonster(ruw, 3));
    const gl = [];
    for (let i = 0; i + 3 <= sn.length; i += 1) gl.push((sn[i] + sn[i + 1] + sn[i + 2]) / 3);
    const cv = gl.length > 3 && H.gemiddelde(gl) > 0 ? H.sd(gl) / H.gemiddelde(gl) : 0.5;
    let V = H.lin(cv, 0.2, 0.8);
    if (wissel) V *= 0.7;

    let score = 100 * (0.40 * R + 0.20 * G + 0.25 * D + 0.15 * V);
    let traag = 0;
    if (o.niveau === 5 && duur > 1500) { traag = Math.min(25, (duur - 1500) / 100); score -= traag; }
    if (open) score = Math.min(score, 55); // duidelijk open: nooit een voldoende
    score = Math.round(H.clamp(score, 0, 100));

    const ratio = asRatio(pts);
    const info = { ratio, gap, gapRel, open, sluitTol, r, dx, dy, dr, V, wissel, traag, R, D, score, tol: o.tol };
    return { score, tip: tip(o, info), c, r, gap, gapRel, sluitTol, open, ratio, e, begin: sl.begin, eind: sl.eind, pts };
  }

  function tip(o, i) {
    const r = i.r;
    if (i.open) return 'Sluit de cirkel: ga door tot voorbij je beginpunt.';
    if (i.ratio > 1.15) return 'Je cirkel is een ei: draai je hele arm mee, niet alleen je pols.';
    if (i.V < 0.35 || i.wissel) return 'Je haperde. Maak één rustige beweging; oefen eerst in de lucht.';
    const lim = Math.max(0.08, i.tol * 0.45) * o.r;
    const delen = [];
    const maatFout = Math.abs(i.dr) > lim;
    if (maatFout) delen.push(i.dr < 0 ? 'te klein' : 'te groot');
    const pos = [];
    if (Math.abs(i.dx) > lim) pos.push(i.dx < 0 ? 'links' : 'rechts');
    if (Math.abs(i.dy) > lim) pos.push(i.dy < 0 ? 'boven' : 'onder');
    if (delen.length || pos.length) {
      let s = 'Iets ' + (delen[0] || 'verschoven');
      if (pos.length) s += (delen.length ? ' en ' : ' ') + 'naar ' + pos.join('-');
      return s.replace('verschoven naar', 'te ver naar') + '.';
    }
    if (i.traag > 5) return 'Te traag: maak de cirkel in minder dan 1,5 seconde.';
    if (i.score >= 85) return 'Mooi rond en gesloten.';
    return 'Bijna: trek rustiger en gelijkmatiger door.';
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const k = vlak.kleur;
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = k.goed; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    if (u && u.c) {
      ctx.strokeStyle = k.tekstZacht; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(u.c.x, u.c.y, u.r, 0, TAU); ctx.stroke();
      if (u.ratio > 1.15 && u.pts) {
        u.pts.forEach((p, idx) => { if (Math.abs(u.e[idx]) > 0.08 * u.r) stip(ctx, p.x, p.y, 4, k.fout); });
      }
      if (u.gapRel > u.sluitTol) {
        ctx.strokeStyle = k.fout; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(u.begin.x, u.begin.y); ctx.lineTo(u.eind.x, u.eind.y); ctx.stroke();
        stip(ctx, u.begin.x, u.begin.y, 5, k.fout);
        stip(ctx, u.eind.x, u.eind.y, 5, k.fout);
      }
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'cirkels',
    naam: 'Cirkels',
    uitleg: 'Teken in één vloeiende streek een gesloten cirkel die past bij het doel.',
    fundament: 'Eén vloeiende, gesloten boog vanuit je schouder met juiste maat en plek; de basis voor wielen, hoofden en organische vormen.',
    meerdereStreken: false,
    toonUitslag: 1400,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

</script>
<script>
/* oefeningen/curves.js */
// Eén vloeiende lijn: C-, S- en golfcurves in één streek door stippen en ringen.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: type, aantal ringen, tolerantie r (fractie van W), gids, oriëntatie, minimumtempo.
  const NIVEAUS = {
    1: { type: 'C', ringen: 1, r: 0.08, gids: 'vol', draai: false },
    2: { type: 'C', ringen: 2, r: 0.07, gids: 'uiteinden', draai: true },
    3: { type: 'S', ringen: 2, r: 0.06, gids: 'geen', draai: true },
    4: { type: 'S2', ringen: 3, r: 0.05, gids: 'geen', draai: true },
    5: { type: 'golf', ringen: 4, r: 0.04, gids: 'geen', draai: true, snel: true },
  };
  const WENDINGEN = { C: 0, S: 1, S2: 1, golf: 2 };
  const HOEK_A = 20;          // graden: minimale koersomkering voor een echte wending (pen-ruis blijft daaronder)
  const TRAAG = 0.12;         // mediane snelheid in W per seconde: daaronder is het "zeer traag"
  const TRAAG_N5 = 0.3;       // idem voor het minimumtempo van niveau 5

  // ---------- opgave ----------
  // Bogen: lijst {R, hoek} (hoek in rad, teken = draairichting). Geeft een dichte polyline in eenheidsruimte.
  function bogen(type, rng) {
    if (type === 'C') return [{ R: 1, hoek: rng.tussen(150, 200) * RAD }];
    if (type === 'S') { const h = rng.tussen(85, 115) * RAD; return [{ R: 1, hoek: h }, { R: 1, hoek: -h }]; }
    if (type === 'S2') {
      const f = rng.kies([rng.tussen(0.5, 0.65), rng.tussen(1.5, 1.9)]);
      return [{ R: 1, hoek: rng.tussen(100, 130) * RAD }, { R: f, hoek: -rng.tussen(90, 120) * RAD }];
    }
    return [
      { R: 1, hoek: rng.tussen(80, 105) * RAD },
      { R: rng.tussen(0.8, 1.2), hoek: -rng.tussen(150, 190) * RAD },
      { R: rng.tussen(0.8, 1.2), hoek: rng.tussen(80, 105) * RAD },
    ];
  }

  function bouwPolyline(segs) {
    const pts = [{ x: 0, y: 0 }];
    let x = 0, y = 0, th = 0;
    const stap = 0.01;
    for (const s of segs) {
      const L = s.R * Math.abs(s.hoek), n = Math.max(2, Math.ceil(L / stap));
      const dth = s.hoek / n, ds = L / n;
      for (let i = 0; i < n; i++) {
        const mid = th + dth / 2;
        x += Math.cos(mid) * ds; y += Math.sin(mid) * ds; th += dth;
        pts.push({ x, y });
      }
    }
    return pts;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const W = Math.min(vlak.w, vlak.h);
    let pts = bouwPolyline(bogen(n.type, rng));
    // Oriëntatie: niveau 1 vast (alleen gespiegeld), daarna willekeurig draaien.
    const spiegel = rng() < 0.5 ? -1 : 1;
    const t = n.draai ? rng.tussen(0, 2 * Math.PI) : 0;
    const c = Math.cos(t), s = Math.sin(t);
    pts = pts.map((p) => { const x = p.x * spiegel; return { x: x * c - p.y * s, y: x * s + p.y * c }; });
    // Passen in het vlak.
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    const marge = n.r * W + 0.04 * W;
    const k = Math.min((vlak.w - 2 * marge) / (x1 - x0 || 1), (vlak.h - 2 * marge) / (y1 - y0 || 1));
    const ox = vlak.w / 2 - k * (x0 + x1) / 2, oy = vlak.h / 2 - k * (y0 + y1) / 2;
    const ideaal = pts.map((p) => ({ x: ox + k * p.x, y: oy + k * p.y }));
    // Tangent, normaal en gesigneerde kromming (+ = middelpunt aan de kant van de normaal).
    const m = ideaal.length, vk = 3;
    for (let i = 0; i < m; i++) {
      const a = ideaal[Math.max(0, i - 1)], b = ideaal[Math.min(m - 1, i + 1)];
      const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      ideaal[i].tx = (b.x - a.x) / l; ideaal[i].ty = (b.y - a.y) / l;
    }
    for (let i = 0; i < m; i++) {
      const a = ideaal[Math.max(0, i - vk)], b = ideaal[Math.min(m - 1, i + vk)];
      let d = Math.atan2(b.ty, b.tx) - Math.atan2(a.ty, a.tx);
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      ideaal[i].k = d / len;
    }
    let lengte = 0;
    const cum = [0];
    for (let i = 1; i < m; i++) { lengte += H.afstand(ideaal[i - 1], ideaal[i]); cum.push(lengte); }
    const ringen = [];
    for (let j = 1; j <= n.ringen; j++) {
      const doel = lengte * j / (n.ringen + 1);
      let i = 0; while (i < m - 1 && cum[i] < doel) i++;
      ringen.push({ x: ideaal[i].x, y: ideaal[i].y, i });
    }
    const opgave = {
      niveau, type: n.type, wendingen: WENDINGEN[n.type], r: n.r * W, W,
      gids: n.gids, snel: !!n.snel, ideaal, cum, lengte, ringen,
      start: { x: ideaal[0].x, y: ideaal[0].y }, eind: { x: ideaal[m - 1].x, y: ideaal[m - 1].y },
    };
    opgave.plek = legePlek(opgave, vlak);
    return opgave;
  }

  // Punt in het vlak met de grootste afstand tot de curve (voor de score).
  function legePlek(o, vlak) {
    const mx = vlak.w * 0.3, my = Math.min(vlak.h * 0.18, 70);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bd = -1;
    const stap = Math.max(8, o.W / 40);
    for (let y = my; y <= vlak.h - my; y += stap) {
      for (let x = mx; x <= vlak.w - mx; x += stap) {
        const d = H.polyAfstand({ x, y }, o.ideaal);
        if (d > bd) { bd = d; beste = { x, y }; }
      }
    }
    return beste;
  }

  // ---------- tekenen ----------
  function pad(ctx, pts, van, tot) {
    ctx.beginPath();
    ctx.moveTo(pts[van].x, pts[van].y);
    for (let i = van + 1; i <= tot; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function teken(ctx, o, vlak) {
    const kl = vlak.kleur, m = o.ideaal.length;
    ctx.save();
    if (o.gids !== 'geen') {
      ctx.strokeStyle = kl.hulp; ctx.lineWidth = 2; ctx.setLineDash([4, 9]); ctx.lineCap = 'round';
      if (o.gids === 'vol') pad(ctx, o.ideaal, 0, m - 1);
      else {
        let a = 0; while (a < m - 1 && o.cum[a] < o.lengte * 0.14) a++;
        let b = m - 1; while (b > 0 && o.cum[b] > o.lengte * 0.86) b--;
        pad(ctx, o.ideaal, 0, a); pad(ctx, o.ideaal, b, m - 1);
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = kl.hulp; ctx.lineWidth = 2;
    for (const r of o.ringen) { ctx.beginPath(); ctx.arc(r.x, r.y, o.r, 0, Math.PI * 2); ctx.stroke(); }
    const dot = Math.max(6, o.r * 0.5);
    ctx.fillStyle = kl.accent;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, dot, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = kl.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, o.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = kl.tekst;
    ctx.beginPath(); ctx.arc(o.eind.x, o.eind.y, dot, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = kl.tekst; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.eind.x, o.eind.y, o.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // ---------- nakijken ----------
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

  // Herbemonsteren op ds en 3-punts gemiddelde (begin/eind blijven staan; tijd blijft behouden).
  function opschonen(ruw, ds) {
    const r = H.herbemonster(ruw, ds);
    const uit = r.map((p, i) => {
      if (i === 0 || i === r.length - 1) return { x: p.x, y: p.y, t: p.t };
      return { x: (r[i - 1].x + p.x + r[i + 1].x) / 3, y: (r[i - 1].y + p.y + r[i + 1].y) / 3, t: p.t };
    });
    return uit;
  }

  function dichtstbij(p, ideaal) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < ideaal.length; i++) {
      const d = (p.x - ideaal[i].x) ** 2 + (p.y - ideaal[i].y) ** 2;
      if (d < bd) { bd = d; bi = i; }
    }
    return { i: bi, d: Math.sqrt(bd) };
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 12 || H.lengte(ruw) < 0.5 * o.lengte) return { ongeldig: 'Te kort: teken de hele lijn in één streek.' };
    const W = o.W, ds = 0.02 * W, r = o.r;   // grove stap: pen-ruis van 1-3 px geeft dan geen schijnknikken
    const P = opschonen(ruw, ds);
    const n = P.length;
    if (n < 12) return { ongeldig: 'Te kort: teken de hele lijn in één streek.' };

    // --- Doorgang ---
    const si = (d) => H.clamp(1 - (d - 0.5 * r) / (1.5 * r), 0, 1);
    const dStart = H.afstand(P[0], o.start), dEind = H.afstand(P[n - 1], o.eind);
    const ringD = o.ringen.map((g) => H.polyAfstand(g, P));
    const sRing = ringD.map(si);
    const sStart = dStart <= 1.5 * r ? si(dStart) : 0;
    const sEind = dEind <= 1.5 * r ? si(dEind) : 0;
    const doorgang = 100 * H.gemiddelde([sStart, ...sRing, sEind]);
    const gemist = o.ringen.filter((g, k) => sRing[k] < 0.5);

    // --- Hoeken en kromming ---
    const phi = [];
    for (let j = 0; j < n - 1; j++) phi.push(Math.atan2(P[j + 1].y - P[j].y, P[j + 1].x - P[j].x));
    const theta = [0];                       // theta[j] = draaihoek in vertex j (j=1..n-2), rad
    for (let j = 1; j < n - 1; j++) theta.push(wrap(phi[j] - phi[j - 1]));
    theta.push(0);
    const kappa = theta.map((t) => t / ds);
    const absK = theta.slice(1, n - 1).map((t) => Math.abs(t / ds));
    const medK = H.mediaan(absK);
    const flag = new Array(n).fill(false);
    for (let j = 1; j < n - 1; j++) {
      const t = Math.abs(theta[j]) / RAD;
      const k = Math.abs(kappa[j]);
      if (t > 30 || (k > 3 * medK && t > 20)) flag[j] = true;
      if (j < n - 3) {
        const s3 = Math.abs(theta[j] + theta[j + 1] + theta[j + 2]) / RAD;
        if (s3 > 55) { flag[j] = flag[j + 1] = flag[j + 2] = true; }
      }
    }
    const hoekjes = [];                      // clusters van aaneengesloten (gap ≤ 1) vlaggen
    for (let j = 1; j < n - 1; j++) {
      if (!flag[j]) continue;
      let e = j;
      while (e + 2 < n - 1 && (flag[e + 1] || flag[e + 2])) e++;
      let mx = j; for (let q = j; q <= e; q++) if (Math.abs(theta[q]) > Math.abs(theta[mx])) mx = q;
      hoekjes.push({ x: P[mx].x, y: P[mx].y });
      j = e;
    }

    // --- Tekenwisselingen van de kromming (hysterese op cumulatieve hoek) ---
    const cumA = [];
    { let c = 0; for (let j = 1; j < n - 1; j++) { c += theta[j] / RAD; cumA.push(c); } }
    const glad = cumA.map((_, j) => {            // 7-punts gemiddelde tegen meetruis
      let s = 0, k = 0;
      for (let q = Math.max(0, j - 3); q <= Math.min(cumA.length - 1, j + 3); q++) { s += cumA[q]; k++; }
      return s / k;
    });
    let dir = 0, ext = 0, mn = 0, mxv = 0, wissels = 0;
    for (const cum of glad) {
      if (dir === 0) {
        mn = Math.min(mn, cum); mxv = Math.max(mxv, cum);
        if (cum - mn >= HOEK_A) { dir = 1; ext = cum; } else if (mxv - cum >= HOEK_A) { dir = -1; ext = cum; }
      } else if (dir === 1) {
        ext = Math.max(ext, cum);
        if (ext - cum >= HOEK_A) { dir = -1; ext = cum; wissels++; }
      } else {
        ext = Math.min(ext, cum);
        if (cum - ext >= HOEK_A) { dir = 1; ext = cum; wissels++; }
      }
    }
    const extra = Math.max(0, wissels - o.wendingen);
    const verkeerdeWendingen = wissels !== o.wendingen;

    // --- Ruwheid ---
    const dK = [];
    for (let j = 2; j < n - 1; j++) dK.push(kappa[j] - kappa[j - 1]);
    const gemK = H.gemiddelde(absK);
    const ruwheid = gemK > 0 ? H.sd(dK) / gemK : 0;
    const ruwPen = 20 * H.clamp((ruwheid - 1) / 2, 0, 1);

    let vloeiend = 100 - 10 * hoekjes.length - 3 * Math.min(extra, 4) - ruwPen;
    vloeiend = H.clamp(vloeiend, 0, 100);

    // --- Tempo ---
    // Groepen segmenten van ≥ 6 ms zodat gelijke tijdstempels geen oneindige snelheid geven.
    const groepen = [];
    let gd = 0, gt = 0, g0 = 0, afgelegd = 0;
    const totaal = H.lengte(P) || 1;
    for (let j = 0; j < n - 1; j++) {
      const d = H.afstand(P[j], P[j + 1]);
      const dt = Math.max(0, P[j + 1].t - P[j].t);
      gd += d; gt += dt;
      if (gt >= 6 || j === n - 2) {
        if (gt > 0) groepen.push({ v: gd / gt, dt: gt, f: (afgelegd + gd / 2) / totaal, j0: g0, j1: j });
        afgelegd += gd; gd = 0; gt = 0; g0 = j + 1;
      }
    }
    let tempo = 70, haperingen = [], cv = 0, vMed = 0, traag = false;
    if (groepen.length >= 4) {
      vMed = H.mediaan(groepen.map((g) => g.v));
      const mid = groepen.filter((g) => g.f >= 0.1 && g.f <= 0.9);
      let run = [];
      const sluit = () => {
        if (run.length && H.gemiddelde([run.reduce((s, g) => s + g.dt, 0)]) >= 80) {
          const g = run[Math.floor(run.length / 2)];
          haperingen.push({ x: P[g.j0].x, y: P[g.j0].y });
        }
        run = [];
      };
      for (const g of mid) { if (g.v < 0.2 * vMed) run.push(g); else sluit(); }
      sluit();
      const vs = mid.map((g) => g.v);
      const gv = H.gemiddelde(vs);
      cv = gv > 0 ? H.sd(vs) / gv : 0;
      tempo = 100 - 25 * haperingen.length - 25 * H.clamp((cv - 0.5) / 0.5, 0, 1);
      const grens = (o.snel ? TRAAG_N5 : TRAAG) * W / 1000;
      traag = vMed < grens;
      if (traag) tempo = Math.min(tempo, 60);
      tempo = H.clamp(tempo, 0, 100);
    }

    // --- Bocht afgesneden (afwijking naar de binnenkant van de bocht) ---
    const afgesneden = [];
    let reeks = [];
    const kMin = 0.4 / o.lengte;             // negeer bijna rechte stukken (kromming in 1/px)
    for (let j = 0; j < n; j++) {
      const q = dichtstbij(P[j], o.ideaal), id = o.ideaal[q.i];
      let binnen = 0;
      if (Math.abs(id.k) > kMin) {
        const nx = -id.ty, ny = id.tx, sg = Math.sign(id.k);
        binnen = ((P[j].x - id.x) * nx + (P[j].y - id.y) * ny) * sg;
      }
      if (binnen > 0.5 * r) reeks.push(P[j]);
      else { if (reeks.length >= 3) afgesneden.push(reeks[Math.floor(reeks.length / 2)]); reeks = []; }
    }
    if (reeks.length >= 3) afgesneden.push(reeks[Math.floor(reeks.length / 2)]);

    let score = 0.35 * doorgang + 0.40 * vloeiend + 0.25 * tempo;
    // Geen harde plafond meer: een ontbrekende wending kost 20 punten, elke extra wending 4 (max 16).
    if (wissels < o.wendingen) score -= 20 * (o.wendingen - wissels);
    else score -= 4 * Math.min(extra, 4);
    score = Math.round(H.clamp(score, 0, 100));

    // --- Tip: de oorzaak met de grootste puntenverlies ---
    const nabijRing = (p) => [o.start, o.eind, ...o.ringen].some((g) => H.afstand(p, g) < 2.5 * r);
    const knikRing = hoekjes.filter(nabijRing).length;
    const kandidaten = [];
    const grensV = (o.snel ? TRAAG_N5 : TRAAG) * W / 1000;
    const trillerig = (ruwPen >= 6 || hoekjes.length >= 3) && vMed > 0 && vMed < Math.max(2 * grensV, 0.4 * W / 1000);
    if (hoekjes.length && !trillerig) {
      kandidaten.push(knikRing
        ? [20 * knikRing + 10, 'Je knikt bij de stip. Kijk al naar de volgende stip en haal de lijn in één beweging door.']
        : [20 * hoekjes.length + 10, 'Je lijn heeft een knik. Trek de bocht in één vloeiende beweging.']);
    }
    if (haperingen.length) kandidaten.push([25 * haperingen.length + 5, 'Je stokt halverwege. Trek sneller, vanuit je schouder.']);
    if (trillerig) kandidaten.push([100, 'Trillerige lijn. Teken sneller; een snelle lijn wordt gladder.']);
    if (traag) kandidaten.push([40, 'Je tekent te langzaam. Trek de lijn sneller, vanuit je schouder.']);
    if (afgesneden.length) kandidaten.push([30, 'Je snijdt de bocht af. Maak hem ruimer.']);
    if (dStart > 1.5 * r || dEind > 1.5 * r) kandidaten.push([60, 'Begin op de gekleurde stip en eindig op de laatste stip.']);
    else if (gemist.length) kandidaten.push([(100 - doorgang) * 1.2, 'Je mist een ring. Laat de lijn door het midden van de ringen lopen.']);
    if (verkeerdeWendingen) {
      kandidaten.push([hoekjes.length ? 15 : wissels < o.wendingen ? 45 : 35,
        o.wendingen === 0 ? 'Dit is één C-bocht: wissel niet van richting.'
          : wissels < o.wendingen ? 'Je lijn mist een wending. Buig na het midden de andere kant op.'
            : 'Te veel wendingen. Houd de bochten ruim en rustig.']);
    }
    let tip;
    if (kandidaten.length) { kandidaten.sort((a, b) => b[0] - a[0]); tip = kandidaten[0][1]; }
    else tip = score >= 85 ? 'Mooie, vloeiende lijn.' : 'Trek gelijkmatiger door, vanuit je schouder.';

    return {
      score, tip, hoekjes: hoekjes.length, ruwPen, doorgang, vloeiend, tempo, wissels, ruwheid, cv, vMed,
      markers: { knikken: hoekjes, haperingen, afgesneden, gemist },
    };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const kl = vlak.kleur;
    ctx.save();
    ctx.setLineDash([10, 8]); ctx.strokeStyle = kl.goed; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    pad(ctx, o.ideaal, 0, o.ideaal.length - 1);
    ctx.setLineDash([]);
    ctx.strokeStyle = kl.fout; ctx.lineWidth = 2.5;
    for (const g of u.markers.gemist) { ctx.beginPath(); ctx.arc(g.x, g.y, o.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = kl.fout;
    const m = u.markers;
    for (const p of [...m.knikken, ...m.haperingen, ...m.afgesneden]) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'curves',
    naam: 'Eén vloeiende lijn',
    uitleg: 'Teken in één vloeiende streek van de startstip door alle ringen naar de eindstip.',
    fundament: 'Zelfverzekerde C- en S-curves vanuit schouder en elleboog; de basis voor lineart en schetsen.',
    meerdereStreken: false,
    toonUitslag: 1500,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();

</script>
<script>
/* oefeningen/slingerlijn.js */
// De Slingerlijn: één vloeiende streek met constant tempo langs een slingerende contour.
(function () {
  const H = window.Hulp;

  // Per niveau (afstanden in mm, tempo in mm/s):
  //  T = brede band (uitslag/hulpband), tempo = streefsnelheid van de stip, bereik = goed tempo, stip = meelopende stip,
  //  hulp = hulplijn ('band' brede band, 'dun' dunne lijn, 'stip' stippellijn, 'anker' alleen ankerpunten bij de toppen),
  //  gem / p90 = [goed, slecht] voor gemiddelde en 90e-percentiel afstand tot de contour, top = idem voor hoe dicht je
  //  bij de toppen/bochten van de contour komt (amplitude; alleen niveau 3-5),
  //  rit = [goed, slecht] rms synchrone afstand (ritme, amplitude en golflengte tegelijk), cv = [goed, slecht] snelheidsvariatie,
  //  bib = [goed, slecht] bibber (rms), dek = afstand waarbinnen contour als 'gedekt' telt, se = marge voor start/eind,
  //  pen = strafpunten voor mis start/eind, draai = max. rotatie van de opgave (graden),
  //  gew = gewichten [vorm, bibber, stoppen, tempo, druk, ritme].
  const NIVEAUS = {
    1: { T: 6.0, tempo: 45, bereik: [30, 80], stip: true, hulp: 'band', gem: [1.8, 9], p90: [3.6, 12], rit: [3, 14], cv: [0.25, 0.6], bib: [0.15, 0.6], dek: 9, se: 12, pen: 10, draai: 0, gew: [0.45, 0.20, 0.15, 0.10, 0.10, 0] },
    2: { T: 5.0, tempo: 60, bereik: [40, 100], stip: true, hulp: 'band', gem: [1.5, 7.5], p90: [3, 10], rit: [3, 14], cv: [0.25, 0.6], bib: [0.15, 0.6], dek: 7.5, se: 10, pen: 10, draai: 6, gew: [0.45, 0.20, 0.15, 0.10, 0.10, 0] },
    3: { T: 3.5, tempo: 0, bereik: [45, 120], stip: false, hulp: 'dun', gem: [0.7, 3.0], p90: [1.5, 5.0], top: [0.8, 3.5], rit: [1.0, 5], cv: [0.18, 0.5], bib: [0.12, 0.5], dek: 6, se: 8, pen: 12, draai: 14, gew: [0.38, 0.14, 0.10, 0.14, 0.04, 0.20] },
    4: { T: 2.5, tempo: 0, bereik: [50, 110], stip: false, hulp: 'stip', gem: [0.7, 3.0], p90: [1.5, 5.0], top: [0.8, 3.6], rit: [1.4, 7], cv: [0.15, 0.45], bib: [0.12, 0.5], dek: 5, se: 6.5, pen: 15, draai: 25, gew: [0.38, 0.14, 0.09, 0.14, 0.04, 0.21] },
    5: { T: 2.0, tempo: 0, bereik: [55, 105], stip: false, hulp: 'anker', gem: [0.6, 2.4], p90: [1.2, 4.0], top: [0.4, 2.0], rit: [0.8, 4.0], cv: [0.12, 0.4], bib: [0.12, 0.5], dek: 4.5, se: 5.5, pen: 18, draai: 30, gew: [0.38, 0.13, 0.08, 0.14, 0.04, 0.23] },
  };

  // ---------- meetkunde ----------
  function chaikin(pts, n) {
    for (let k = 0; k < n; k++) {
      const u = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        u.push({ x: 0.75 * a.x + 0.25 * b.x, y: 0.75 * a.y + 0.25 * b.y });
        u.push({ x: 0.25 * a.x + 0.75 * b.x, y: 0.25 * a.y + 0.75 * b.y });
      }
      u.push(pts[pts.length - 1]);
      pts = u;
    }
    return pts;
  }

  // Ruwe vorm (eenheden willekeurig) per niveau.
  function ruweVorm(niveau, rng) {
    const j = (a) => rng.tussen(-a, a);
    if (niveau === 1) {
      return chaikin([{ x: 0, y: 0.7 + j(0.08) }, { x: 1.0 + j(0.1), y: 0.1 + j(0.08) }, { x: 2.0, y: 0.6 + j(0.08) }], 5)
        .map((p) => ({ x: p.x * 1.0, y: p.y }));
    }
    if (niveau === 2) {
      return chaikin([{ x: 0, y: 0.9 + j(0.1) }, { x: 0.7, y: 0.1 + j(0.1) }, { x: 1.3, y: 0.9 + j(0.1) }, { x: 2.0, y: 0.1 + j(0.1) }], 5);
    }
    if (niveau === 3) {
      // 6-7 toppen, wisselende amplitude en afstand
      const n = rng.kies([6, 7]), w = 2.0, v = [];
      for (let i = 0; i < n; i++) {
        v.push({ x: w * i / (n - 1) + (i && i < n - 1 ? j(0.07) : 0), y: (i % 2 ? 0.08 + rng.tussen(0, 0.2) : 0.92 - rng.tussen(0, 0.2)) });
      }
      return chaikin(v, 5);
    }
    if (niveau === 4) {
      const kiesVorm = rng();
      if (kiesVorm < 0.34) { // golf met wisselende periode en afnemende amplitude
        const k = rng.tussen(2.6, 3.4), chirp = rng.tussen(0.25, 0.5), r = [];
        for (let q = 0; q <= 500; q++) {
          const x = q / 500;
          r.push({ x: x * 2.4, y: Math.exp(-0.9 * x) * Math.sin(2 * Math.PI * (k * x + chirp * x * x * k)) });
        }
        return r;
      }
      if (kiesVorm < 0.67) { // spiraal naar binnen
        const draaien = rng.tussen(1.35, 1.6), th = draaien * 2 * Math.PI, r = [];
        for (let k = 0; k <= 400; k++) {
          const a = th * k / 400, rr = 1 - 0.78 * (a / th);
          r.push({ x: rr * Math.cos(a), y: rr * Math.sin(a) });
        }
        return r;
      }
      const a = 1, b = rng.tussen(2.1, 2.6), tm = Math.PI * 1.1, r = []; // lus (trochoïde)
      for (let k = 0; k <= 400; k++) {
        const t = -tm + 2 * tm * k / 400;
        r.push({ x: a * t - b * Math.sin(t), y: -b * Math.cos(t) });
      }
      return r;
    }
    // niveau 5: scherpe bochten, wisselende kromming
    const n = rng.kies([9, 10, 11]), v = [];
    let x = 0;
    for (let i = 0; i < n; i++) {
      v.push({ x, y: i % 2 ? 0.05 + rng.tussen(0, 0.45) : 0.95 - rng.tussen(0, 0.45) });
      x += rng.tussen(0.16, 0.5);
    }
    return chaikin(v, 2);
  }

  // Zet een polylijn om naar punten op gelijke afstand (px).
  function gelijkeStap(pts, stap) { return H.herbemonster(pts.map((p) => ({ x: p.x, y: p.y, p: 0, t: 0 })), stap).map((p) => ({ x: p.x, y: p.y })); }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const mm = vlak.pxPerMm;
    const k = H.clamp(Math.min(vlak.w, vlak.h) / (mm * 100), 0.55, 1);
    const Tpx = n.T * mm * k;
    let ruw = ruweVorm(niveau, rng);
    // Passend maken in het vlak (uniform schalen, midden).
    if (n.draai) { // gedraaide opgave
      const hk = rng.tussen(-n.draai, n.draai) * Math.PI / 180, cs = Math.cos(hk), sn = Math.sin(hk);
      ruw = ruw.map((p) => ({ x: p.x * cs - p.y * sn, y: p.x * sn + p.y * cs }));
    }
    const marge = Math.max(Tpx * 2, 30);
    const bx = [marge + 8, vlak.w - marge - 8], by = [Math.max(marge, 34) + 20, vlak.h - Math.max(marge, 34)];
    const minx = Math.min(...ruw.map((p) => p.x)), maxx = Math.max(...ruw.map((p) => p.x));
    const miny = Math.min(...ruw.map((p) => p.y)), maxy = Math.max(...ruw.map((p) => p.y));
    const s = Math.min((bx[1] - bx[0]) / Math.max(1e-6, maxx - minx), (by[1] - by[0]) / Math.max(1e-6, maxy - miny));
    const ox = (bx[0] + bx[1]) / 2 - s * (minx + maxx) / 2, oy = (by[0] + by[1]) / 2 - s * (miny + maxy) / 2;
    const spiegelX = rng() < 0.5, spiegelY = rng() < 0.5;
    ruw = ruw.map((p) => {
      let x = ox + s * p.x, y = oy + s * p.y;
      if (spiegelX) x = vlak.w - x;
      if (spiegelY) y = vlak.h - y;
      return { x, y };
    });
    const pts = gelijkeStap(ruw, mm); // 1 mm
    const N = pts.length;
    const tang = [], kr = [];
    const hoek = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
    for (let i = 0; i < N; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
      const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      tang.push({ x: (b.x - a.x) / d, y: (b.y - a.y) / d });
      const i0 = Math.max(0, i - 4), i1 = Math.min(N - 1, i + 4);
      if (i1 - i0 < 3 || i === i0 || i === i1) { kr.push(0); continue; }
      let dh = hoek(pts[i], pts[i1]) - hoek(pts[i0], pts[i]);
      while (dh > Math.PI) dh -= 2 * Math.PI;
      while (dh < -Math.PI) dh += 2 * Math.PI;
      kr.push(dh / (i1 - i0));
    }
    const o = {
      niveau, T: n.T, Tpx, k, pts, tang, kr, gew: n.gew, bereik: n.bereik, tab: n, hulp: n.hulp, anker: vindAnkers(pts, kr).map((i) => ({ i, x: pts[i].x, y: pts[i].y })),
      start: pts[0], eind: pts[N - 1], lengteMm: N - 1,
      tempo: n.tempo, animeer: n.stip, stip: n.stip,
    };
    o.plek = vindPlek(o, vlak);
    return o;
  }

  // Ankerpunten: plekken met de sterkste kromming (toppen en bochten), minstens 10 mm uit elkaar.
  function vindAnkers(pts, kr) { // geeft indices in pts
    const ids = kr.map((v, i) => i).filter((i) => i > 5 && i < pts.length - 6);
    const mx = Math.max(0, ...ids.map((i) => Math.abs(kr[i])));
    const kand = ids.filter((i) => Math.abs(kr[i]) > 0.25 * mx && Math.abs(kr[i]) >= Math.abs(kr[i - 1]) && Math.abs(kr[i]) >= Math.abs(kr[i + 1]));
    kand.sort((a, b) => Math.abs(kr[b]) - Math.abs(kr[a]));
    const uit = [];
    for (const i of kand) if (uit.every((j) => Math.abs(i - j) > 10)) uit.push(i);
    return uit;
  }

  // Lege plek in het vlak, ver van de lijn, voor de score.
  function vindPlek(o, vlak) {
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bw = -Infinity;
    const stap = Math.max(1, Math.floor(o.pts.length / 300));
    const sub = o.pts.filter((p, i) => i % stap === 0);
    for (let i = 0; i <= 20; i++) {
      for (let j = 0; j <= 12; j++) {
        const x = vlak.w * (0.25 + 0.5 * i / 20), y = vlak.h * (0.2 + 0.6 * j / 12);
        let m = Infinity;
        for (const p of sub) m = Math.min(m, Math.hypot(p.x - x, p.y - y));
        const w = Math.min(m, 140) - 0.05 * Math.hypot(x - vlak.w / 2, y - vlak.h / 2);
        if (w > bw) { bw = w; beste = { x, y }; }
      }
    }
    return beste;
  }

  function teken(ctx, o, vlak, info) {
    const c = vlak.kleur, P = o.pts;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (o.hulp !== 'anker') {
      ctx.beginPath();
      ctx.moveTo(P[0].x, P[0].y);
      for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
      if (o.hulp === 'band') { ctx.strokeStyle = c.hulpZacht; ctx.lineWidth = 2 * o.Tpx; ctx.stroke(); }
      ctx.strokeStyle = c.hulp;
      ctx.lineWidth = o.hulp === 'band' ? 1.5 : 1.2;
      if (o.hulp === 'stip') ctx.setLineDash([2, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
    } else { // alleen ankerpunten bij de toppen
      ctx.fillStyle = c.hulp;
      for (const a of o.anker) { ctx.beginPath(); ctx.arc(a.x, a.y, 3.2, 0, Math.PI * 2); ctx.fill(); }
    }
    // eindvlag
    const e = o.eind;
    ctx.strokeStyle = c.hulp;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x, e.y - 28); ctx.stroke();
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.moveTo(e.x, e.y - 28); ctx.lineTo(e.x + 18, e.y - 21); ctx.lineTo(e.x, e.y - 14); ctx.closePath(); ctx.fill();
    // startstip
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.arc(o.start.x, o.start.y, 8, 0, Math.PI * 2); ctx.fill();
    // meelopende tempo-stip (lus als voorbeeldtempo)
    if (o.stip && !(info && info.verborgen)) {
      const L = P.length - 1;
      const s = (((info && info.nu) || 0) / 1000 * o.tempo) % (L + 0.9 * o.tempo); // 1 punt = 1 mm
      const idx = H.clamp(Math.floor(s), 0, L);
      ctx.fillStyle = c.accent;
      ctx.strokeStyle = c.hulp;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P[idx].x, P[idx].y, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- nakijken ----------
  function gladMaken(r) {
    const n = r.length, s = [];
    for (let i = 0; i < n; i++) {
      const h = Math.min(2, i, n - 1 - i);
      let x = 0, y = 0;
      for (let j = i - h; j <= i + h; j++) { x += r[j].x; y += r[j].y; }
      s.push({ x: x / (2 * h + 1), y: y / (2 * h + 1), p: r[i].p, t: r[i].t });
    }
    return s;
  }

  function nakijken(o, streken, vlak) {
    const mm = vlak.pxPerMm, T = o.Tpx, C = o.pts, NC = C.length, tb = o.tab;
    const dekPx = tb.dek * mm;
    const ruwP = streken[streken.length - 1].punten;
    if (ruwP.length < 8 || H.lengte(ruwP) < o.lengteMm * mm * 0.4) return { ongeldig: 'Te kort: trek in één streek van de stip naar de vlag.' };
    const r = H.herbemonster(ruwP, mm);
    const n = r.length;
    const dur = r[n - 1].t - r[0].t;
    if (n < 8 || !(dur > 150)) return { ongeldig: 'Te kort of te snel: probeer opnieuw.' };
    const sm = gladMaken(r);

    // snelheid (mm/s) per punt op de gladde lijn, over venster van +-2
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - 2), b = Math.min(n - 1, i + 2);
      const dt = sm[b].t - sm[a].t;
      v.push(dt > 0 ? H.afstand(sm[a], sm[b]) / mm / (dt / 1000) : 0);
    }
    const w = []; // tijdsgewicht per punt (ms)
    for (let i = 0; i < n; i++) w.push((sm[Math.min(n - 1, i + 1)].t - sm[Math.max(0, i - 1)].t) / 2);
    const t0 = sm[0].t, t1 = sm[n - 1].t;
    const kern = []; // indices in de middelste 80% van de tijd
    for (let i = 0; i < n; i++) if (sm[i].t >= t0 + 0.1 * dur && sm[i].t <= t1 - 0.1 * dur) kern.push(i);

    // afstand tot contour, gesigneerd + richting
    const af = [], dev = [], inw = [], mjs = [];
    let tegen = 0, stappen = 0, vorig = -1;
    const zoek = (i, j0, j1) => {
      let m = Infinity, mj = j0;
      for (let j = j0; j <= j1; j++) {
        const d = Math.hypot(C[j].x - sm[i].x, C[j].y - sm[i].y);
        if (d < m) { m = d; mj = j; }
      }
      return [m, mj];
    };
    for (let i = 0; i < n; i++) {
      // volg de contour in volgorde (anders springt je bij lussen/spiralen naar de verkeerde tak)
      let [m, mj] = vorig < 0 ? zoek(i, 0, Math.floor(NC * 0.25)) : zoek(i, Math.max(0, vorig - 4), Math.min(NC - 1, vorig + 30));
      if (m > 2.5 * dekPx) [m, mj] = zoek(i, 0, NC - 1);
      vorig = mj;
      mjs.push(mj);
      af.push(m);
      const nx = -o.tang[mj].y, ny = o.tang[mj].x;
      const d = (sm[i].x - C[mj].x) * nx + (sm[i].y - C[mj].y) * ny;
      dev.push(d);
      const kk = o.kr[mj];
      inw.push(Math.abs(kk) > 0.008 ? d * Math.sign(kk) : null);
      if (i > 0 && H.afstand(sm[i], sm[i - 1]) > 0.3 * mm) {
        stappen++;
        const dx = sm[i].x - sm[i - 1].x, dy = sm[i].y - sm[i - 1].y;
        if (dx * o.tang[mj].x + dy * o.tang[mj].y < 0) tegen++;
      }
    }
    // dekking: contourpunten met een streekpunt binnen de dek-marge
    let gedekt = 0;
    for (let j = 0; j < NC; j++) {
      let m = Infinity;
      for (let i = 0; i < n; i += 1) { const d = Math.hypot(C[j].x - sm[i].x, C[j].y - sm[i].y); if (d < m) m = d; if (m <= dekPx) break; }
      if (m <= dekPx) gedekt++;
    }
    const dekking = gedekt / NC;
    const gem = H.gemiddelde(af) / mm;
    const sorted = af.slice().sort((a, b) => a - b);
    const p90 = sorted[Math.min(n - 1, Math.floor(0.9 * n))] / mm;
    // toppen: hoe dicht komt je streek bij de sterkste bochten van de contour (verraadt te lage/hoge amplitude)
    let top = 0;
    if (o.anker.length) {
      for (const a of o.anker) {
        let m = Infinity;
        for (let i = 0; i < n; i++) m = Math.min(m, Math.hypot(sm[i].x - a.x, sm[i].y - a.y));
        top += m;
      }
      top /= o.anker.length * mm;
    }
    let A = tb.top && o.anker.length
      ? 100 * (H.lin(gem, tb.gem[0], tb.gem[1]) + H.lin(p90, tb.p90[0], tb.p90[1]) + H.lin(top, tb.top[0], tb.top[1])) / 3
      : 100 * (H.lin(gem, tb.gem[0], tb.gem[1]) + H.lin(p90, tb.p90[0], tb.p90[1])) / 2;
    if (dekking < 0.9) A = Math.min(A, 60);
    const startFout = H.afstand(sm[0], o.start) > tb.se * mm;
    const eindFout = H.afstand(sm[n - 1], o.eind) > tb.se * mm;
    const pen = (startFout || eindFout) ? tb.pen : 0;

    // ritme/periode: waar je zou moeten zijn als je op dezelfde fractie van de lijn zat als op de contour (synchroon),
    // de rms afstand daartoe. Straft te kleine/grote amplitude en verschoven golven, ook waar de band zelf steil loopt.
    let ritS = 0;
    {
      const cum = [0];
      for (let i = 1; i < n; i++) cum.push(cum[i - 1] + H.afstand(sm[i], sm[i - 1]));
      const tot = cum[n - 1] || 1;
      for (let i = 0; i < n; i++) {
        const q = C[Math.round(cum[i] / tot * (NC - 1))];
        ritS += (sm[i].x - q.x) ** 2 + (sm[i].y - q.y) ** 2;
      }
    }
    const rit = Math.sqrt(ritS / n) / mm;
    const R = 100 * H.lin(rit, tb.rit[0], tb.rit[1]);

    // amplitude/grootte: spreiding van je streek tegenover de contour (rotatie-onafhankelijk)
    const spreid = (pp) => {
      const mx = H.gemiddelde(pp.map((q) => q.x)), my = H.gemiddelde(pp.map((q) => q.y));
      return Math.sqrt(H.gemiddelde(pp.map((q) => (q.x - mx) ** 2 + (q.y - my) ** 2)));
    };
    const grootte = spreid(sm) / spreid(C);

    // bibber
    let ss = 0;
    for (let i = 0; i < n; i++) ss += ((r[i].x - sm[i].x) ** 2 + (r[i].y - sm[i].y) ** 2);
    const rms = Math.sqrt(ss / n) / mm;
    const B = 100 * H.lin(rms, tb.bib[0], tb.bib[1]);

    // stoppen
    const med = H.mediaan(kern.map((i) => v[i]));
    let slow = 0, tot = 0;
    const stops = [];
    let run = null;
    for (const i of kern) {
      tot += w[i];
      if (v[i] < 0.15 * med) {
        slow += w[i];
        if (run && run.last === i - 1) { run.last = i; run.ms += w[i]; } else { run = { first: i, last: i, ms: w[i] }; stops.push(run); }
      }
    }
    const stopFrac = tot > 0 ? slow / tot : 0;
    const S = 100 * H.lin(stopFrac, 0, 0.10);

    // tempo
    let dist = 0;
    for (let a = 1; a < kern.length; a++) dist += H.afstand(sm[kern[a]], sm[kern[a - 1]]);
    const kernTijd = kern.length > 1 ? (sm[kern[kern.length - 1]].t - sm[kern[0]].t) / 1000 : 0;
    const vGem = kernTijd > 0 ? dist / mm / kernTijd : 0;
    const [lo, hi] = o.bereik;
    const bereikS = vGem >= lo && vGem <= hi ? 1 : vGem < lo ? H.lin(vGem, lo, lo / 2) : H.lin(vGem, hi, hi * 1.6);
    const vk = kern.map((i) => v[i]);
    const cvV = H.gemiddelde(vk) > 0 ? H.sd(vk) / H.gemiddelde(vk) : 1;
    const Tm = 100 * (bereikS + H.lin(cvV, tb.cv[0], tb.cv[1])) / 2;

    // druk
    const p = r.map((q) => q.p);
    const lo5 = Math.floor(n * 0.1), pm = p.slice(lo5, n - lo5);
    const mono = Math.max(...p) - Math.min(...p) < 1e-3;
    const pg = H.gemiddelde(pm);
    const cvP = pg > 0 ? H.sd(pm) / pg : 0;
    const D = mono ? 100 : 100 * H.lin(cvP, 0.15, 0.5);

    // kriebel
    const pad = H.lengte(sm) / mm;
    const kriebel = pad / o.lengteMm > 1.25 || (stappen > 0 && tegen / stappen > 0.05);

    const g = o.gew;
    let score = g[0] * A + g[1] * B + g[2] * S + g[3] * Tm + g[4] * D + g[5] * R - pen - (kriebel ? 15 : 0);
    score = Math.round(H.clamp(score, 0, 100));

    // bochten afgesneden?
    const iw = inw.filter((x) => x !== null);
    const snijdt = iw.length > 20 && H.gemiddelde(iw) > 0.35 * T && iw.filter((x) => x > 0.3 * T).length / iw.length > 0.5;

    let tip;
    if (kriebel) tip = 'Trek één lijn zonder te corrigeren.';
    else if (stopFrac > 0.05) tip = 'Je stopt halverwege, houd je tempo vast tot de vlag.';
    else if (B < 60 && vGem < lo) tip = 'Te voorzichtig. Trek sneller en gebruik je arm.';
    else if (vGem > hi && A < 70) tip = 'Te snel. Zoek een rustiger ritme.';
    else if (A < 80 && grootte < 0.9) tip = 'Je golven zijn te klein, ga tot aan de toppen.';
    else if (A < 80 && grootte > 1.1) tip = 'Je golven zijn te groot, stop op de toppen.';
    else if (R < 60 && A < 85) tip = 'Je ritme loopt uit de pas, houd de golflengte gelijk aan de lijn.';
    else if (snijdt && A < 90) tip = 'Je snijdt de bochten af, kijk vooruit langs de lijn.';
    else if (dekking < 0.9 || startFout || eindFout) tip = 'Begin bij de stip en trek door tot de vlag.';
    else if (A < 80) tip = o.hulp === 'band' ? 'Blijf in de band. Kijk vooruit langs de lijn.' : 'Blijf dicht op de lijn. Kijk vooruit langs de lijn.';
    else if (B < 60) tip = vGem < lo ? 'Te voorzichtig. Trek sneller en gebruik je arm.' : 'Lijn trilt. Trek ontspannen vanuit je schouder.';
    else if (Tm < 60) tip = vGem < lo ? 'Te traag. Trek met meer vaart.' : vGem > hi ? 'Te snel. Zoek een rustiger ritme.' : 'Houd je snelheid gelijk van begin tot eind.';
    else if (D < 60 && !mono) tip = 'Houd je pendruk gelijkmatig.';
    else if (R < 70) tip = 'Let op de afstand tussen de toppen, houd het ritme van de lijn aan.';
    else tip = score >= 85 ? 'Mooi vloeiend en gelijkmatig.' : 'Goed bezig. Blijf dichter op de lijn.';

    // voor de uitslag: stukken buiten T en stoppunten
    const buiten = [];
    let cur = null;
    for (let i = 0; i < n; i++) {
      if (af[i] > T) { if (!cur) { cur = []; buiten.push(cur); if (i > 0) cur.push({ x: sm[i - 1].x, y: sm[i - 1].y }); } cur.push({ x: sm[i].x, y: sm[i].y }); } else cur = null;
    }
    const stopPlek = stops.filter((s) => s.ms > 80).map((s) => ({ x: sm[s.first].x, y: sm[s.first].y }));

    return {
      score, tip, A: Math.round(A), B: Math.round(B), S: Math.round(S), tempoScore: Math.round(Tm), druk: Math.round(D), ritme: Math.round(R), grootte, top,
      stopFrac, vGem, rms, dekking, kriebel, snijdt, buiten, stopPlek,
    };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const c = vlak.kleur, P = o.pts;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = c.goed;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = c.fout;
    ctx.lineWidth = 4;
    for (const seg of u.buiten || []) {
      if (seg.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(seg[0].x, seg[0].y);
      for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
      ctx.stroke();
    }
    ctx.fillStyle = c.fout;
    for (const s of u.stopPlek || []) { ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'slingerlijn',
    naam: 'Slingerlijn',
    uitleg: 'Trek in één vloeiende streek van de stip naar de vlag, binnen de band, zonder te stoppen.',
    fundament: 'Zelfverzekerde lijnen met constant tempo vanuit schouder en elleboog; de basis van schone lineart.',
    meerdereStreken: false,
    toonUitslag: 1500,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();

<script>
/* oefeningen/hoeken.js */
// Hoekjager: richting en hoek schatten en in één beweging uitvoeren.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: maximale hoekfout (graden voor score 0) en of de start meetelt.
  const EMAX = { 1: 25, 2: 20, 3: 15, 4: 12, 5: 10 };
  const GENOEMD4 = [30, 45, 60, 75, 105, 120, 135, 150];

  // Gesigneerde fouten van de laatste pogingen (voor "je wijkt steeds dezelfde kant op").
  const vorige = [];

  // Wiskundige hoek (graden, 0 = rechts, tegen de klok in) -> eenheidsrichting op het canvas.
  const richting = (deg) => ({ x: Math.cos(deg * RAD), y: -Math.sin(deg * RAD) });
  const mod180 = (d) => ((d % 180) + 180) % 180;

  function nieuweOpgave(niveau, rng, vlak) {
    const m = Math.min(vlak.w, vlak.h);
    let soort, ref = 0, doel = 0, verberg = false;
    if (niveau === 1) { soort = 'kopie'; ref = rng.kies([0, 90, 45, 135]); }
    else if (niveau === 2) { soort = 'kopie'; ref = rng.kies([15, 30, 45, 60, 75, 105, 120, 135, 150, 165, 0, 90]); }
    else if (niveau === 3) { soort = rng() < 0.5 ? 'kopie' : 'loodrecht'; ref = Math.round(rng.tussen(5, 175)); }
    else if (niveau === 4) { soort = 'hoek'; doel = rng.kies(GENOEMD4); }
    else if (rng() < 0.5) { soort = rng() < 0.5 ? 'kopie' : 'loodrecht'; ref = Math.round(rng.tussen(5, 175)); verberg = true; }
    else { soort = 'hoek'; do { doel = Math.round(rng.tussen(7, 173)); } while (doel % 15 === 0); }
    if (soort === 'kopie') doel = ref;
    else if (soort === 'loodrecht') doel = mod180(ref + 90);

    const o = { niveau, soort, ref, doel, verberg, emax: EMAX[niveau], m, w: vlak.w, h: vlak.h };
    if (verberg) o.verbergNa = 2000;
    if (soort === 'hoek') {
      o.start = { x: vlak.w * 0.45, y: vlak.h * 0.68 };
      o.hulpLen = m * 0.32;
    } else {
      o.start = { x: vlak.w * 0.6, y: vlak.h * 0.6 };
      const c = { x: vlak.w * 0.26, y: vlak.h * 0.6 }, r = richting(ref), half = m * 0.17;
      o.refLijn = { x1: c.x - r.x * half, y1: c.y - r.y * half, x2: c.x + r.x * half, y2: c.y + r.y * half };
    }
    o.zin = soort === 'kopie' ? 'Teken evenwijdig' : soort === 'loodrecht' ? 'Teken loodrecht' : 'Teken ' + doel + '°';
    return o;
  }

  function lijn(ctx, x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function tekenZin(ctx, o, vlak, extra) {
    const px = Math.round(H.clamp(o.m * 0.05, 16, 34));
    ctx.save();
    ctx.font = '600 ' + px + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = vlak.kleur.tekst;
    ctx.fillText(o.zin + (extra || ''), vlak.w / 2, vlak.h * 0.08);
    ctx.restore();
  }

  function stip(ctx, o, vlak) {
    ctx.save();
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath();
    ctx.arc(o.start.x, o.start.y, Math.max(7, o.m * 0.014), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function teken(ctx, o, vlak, info) {
    const verborgen = !!(info && info.verborgen && o.verberg);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = vlak.kleur.hulp;
    if (o.soort === 'hoek') {
      const s = o.start;
      lijn(ctx, s.x, s.y, s.x + o.hulpLen, s.y);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, o.m * 0.12, 0, -o.doel * RAD, true);
      ctx.stroke();
    } else if (!verborgen) {
      const l = o.refLijn;
      lijn(ctx, l.x1, l.y1, l.x2, l.y2);
    }
    ctx.restore();
    stip(ctx, o, vlak);
    tekenZin(ctx, o, vlak, verborgen ? ' (uit je hoofd)' : '');
  }

  function isKlaar() { return true; }

  // Hoek van een stuk punten (graden, wiskundig, 0..180) via PCA.
  const hoekVan = (pts) => mod180(-H.lijnFit(pts).hoek / RAD);

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    const L = H.lengte(ruw);
    if (ruw.length < 8 || L < 40) return { ongeldig: 'Te kort, trek een langere lijn.' };

    const pts = H.herbemonster(ruw, 3);
    const n = pts.length;
    const kern = pts.slice(Math.floor(n * 0.1), Math.max(Math.floor(n * 0.1) + 3, Math.ceil(n * 0.95)));
    const fit = H.lijnFit(kern);
    const gemeten = mod180(-fit.hoek / RAD);
    const e = H.lijnHoekVerschil(gemeten * RAD, o.doel * RAD);
    const fout = ((gemeten - o.doel + 270) % 180 + 180) % 180 - 90; // gesigneerd, tegen de klok in = +
    const steiler = Math.abs(Math.sin(gemeten * RAD)) > Math.abs(Math.sin(o.doel * RAD));

    // Rechtheid
    let maxAfw = 0;
    for (const p of kern) maxAfw = Math.max(maxAfw, Math.abs(H.lijnAfstand(p, { x: fit.mx, y: fit.my }, fit.dx, fit.dy)));
    const afw = maxAfw / L;

    // Start
    const dStart = H.afstand(ruw[0], o.start);
    const startRel = dStart / L;

    // Buiging: eerste 30% t.o.v. laatste 30%
    const k30 = Math.max(3, Math.floor(n * 0.3));
    const buig = n >= 8 ? H.lijnHoekVerschil(hoekVan(pts.slice(0, k30)) * RAD, hoekVan(pts.slice(n - k30)) * RAD) : 0;

    const sv = H.snelheden(ruw);
    const traag = sv.length > 0 && H.mediaan(sv) < 0.0012 * o.m;

    const A = H.lin(e, 1.5, o.emax);
    const R = H.lin(afw, 0.012, 0.06);
    const S = H.lin(dStart, 0.02 * L, 0.15 * L);
    const metStart = o.niveau > 1;
    const wA = metStart ? 0.7 : 0.78, wR = metStart ? 0.2 : 0.22, wS = metStart ? 0.1 : 0;
    const score = Math.round(100 * (wA * A + wR * R + wS * S));

    // Tips
    const kant = Math.abs(fout) > 4 ? Math.sign(fout) : 0;
    const steeds = kant !== 0 && vorige.length >= 2 && vorige.slice(-2).every((v) => v === kant);
    vorige.push(kant);
    if (vorige.length > 6) vorige.shift();

    let tip = '';
    if (o.soort === 'loodrecht' && H.lijnHoekVerschil(gemeten * RAD, o.ref * RAD) < 6) {
      tip = 'Je tekende evenwijdig in plaats van loodrecht.';
    } else {
      const kand = [];
      if (Math.abs(fout) > 4) {
        const t = steiler ? 'Je lijn is te steil. Maak hem vlakker.' : 'Je lijn is te vlak. Maak hem steiler.';
        kand.push([wA * (1 - A), steeds ? 'Je wijkt steeds dezelfde kant op: ' + t.charAt(0).toLowerCase() + t.slice(1) : t]);
      }
      if (buig > 6) kand.push([0.35 + 0.65 * Math.min(1, (buig - 6) / 10), 'Je buigt aan het einde af. Blijf je doel aankijken en trek door.']);
      if (R < 0.6) {
        kand.push([wR * (1 - R) + (traag ? 0.05 : 0),
          traag ? 'Trek in één vloeiende, snelle beweging.' : 'Je lijn wiebelt. Trek vanuit je schouder, niet je pols.']);
      }
      if (metStart && S < 0.5) kand.push([wS * (1 - S), 'Begin precies op de stip.']);
      kand.sort((a, b) => b[0] - a[0]);
      tip = kand.length ? kand[0][1] : (score >= 85 ? 'Scherp gezien, mooie rechte lijn.' : 'Bijna. Let op hoek en rechtheid.');
    }

    return { score, tip, e, fout, gemeten, fit: { mx: fit.mx, my: fit.my, dx: fit.dx, dy: fit.dy }, lengte: L, A, R, S, buig };
  }

  const HALF = 0.36;

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const m = o.m, s = o.start, d = richting(o.doel), half = m * HALF;
    ctx.save();
    ctx.lineCap = 'round';
    if (o.verberg && o.refLijn) {
      ctx.strokeStyle = vlak.kleur.hulpZacht;
      ctx.lineWidth = 3;
      const l = o.refLijn;
      lijn(ctx, l.x1, l.y1, l.x2, l.y2);
    }
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    lijn(ctx, s.x - d.x * half, s.y - d.y * half, s.x + d.x * half, s.y + d.y * half);
    ctx.setLineDash([]);
    const groot = u.e > o.emax / 2;
    if (groot) {
      const f = u.fit, h2 = u.lengte / 2;
      ctx.strokeStyle = vlak.kleur.fout;
      ctx.lineWidth = 1.5;
      lijn(ctx, f.mx - f.dx * h2, f.my - f.dy * h2, f.mx + f.dx * h2, f.my + f.dy * h2);
    }
    // Hoekfout als tekst aan het uiteinde van de doellijn
    const px = Math.round(H.clamp(m * 0.035, 13, 24));
    ctx.font = '600 ' + px + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let ex = s.x + d.x * (half + px * 1.6), ey = s.y + d.y * (half + px * 1.6);
    if (ex < px * 2 || ex > vlak.w - px * 2 || ey < px * 2 || ey > vlak.h - px * 2) {
      ex = s.x - d.x * (half + px * 1.6); ey = s.y - d.y * (half + px * 1.6);
    }
    ex = H.clamp(ex, px * 2, vlak.w - px * 2);
    ey = H.clamp(ey, px * 2, vlak.h - px * 2);
    ctx.fillStyle = groot ? vlak.kleur.fout : vlak.kleur.tekst;
    ctx.fillText('fout ' + (Math.round(u.e * 10) / 10) + '°', ex, ey);
    ctx.restore();
  }

  // Lege plek weg van de lijnen: kies het rasterpunt met de grootste afstand tot alle lijnen.
  function scorePlek(o, vlak) {
    const m = o.m, s = o.start, d = richting(o.doel), half = m * HALF;
    const segs = [[{ x: s.x - d.x * half, y: s.y - d.y * half }, { x: s.x + d.x * half, y: s.y + d.y * half }]];
    if (o.refLijn) segs.push([{ x: o.refLijn.x1, y: o.refLijn.y1 }, { x: o.refLijn.x2, y: o.refLijn.y2 }]);
    if (o.soort === 'hoek') segs.push([s, { x: s.x + o.hulpLen, y: s.y }]);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bd = -1;
    for (let i = 0; i <= 6; i++) for (let j = 0; j <= 4; j++) {
      const p = { x: vlak.w * (0.2 + 0.6 * i / 6), y: vlak.h * (0.28 + 0.6 * j / 4) };
      let dm = Infinity;
      for (const sg of segs) dm = Math.min(dm, H.segmentAfstand(p, sg[0], sg[1]));
      dm = Math.min(dm, H.afstand(p, s));
      if (dm > bd) { bd = dm; beste = p; }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'hoeken',
    naam: 'Hoekjager',
    uitleg: 'Trek vanaf de stip in één snelle beweging een rechte lijn in de gevraagde richting.',
    fundament: 'Richting en hoek schatten en in één beweging uitvoeren; de basis voor perspectief en lijnen die kloppen.',
    meerdereStreken: false,
    toonUitslag: 1600,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();
