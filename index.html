<script>
/* oefeningen/perspectief.js */
// Richting verdwijnpunt: schat de richting naar een verdwijnpunt (VP) en trek vanuit elk kruisje
// één rechte lijn die erheen wijst. Basis van perspectief.
(function () {
  const H = window.Hulp;
  const RAD = 180 / Math.PI;

  // Per niveau: aantal startpunten, hoek-tolerantie (graden), afstand startpunt-VP (fractie van min(w,h)),
  // aantal VP's, hulpstraal, VP buiten beeld.
  const NIVEAUS = {
    1: { n: [3, 3], thetaMax: 12, afstand: [0.45, 0.8], vps: 1, hulp: true, buiten: false },
    2: { n: [3, 4], thetaMax: 9, afstand: [0.4, 0.8], vps: 1, hulp: false, buiten: false },
    3: { n: [4, 4], thetaMax: 7, afstand: [0.35, 0.75], vps: 2, hulp: false, buiten: false },
    4: { n: [4, 5], thetaMax: 5, afstand: [0.25, 0.45], vps: 2, hulp: false, buiten: false },
    5: { n: [4, 5], thetaMax: 4, afstand: [0.3, 3], vps: 1, hulp: false, buiten: true },
  };

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const cfg = NIVEAUS[niveau];
    const w = vlak.w, h = vlak.h, m = Math.min(w, h);
    const marge = 0.07 * m;
    const n = Math.floor(rng.tussen(cfg.n[0], cfg.n[1] + 1 - 1e-9));
    const vps = [];
    if (cfg.buiten) {
      for (let poging = 0; poging < 200; poging++) {
        const a = rng.tussen(0, 2 * Math.PI), d = rng.tussen(0.75, 1.5) * w;
        const x = w / 2 + Math.cos(a) * d, y = h / 2 + Math.sin(a) * d;
        if (x < -0.08 * m || x > w + 0.08 * m || y < -0.08 * m || y > h + 0.08 * m) { vps.push({ x, y, vorm: 'rond' }); break; }
      }
      if (!vps.length) vps.push({ x: w * 1.4, y: h * 0.3, vorm: 'rond' });
    } else if (cfg.vps === 1) {
      vps.push({ x: rng.tussen(0.35, 0.65) * w, y: rng.tussen(0.28, 0.5) * h, vorm: 'rond' });
    } else {
      const yl = rng.tussen(0.3, 0.5) * h, yr = rng.tussen(0.3, 0.5) * h;
      vps.push({ x: rng.tussen(0.1, 0.2) * w, y: yl, vorm: 'rond' });
      vps.push({ x: rng.tussen(0.8, 0.9) * w, y: yr, vorm: 'vierkant' });
    }

    const starts = [];
    for (let i = 0; i < n; i++) {
      const vp = cfg.vps === 2 ? i % 2 : 0;
      let relax = 1, gelukt = false, kies = null;
      for (let poging = 0; poging < 900 && !gelukt; poging++) {
        if (poging % 150 === 149) relax *= 0.8;
        const x = rng.tussen(marge, w - marge), y = rng.tussen(0.14 * h, h - marge);
        const V = vps[vp], d = Math.hypot(V.x - x, V.y - y);
        kies = { x, y, vp };
        if (d < cfg.afstand[0] * m * relax || d > cfg.afstand[1] * m) continue;
        if (vps.some((q) => Math.hypot(q.x - x, q.y - y) < 0.14 * m)) continue;
        if (starts.some((s) => Math.hypot(s.x - x, s.y - y) < 0.2 * m * relax)) continue;
        // Lijnen naar hetzelfde VP niet bijna op elkaar.
        const hoek = Math.atan2(V.y - y, V.x - x);
        if (starts.some((s) => s.vp === vp && H.lijnHoekVerschil(hoek, Math.atan2(V.y - s.y, V.x - s.x)) < 7 * relax)) continue;
        gelukt = true;
      }
      starts.push(kies);
    }
    return { niveau, vps, starts, thetaMax: cfg.thetaMax, hulp: cfg.hulp, buiten: cfg.buiten, m, w, h };
  }

  // ---------- meetkunde ----------
  function eenheid(o, k) {
    const s = o.starts[k], V = o.vps[s.vp];
    const d = Math.hypot(V.x - s.x, V.y - s.y) || 1;
    return { ux: (V.x - s.x) / d, uy: (V.y - s.y) / d, d };
  }

  // Eindpunt van de ideale lijn: het VP, of (buiten beeld) de rand van het vlak.
  function eindpunt(o, k) {
    const s = o.starts[k], { ux, uy, d } = eenheid(o, k);
    let t = d;
    if (o.buiten) {
      t = Infinity;
      if (ux > 1e-9) t = Math.min(t, (o.w - s.x) / ux); else if (ux < -1e-9) t = Math.min(t, -s.x / ux);
      if (uy > 1e-9) t = Math.min(t, (o.h - s.y) / uy); else if (uy < -1e-9) t = Math.min(t, -s.y / uy);
      t = Math.min(d, Math.max(0, t));
    }
    return { x: s.x + ux * t, y: s.y + uy * t };
  }

  function geldig(o, st) {
    return st.punten.length >= 12 && H.lengte(st.punten) >= Math.min(60, 0.2 * o.m);
  }

  // Koppel elke geldige streek aan het dichtstbijzijnde nog vrije startpunt. Geeft per streek de index (of -1).
  function toewijzing(o, streken) {
    const vrij = o.starts.map(() => true);
    return streken.map((st) => {
      if (!geldig(o, st)) return -1;
      const p0 = st.punten[0];
      let best = -1, bd = Infinity;
      o.starts.forEach((s, k) => {
        const d = Math.hypot(s.x - p0.x, s.y - p0.y);
        if (vrij[k] && d < bd) { bd = d; best = k; }
      });
      if (best >= 0) vrij[best] = false;
      return best;
    });
  }

  // ---------- tekenen ----------
  function vpKleur(o, vlak, i) {
    return o.vps.length === 2 && i === 1 ? vlak.kleur.tekst : vlak.kleur.accent;
  }

  function vorm(ctx, vorm, x, y, r, vul) {
    ctx.beginPath();
    if (vorm === 'rond') ctx.arc(x, y, r, 0, 2 * Math.PI);
    else ctx.rect(x - r, y - r, 2 * r, 2 * r);
    if (vul) ctx.fill(); else ctx.stroke();
  }

  function teken(ctx, o, vlak, info) {
    const m = o.m, K = vlak.kleur;
    const gedaan = new Set();
    toewijzing(o, (info && info.streken) || []).forEach((k) => { if (k >= 0) gedaan.add(k); });
    ctx.save();
    ctx.lineCap = 'round';

    // Hulpstralen (niveau 1).
    if (o.hulp) {
      ctx.strokeStyle = K.hulp;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.5;
      o.starts.forEach((s, k) => {
        const e = eindpunt(o, k);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // Verdwijnpunt(en).
    const r = Math.max(7, 0.022 * m);
    o.vps.forEach((V, i) => {
      if (o.buiten) return;
      ctx.fillStyle = vpKleur(o, vlak, i);
      vorm(ctx, V.vorm, V.x, V.y, r, true);
      ctx.strokeStyle = K.hulp; ctx.lineWidth = 2;
      vorm(ctx, V.vorm, V.x, V.y, r + 4, false);
    });
    if (o.buiten) pijl(ctx, o, vlak);

    // Startkruisjes.
    const c = Math.max(8, 0.028 * m);
    o.starts.forEach((s, k) => {
      const klaar = gedaan.has(k);
      const kl = o.vps.length === 2 ? vpKleur(o, vlak, s.vp) : K.hulp;
      ctx.strokeStyle = klaar ? K.tekstZacht : kl;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(s.x - c, s.y); ctx.lineTo(s.x + c, s.y);
      ctx.moveTo(s.x, s.y - c); ctx.lineTo(s.x, s.y + c);
      ctx.stroke();
      if (o.vps.length === 2) {
        ctx.fillStyle = vpKleur(o, vlak, s.vp);
        vorm(ctx, o.vps[s.vp].vorm, s.x + c * 0.9, s.y - c * 0.9, Math.max(4, c * 0.4), true);
      }
      if (klaar) {
        ctx.strokeStyle = K.goed; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, c * 1.25, 0, 2 * Math.PI); ctx.stroke();
      }
    });
    ctx.restore();
  }

  // Pijl aan de rand van het vlak in de richting van het VP buiten beeld.
  function pijl(ctx, o, vlak) {
    const V = o.vps[0], cx = o.w / 2, cy = o.h / 2, m = o.m;
    const dx = V.x - cx, dy = V.y - cy, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const ins = 0.06 * m;
    let t = Infinity;
    if (ux > 1e-9) t = Math.min(t, (o.w - ins - cx) / ux); else if (ux < -1e-9) t = Math.min(t, (ins - cx) / ux);
    if (uy > 1e-9) t = Math.min(t, (o.h - ins - cy) / uy); else if (uy < -1e-9) t = Math.min(t, (ins - cy) / uy);
    const px = cx + ux * t, py = cy + uy * t, s = Math.max(10, 0.035 * m);
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath();
    ctx.moveTo(px + ux * s, py + uy * s);
    ctx.lineTo(px - ux * s * 0.6 - uy * s * 0.8, py - uy * s * 0.6 + ux * s * 0.8);
    ctx.lineTo(px - ux * s * 0.6 + uy * s * 0.8, py - uy * s * 0.6 - ux * s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- nakijken ----------
  function snelheidsProfiel(pts) {
    // Snelheid per ~40 ms venster, tegen jitter van losse events.
    const v = [];
    let a = pts[0];
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - a.t;
      if (dt >= 40) { v.push(H.afstand(a, pts[i]) / dt); a = pts[i]; }
    }
    return v;
  }

  // Aantal pauzes (>120 ms nagenoeg stilstaan) midden in de streek.
  function pauzes(pts) {
    let n = 0, anker = 0;
    for (let i = 1; i < pts.length; i++) {
      if (H.afstand(pts[anker], pts[i]) > 2.5) {
        const eind = H.afstand(pts[i - 1], pts[i]) < 8 ? pts[i].t : pts[i - 1].t;
        if (anker > 0 && eind - pts[anker].t > 120) n++;
        anker = i;
      }
    }
    return n;
  }

  function meetStreek(o, st, k) {
    const s = o.starts[k], { ux, uy } = eenheid(o, k);
    const pts = st.punten;
    const dS = H.afstand(pts[0], s);
    const rest = pts.slice(Math.floor(pts.length * 0.1));
    const f = H.lijnFit(rest);
    let fx = f.dx, fy = f.dy;
    if (fx * ux + fy * uy < 0) { fx = -fx; fy = -fy; }
    const theta = Math.atan2(ux * fy - uy * fx, ux * fx + uy * fy) * RAD; // + = kloksgewijs (scherm)
    // Kant waarop de lijn langs het VP loopt.
    const horizontaal = Math.abs(ux) >= Math.abs(uy);
    const kantWaarde = theta * Math.sign(horizontaal ? ux || 1 : uy || 1); // + = onder / links
    const kant = horizontaal ? (kantWaarde > 0 ? 'onder' : 'boven') : (kantWaarde > 0 ? 'links' : 'rechts');

    const L = H.lengte(rest) || 1;
    const e = rest.map((p) => H.lijnAfstand(p, { x: f.mx, y: f.my }, f.dx, f.dy));
    const rms = Math.sqrt(H.gemiddelde(e.map((v) => v * v)));
    const derde = Math.max(1, Math.floor(e.length / 3));
    const bow = H.gemiddelde(e.slice(derde, e.length - derde)) -
      0.5 * (H.gemiddelde(e.slice(0, derde)) + H.gemiddelde(e.slice(e.length - derde)));
    const recht = rms / L;
    const krom = recht > 0.02 && Math.abs(bow) > 0.5 * rms;

    const sp = snelheidsProfiel(pts);
    const gem = H.gemiddelde(sp);
    const cv = gem > 0 ? H.sd(sp) / gem : 0;
    const pauze = pauzes(pts);

    const sHoek = 100 * H.lin(Math.abs(theta), 0, o.thetaMax);
    const sRecht = 100 * H.lin(recht, 0, 0.03);
    const sVloei = Math.max(0, 100 - 40 * Math.max(0, cv - 0.5) - 15 * pauze);
    const sStart = 100 * H.lin(dS, 25, 75);
    const score = 0.6 * sHoek + 0.25 * sRecht + 0.1 * sVloei + 0.05 * sStart;
    return { k, theta, kant, horizontaal, dS, recht, krom, cv, pauze, score };
  }

  function nakijken(o, streken) {
    const wijs = toewijzing(o, streken);
    const details = [];
    wijs.forEach((k, si) => { if (k >= 0) details.push(Object.assign(meetStreek(o, streken[si], k), { si })); });
    if (!details.length) return { ongeldig: 'Te kort: trek een lange lijn vanuit het kruisje.' };

    const n = o.starts.length;
    const ontbreekt = n - details.length;
    const score = Math.round(details.reduce((s, d) => s + d.score, 0) / n);

    // Tips met een ernst; de ergste wint.
    const kandidaten = [];
    if (ontbreekt > 0) kandidaten.push([10, 'Trek een lijn vanuit elk kruisje.']);
    const krom = details.filter((d) => d.krom);
    if (krom.length) {
      const zelfde = krom.length;
      kandidaten.push([H.gemiddelde(krom.map((d) => d.recht)) / 0.02 * (zelfde > 1 ? 1.1 : 0.9), 'Je lijnen buigen: trek sneller en vanuit je schouder.']);
    }
    for (const kant of ['boven', 'onder', 'links', 'rechts']) {
      const g = details.filter((d) => d.kant === kant && Math.abs(d.theta) > 1);
      if (g.length < 3 || g.length < 0.6 * details.length) continue;
      const gemAbs = H.gemiddelde(g.map((d) => Math.abs(d.theta)));
      if (gemAbs > 3) kandidaten.push([gemAbs / 3, 'Je lijnen wijzen steeds te ver ' + kant + (kant === 'links' || kant === 'rechts' ? ' van' : '') + ' het punt.']);
    }
    const aarzel = details.filter((d) => d.pauze > 0 || d.cv > 0.8);
    if (aarzel.length) kandidaten.push([1.5 * aarzel.length / details.length + 0.3, 'Je aarzelt halverwege: kijk naar het verdwijnpunt, niet naar je pen.']);
    const ver = details.filter((d) => d.dS > 25);
    if (ver.length) kandidaten.push([H.gemiddelde(ver.map((d) => d.dS)) / 25 * (ver.length / details.length), 'Begin precies op het kruisje.']);

    let tip;
    if (kandidaten.length) {
      kandidaten.sort((x, y) => y[0] - x[0]);
      tip = kandidaten[0][1];
    } else if (score >= 85) tip = 'Mooi: rechte lijnen die naar het punt wijzen.';
    else tip = 'Schat de richting eerst: kijk naar het verdwijnpunt en trek dan in één beweging.';
    return { score, tip, details, ontbreekt };
  }

  // ---------- uitslag ----------
  function tekenUitslag(ctx, o, streken, u, vlak) {
    const K = vlak.kleur, m = o.m;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = K.goed;
    ctx.lineWidth = 2.5;
    o.starts.forEach((s, k) => {
      const e = eindpunt(o, k);
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
    });
    ctx.setLineDash([]);
    const fs = Math.round(H.clamp(m * 0.032, 11, 15));
    ctx.font = '600 ' + fs + 'px ' + (getComputedStyle(document.body).fontFamily || 'sans-serif');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const d of u.details || []) {
      const slecht = Math.abs(d.theta) > o.thetaMax / 2;
      const pts = streken[d.si].punten;
      if (slecht) {
        ctx.strokeStyle = K.fout; ctx.lineWidth = 1.5;
        ctx.beginPath();
        pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
      const a = pts[pts.length - 1], b = pts[Math.max(0, pts.length - 6)];
      const L = H.afstand(a, b) || 1;
      ctx.fillStyle = slecht ? K.fout : K.tekstZacht;
      ctx.fillText(Math.abs(d.theta).toFixed(1) + '°', a.x + (a.x - b.x) / L * 18, a.y + (a.y - b.y) / L * 14);
    }
    ctx.restore();
  }

  // Lege plek weg van de ideale lijnen, VP's en kruisjes (bij voorkeur onderin).
  function scorePlek(o, vlak) {
    const w = vlak.w, h = vlak.h, m = o.m;
    const lijnen = o.starts.map((s, k) => [s, eindpunt(o, k)]);
    const punten = o.starts.concat(o.vps.filter(() => !o.buiten));
    let beste = { x: w / 2, y: h * 0.8 }, bw = -Infinity;
    for (let i = 0; i <= 6; i++) {
      for (let j = 0; j <= 5; j++) {
        const p = { x: w * (0.2 + 0.6 * i / 6), y: h * (0.35 + 0.5 * j / 5) };
        let c = Infinity;
        for (const [a, b] of lijnen) c = Math.min(c, H.segmentAfstand(p, a, b));
        for (const q of punten) c = Math.min(c, H.afstand(p, q));
        const waarde = Math.min(c, 0.3 * m) + 0.25 * p.y;
        if (waarde > bw) { bw = waarde; beste = p; }
      }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'perspectief',
    naam: 'Richting verdwijnpunt',
    uitleg: 'Trek vanuit elk kruisje in één beweging een rechte lijn richting het verdwijnpunt.',
    fundament: 'Lijnrichting naar een verdwijnpunt inschatten en rechttrekken vanuit je schouder; de basis van perspectief.',
    meerdereStreken: true,
    stilNa: 0,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar(o, streken) { return toewijzing(o, streken).filter((k) => k >= 0).length >= o.starts.length; },
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();

</script>
<script>
/* oefeningen/dozen.js */
// Doos afmaken: een 3D-doos in perspectief; teken de ontbrekende ribben vanaf het gemarkeerde hoekpunt.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: draaihoeken (graden), camera-afstand (in doosgroottes; klein = sterke convergentie),
  // aantal ontbrekende ribben, hulplijnen, en of verborgen ribben meedoen.
  const NIVEAUS = {
    1: { yaw: [38, 52], pitch: [26, 36], roll: [0, 0], cam: 14, mist: 3, aantal: 3, gids: true, verborgen: false },
    2: { yaw: [38, 52], pitch: [26, 36], roll: [0, 0], cam: 14, mist: 3, aantal: 3, gids: false, verborgen: false },
    3: { yaw: [20, 62], pitch: [14, 38], roll: [-14, 14], cam: 4.6, mist: 5, aantal: 5, gids: false, verborgen: false },
    4: { yaw: [22, 58], pitch: [0, 7], roll: [0, 0], cam: 3.2, mist: 7, aantal: 7, gids: false, verborgen: true },
    5: { yaw: [0, 360], pitch: [-55, 55], roll: [-40, 40], cam: 2.7, mist: 6, aantal: 6, gids: false, verborgen: true },
  };

  // Hoekpunt i: bit0 = x, bit1 = y, bit2 = z. Rib = twee hoekpunten die in precies één bit verschillen.
  const RIBBEN = [];
  for (let i = 0; i < 8; i++) for (let k = 0; k < 3; k++) if (!(i & (1 << k))) RIBBEN.push({ a: i, b: i | (1 << k), as: k });

  function shuffle(lijst, rng) {
    const l = lijst.slice();
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
    return l;
  }

  function projecteer(n, rng, dims) {
    const yaw = rng.tussen(n.yaw[0], n.yaw[1]) * RAD * (rng() < 0.5 ? -1 : 1);
    const pitch = rng.tussen(n.pitch[0], n.pitch[1]) * RAD * (rng() < 0.5 ? -1 : 1);
    const roll = rng.tussen(n.roll[0], n.roll[1]) * RAD;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch), cz = Math.cos(roll), sz = Math.sin(roll);
    const diag = Math.hypot(dims[0], dims[1], dims[2]);
    const cam = n.cam * diag / 1.7;
    const pts = [];
    for (let i = 0; i < 8; i++) {
      let x = ((i & 1) ? 0.5 : -0.5) * dims[0], y = ((i & 2) ? 0.5 : -0.5) * dims[1], z = ((i & 4) ? 0.5 : -0.5) * dims[2];
      let t = x * cy + z * sy; z = -x * sy + z * cy; x = t;      // yaw (om y)
      t = y * cx - z * sx; z = y * sx + z * cx; y = t;           // pitch (om x)
      t = x * cz - y * sz; y = x * sz + y * cz; x = t;           // roll (om z)
      const zc = cam + z;                                         // z > 0 = verder weg
      pts.push({ x: x * cam / zc, y: -y * cam / zc, z });
    }
    return pts;
  }

  const gebied = (vlak) => vlak.w >= vlak.h * 1.15
    ? { x0: vlak.w * 0.04, x1: vlak.w * 0.60, y0: vlak.h * 0.10, y1: vlak.h * 0.92, score: { x: vlak.w * 0.80, y: vlak.h * 0.5 } }
    : { x0: vlak.w * 0.05, x1: vlak.w * 0.95, y0: vlak.h * 0.08, y1: vlak.h * 0.70, score: { x: vlak.w * 0.5, y: vlak.h * 0.86 } };

  const vlakArea = (v, ids) => {
    let s = 0;
    for (let i = 0; i < ids.length; i++) { const p = v[ids[i]], q = v[ids[(i + 1) % ids.length]]; s += p.x * q.y - q.x * p.y; }
    return Math.abs(s) / 2;
  };

  function bouw(n, rng, vlak) {
    const dims = [rng.tussen(0.8, 1.25), rng.tussen(0.8, 1.25), rng.tussen(0.8, 1.25)];
    for (let poging = 0; poging < 30; poging++) {
      const v = projecteer(n, rng, dims);
      // Voorvlak: per as de nabije kant, daarvan het vlak met de grootste oppervlakte.
      let front = null, besteArea = -1;
      for (let k = 0; k < 3; k++) {
        const kant = [0, 1].map((s) => { const ids = []; for (let i = 0; i < 8; i++) if (((i >> k) & 1) === s) ids.push(i); return ids; });
        const diep = kant.map((ids) => H.gemiddelde(ids.map((i) => v[i].z)));
        const ids = diep[0] <= diep[1] ? kant[0] : kant[1];
        const ordered = [ids[0], ids[1], ids[3], ids[2]];
        const a = vlakArea(v, ordered);
        if (a > besteArea) { besteArea = a; front = ids; }
      }
      let verborgen = 0;
      for (let i = 1; i < 8; i++) if (v[i].z > v[verborgen].z) verborgen = i;
      if (front.includes(verborgen)) continue;

      // Naar het vlak schalen en centreren.
      const g = gebied(vlak);
      const minx = Math.min(...v.map((p) => p.x)), maxx = Math.max(...v.map((p) => p.x));
      const miny = Math.min(...v.map((p) => p.y)), maxy = Math.max(...v.map((p) => p.y));
      const k = Math.min((g.x1 - g.x0) / (maxx - minx), (g.y1 - g.y0) / (maxy - miny));
      const cx = (g.x0 + g.x1) / 2, cy = (g.y0 + g.y1) / 2, mx = (minx + maxx) / 2, my = (miny + maxy) / 2;
      const punten = v.map((p) => ({ x: cx + (p.x - mx) * k, y: cy + (p.y - my) * k, z: p.z }));
      let D = 0;
      for (const a of front) for (const b of front) D = Math.max(D, H.afstand(punten[a], punten[b]));
      if (D < Math.min(vlak.w, vlak.h) * 0.12) continue;
      // Geen bijna-samenvallende hoekpunten (dan is een rib niet te tekenen).
      let kort = Infinity;
      for (const r of RIBBEN) kort = Math.min(kort, H.afstand(punten[r.a], punten[r.b]));
      if (kort < D * 0.18) continue;
      return { punten, front, verborgen, D };
    }
    return null;
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    let doos = null;
    while (!doos) doos = bouw(n, rng, vlak);
    const { punten, front, verborgen, D } = doos;

    const ribben = RIBBEN.map((r, i) => {
      const inFront = front.includes(r.a) && front.includes(r.b);
      const verb = r.a === verborgen || r.b === verborgen;
      return { i, a: r.a, b: r.b, as: r.as, inFront, verb, status: inFront ? 'gegeven' : 'weg' };
    });
    const zichtbaar = shuffle(ribben.filter((r) => !r.inFront && !r.verb), rng);
    const kandidaten = n.verborgen ? shuffle(ribben.filter((r) => !r.inFront), rng) : zichtbaar;
    // Op niveau 4/5 blijven er alleen zichtbare ribben als gegeven over.
    let mist = [];
    if (n.verborgen) {
      const gegeven = zichtbaar.slice(0, kandidaten.length - n.aantal);
      mist = kandidaten.filter((r) => !gegeven.includes(r));
    } else mist = kandidaten.slice(0, n.aantal);
    for (const r of ribben) if (!r.inFront) r.status = mist.includes(r) ? 'mist' : (r.verb ? 'verborgen' : 'gegeven');

    // Beginpunt: een hoekpunt dat al bestaat (voorvlak of eind van een gegeven rib); anders het nabije uiteinde.
    const bekend = new Set(front);
    for (const r of ribben) if (r.status === 'gegeven') { bekend.add(r.a); bekend.add(r.b); }
    for (const r of mist) {
      let s = r.a, e = r.b;
      const ak = bekend.has(r.a), bk = bekend.has(r.b);
      if (ak && !bk) { s = r.a; e = r.b; }
      else if (bk && !ak) { s = r.b; e = r.a; }
      else if (punten[r.a].z > punten[r.b].z) { s = r.b; e = r.a; }
      r.s = s; r.e = e;
    }
    return {
      niveau, punten, ribben, mist: mist.slice().sort((x, y) => x.i - y.i), front, D, gids: n.gids,
      gebied: gebied(vlak),
    };
  }

  const P = (o, i) => o.punten[i];
  const lijn = (ctx, a, b) => { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };

  function teken(ctx, o, vlak, info) {
    const m = Math.min(vlak.w, vlak.h);
    ctx.save();
    ctx.lineCap = 'round';
    if (o.gids) {
      // Dunne hulplijnen: de gegeven ribben doorgetrokken richting hun verdwijnpunt.
      const assen = new Set(o.mist.map((r) => r.as));
      ctx.strokeStyle = vlak.kleur.hulpZacht;
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      const L = Math.hypot(vlak.w, vlak.h);
      for (const r of o.ribben) {
        if (r.status !== 'gegeven' || !assen.has(r.as)) continue;
        const a = P(o, r.a), b = P(o, r.b), d = H.afstand(a, b);
        const ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
        lijn(ctx, { x: a.x - ux * L, y: a.y - uy * L }, { x: a.x + ux * L, y: a.y + uy * L });
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2.2;
    for (const r of o.ribben) if (r.status === 'gegeven' || r.inFront) lijn(ctx, P(o, r.a), P(o, r.b));
    // Beginpunten van de ontbrekende ribben.
    ctx.fillStyle = vlak.kleur.accent;
    const rad = Math.max(5, m * 0.012);
    const gezet = new Set();
    for (const r of o.mist) {
      if (gezet.has(r.s)) continue;
      gezet.add(r.s);
      ctx.beginPath(); ctx.arc(P(o, r.s).x, P(o, r.s).y, rad, 0, Math.PI * 2); ctx.fill();
    }
    // Teller.
    const n = Math.min(o.mist.length, (info && info.streken ? info.streken.length : 0));
    ctx.fillStyle = vlak.kleur.tekstZacht;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '600 ' + Math.round(H.clamp(m * 0.045, 16, 30)) + 'px sans-serif';
    ctx.fillText(n + '/' + o.mist.length, 14, 12);
    ctx.restore();
  }

  function isKlaar(o, streken) { return streken.length >= o.mist.length; }

  // ---------- nakijken ----------
  function hoekVan(v) { return Math.atan2(v.y, v.x); }
  function wikkel(h) { while (h > Math.PI / 2) h -= Math.PI; while (h <= -Math.PI / 2) h += Math.PI; return h; }

  function koppel(o, streken) {
    const paren = [];
    streken.forEach((st, si) => {
      const p0 = st.punten[0], pn = st.punten[st.punten.length - 1];
      o.mist.forEach((r, ri) => {
        const b = P(o, r.s), e = P(o, r.e);
        // Begin (en bij gedeelde hoekpunten ook het eind) bepaalt bij welke rib de streek hoort.
        const d = Math.min(H.afstand(p0, b) + 0.5 * H.afstand(pn, e), H.afstand(pn, b) + 0.5 * H.afstand(p0, e));
        paren.push({ si, ri, d });
      });
    });
    paren.sort((x, y) => x.d - y.d);
    const sGebruikt = new Set(), rGebruikt = new Set(), uit = [];
    for (const p of paren) {
      if (sGebruikt.has(p.si) || rGebruikt.has(p.ri)) continue;
      sGebruikt.add(p.si); rGebruikt.add(p.ri);
      let pts = streken[p.si].punten;
      const b = P(o, o.mist[p.ri].s);
      if (H.afstand(pts[pts.length - 1], b) < H.afstand(pts[0], b)) pts = pts.slice().reverse();
      uit.push({ ri: p.ri, rib: o.mist[p.ri], pts });
    }
    return uit;
  }

  function nakijken(o, streken) {
    const D = o.D;
    for (const st of streken) if (st.punten.length < 3 || H.lengte(st.punten) < D * 0.1) return { ongeldig: 'Te kort: trek elke rib in één lange streek.' };
    const gekoppeld = koppel(o, streken);
    const per = [];
    for (const g of gekoppeld) {
      const b = P(o, g.rib.s), e = P(o, g.rib.e);
      const p0 = g.pts[0], pn = g.pts[g.pts.length - 1];
      const L = H.afstand(p0, pn) || 1;
      const s = H.afstand(p0, b) / D;
      let dx = (pn.x - p0.x) / L, dy = (pn.y - p0.y) / L, r = 0;
      for (const p of g.pts) r = Math.max(r, Math.abs(H.lijnAfstand(p, p0, dx, dy)));
      r /= L;
      const ideaal = { x: e.x - b.x, y: e.y - b.y };
      const iL = Math.hypot(ideaal.x, ideaal.y);
      const cos = ((pn.x - p0.x) * ideaal.x + (pn.y - p0.y) * ideaal.y) / (L * iL);
      const alfa = Math.acos(H.clamp(cos, -1, 1)) / RAD;
      const eind = H.afstand(pn, e) / D;
      const sn = H.snelheden(g.pts);
      const mid = sn.slice(Math.floor(sn.length * 0.15), Math.ceil(sn.length * 0.85));
      const cv = mid.length >= 4 && H.gemiddelde(mid) > 0 ? H.sd(mid) / H.gemiddelde(mid) : 0;
      let score = 100 * (0.15 * H.lin(s, 0, 0.10) + 0.15 * H.lin(r, 0.01, 0.06) + 0.40 * H.lin(alfa, 2, 14) + 0.30 * H.lin(eind, 0.03, 0.20));
      if (cv > 0.6) score *= 0.9;
      per.push({ ri: g.ri, rib: g.rib, pts: g.pts, s, r, alfa, eind, cv, lenFout: L / iL - 1, score });
    }

    // Parallelcontrole per as: gegeven + getekende ribben die evenwijdig/convergerend horen te zijn.
    const getekend = new Map(per.map((x) => [x.rib.i, x]));
    let som = 0, aantal = 0, signed = 0;
    for (let k = 0; k < 3; k++) {
      const leden = [];
      let u = null, beste = -1;
      for (const r of o.ribben) {
        if (r.as !== k) continue;
        const d = getekend.get(r.i);
        if (!(d || r.status === 'gegeven' || r.inFront)) continue;
        const a = P(o, r.a), b = P(o, r.b);
        const nab = a.z <= b.z ? a : b, ver = a.z <= b.z ? b : a;
        const diep = Math.abs(a.z - b.z);
        if (diep > beste) { beste = diep; u = { x: ver.x - nab.x, y: ver.y - nab.y }; }
        leden.push({ r, d, a, b });
      }
      if (leden.length < 2) continue;
      const ul = Math.hypot(u.x, u.y); u = { x: u.x / ul, y: u.y / ul };
      const ori = (v) => (v.x * u.x + v.y * u.y < 0 ? { x: -v.x, y: -v.y } : v);
      for (const l of leden) {
        l.ideaal = ori({ x: P(o, l.r.b).x - P(o, l.r.a).x, y: P(o, l.r.b).y - P(o, l.r.a).y });
        l.mid = { x: (P(o, l.r.a).x + P(o, l.r.b).x) / 2, y: (P(o, l.r.a).y + P(o, l.r.b).y) / 2 };
        l.dir = l.d ? ori({ x: l.d.pts[l.d.pts.length - 1].x - l.d.pts[0].x, y: l.d.pts[l.d.pts.length - 1].y - l.d.pts[0].y }) : l.ideaal;
        if (l.d) l.mid = { x: (l.d.pts[0].x + l.d.pts[l.d.pts.length - 1].x) / 2, y: (l.d.pts[0].y + l.d.pts[l.d.pts.length - 1].y) / 2 };
      }
      // Uiteen/naar elkaar (langs u, weg van de kijker): positief = uiteen.
      const uiteen = (x, y, imid, jmid) => {
        const zijde = Math.sign(u.x * (jmid.y - imid.y) - u.y * (jmid.x - imid.x));
        return zijde * Math.atan2(x.x * y.y - x.y * y.x, x.x * y.x + x.y * y.y);
      };
      for (let i = 0; i < leden.length; i++) for (let j = i + 1; j < leden.length; j++) {
        if (!leden[i].d && !leden[j].d) continue;
        // De zijde bepalen we op de ideale middens (stabiel), de hoeken op de getekende richtingen.
        const im = { x: (P(o, leden[i].r.a).x + P(o, leden[i].r.b).x) / 2, y: (P(o, leden[i].r.a).y + P(o, leden[i].r.b).y) / 2 };
        const jm = { x: (P(o, leden[j].r.a).x + P(o, leden[j].r.b).x) / 2, y: (P(o, leden[j].r.a).y + P(o, leden[j].r.b).y) / 2 };
        const ex = uiteen(leden[i].dir, leden[j].dir, im, jm) - uiteen(leden[i].ideaal, leden[j].ideaal, im, jm);
        som += Math.abs(ex) / RAD; aantal++; signed += ex / RAD;
      }
    }
    const par = aantal ? som / aantal : 0;
    const parSigned = aantal ? signed / aantal : 0;
    const straf = 15 * (1 - H.lin(par, 3, 14));

    const totaal = per.reduce((t, x) => t + x.score, 0) / o.mist.length;
    const score = Math.round(H.clamp(totaal - straf, 0, 100));

    // Tips: de grootste afwijking t.o.v. haar drempel wint.
    const gem = (f) => H.gemiddelde(per.map(f));
    const lenGem = gem((x) => x.lenFout);
    const zelfde = per.filter((x) => Math.sign(x.lenFout) === Math.sign(lenGem)).length / Math.max(1, per.length);
    const onrust = per.filter((x) => x.cv > 0.6).length / Math.max(1, per.length);
    const kand = [
      [par / 6, parSigned < 0 ? 'Je ribben lopen te veel naar elkaar toe.' : 'Je ribben lopen te veel uit elkaar.'],
      [Math.max(gem((x) => x.r) / 0.03, onrust >= 0.4 ? 1.3 : 0), 'Trek in één vloeiende beweging vanuit je schouder.'],
      [zelfde >= 0.7 ? Math.abs(lenGem) / 0.12 : 0, lenGem > 0 ? 'Je ribben worden te lang; kijk vooruit naar het eindpunt.' : 'Je ribben worden te kort; kijk vooruit naar het eindpunt.'],
      [gem((x) => x.s) / 0.06, 'Begin precies op de hoek.'],
      [gem((x) => x.alfa) / 8, 'Let op de richting: laat elke rib meelopen met de evenwijdige ribben.'],
    ].filter((k) => k[0] > 1).sort((a, b) => b[0] - a[0]);
    const tip = kand.length ? kand[0][1] : (score >= 85 ? 'Mooi: rechte, stevige ribben.' : 'Kijk nog even naar de richting en het eindpunt.');

    return { score, tip, per, par, straf };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.5;
    for (const r of o.ribben) {
      if (r.status === 'mist') continue;
      ctx.setLineDash(r.status === 'verborgen' ? [4, 6] : []);
      lijn(ctx, P(o, r.a), P(o, r.b));
    }
    ctx.globalAlpha = 1;
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2.5;
    for (const r of o.mist) lijn(ctx, P(o, r.s), P(o, r.e));
    ctx.setLineDash([]);
    ctx.strokeStyle = vlak.kleur.fout;
    ctx.lineWidth = 3;
    for (const x of u.per) {
      if (x.score >= 60) continue;
      ctx.beginPath();
      x.pts.forEach((p, k) => (k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'dozen',
    naam: 'Dozen',
    uitleg: 'Maak de doos af: trek elke ontbrekende rib in één streek vanaf de stip.',
    fundament: 'Evenwijdige ribben convergeren naar dezelfde verdwijnpunten; trek rechte, zelfverzekerde lijnen.',
    meerdereStreken: true,
    stilNa: 0,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.gebied.score,
  });
})();

</script>
<script>
/* oefeningen/geheugen.js */
// Kijk, verberg, teken: een vorm even zien, die verdwijnt, en dan uit je hoofd natekenen.
(function () {
  const H = window.Hulp;
  const N = 64;                     // punten per vorm na herbemonstering
  const D2R = Math.PI / 180;

  // Per niveau: toontijd in ms en of het ankerkruis (startpunt) getoond wordt.
  const TOON = { 1: 4000, 2: 3000, 3: 3000, 4: 3000, 5: 2000 };
  const ANKER = { 1: true, 2: true, 3: false, 4: false, 5: false };

  // ---------- meetkunde ----------
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const hoekTussen = (a, b) => {
    const la = Math.hypot(a.x, a.y), lb = Math.hypot(b.x, b.y);
    if (!la || !lb) return 0;
    const c = H.clamp((a.x * b.x + a.y * b.y) / (la * lb), -1, 1);
    return Math.acos(c) / D2R;
  };

  // Herbemonster een gesloten lijn (laatste punt sluit terug naar het eerste) naar n punten.
  function resSluit(pts, n) {
    const p = [];
    for (const q of pts) if (!p.length || H.afstand(p[p.length - 1], q) > 1e-9) p.push({ x: q.x, y: q.y });
    if (p.length < 2) return Array.from({ length: n }, () => ({ x: p[0].x, y: p[0].y }));
    p.push({ x: p[0].x, y: p[0].y });
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + H.afstand(p[i - 1], p[i]));
    const L = cum[cum.length - 1];
    const uit = [];
    let j = 1;
    for (let k = 0; k < n; k++) {
      const s = L * k / n;
      while (j < p.length - 1 && cum[j] < s) j++;
      const d = cum[j] - cum[j - 1] || 1;
      const f = (s - cum[j - 1]) / d;
      uit.push({ x: p[j - 1].x + (p[j].x - p[j - 1].x) * f, y: p[j - 1].y + (p[j].y - p[j - 1].y) * f });
    }
    return uit;
  }

  const omtrekGesloten = (pts) => H.lengte(pts) + H.afstand(pts[pts.length - 1], pts[0]);

  function middelpunt(pts) {
    return { x: H.gemiddelde(pts.map((p) => p.x)), y: H.gemiddelde(pts.map((p) => p.y)) };
  }
  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  // Centroïde naar de oorsprong en schaal naar eenheids-RMS-straal.
  function normaliseer(pts) {
    const c = middelpunt(pts);
    const s = Math.sqrt(H.gemiddelde(pts.map((p) => (p.x - c.x) ** 2 + (p.y - c.y) ** 2))) || 1;
    return pts.map((p) => ({ x: (p.x - c.x) / s, y: (p.y - c.y) / s }));
  }

  // Hoekpunten: richtingswijziging > 40 graden in een venster van 5 punten (gesloten lijn).
  // De hoek zelf wordt gemeten uit de richtingen vlak voor en na de piek, zodat de meting
  // niet afhangt van waar de herbemonstering toevallig valt.
  function detecteerHoeken(P) {
    const n = P.length, at = (i) => P[((i % n) + n) % n];
    const w = [];
    for (let i = 0; i < n; i++) w.push(hoekTussen(sub(at(i), at(i - 2)), sub(at(i + 2), at(i))));
    const uit = [];
    for (let i = 0; i < n; i++) {
      if (w[i] <= 40) continue;
      let top = true;
      for (let d = -2; d <= 2 && top; d++) {
        if (!d) continue;
        const v = w[((i + d) % n + n) % n];
        if (d < 0 ? v >= w[i] : v > w[i]) top = false;
      }
      if (!top) continue;
      const draai = hoekTussen(sub(at(i - 2), at(i - 5)), sub(at(i + 5), at(i + 2)));
      uit.push({ i, x: at(i).x, y: at(i).y, draai });
    }
    return uit;
  }

  // ---------- vormen (rond de oorsprong, grootste afmeting = s) ----------
  const cirkel = (s) => Array.from({ length: 96 }, (_, k) => ({ x: s / 2 * Math.cos(k / 96 * 2 * Math.PI - Math.PI / 2), y: s / 2 * Math.sin(k / 96 * 2 * Math.PI - Math.PI / 2) }));
  const rechthoek = (w, h) => [{ x: -w / 2, y: -h / 2 }, { x: w / 2, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }];
  const driehoek = (b, h) => [{ x: 0, y: -h / 2 }, { x: b / 2, y: h / 2 }, { x: -b / 2, y: h / 2 }];
  function druppel(s) {
    const uit = [];
    for (let k = 0; k < 96; k++) {
      const t = k / 96 * 2 * Math.PI;
      uit.push({ x: Math.sin(t) * Math.sin(t / 2), y: -Math.cos(t) });
    }
    const b = bbox(uit), f = s / Math.max(b.w, b.h);
    return uit.map((p) => ({ x: p.x * f, y: p.y * f }));
  }
  function ster(s) {
    const uit = [];
    for (let k = 0; k < 10; k++) {
      const r = k % 2 ? 0.45 : 1, a = -Math.PI / 2 + k * Math.PI / 5;
      uit.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
    }
    const b = bbox(uit), f = s / Math.max(b.w, b.h);
    return uit.map((p) => ({ x: p.x * f, y: p.y * f }));
  }

  // Controle voor onregelmatige veelhoeken: elke hoek scherp genoeg en geen te korte zijde.
  function veelhoekGoed(v) {
    const n = v.length, omtrek = omtrekGesloten(v);
    for (let i = 0; i < n; i++) {
      const a = v[(i + n - 1) % n], b = v[i], c = v[(i + 1) % n];
      if (hoekTussen(sub(b, a), sub(c, b)) < 55) return false;
      if (H.afstand(b, c) < 0.1 * omtrek) return false;
    }
    return true;
  }
  function onregelmatig(s, rng) {
    for (let poging = 0; poging < 300; poging++) {
      const n = rng.kies([5, 6]), stap = 2 * Math.PI / n;
      const v = [];
      for (let k = 0; k < n; k++) {
        const a = k * stap + rng.tussen(-0.25, 0.25) * stap - Math.PI / 2, r = rng.tussen(0.55, 1);
        v.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
      }
      if (!veelhoekGoed(v)) continue;
      const b = bbox(v), f = s / Math.max(b.w, b.h);
      return v.map((p) => ({ x: p.x * f, y: p.y * f }));
    }
    const v = Array.from({ length: 5 }, (_, k) => ({ x: Math.cos(k * 2 * Math.PI / 5 - Math.PI / 2), y: Math.sin(k * 2 * Math.PI / 5 - Math.PI / 2) }));
    const b = bbox(v), f = s / Math.max(b.w, b.h);
    return v.map((p) => ({ x: p.x * f, y: p.y * f }));
  }

  // Basisvorm kiezen: s = grootste afmeting.
  function basis(soort, s, rng) {
    switch (soort) {
      case 'cirkel': return { naam: 'cirkel', pts: cirkel(s) };
      case 'vierkant': return { naam: 'vierkant', pts: rechthoek(s, s) };
      case 'driehoek': return { naam: 'driehoek', pts: driehoek(s, s * 0.87) };
      case 'rechthoek2:1': return rng.kies([0, 1]) ? { naam: 'rechthoek', pts: rechthoek(s, s / 2) } : { naam: 'rechthoek', pts: rechthoek(s / 2, s) };
      case 'rechthoek1:3': return rng.kies([0, 1]) ? { naam: 'rechthoek', pts: rechthoek(s, s / 3) } : { naam: 'rechthoek', pts: rechthoek(s / 3, s) };
      case 'driehoek2:1': return rng.kies([0, 1]) ? { naam: 'driehoek', pts: driehoek(s, s / 2) } : { naam: 'driehoek', pts: driehoek(s / 2.2, s) };
      case 'driehoek1:3': return { naam: 'driehoek', pts: driehoek(s / 3, s) };
      case 'onregelmatig': return { naam: 'veelhoek', pts: onregelmatig(s, rng) };
      case 'druppel': return { naam: 'druppel', pts: druppel(s) };
      case 'ster': return { naam: 'ster', pts: ster(s) };
    }
    throw new Error('onbekende vorm ' + soort);
  }

  // Zet een vorm op een plek (bbox-midden op cx, cy) en bereken alles wat nakijken nodig heeft.
  function maakVorm(pts, cx, cy, naam) {
    const b = bbox(pts), mx = (b.x0 + b.x1) / 2, my = (b.y0 + b.y1) / 2;
    const dicht = pts.map((p) => ({ x: p.x - mx + cx, y: p.y - my + cy }));
    const p64 = resSluit(dicht, N);
    const c = middelpunt(p64);
    return { naam, dicht, p64, c, bb: bbox(p64), norm: normaliseer(p64), hoeken: detecteerHoeken(normaliseer(p64)), omtrek: omtrekGesloten(dicht) };
  }

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const kader = { x: vlak.w * 0.03, y: vlak.h * 0.05, w: vlak.w * 0.94, h: vlak.h * 0.66 };
    const u = Math.min(kader.w, kader.h);
    const mid = { x: kader.x + kader.w / 2, y: kader.y + kader.h / 2 };
    const lang = kader.w >= kader.h ? 'x' : 'y';
    const vormen = [];

    // Positie langs de lange as (fractie) en de korte as (jitter).
    const op = (t, jit) => {
      const j = rng.tussen(-jit, jit);
      return lang === 'x'
        ? { x: kader.x + kader.w * t, y: mid.y + j * kader.h }
        : { x: mid.x + j * kader.w, y: kader.y + kader.h * t };
    };

    if (niveau === 1) {
      const soort = rng.kies(['cirkel', 'vierkant', 'driehoek']);
      const v = basis(soort, rng.tussen(0.5, 0.62) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.06, 0.06) * u, mid.y + rng.tussen(-0.05, 0.05) * u, v.naam));
    } else if (niveau === 2) {
      const soort = rng.kies(['rechthoek2:1', 'rechthoek1:3', 'driehoek2:1', 'driehoek1:3']);
      const v = basis(soort, rng.tussen(0.66, 0.8) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.06, 0.06) * u, mid.y + rng.tussen(-0.04, 0.04) * u, v.naam));
    } else if (niveau === 3) {
      const soort = rng.kies(['onregelmatig', 'onregelmatig', 'druppel', 'ster']);
      const v = basis(soort, rng.tussen(0.6, 0.76) * u, rng);
      vormen.push(maakVorm(v.pts, mid.x + rng.tussen(-0.05, 0.05) * u, mid.y + rng.tussen(-0.04, 0.04) * u, v.naam));
    } else if (niveau === 4) {
      const pool = ['cirkel', 'vierkant', 'driehoek', 'rechthoek2:1'];
      const a = rng.kies(pool);
      let b = rng.kies(pool);
      if (b === a) b = pool[(pool.indexOf(a) + 1 + Math.floor(rng() * 3)) % pool.length];
      const pa = op(rng.tussen(0.25, 0.3), 0.1), pb = op(rng.tussen(0.7, 0.75), 0.1);
      for (const [soort, p] of [[a, pa], [b, pb]]) {
        const v = basis(soort, rng.tussen(0.28, 0.4) * u, rng);
        vormen.push(maakVorm(v.pts, p.x, p.y, v.naam));
      }
    } else if (rng() < 0.5) {
      // Huisje: muur (vierkant), dak (driehoek) en deur (rechthoek).
      const w = rng.tussen(0.42, 0.52) * u, dakH = w * 0.45, dh = w * 0.5, dw = w * 0.24;
      const totH = w + dakH, cx = mid.x + rng.tussen(-0.05, 0.05) * u, top = mid.y - totH / 2 + rng.tussen(-0.03, 0.03) * u;
      vormen.push(maakVorm(rechthoek(w, w), cx, top + dakH + w / 2, 'muur'));
      vormen.push(maakVorm(driehoek(w * 1.18, dakH), cx, top + dakH / 2, 'dak'));
      vormen.push(maakVorm(rechthoek(dw, dh), cx, top + dakH + w - dh / 2, 'deur'));
    } else {
      const pool = ['cirkel', 'vierkant', 'driehoek', 'rechthoek2:1'];
      const ts = [0.2, 0.5, 0.8];
      for (let k = 0; k < 3; k++) {
        const p = op(ts[k] + rng.tussen(-0.02, 0.02), 0.1);
        const v = basis(rng.kies(pool), rng.tussen(0.22, 0.27) * u, rng);
        vormen.push(maakVorm(v.pts, p.x, p.y, v.naam));
      }
    }

    // Het score-blok komt in de lege strook onder het kader.
    const plek = { x: vlak.w / 2, y: kader.y + kader.h + (vlak.h - kader.y - kader.h) * 0.42 };
    return {
      niveau, kader, u, vormen, plek,
      verbergNa: TOON[niveau],
      anker: ANKER[niveau] ? { x: vormen[0].dicht[0].x, y: vormen[0].dicht[0].y } : null,
      animeer: true,
    };
  }

  // ---------- tekenen ----------
  function pad(ctx, pts) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
  }

  function teken(ctx, o, vlak, info) {
    const k = o.kader, kl = vlak.kleur;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = kl.hulpZacht;
    ctx.lineWidth = 2;
    ctx.strokeRect(k.x, k.y, k.w, k.h);
    ctx.setLineDash([]);

    if (!info.verborgen) {
      o.animeer = true;
      ctx.strokeStyle = kl.hulp;
      ctx.lineWidth = 3;
      for (const v of o.vormen) { pad(ctx, v.dicht); ctx.stroke(); }
      // Aftelbalk boven het kader.
      const f = H.clamp(1 - info.sinds / o.verbergNa, 0, 1);
      const bw = k.w * 0.5, bx = k.x + (k.w - bw) / 2, by = Math.max(4, k.y * 0.4);
      ctx.lineWidth = 5;
      ctx.strokeStyle = kl.hulpZacht;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();
      if (f > 0) {
        ctx.strokeStyle = kl.accent;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw * f, by); ctx.stroke();
      }
    } else {
      o.animeer = false;
    }

    if (o.anker) {
      const s = 0.025 * o.u;
      ctx.strokeStyle = kl.accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(o.anker.x - s, o.anker.y); ctx.lineTo(o.anker.x + s, o.anker.y);
      ctx.moveTo(o.anker.x, o.anker.y - s); ctx.lineTo(o.anker.x, o.anker.y + s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- klaar? ----------
  function strekenGesloten(streek, o) {
    const p = streek.punten;
    if (p.length < 8) return false;
    const b = bbox(p), diag = Math.hypot(b.w, b.h);
    const kleinste = Math.min(...o.vormen.map((v) => Math.hypot(v.bb.w, v.bb.h)));
    if (diag < 0.5 * kleinste) return false;
    return H.afstand(p[0], p[p.length - 1]) <= 0.08 * diag;
  }

  function wijsToe(o, streken) {
    const groepen = o.vormen.map(() => []);
    for (const s of streken) {
      const c = middelpunt(H.herbemonster(s.punten, 4));
      let best = 0, bd = Infinity;
      o.vormen.forEach((v, i) => { const d = H.afstand(c, v.c); if (d < bd) { bd = d; best = i; } });
      groepen[best].push(s);
    }
    return groepen;
  }

  function isKlaar(o, streken) {
    if (!streken.length || !strekenGesloten(streken[streken.length - 1], o)) return false;
    const groepen = wijsToe(o, streken);
    return groepen.every((g) => g.some((s) => strekenGesloten(s, o)));
  }

  // ---------- nakijken ----------
  function vergelijkVorm(v, groep, o) {
    const kd = Math.hypot(o.kader.w, o.kader.h);
    const gesorteerd = groep.slice().sort((a, b) => a.punten[0].t - b.punten[0].t);
    const ruw = [];
    for (const s of gesorteerd) for (const p of s.punten) ruw.push(p);
    const D = resSluit(ruw, N);
    const dc = middelpunt(D), bD = bbox(D);

    const dx = dc.x - v.c.x, dy = dc.y - v.c.y;
    const pos = H.lin(Math.hypot(dx, dy) / kd, 0.01, 0.15);

    const r = Math.sqrt(Math.max(bD.w * bD.h, 1) / Math.max(v.bb.w * v.bb.h, 1));
    const maat = H.lin(Math.abs(Math.log(r)), 0.03, 0.5);
    const q = (Math.max(bD.w, 1) / Math.max(bD.h, 1)) / (v.bb.w / v.bb.h);

    const Dn = normaliseer(D);
    let best = Infinity;
    for (const dir of [1, -1]) {
      for (let k = 0; k < N; k++) {
        let som = 0;
        for (let i = 0; i < N; i++) {
          const a = Dn[(((dir * i + k) % N) + N) % N], b = v.norm[i];
          som += Math.hypot(a.x - b.x, a.y - b.y);
        }
        if (som / N < best) best = som / N;
      }
    }
    const vorm = H.lin(best, 0.02, 0.12);

    let hoek = null;
    if (v.hoeken.length) {
      const gez = detecteerHoeken(Dn);
      let tot = 0;
      for (const e of v.hoeken) {
        let bk = null, bd = 0.4;
        for (const g of gez) { const d = Math.hypot(g.x - e.x, g.y - e.y); if (d < bd) { bd = d; bk = g; } }
        tot += bk ? H.lin(Math.abs(bk.draai - e.draai), 3, 25) : 0;
      }
      hoek = tot / v.hoeken.length;
    }

    const w = hoek === null ? [0.30, 0.25, 0.45, 0] : [0.25, 0.20, 0.35, 0.20];
    const som = w[0] * pos + w[1] * maat + w[2] * vorm + w[3] * (hoek || 0);
    // Een vorm die op de verkeerde plek of maat staat kan niet hoog scoren, ook al klopt de vorm.
    const score = 100 * som * (0.55 + 0.45 * Math.min(pos, maat));

    // Grote afwijkingen voor de uitslag.
    const grens = 0.1 * Math.hypot(v.bb.w, v.bb.h), dichtGesloten = v.dicht.concat([v.dicht[0]]);
    const fouten = D.filter((p) => H.polyAfstand(p, dichtGesloten) > grens).map((p) => ({ x: p.x, y: p.y }));

    return { score, pos, maat, vorm, hoek, r, q, dx, dy, fouten, ontbreekt: false };
  }

  function nakijken(o, streken) {
    const bruikbaar = streken.filter((s) => s.punten.length >= 2);
    const kleinsteOmtrek = Math.min(...o.vormen.map((v) => v.omtrek));
    const totaal = bruikbaar.reduce((s, st) => s + H.lengte(st.punten), 0);
    if (bruikbaar.length < 1 || totaal < 0.4 * kleinsteOmtrek) return { ongeldig: 'Te kort, teken de hele vorm opnieuw.' };

    const groepen = wijsToe(o, bruikbaar);
    const res = o.vormen.map((v, i) => groepen[i].length && groepen[i].reduce((s, st) => s + H.lengte(st.punten), 0) > 0.2 * v.omtrek
      ? vergelijkVorm(v, groepen[i], o)
      : { score: 0, ontbreekt: true, fouten: [] });
    const score = Math.round(H.clamp(H.gemiddelde(res.map((x) => x.score)), 0, 100));
    return { score, tip: kiesTip(res, o, score), res, fouten: [].concat(...res.map((x) => x.fouten)) };
  }

  function kiesTip(res, o, score) {
    const slecht = res.reduce((a, b) => (b.score < a.score ? b : a));
    if (slecht.ontbreekt) return o.vormen.length > 1 ? 'Een vorm ontbreekt. Onthoud alle ' + o.vormen.length + ' vormen.' : 'Teken de hele vorm.';
    const kand = [];
    const rel = Math.max(Math.abs(slecht.dx) / o.kader.w, Math.abs(slecht.dy) / o.kader.h);
    if (slecht.r < 0.8 || slecht.r > 1.25) kand.push([(1 - slecht.maat) * 0.2 + 0.3, slecht.r < 1 ? 'Te klein: teken groter, de vorm was ruimer.' : 'Te groot: teken kleiner, de vorm was compacter.']);
    if (rel > 0.06) {
      const horiz = Math.abs(slecht.dx) / o.kader.w >= Math.abs(slecht.dy) / o.kader.h;
      const tekst = horiz
        ? (slecht.dx < 0 ? 'Te ver naar links: begin verder naar rechts.' : 'Te ver naar rechts: begin verder naar links.')
        : (slecht.dy < 0 ? 'Te ver naar boven: teken lager.' : 'Te ver naar onder: teken hoger.');
      kand.push([(1 - slecht.pos) * 0.25 + 0.3, tekst]);
    }
    if (slecht.q < 0.85 || slecht.q > 1.18) kand.push([Math.min(1, Math.abs(Math.log(slecht.q)) / 0.5) * 0.35 + 0.2, 'Verhouding scheef: de vorm was ' + (slecht.q < 1 ? 'breder' : 'hoger') + ' dan jij tekende.']);
    if (slecht.hoek !== null && slecht.hoek < 0.6) kand.push([(1 - slecht.hoek) * 0.2 + 0.25, 'Hoeken te rond of ontbrekend: zet scherp om in de hoek.']);
    if (kand.length) { kand.sort((a, b) => b[0] - a[0]); return kand[0][1]; }
    if (score >= 85) return slecht.hoek !== null ? 'Sterk, je hoekpunten zaten erop.' : 'Sterk, plek en maat kloppen.';
    return 'Vorm wijkt af: let op de verhoudingen tussen de zijden.';
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    for (const v of o.vormen) { pad(ctx, v.dicht); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.fillStyle = vlak.kleur.fout;
    for (const p of (u.fouten || [])) { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  Tekentrainer.registreer({
    id: 'geheugen',
    naam: 'Kijk, verberg, teken',
    uitleg: 'Onthoud de vorm voordat hij verdwijnt en teken hem op dezelfde plek na.',
    fundament: 'Observatie en visueel geheugen: plek, maat, verhoudingen en hoeken van een vorm inschatten.',
    meerdereStreken: true,
    stilNa: 2500,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => o.plek,
  });
})();

</script>
<script>
(function () {
  const H = window.Hulp;
  const $ = (id) => document.getElementById(id);
  const doek = $('doek'), ctx = doek.getContext('2d');

  // ---------- opslag (alleen gemak op dit apparaat) ----------
  const opslag = {
    lees(k, d) { try { const v = localStorage.getItem('tt.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    schrijf(k, v) { try { localStorage.setItem('tt.' + k, JSON.stringify(v)); } catch (e) { /* geen opslag */ } },
  };
  const stand = (id) => opslag.lees('stand.' + id, { niveau: 1, scores: [], sindsWissel: 0, beste: 0 });

  // ---------- thema-kleuren voor de canvas ----------
  function kleuren() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    return { hulp: v('--guide'), hulpZacht: v('--guide-soft'), accent: v('--accent'), goed: v('--good'),
      fout: v('--bad'), tekst: v('--fg'), tekstZacht: v('--fg-soft'), inkt: v('--ink'), papier: v('--paper'), waarschuwing: v('--warn') };
  }

  // ---------- menu ----------
  const GROEPEN = [
    { naam: 'Lijnen & vormen', ids: ['lijnen', 'curves', 'slingerlijn', 'cirkels', 'ellipsen'] },
    { naam: 'Meten & richting', ids: ['hoeken', 'proporties', 'perspectief', 'dozen'] },
    { naam: 'Oog & hand', ids: ['arcering', 'geheugen'] },
  ];
  const SVGNS = 'http://www.w3.org/2000/svg';
  const ICONEN = {
    lijnen: 'M4 24 L26 6',
    curves: 'M3 22 C9 2 15 2 16 15 S24 28 27 8',
    slingerlijn: 'M3 15 C6 6 9 6 12 15 S18 24 21 15 S25 6 28 15',
    cirkels: 'M15 4a11 11 0 1 0 .01 0',
    ellipsen: 'M15 7 C25 7 28 12 28 15 S25 23 15 23 S2 18 2 15 S5 7 15 7',
    hoeken: 'M5 25 L5 5 M5 25 L26 25 M5 17 A8 8 0 0 1 13 25',
    proporties: 'M5 6 H25 M5 24 H25 M15 6 V24 M10 12 H20',
    perspectief: 'M3 25 L15 8 L27 25 M9 25 L15 8 L21 25 M3 25 H27',
    dozen: 'M5 11 L15 6 L25 11 L25 22 L15 27 L5 22 Z M5 11 L15 16 L25 11 M15 16 V27',
    arcering: 'M6 24 L14 6 M12 24 L20 6 M18 24 L26 6 M4 17 L9 6',
    geheugen: 'M4 15 C9 7 21 7 26 15 C21 23 9 23 4 15 M15 11a4 4 0 1 0 .01 0',
  };
  function ikoon(id) {
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 30 30');
    svg.setAttribute('class', 'ico');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.8');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', ICONEN[id] || 'M5 15 H25');
    svg.appendChild(p);
    return svg;
  }
  function kaart(o) {
    const s = stand(o.id);
    const laatste = s.scores.slice(-10);
    const b = document.createElement('button');
    b.className = 'kaart';
    b.type = 'button';
    const naam = document.createElement('b'); naam.textContent = o.naam;
    const fund = document.createElement('span'); fund.className = 'fund'; fund.textContent = o.fundament;
    const onder = document.createElement('span'); onder.className = 'onder';
    const niv = document.createElement('span'); niv.className = 'niv';
    niv.setAttribute('role', 'img'); niv.setAttribute('aria-label', 'Niveau ' + s.niveau + ' van 5');
    for (let i = 1; i <= 5; i++) { const t = document.createElement('i'); if (i <= s.niveau) t.className = 'aan'; niv.appendChild(t); }
    const cijfers = document.createElement('span'); cijfers.className = 'cijfers';
    if (laatste.length) { cijfers.innerHTML = '<em>gem.</em> ' + Math.round(H.gemiddelde(laatste)) + ' &middot; <em>beste</em> ' + s.beste; }
    else { cijfers.textContent = 'nog niet geoefend'; cijfers.style.color = 'var(--fg-soft)'; }
    onder.append(niv, cijfers);
    b.append(naam, ikoon(o.id), fund, onder);
    b.addEventListener('click', () => start(o));
    return b;
  }
  function toonMenu() {
    huidig = null;
    $('oefening').hidden = true;
    $('menu').hidden = false;
    const lijst = $('lijst');
    lijst.innerHTML = '';
    const alle = Tekentrainer.oefeningen.slice();
    const gebruikt = new Set();
    const groepen = GROEPEN.map((g) => ({ naam: g.naam, items: g.ids.map((id) => alle.find((o) => o.id === id)).filter(Boolean) }));
    groepen.forEach((g) => g.items.forEach((o) => gebruikt.add(o.id)));
    const rest = alle.filter((o) => !gebruikt.has(o.id));
    if (rest.length) groepen.push({ naam: 'Overig', items: rest });
    groepen.forEach((g, gi) => {
      if (!g.items.length) return;
      const sec = document.createElement('section');
      sec.className = 'groep';
      const h = document.createElement('h2');
      h.textContent = String(gi + 1).padStart(2, '0') + ' ' + g.naam;
      const rij = document.createElement('div');
      rij.className = 'rij';
      g.items.forEach((o) => rij.appendChild(kaart(o)));
      sec.append(h, rij);
      lijst.appendChild(sec);
    });
  }
  $('vingerAan').checked = opslag.lees('vinger', false);
  $('vingerAan').addEventListener('change', (e) => opslag.schrijf('vinger', e.target.checked));

  // ---------- oefening ----------
  let huidig = null;   // { o, s, opgave, streken, fase, start, uitslag, actief }
  let vlak = { w: 1, h: 1, pxPerMm: 96 / 25.4, kleur: kleuren() };
  const rng = H.maakRng(Date.now());

  function start(o) {
    $('menu').hidden = true;
    $('oefening').hidden = false;
    $('oTitel').textContent = o.naam;
    $('oUitleg').textContent = o.uitleg;
    $('oUitleg').classList.remove('open');
    $('klaar').hidden = !o.meerdereStreken;
    huidig = { o, s: stand(o.id), streken: [], fase: 'tekenen' };
    maat();
    nieuweOpgave();
  }

  function nieuweOpgave() {
    const h = huidig;
    clearTimeout(h.verbergTimer);
    h.streken = [];
    h.actief = null;
    h.uitslag = null;
    h.fase = 'tekenen';
    h.verborgen = false;
    h.opgave = h.o.nieuweOpgave(h.s.niveau, rng, vlak);
    window.__tt = h;
    h.start = performance.now();
    if (h.opgave.verbergNa) h.verbergTimer = setTimeout(() => { h.verborgen = true; teken(); }, h.opgave.verbergNa);
    werkStand();
    teken();
  }

  function werkStand() {
    const s = huidig.s, laatste = s.scores.slice(-5);
    $('oStand').innerHTML = '<b>Niv. ' + s.niveau + '</b>' + (laatste.length ? 'gem. ' + Math.round(H.gemiddelde(laatste)) : 'nieuw');
  }

  function zetNiveau(n, tekst) {
    const s = huidig.s;
    n = H.clamp(n, 1, 5);
    if (n === s.niveau) return;
    s.niveau = n;
    s.sindsWissel = 0;
    opslag.schrijf('stand.' + huidig.o.id, s);
    melding(tekst || 'Niveau ' + n);
    werkStand();
  }
  $('nivMin').addEventListener('click', () => { zetNiveau(huidig.s.niveau - 1); nieuweOpgave(); });
  $('nivPlus').addEventListener('click', () => { zetNiveau(huidig.s.niveau + 1); nieuweOpgave(); });
  $('oUitleg').addEventListener('click', (e) => e.currentTarget.classList.toggle('open'));
  $('terug').addEventListener('click', toonMenu);
  $('volScherm').addEventListener('click', () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  });

  let meldTimer = 0;
  function melding(t) {
    const m = $('melding');
    m.textContent = t;
    m.classList.add('zicht');
    clearTimeout(meldTimer);
    meldTimer = setTimeout(() => m.classList.remove('zicht'), 1600);
  }

  function nakijken() {
    const h = huidig;
    if (!h || h.fase !== 'tekenen' || !h.streken.length) return;
    let u;
    try { u = h.o.nakijken(h.opgave, h.streken, vlak); }
    catch (e) { console.error(e); u = { ongeldig: 'Er ging iets mis bij het nakijken.' }; }
    if (u && !u.ongeldig && !Number.isFinite(u.score)) { console.error('Ongeldige score', u); u = { ongeldig: 'Er ging iets mis bij het nakijken.' }; }
    if (!u || u.ongeldig) {
      melding((u && u.ongeldig) || 'Probeer opnieuw');
      h.streken = [];
      teken();
      return;
    }
    u.score = Math.round(H.clamp(u.score, 0, 100));
    h.uitslag = u;
    h.fase = 'uitslag';
    h.uitslagT = performance.now();

    const s = h.s;
    s.scores.push(u.score);
    if (s.scores.length > 200) s.scores.shift();
    s.sindsWissel++;
    s.beste = Math.max(s.beste || 0, u.score);
    const l5 = s.scores.slice(-5), l3 = s.scores.slice(-3);
    let wissel = 0;
    if (s.sindsWissel >= 5 && H.gemiddelde(l5) >= 80 && s.niveau < 5) wissel = 1;
    else if (s.sindsWissel >= 3 && l3.every((x) => x < 45) && s.niveau > 1) wissel = -1;
    opslag.schrijf('stand.' + h.o.id, s);
    teken();
    setTimeout(() => {
      if (huidig !== h) return;
      if (wissel) zetNiveau(s.niveau + wissel, wissel > 0 ? 'Niveau omhoog: ' + (s.niveau + 1) : 'Even een niveau terug: ' + (s.niveau - 1));
      nieuweOpgave();
    }, h.o.toonUitslag || 1400);
    werkStand();
  }
  $('klaar').addEventListener('click', nakijken);

  // ---------- tekenen ----------
  function maat() {
    const r = $('vlak').getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    doek.width = Math.round(r.width * dpr);
    doek.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vlak = { w: r.width, h: r.height, pxPerMm: 96 / 25.4, kleur: kleuren() };
  }

  function tekenStreek(st) {
    const p = st.punten;
    ctx.strokeStyle = vlak.kleur.inkt;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (p.length === 1) { ctx.fillStyle = vlak.kleur.inkt; ctx.beginPath(); ctx.arc(p[0].x, p[0].y, 1.5, 0, 7); ctx.fill(); return; }
    for (let i = 1; i < p.length; i++) {
      ctx.lineWidth = 1.2 + 2.6 * ((p[i].p || 0.5) + (p[i - 1].p || 0.5)) / 2;
      ctx.beginPath();
      ctx.moveTo(p[i - 1].x, p[i - 1].y);
      ctx.lineTo(p[i].x, p[i].y);
      ctx.stroke();
    }
  }

  function rondRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function breek(tekst, maxB) {
    const regels = []; let r = '';
    for (const w of String(tekst).split(/\s+/)) {
      const t = r ? r + ' ' + w : w;
      if (r && ctx.measureText(t).width > maxB) { regels.push(r); r = w; } else r = t;
    }
    if (r) regels.push(r);
    return regels.slice(0, 3);
  }
  function tekenScore(u) {
    const plek = huidig.o.scorePlek ? huidig.o.scorePlek(huidig.opgave, vlak) : { x: vlak.w / 2, y: vlak.h / 2 };
    const sterk = u.score >= 80, matig = u.score >= 60;
    const k = sterk ? vlak.kleur.goed : matig ? vlak.kleur.waarschuwing : vlak.kleur.fout;
    const woord = sterk ? 'Sterk' : matig ? 'Bijna' : 'Oefen door';
    const fam = getComputedStyle(document.body).fontFamily;
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono') || fam;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t = reduced ? 1 : H.clamp((performance.now() - (huidig.uitslagT || 0)) / 380, 0, 1);
    const e = 1 - Math.pow(1 - t, 3);
    const grootte = Math.round(H.clamp(Math.min(vlak.w, vlak.h) * 0.13, 38, 84));
    const tf = Math.round(H.clamp(grootte * 0.3, 13, 20));
    const maxB = Math.min(vlak.w * 0.84, 340);
    ctx.save();
    ctx.font = '500 ' + tf + 'px ' + fam;
    const regels = u.tip ? breek(u.tip, maxB - 28) : [];
    const lh = tf * 1.3;
    const cw = Math.max(regels.reduce((m, r) => Math.max(m, ctx.measureText(r).width), 0) + 28, grootte * 2.2, 120);
    const ch = 8 + grootte + 20 + (regels.length ? regels.length * lh + 14 : 0) + 6;
    const cx = H.clamp(plek.x, cw / 2 + 8, Math.max(cw / 2 + 8, vlak.w - cw / 2 - 8));
    const cy = H.clamp(plek.y, ch / 2 + 8, Math.max(ch / 2 + 8, vlak.h - ch / 2 - 8));
    ctx.translate(cx, cy + (1 - e) * 10);
    ctx.scale(0.92 + 0.08 * e, 0.92 + 0.08 * e);
    rondRect(-cw / 2, -ch / 2, cw, ch, 12);
    ctx.globalAlpha = 0.94 * e; ctx.fillStyle = vlak.kleur.papier; ctx.fill();
    ctx.globalAlpha = e; ctx.lineWidth = 2.5; ctx.strokeStyle = k; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let y = -ch / 2 + 8 + grootte / 2;
    ctx.font = '800 ' + grootte + 'px ' + fam;
    ctx.fillStyle = k;
    ctx.fillText(String(u.score), 0, y);
    y += grootte / 2 + 12;
    ctx.font = '500 ' + Math.max(11, Math.round(tf * 0.8)) + 'px ' + mono;
    ctx.fillStyle = vlak.kleur.tekstZacht;
    ctx.fillText(woord.toUpperCase(), 0, y);
    if (regels.length) {
      y += 10 + lh / 2 + 4;
      ctx.font = '500 ' + tf + 'px ' + fam;
      ctx.fillStyle = vlak.kleur.tekst;
      regels.forEach((r, i) => ctx.fillText(r, 0, y + i * lh));
    }
    ctx.restore();
  }

  function teken() {
    const h = huidig;
    if (!h) return;
    ctx.clearRect(0, 0, vlak.w, vlak.h);
    const info = { nu: performance.now(), sinds: performance.now() - h.start, verborgen: h.verborgen, streken: h.streken };
    try { h.o.teken(ctx, h.opgave, vlak, info); } catch (e) { console.error(e); }
    for (const st of h.streken) tekenStreek(st);
    if (h.actief) tekenStreek(h.actief);
    if (h.fase === 'uitslag' && h.uitslag) {
      try { h.o.tekenUitslag && h.o.tekenUitslag(ctx, h.opgave, h.streken, h.uitslag, vlak); } catch (e) { console.error(e); }
      tekenScore(h.uitslag);
    }
  }

  (function lus() {
    if (huidig && huidig.opgave && ((huidig.opgave.animeer && huidig.fase === 'tekenen') || (huidig.fase === 'uitslag' && performance.now() - (huidig.uitslagT || 0) < 450))) teken();
    requestAnimationFrame(lus);
  })();

  // ---------- invoer ----------
  const magTekenen = (e) => e.pointerType === 'pen' || $('vingerAan').checked;
  let stilTimer = 0;

  function punt(e) {
    const r = doek.getBoundingClientRect();
    const p = e.pointerType === 'pen' ? e.pressure : 0.5;
    return { x: e.clientX - r.left, y: e.clientY - r.top, p, t: e.timeStamp };
  }

  doek.addEventListener('pointerdown', (e) => {
    if (!huidig || huidig.fase !== 'tekenen' || !magTekenen(e)) return;
    e.preventDefault();
    clearTimeout(stilTimer);
    doek.setPointerCapture(e.pointerId);
    huidig.actief = { punten: [punt(e)], id: e.pointerId };
    teken();
  });
  doek.addEventListener('pointermove', (e) => {
    const a = huidig && huidig.actief;
    if (!a || a.id !== e.pointerId) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) a.punten.push(punt(ev));
    teken();
  });
  function einde(e) {
    const h = huidig, a = h && h.actief;
    if (!a || a.id !== e.pointerId) return;
    a.punten.push(punt(e));
    h.actief = null;
    h.streken.push({ punten: a.punten });
    teken();
    const klaar = h.o.isKlaar ? h.o.isKlaar(h.opgave, h.streken) : !h.o.meerdereStreken;
    if (klaar) nakijken();
    else if (h.o.stilNa) stilTimer = setTimeout(nakijken, h.o.stilNa);
  }
  doek.addEventListener('pointerup', einde);
  doek.addEventListener('pointercancel', einde);
  window.addEventListener('contextmenu', (e) => { if (huidig) e.preventDefault(); });

  window.addEventListener('resize', () => { if (huidig) { maat(); nieuweOpgave(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { vlak.kleur = kleuren(); teken(); });

  toonMenu();
})();
</script>
