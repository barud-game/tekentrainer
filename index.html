<style>
  /* Opzet: menu als schetsboek-index (groepen, kaarten met niveau-streepjes);

  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #101317; --paper: #1a1e24; --fg: #e9ecef; --fg-soft: #9ba5b1; --line: #343b44;

    --kaart: #171b20; --kaart-rand: #3a424c; --knop-tekst: #101317; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #101317; --paper: #1a1e24; --fg: #e9ecef; --fg-soft: #9ba5b1; --line: #343b44;
    --accent: #f08cb4; --good: #5db8f5; --warn: #f0c040; --bad: #ff8a4a;
    --guide: #7d8997; --guide-soft: #38414c; --ink: #f5f6f8;
    --kaart: #171b20; --kaart-rand: #3a424c; --knop-tekst: #101317; color-scheme: dark; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- menu ---- */
  #menu { max-width: 820px; margin: 0 auto; min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(36px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #menu header { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; margin-bottom: 22px; }
  #menu .kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); margin: 0 0 4px; }
  #menu h1 { font-size: 1.75rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  #menu p.sub { color: var(--fg-soft); margin: 0; font-size: 0.95rem; line-height: 1.4; max-width: 46ch; }
  .groep { margin: 0 0 24px; }
  .groep h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 0.8rem; font-weight: 500;
    font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); }
  .groep h2::after { content: ""; flex: 1; border-top: 1px dashed var(--kaart-rand); transform: translateY(-3px); }
  .groep h2 small { font-size: inherit; color: var(--fg-soft); order: 3; }
  .groep .rij { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .kaart { position: relative; text-align: left; background: var(--kaart); border: 1px solid var(--kaart-rand); border-radius: 4px 14px 4px 14px;
    padding: 12px 14px 12px; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 4px; min-height: 108px; align-content: start;
    transition: transform .12s ease, border-color .12s ease; }
  .kaart:hover { border-color: var(--fg); }
  .kaart:active { transform: translateY(1px); }
  .kaart b { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .kaart .fund { grid-column: 1 / -1; color: var(--fg-soft); font-size: 0.86rem; line-height: 1.35; }
  .kaart .ico { width: 30px; height: 30px; color: var(--fg); grid-row: 1; grid-column: 2; }
  .kaart .onder { grid-column: 1 / -1; margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 0.74rem; color: var(--fg-soft); }
  .niv { display: inline-flex; gap: 3px; align-items: flex-end; }
  .niv i { display: block; width: 7px; background: var(--guide-soft); border: 1px solid var(--guide); border-radius: 1px; }
  .niv i:nth-child(1) { height: 7px; } .niv i:nth-child(2) { height: 10px; } .niv i:nth-child(3) { height: 13px; }
  .niv i:nth-child(4) { height: 16px; } .niv i:nth-child(5) { height: 19px; }
  .niv i.aan { background: var(--fg); border-color: var(--fg); }
  .kaart .cijfers { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
  .kaart .cijfers em { font-style: normal; color: var(--fg-soft); }
  #instellingen { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--fg-soft); font-size: 0.88rem; display: flex; gap: 10px; align-items: center; }
  #instellingen input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  #instellingen label { padding: 6px 0; }
  #instellingen { flex-wrap: wrap; }
  #exportLog { font-size: 0.8rem; color: var(--fg-soft); padding: 6px 10px; margin-left: auto; background: var(--kaart); border-color: var(--kaart-rand); }

  /* ---- tekenscherm ---- */
  #oefening { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--bg); }
  #balk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto; align-items: center; gap: 4px 6px;
    padding: calc(5px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 5px max(8px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--kaart-rand); background: var(--bg); }
  #balk button:not(.uitleg) { padding: 0; min-width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.15rem; line-height: 1; background: var(--kaart); border-color: var(--kaart-rand); }
  #balk .titel { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  #balk .stand { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.74rem; color: var(--fg-soft); text-align: center; min-width: 4.4em; line-height: 1.15; }
  #balk .stand b { display: block; font-size: 0.9rem; color: var(--fg); font-weight: 500; }
  #balk .uitleg { background: none; border: 0; grid-column: 1 / -1; margin: 0; padding: 0 4px; color: var(--fg-soft); font-size: 0.86rem; line-height: 1.3; text-align: left; border: 0; border-radius: 0; height: auto; min-height: 0; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #balk .uitleg.open { -webkit-line-clamp: unset; display: block; }
  #vlak { flex: 1; position: relative; background: var(--paper); min-height: 0; }
  #vlak canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #melding { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); max-width: 90%; text-align: center;
    padding: 7px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #melding.zicht { opacity: 1; }
  #klaar { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--knop-tekst);
    border: 0; border-radius: 4px 16px 4px 16px; min-width: 112px; min-height: 52px; padding: 0 24px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #klaar:active { transform: translateY(1px); box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { #melding, .kaart { transition: none; } }

<script>
/* hulp.js */
// Gedeelde rekenhulpjes voor alle oefeningen. Alles werkt met punten {x, y, p, t}
// (x/y in CSS-pixels van het tekenvlak, p = druk 0..1, t = tijd in ms).
window.Hulp = (function () {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // 1 bij x <= goed, 0 bij x >= slecht, lineair ertussen (werkt ook als goed > slecht).
  function lin(x, goed, slecht) {
    if (goed === slecht) return x <= goed ? 1 : 0;
    return clamp((slecht - x) / (slecht - goed), 0, 1);
  }

  const afstand = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function lengte(pts) {
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += afstand(pts[i - 1], pts[i]);
    return s;
  }

  // Herbemonster op gelijke afstand 'stap' (px); p en t worden meegeïnterpoleerd.
  function herbemonster(pts, stap) {
    if (pts.length < 2) return pts.slice();
    const uit = [Object.assign({}, pts[0])];
    let rest = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const d = afstand(a, b);
      if (d === 0) continue;
      let pos = stap - rest;
      while (pos <= d) {
        const f = pos / d;
        uit.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, p: a.p + (b.p - a.p) * f, t: a.t + (b.t - a.t) * f });
        pos += stap;
      }
      rest = d - (pos - stap);
    }
    const last = pts[pts.length - 1];
    if (afstand(uit[uit.length - 1], last) > stap * 0.3) uit.push(Object.assign({}, last));
    return uit;
  }

  // Herbemonster naar precies n punten.
  function herbemonsterN(pts, n) {
    const L = lengte(pts);
    if (L === 0 || n < 2) return pts.slice(0, n);
    const r = herbemonster(pts, L / (n - 1));
    while (r.length > n) r.pop();
    while (r.length < n) r.push(Object.assign({}, pts[pts.length - 1]));
    return r;
  }

  function gemiddelde(arr) { return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0; }
  function sd(arr) { const m = gemiddelde(arr); return Math.sqrt(gemiddelde(arr.map((v) => (v - m) ** 2))); }
  function mediaan(arr) {
    if (!arr.length) return 0;
    const s = arr.slice().sort((a, b) => a - b), k = s.length >> 1;
    return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2;
  }

  // Beste rechte lijn door de punten (PCA). Geeft midden, eenheidsrichting en hoek (rad).
  function lijnFit(pts) {
    const mx = gemiddelde(pts.map((p) => p.x)), my = gemiddelde(pts.map((p) => p.y));
    let sxx = 0, syy = 0, sxy = 0;
    for (const p of pts) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    const hoek = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    return { mx, my, dx: Math.cos(hoek), dy: Math.sin(hoek), hoek };
  }

  // Loodrechte (gesigneerde) afstand van punt tot lijn door a met richting (dx, dy).
  function lijnAfstand(p, a, dx, dy) { return (p.x - a.x) * -dy + (p.y - a.y) * dx; }

  // Afstand van punt tot lijnstuk a-b.
  function segmentAfstand(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
    const f = L2 ? clamp(((p.x - a.x) * vx + (p.y - a.y) * vy) / L2, 0, 1) : 0;
    return Math.hypot(p.x - (a.x + vx * f), p.y - (a.y + vy * f));
  }

  // Kleinste afstand van punt tot een polylijn.
  function polyAfstand(p, poly) {
    let m = Infinity;
    for (let i = 1; i < poly.length; i++) m = Math.min(m, segmentAfstand(p, poly[i - 1], poly[i]));
    return m;
  }

  // Snelheden (px/ms) tussen opeenvolgende punten, met tijd > 0.
  function snelheden(pts) {
    const v = [];
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - pts[i - 1].t;
      if (dt > 0) v.push(afstand(pts[i - 1], pts[i]) / dt);
    }
    return v;
  }

  // Hoekverschil tussen twee richtingen in graden, voor lijnen zonder richting (0..90).
  function lijnHoekVerschil(a, b) {
    let d = Math.abs(a - b) % Math.PI;
    if (d > Math.PI / 2) d = Math.PI - d;
    return d * 180 / Math.PI;
  }

  // Kleine voorspelbare random-generator: rng() -> 0..1. Met rng.tussen(a, b) en rng.kies(lijst).
  function maakRng(seed) {
    let s = (seed >>> 0) || 1;
    const rng = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; };
    rng.tussen = (a, b) => a + (b - a) * rng();
    rng.kies = (lijst) => lijst[Math.floor(rng() * lijst.length)];
    return rng;
  }

  return { clamp, lin, afstand, lengte, herbemonster, herbemonsterN, gemiddelde, sd, mediaan,
    lijnFit, lijnAfstand, segmentAfstand, polyAfstand, snelheden, lijnHoekVerschil, maakRng };
})();

</script>
<script>

<script>
/* oefeningen/ellipsen.js */
// Ellipsen in een kader, van bijna-cirkel (niveau 1) tot smal en gedraaid (niveau 5).
// Score = mix van vormscore (is het een nette, gesloten ellips met ongeveer de juiste verhouding en draaiing?)
// en passingscore (ligt hij op de exacte doel-ellips die het kader raakt?). De mix hangt van het niveau af.
(function () {
  const H = window.Hulp;
  const BINS = 72;
  const FBINS = 36; // bakjes voor de gefitte ellips (symmetrie / puntigheid)
  // Per niveau: verhouding lange/korte as, draaiing, grootte (fractie van het vlak), hulp.
  // vorm = aandeel van de score dat uit de vormscore komt (de rest is passing in het kader).
  // sluit = [gat (t.o.v. grootte) waarbij sluiting 0 wordt, exponent op de dekking]: laag niveau milder.
  const NIVEAUS = {
    1: { ratio: [1.0, 1.3], draai: [0, 0], maat: [0.62, 0.72], ghost: 0.5, streepjes: true, vorm: 0.85, sluit: [2.4, 1] },
    2: { ratio: [1.25, 1.7], draai: [0, 90], maat: [0.55, 0.7], ghost: 0.25, streepjes: true, vorm: 0.7, sluit: [1.9, 1.5] },
    3: { ratio: [1.4, 2.1], draai: [-35, 35], maat: [0.5, 0.68], ghost: 0, streepjes: true, vorm: 0.5, sluit: [0.9, 2] },
    4: { ratio: [1.6, 2.6], draai: [-90, 90], maat: [0.4, 0.62], ghost: 0, streepjes: true, vorm: 0.2, sluit: [0.9, 2] },
    5: { ratio: [2.0, 3.4], draai: [-90, 90], maat: [0.32, 0.58], ghost: 0, streepjes: false, vorm: 0.1, sluit: [0.9, 2] },
  };

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const ratio = rng.tussen(n.ratio[0], n.ratio[1]);
    const draai = niveau === 2 ? rng.kies([0, 90]) : rng.tussen(n.draai[0], n.draai[1]);
    const t = draai * Math.PI / 180;
    // Lange as zo groot als past: de gedraaide omhullende moet binnen het vlak blijven.
    const want = rng.tussen(n.maat[0], n.maat[1]);
    let a = want * Math.min(vlak.w, vlak.h) * 0.5 * Math.sqrt(ratio);
    let b = a / ratio;
    const halfW = Math.abs(a * Math.cos(t)) + Math.abs(b * Math.sin(t));
    const halfH = Math.abs(a * Math.sin(t)) + Math.abs(b * Math.cos(t));
    const k = Math.min(1, (vlak.w * 0.44) / halfW, (vlak.h * 0.40) / halfH);
    a *= k; b *= k;
    return {
      cx: vlak.w / 2 + rng.tussen(-0.04, 0.04) * vlak.w,
      cy: vlak.h * 0.53 + rng.tussen(-0.03, 0.03) * vlak.h,
      a, b, t, ghost: n.ghost, streepjes: n.streepjes, niveau, vorm: n.vorm,
    };
  }

  function inLokaal(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.rotate(o.t);
    fn();
    ctx.restore();
  }

  function teken(ctx, o, vlak) {
    inLokaal(ctx, o, () => {
      ctx.strokeStyle = vlak.kleur.hulp;
      ctx.lineWidth = 2;
      ctx.strokeRect(-o.a, -o.b, 2 * o.a, 2 * o.b);
      if (o.streepjes) {
        const s = 12;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-o.a - s, 0); ctx.lineTo(-o.a + s, 0);
        ctx.moveTo(o.a - s, 0); ctx.lineTo(o.a + s, 0);
        ctx.moveTo(0, -o.b - s); ctx.lineTo(0, -o.b + s);
        ctx.moveTo(0, o.b - s); ctx.lineTo(0, o.b + s);
        ctx.stroke();
      }
      if (o.ghost > 0) {
        ctx.globalAlpha = o.ghost;
        ctx.strokeStyle = vlak.kleur.hulpZacht;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(0, 0, o.a, o.b, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
  }

  // Punt naar ellips-assenstelsel.
  function lokaal(o, p) {
    const dx = p.x - o.cx, dy = p.y - o.cy, c = Math.cos(o.t), s = Math.sin(o.t);
    return { u: dx * c + dy * s, v: -dx * s + dy * c };
  }

  // Radiale afstand van punt tot ellips {cx,cy,a,b,t} (+ = buiten) en hoek in het ellipsstelsel.
  function radiaal(e, p) {
    const { u, v } = lokaal(e, p);
    const r = Math.max(1e-6, Math.hypot(u / e.a, v / e.b));
    return { d: Math.hypot(u, v) * (1 - 1 / r), r, phi: Math.atan2(v / e.b, u / e.a) };
  }

  // Ellips fitten op punten (kleinste kwadraten van de radiale afwijking, Levenberg-Marquardt, start via PCA).
  function fitEllips(pts) {
    const mx = H.gemiddelde(pts.map((p) => p.x)), my = H.gemiddelde(pts.map((p) => p.y));
    const lf = H.lijnFit(pts);
    const sa = Math.sqrt(2) * H.sd(pts.map((p) => (p.x - mx) * lf.dx + (p.y - my) * lf.dy));
    const sb = Math.sqrt(2) * H.sd(pts.map((p) => -(p.x - mx) * lf.dy + (p.y - my) * lf.dx));
    let par = [mx, my, Math.max(sa, 3), Math.max(sb, 3), lf.hoek];
    const res = (q) => {
      const e = { cx: q[0], cy: q[1], a: Math.max(q[2], 1), b: Math.max(q[3], 1), t: q[4] };
      return pts.map((p) => radiaal(e, p).d);
    };
    const kost = (r) => r.reduce((s, x) => s + x * x, 0);
    let r0 = res(par), k0 = kost(r0), lam = 1;
    for (let it = 0; it < 40; it++) {
      const J = par.map((_, j) => {
        const q = par.slice(); const h = j === 4 ? 1e-4 : 1e-3 * Math.max(1, Math.abs(par[j]));
        q[j] += h; const r1 = res(q);
        return r1.map((x, i) => (x - r0[i]) / h);
      });
      const A = par.map((_, i) => par.map((__, j) => J[i].reduce((s, x, m) => s + x * J[j][m], 0)));
      const g = par.map((_, i) => J[i].reduce((s, x, m) => s + x * r0[m], 0));
      for (let i = 0; i < 5; i++) A[i][i] *= 1 + lam;
      // Gauss-eliminatie voor A * dx = -g
      const M = A.map((rij, i) => rij.concat(-g[i]));
      let ok = true;
      for (let i = 0; i < 5 && ok; i++) {
        let piv = i;
        for (let k = i + 1; k < 5; k++) if (Math.abs(M[k][i]) > Math.abs(M[piv][i])) piv = k;
        if (Math.abs(M[piv][i]) < 1e-12) { ok = false; break; }
        [M[i], M[piv]] = [M[piv], M[i]];
        for (let k = i + 1; k < 5; k++) { const f = M[k][i] / M[i][i]; for (let c = i; c < 6; c++) M[k][c] -= f * M[i][c]; }
      }
      if (!ok) break;
      const dx = new Array(5);
      for (let i = 4; i >= 0; i--) { let s = M[i][5]; for (let c = i + 1; c < 5; c++) s -= M[i][c] * dx[c]; dx[i] = s / M[i][i]; }
      const q = par.map((x, i) => x + dx[i]);
      const r1 = res(q), k1 = kost(r1);
      if (k1 < k0) { const klein = k0 - k1 < 1e-6 * k0; par = q; r0 = r1; k0 = k1; lam = Math.max(lam / 3, 1e-4); if (klein) break; }
      else lam *= 4;
    }
    let [cx, cy, a, b, t] = par;
    a = Math.max(a, 1); b = Math.max(b, 1);
    if (b > a) { [a, b] = [b, a]; t += Math.PI / 2; }
    t = ((t % Math.PI) + Math.PI) % Math.PI;
    return { cx, cy, a, b, t };
  }

  // Hoe goed is de getekende lijn een nette ellips? Alles genormeerd op de grootte van de gefitte ellips.
  function vormMeting(o, ruw) {
    const pts = H.herbemonsterN(H.herbemonster(ruw, 2), 180);
    const fit = fitEllips(pts);
    const size = (fit.a + fit.b) / 2;
    const rs = pts.map((p) => radiaal(fit, p));
    const rms = Math.sqrt(H.gemiddelde(rs.map((x) => x.d * x.d))) / size;

    // Wiebelig: afwijking van de eigen (gladgestreken) afwijking, d.w.z. hoogfrequent.
    const w = 7, ds = rs.map((x) => x.d);
    const wiebel = Math.sqrt(H.gemiddelde(ds.map((d, i) => {
      let s = 0, n = 0;
      for (let k = -w; k <= w; k++) { const j = i + k; if (j >= 0 && j < ds.length) { s += ds[j]; n++; } }
      return (d - s / n) ** 2;
    }))) / size;

    // Dekking en sluiting (hoek om het midden van de fit, en afstand tussen begin en eind).
    const bak = Array.from({ length: FBINS }, () => []);
    for (const x of rs) bak[Math.floor((x.phi + Math.PI) / (2 * Math.PI) * FBINS) % FBINS].push(x.d);
    const dekking = bak.filter((b) => b.length).length / FBINS;
    const gat = H.afstand(pts[0], pts[pts.length - 1]) / size;
    const [gatSlecht, dekExp] = (NIVEAUS[o.niveau] || NIVEAUS[4]).sluit; // beginners: mildere sluiting
    const sluit = Math.pow(dekking, dekExp) * H.lin(gat, 0.25, gatSlecht);

    // Symmetrie: afwijking in tegenoverliggende (punt) en gespiegelde (as) bakjes moet gelijk zijn.
    const f = bak.map((b) => (b.length ? H.gemiddelde(b) : null));
    let asym = 0, na = 0;
    for (let k = 0; k < FBINS; k++) {
      const punt = f[(k + FBINS / 2) % FBINS], spiegel = f[FBINS - 1 - k];
      if (f[k] !== null && punt !== null) { asym += Math.abs(f[k] - punt); na++; }
      if (f[k] !== null && spiegel !== null) { asym += Math.abs(f[k] - spiegel); na++; }
    }
    asym = na ? asym / na / size : 0;

    // Puntig (oog) of hoekig: afwijking aan de uiteinden van de lange as t.o.v. de diagonalen.
    const waar = (cond) => {
      const v = f.filter((x, k) => x !== null && cond(-Math.PI + (k + 0.5) * 2 * Math.PI / FBINS));
      return v.length ? H.gemiddelde(v) : 0;
    };
    const uiteinde = waar((p) => Math.abs(Math.cos(p)) > 0.9);
    const diag = waar((p) => Math.abs(Math.cos(p)) > 0.45 && Math.abs(Math.cos(p)) < 0.85);
    const punt = (uiteinde - diag) / size; // > 0: puntige uiteinden, < 0: hoekig

    // Verhouding en draaiing t.o.v. de opdracht.
    const fr = fit.a / fit.b, dr = o.a / o.b;
    const ratioFout = Math.abs(Math.log(fr / dr));
    const draaiFout = H.lijnHoekVerschil(fit.t, o.t);
    const gewicht = H.clamp((Math.min(fr, dr) - 1.1) / 0.3, 0, 1); // bij bijna-cirkel telt draaiing niet
    const draaiEff = draaiFout * gewicht;

    const c = {
      netjes: H.lin(rms, 0.015, 0.10),
      wiebel: H.lin(wiebel, 0.008, 0.04),
      sym: H.lin(asym, 0.02, 0.09),
      sluit,
      ratio: H.lin(ratioFout, 0.1, 0.4),
      draai: H.lin(draaiEff, 8, 30),
    };
    const score = Math.round(100 * c.netjes * c.wiebel * c.sym * c.sluit * c.ratio * c.draai);
    return { score, fit, c, rms, wiebel, asym, punt, ratioFout, fr, dr, draaiEff, dekking, gat };
  }

  // Passing t.o.v. de exacte doel-ellips (de oude beoordeling).
  function passingMeting(o, ruw) {
    const pts = H.herbemonster(ruw, 2);
    const size = (o.a + o.b) / 2;
    const bins = Array.from({ length: BINS }, () => []);
    let stray = 0;
    for (const p of pts) {
      const { u, v } = lokaal(o, p);
      const r = Math.hypot(u / o.a, v / o.b);
      if (r < 0.5 || r > 1.7) { stray++; continue; }
      // Afstand tot de ideale ellips langs de straal vanuit het midden (+ = buiten).
      const d = Math.hypot(u, v) * (1 - 1 / r);
      const phi = Math.atan2(v / o.b, u / o.a);
      bins[Math.floor((phi + Math.PI) / (2 * Math.PI) * BINS) % BINS].push(d);
    }
    const offs = bins.map((b) => (b.length ? H.gemiddelde(b) : null));
    const gedekt = offs.filter((x) => x !== null);
    if (!gedekt.length) return null;
    const dekking = gedekt.length / BINS;
    const fout = H.gemiddelde(gedekt.map(Math.abs)) / size;
    const strayFrac = stray / pts.length;
    const score = Math.round(100 * H.lin(fout, 0.012, 0.11) * Math.pow(dekking, 2) * (1 - Math.min(0.5, strayFrac)));
    return { score, offs, dekking, strayFrac, size };
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    if (ruw.length < 8 || H.lengte(ruw) < (o.a + o.b) * 1.5) return { ongeldig: 'Te kort: teken de hele ellips in één streek.' };
    const pas = passingMeting(o, ruw);
    if (!pas) return { ongeldig: 'Teken de ellips in het kader.' };
    const vorm = vormMeting(o, ruw);
    const wv = o.vorm === undefined ? NIVEAUS[o.niveau || 4].vorm : o.vorm;
    const score = Math.round(wv * vorm.score + (1 - wv) * pas.score);
    return { score, vm: vorm, tip: tip(o, vorm, pas, wv, score), offs: pas.offs, fit: vorm.fit, vorm: vorm.score, passing: pas.score };
  }

  function tip(o, vm, pas, wv, score) {
    const size = pas.size;
    const waar = (cond) => {
      const v = pas.offs.filter((x, k) => x !== null && cond(-Math.PI + (k + 0.5) * 2 * Math.PI / BINS));
      return v.length ? H.gemiddelde(v) : 0;
    };
    const zij = waar((f) => Math.abs(Math.cos(f)) > 0.95);
    const bovenOnder = waar((f) => Math.abs(Math.sin(f)) > 0.95);
    // Vormtips: ernst 0..1, gewogen met het vormaandeel van dit niveau.
    const vormTips = [];
    if (vm.dekking < 0.9 || vm.c.sluit < 0.7) vormTips.push([1 - vm.c.sluit + 0.3, 'Niet gesloten. Ga door tot voorbij je beginpunt.']);
    if (vm.punt > 0.03) vormTips.push([vm.punt * 12, 'Puntige uiteinden (een oog). Houd je tempo in de bocht en draai rond.']);
    else if (vm.punt < -0.03) vormTips.push([-vm.punt * 12, 'Te hoekig. Laat de bochten soepeler verlopen.']);
    if (vm.c.ratio < 0.8) vormTips.push([1 - vm.c.ratio, vm.fr > vm.dr ? 'Te smal: maak hem boller, dichter bij de verhouding van het kader.' : 'Te rond: maak hem langer en smaller zoals het kader.']);
    if (vm.c.draai < 0.8) vormTips.push([1 - vm.c.draai, 'Scheef: laat de lange as meelopen met het kader.']);
    if (vm.c.sym < 0.75) vormTips.push([1 - vm.c.sym, 'Niet symmetrisch: beide helften moeten elkaars spiegelbeeld zijn.']);
    if (Math.abs(vm.punt) < 0.03 && (vm.c.wiebel < 0.75 || vm.c.netjes < 0.6)) vormTips.push([1 - Math.min(vm.c.wiebel, vm.c.netjes + 0.2), 'Lijn wiebelt. Trek sneller vanuit je schouder.']);
    // Passingtips (kader).
    const passTips = [];
    if (pas.dekking < 0.9) passTips.push([1, 'Niet gesloten. Ga door tot voorbij je beginpunt.']);
    if (Math.abs(zij) > 0.035 * size) passTips.push([Math.abs(zij) / size, zij < 0 ? 'Raakt de korte zijden niet. Ga verder door naar de streepjes.' : 'Schiet over de korte zijden heen.']);
    if (Math.abs(bovenOnder) > 0.035 * size) passTips.push([Math.abs(bovenOnder) / size, bovenOnder < 0 ? 'Raakt de lange zijden niet. Maak hem boller.' : 'Steekt over de lange zijden heen.']);
    if (pas.strayFrac > 0.1) passTips.push([pas.strayFrac, 'Een deel van je lijn ligt ver naast de vorm.']);
    const tips = vormTips.map(([e, t]) => [e * (0.3 + wv), t]).concat(passTips.map(([e, t]) => [e * (1.3 - wv), t]));
    if (!tips.length) return score >= 85 ? 'Mooi rond en gesloten.' : vm.score >= 85 ? 'Mooie vorm! Zet hem nu precies in het kader.' : 'Lijn wiebelt. Trek sneller vanuit je schouder.';
    // Op lage niveaus telt passing pas mee als de vorm goed is.
    if (wv >= 0.5 && vormTips.length && vm.score < 70) return vormTips.sort((x, y) => y[0] - x[0])[0][1];
    tips.sort((x, y) => y[0] - x[0]);
    const top = tips[0][1];
    if (wv >= 0.7 && !vormTips.length && passTips.length) return 'Mooie vorm! Probeer nu ook de zijden van het kader te raken.';
    return top;
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const size = (o.a + o.b) / 2;
    // Op lage niveaus: de gefitte ellips (jouw vorm) als doorgetrokken lijn.
    const wv = o.vorm === undefined ? NIVEAUS[o.niveau || 4].vorm : o.vorm;
    if (wv >= 0.5 && u.fit) {
      ctx.save();
      ctx.translate(u.fit.cx, u.fit.cy);
      ctx.rotate(u.fit.t);
      ctx.strokeStyle = vlak.kleur.tekstZacht;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, u.fit.a, u.fit.b, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    inLokaal(ctx, o, () => {
      ctx.setLineDash([10, 8]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, o.a, o.b, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let k = 0; k < BINS; k++) {
        const off = u.offs[k];
        const phi = -Math.PI + (k + 0.5) * 2 * Math.PI / BINS;
        const x = o.a * Math.cos(phi), y = o.b * Math.sin(phi);
        if (off === null) { ctx.fillStyle = vlak.kleur.tekstZacht; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
        else if (wv < 0.5 && Math.abs(off) > 0.06 * size) { ctx.fillStyle = vlak.kleur.fout; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); }
      }
    });
  }

  Tekentrainer.registreer({
    id: 'ellipsen',
    naam: 'Ellipsen',
    uitleg: 'Teken in één streek een nette ellips die het kader raakt. Eerst telt vooral de vorm, later ook de passing.',
    fundament: 'Gesloten, ronde vormen vanuit je schouder; de basis van elk 3D-object.',
    meerdereStreken: false,
    toonUitslag: 1300,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

</script>
<script>
/* oefeningen/lijnen.js */
// Stip naar stip: trek een rechte lijn van A naar B in één vloeiende armbeweging.
(function () {
  const H = window.Hulp;
  // Per niveau (alles hier te tunen):
  //  len: lengtebanden (fractie van vlakbreedte); hoeken: 'hv' | '45' | 'vrij' | 'bijna' (bijna-horizontaal/verticaal, 3-9 graden scheef)
  //  gids: 'aan' | 'vervaag' | 'uit'; aR / bR: grootte stip A / B (factor); startTol: px (verder van A starten = ongeldig);
  //  recht: [goed, slecht] als fractie van L (afwijking: 0.6*max + 0.6*rms); eind: [px, fractie van L] tolerantie;
  //  lMin: px; recht- en eindtolerantie rekenen met max(L, lMin), zodat korte lijnen niet onmogelijk strak hoeven;
  //  vloei: [cv goed, cv slecht]; haper: aftrek (punten) per haperpunt in vloeiendheid; hapMult: extra aftrek op totaalscore per haper (max 3);
  //  tempo: false of { basis ms, perPx ms/px, straf (max aftrek op totaalscore) }; w: weging [recht, eind, vloei].
  const BASIS = { aR: 1, startTol: 24, recht: [0.01, 0.08], vloei: [0.25, 0.85], haper: 10, hapMult: 0, lMin: 0, tempo: false, w: [0.45, 0.30, 0.25] };
  const NIVEAUS = {
    1: { len: [[0.35, 0.55]], hoeken: 'hv', gids: 'aan', bR: 1, eind: [8, 0.12] },
    2: { len: [[0.35, 0.55]], hoeken: '45', gids: 'aan', bR: 1, eind: [8, 0.12] },
    3: { len: [[0.35, 0.55]], hoeken: 'vrij', gids: 'vervaag', bR: 0.85, eind: [8, 0.12] },
    4: { len: [[0.10, 0.20], [0.60, 0.80]], hoeken: 'vrij', gids: 'uit', aR: 0.8, bR: 0.5, startTol: 20,
         recht: [0.005, 0.04], eind: [4, 0.05], vloei: [0.25, 0.8], lMin: 220, haper: 14, hapMult: 0.04,
         tempo: { basis: 700, perPx: 1.8, straf: 0.3 } },
    5: { len: [[0.10, 0.18], [0.65, 0.90]], hoeken: 'bijna', gids: 'uit', aR: 0.65, bR: 0.4, startTol: 16,
         recht: [0.004, 0.022], eind: [3, 0.025], vloei: [0.28, 0.65], lMin: 260, haper: 20, hapMult: 0.08,
         tempo: { basis: 500, perPx: 1.0, straf: 0.5 }, w: [0.40, 0.35, 0.25] },
  };
  for (const k in NIVEAUS) NIVEAUS[k] = Object.assign({}, BASIS, NIVEAUS[k]);

  let laatsteHoek = null; // vorige looprichting (rad), om herhaling te voorkomen

  const hoekVerschil = (a, b) => {
    let d = Math.abs(a - b) % (2 * Math.PI);
    return d > Math.PI ? 2 * Math.PI - d : d;
  };

  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const mn = Math.min(vlak.w, vlak.h);
    const marge = Math.max(14, mn * 0.08);

    // Hoek kiezen, niet gelijk aan de vorige.
    let hoek;
    for (let poging = 0; poging < 30; poging++) {
      if (n.hoeken === 'bijna') hoek = (rng.kies([0, 90, 180, 270]) + rng.kies([-1, 1]) * rng.tussen(3, 9)) * Math.PI / 180;
      else if (n.hoeken === 'hv') hoek = rng.kies([0, 90, 180, 270]) * Math.PI / 180;
      else if (n.hoeken === '45') hoek = rng.kies([0, 45, 90, 135, 180, 225, 270, 315]) * Math.PI / 180;
      else hoek = rng.tussen(0, 360) * Math.PI / 180;
      if (laatsteHoek === null || hoekVerschil(hoek, laatsteHoek) > (n.hoeken === 'vrij' ? 0.26 : 0.1)) break;
    }
    laatsteHoek = hoek;
    const ux = Math.cos(hoek), uy = Math.sin(hoek);

    // Lengte, begrensd zodat de lijn in het vlak past.
    const band = rng.kies(n.len);
    let L = rng.tussen(band[0], band[1]) * vlak.w;
    const kx = Math.abs(ux) > 1e-6 ? (vlak.w - 2 * marge) / Math.abs(ux) : Infinity;
    const ky = Math.abs(uy) > 1e-6 ? (vlak.h - 2 * marge) / Math.abs(uy) : Infinity;
    L = Math.min(L, kx, ky);

    // Midden zo kiezen dat beide uiteinden binnen de marge liggen.
    const hx = Math.abs(ux) * L / 2, hy = Math.abs(uy) * L / 2;
    const cx = rng.tussen(marge + hx, vlak.w - marge - hx);
    const cy = rng.tussen(marge + hy, vlak.h - marge - hy);
    const A = { x: cx - ux * L / 2, y: cy - uy * L / 2 };
    const B = { x: cx + ux * L / 2, y: cy + uy * L / 2 };
    const r = H.clamp(mn * 0.014, 6, 11);
    return {
      A, B, L, hoek, ux, uy, niveau,
      rA: Math.max(3, r * n.aR), rB: Math.max(3, r * n.bR),
      gids: n.gids,
      n,
      eind: n.eind,
      tempo: n.tempo,
      animeer: n.gids === 'vervaag',
    };
  }

  function teken(ctx, o, vlak, info) {
    let alpha = 1;
    if (o.gids === 'uit') alpha = 0;
    else if (o.gids === 'vervaag') alpha = 1 - H.clamp((info.sinds - 500) / 400, 0, 1);
    if (alpha > 0) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = vlak.kleur.hulp;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(o.A.x, o.A.y);
      ctx.lineTo(o.B.x, o.B.y);
      ctx.stroke();
      ctx.restore();
    }
    // B: ring met stip
    ctx.save();
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.fillStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.B.x, o.B.y, o.rB, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(o.B.x, o.B.y, Math.max(1.5, o.rB * 0.3), 0, Math.PI * 2); ctx.fill();
    // A: gevulde accentstip
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath(); ctx.arc(o.A.x, o.A.y, o.rA, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Snelheden (px/ms): punten minstens 12 ms uit elkaar, daarna 3-punts gladding.
  function gladdeSnelheden(pts) {
    const dun = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].t - dun[dun.length - 1].t >= 12 || i === pts.length - 1) dun.push(pts[i]);
    }
    const v = H.snelheden(dun);
    return v.map((x, i) => {
      const a = v[Math.max(0, i - 1)], c = v[Math.min(v.length - 1, i + 1)];
      return (a + x + c) / 3;
    });
  }

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    const A = o.A, B = o.B, L = o.L;
    if (ruw.length < 8 || H.lengte(ruw) < 0.25 * L) return { ongeldig: 'Te kort. Trek de hele lijn van A naar B.' };
    if (H.afstand(ruw[0], A) > o.n.startTol) return { ongeldig: 'Start op stip A en trek dan naar B.' };

    const eerste = ruw[0], laatste = ruw[ruw.length - 1];
    const sx = laatste.x - eerste.x, sy = laatste.y - eerste.y;
    const sl = Math.hypot(sx, sy);
    if (sl < 0.2 * L) return { ongeldig: 'Te kort. Trek de hele lijn van A naar B.' };
    const dx = sx / sl, dy = sy / sl;

    // Rechtheid: gesigneerde afstand tot de lijn eerste -> laatste punt (herbemonsterd op 3 px).
    const pts = H.herbemonster(ruw, 3);
    const d = pts.map((p) => H.lijnAfstand(p, eerste, dx, dy));
    let dmax = 0, imax = 0;
    d.forEach((x, i) => { if (Math.abs(x) > dmax) { dmax = Math.abs(x); imax = i; } });
    const rms = Math.sqrt(H.gemiddelde(d.map((x) => x * x)));
    const Lt = Math.max(L, o.n.lMin);
    const dm = Math.max(0, dmax - 1), rm = Math.max(0, rms - 0.5);
    const sRecht = 100 * H.lin(0.6 * dm / Lt + 0.6 * rm / Lt, o.n.recht[0], o.n.recht[1]);

    // Eindpunten.
    const e = (H.afstand(eerste, A) + H.afstand(laatste, B)) / 2;
    const sEind = 100 * H.lin(e, o.eind[0], o.eind[0] + o.eind[1] * Lt);

    // Vloeiendheid.
    const v = gladdeSnelheden(ruw);
    const lo = Math.floor(v.length * 0.15), hi = Math.ceil(v.length * 0.85);
    const mid = v.slice(lo, hi);
    let cv = 0, hapers = 0;
    if (mid.length >= 3) {
      const gem = H.gemiddelde(mid);
      cv = gem > 0 ? H.sd(mid) / gem : 1;
      let in_ = false;
      for (const x of mid) {
        const laag = x < 0.2 * gem;
        if (laag && !in_) hapers++;
        in_ = laag;
      }
    }
    const sVloei = H.clamp(100 * H.lin(cv, o.n.vloei[0], o.n.vloei[1]) - o.n.haper * hapers, 0, 100);

    // Tempo (niveau 5).
    const duur = laatste.t - eerste.t;
    const maxDuur = o.tempo ? o.tempo.basis + o.tempo.perPx * L : Infinity;
    const traag = o.tempo ? Math.max(0, duur / maxDuur - 1) : 0;

    const w = o.n.w;
    let score = w[0] * sRecht + w[1] * sEind + w[2] * sVloei;
    if (o.tempo) score *= 1 - o.tempo.straf * H.clamp(traag, 0, 1);
    score *= 1 - o.n.hapMult * Math.min(hapers, 3);
    score = Math.round(H.clamp(score, 0, 100));

    // Tips: kandidaten met ernst (1 = net over de drempel).
    const mid3 = d.slice(Math.floor(d.length * 0.1), Math.ceil(d.length * 0.9));
    const med = H.mediaan(mid3);
    const zelfdeKant = mid3.filter((x) => Math.sign(x) === Math.sign(med)).length / Math.max(1, mid3.length);
    const proj = ((laatste.x - A.x) * o.ux + (laatste.y - A.y) * o.uy) / L;
    let trilling = 0;
    const dd = d;
    if (dd.length > 4) {
      let s = 0;
      for (let i = 1; i < dd.length - 1; i++) s += Math.abs(dd[i] - (dd[i - 1] + dd[i + 1]) / 2);
      trilling = s / (dd.length - 2);
    }
    const tips = [];
    if (Math.abs(med) > 0.02 * L && zelfdeKant > 0.75) {
      tips.push([Math.abs(med) / (0.02 * L), 'Je lijn buigt naar ' + (med > 0 ? 'rechts' : 'links') + '; trek vanuit je schouder.']);
    }
    if (hapers >= 2 || cv > 0.6) tips.push([Math.max(hapers / 2, cv / 0.6), 'Je stopt halverwege; trek in één vloeiende beweging.']);
    if (proj < 0.9) tips.push([(1 - proj) / 0.1,'Je schiet te kort; kijk naar B, niet naar je pen.']);
    else if (proj > 1.1) tips.push([(proj - 1) / 0.1, 'Je schiet te ver door; kijk naar B, niet naar je pen.']);
    if (trilling > 0.8) tips.push([trilling / 0.8, 'Je lijn trilt; ontspan je greep.']);
    if (traag > 0.1) tips.push([traag / 0.1, 'Te traag; trek in één snelle beweging.']);
    tips.sort((a, b) => b[0] - a[0]);
    const tip = tips.length ? tips[0][1] : (score >= 85 ? 'Mooi recht, in één beweging.' : 'Let op je eindpunten: begin en eindig op de stippen.');

    return { score, tip, sRecht, sEind, sVloei, cv, hapers, dmax, maxPunt: pts[imax], maxD: d[imax], proj, trilling, duur };
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(o.A.x, o.A.y);
    ctx.lineTo(o.B.x, o.B.y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (u.maxPunt && Math.abs(u.maxD) > Math.max(4, 0.02 * o.L)) {
      const p = u.maxPunt;
      const k = H.clamp(((p.x - o.A.x) * o.ux + (p.y - o.A.y) * o.uy), 0, o.L);
      const q = { x: o.A.x + o.ux * k, y: o.A.y + o.uy * k };
      ctx.strokeStyle = vlak.kleur.fout;
      ctx.fillStyle = vlak.kleur.fout;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Zoek een plek voor score + tip die de lijn zo min mogelijk bedekt.
  function scorePlek(o, vlak) {
    const mn = Math.min(vlak.w, vlak.h);
    const g = H.clamp(mn * 0.14, 40, 96);
    const hw = Math.min(vlak.w * 0.45, 200);
    const boven = g / 2 + 4, onder = g * 0.62 + 18;
    const midX = (o.A.x + o.B.x) / 2, midY = (o.A.y + o.B.y) / 2;
    const xs = [], ys = [];
    const xlo = Math.min(hw, vlak.w / 2), xhi = Math.max(vlak.w - hw, vlak.w / 2);
    for (let i = 0; i <= 8; i++) xs.push(xlo + (xhi - xlo) * i / 8);
    const ylo = boven, yhi = Math.max(boven, vlak.h - onder);
    for (let i = 0; i <= 12; i++) ys.push(ylo + (yhi - ylo) * i / 12);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bestScore = -Infinity;
    for (const x of xs) for (const y of ys) {
      const r = { l: x - hw, r: x + hw, t: y - g / 2, b: y + onder };
      let dmin = Infinity;
      for (let i = 0; i <= 40; i++) {
        const f = i / 40, px = o.A.x + (o.B.x - o.A.x) * f, py = o.A.y + (o.B.y - o.A.y) * f;
        const ddx = Math.max(r.l - px, 0, px - r.r), ddy = Math.max(r.t - py, 0, py - r.b);
        dmin = Math.min(dmin, Math.hypot(ddx, ddy));
      }
      const s = Math.min(dmin, 50) - 0.02 * Math.hypot(x - midX, y - midY);
      if (s > bestScore) { bestScore = s; beste = { x, y }; }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'lijnen',
    naam: 'Lijnen',
    uitleg: 'Trek in één vloeiende beweging een rechte lijn van stip A naar stip B.',
    fundament: 'Rechte lijnen vanuit je schouder en elleboog; de basis van contouren, perspectief en arcering.',
    meerdereStreken: false,
    toonUitslag: 1400,
    nieuweOpgave,
    teken,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();
