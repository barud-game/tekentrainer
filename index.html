<script>
/* oefeningen/hoeken.js */
// Hoekjager: richting en hoek schatten en in één beweging uitvoeren.
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;

  // Per niveau: maximale hoekfout (graden voor score 0) en of de start meetelt.
  const EMAX = { 1: 25, 2: 20, 3: 15, 4: 12, 5: 10 };
  const GENOEMD4 = [30, 45, 60, 75, 105, 120, 135, 150];

  // Gesigneerde fouten van de laatste pogingen (voor "je wijkt steeds dezelfde kant op").
  const vorige = [];

  // Wiskundige hoek (graden, 0 = rechts, tegen de klok in) -> eenheidsrichting op het canvas.
  const richting = (deg) => ({ x: Math.cos(deg * RAD), y: -Math.sin(deg * RAD) });
  const mod180 = (d) => ((d % 180) + 180) % 180;

  function nieuweOpgave(niveau, rng, vlak) {
    const m = Math.min(vlak.w, vlak.h);
    let soort, ref = 0, doel = 0, verberg = false;
    if (niveau === 1) { soort = 'kopie'; ref = rng.kies([0, 90, 45, 135]); }
    else if (niveau === 2) { soort = 'kopie'; ref = rng.kies([15, 30, 45, 60, 75, 105, 120, 135, 150, 165, 0, 90]); }
    else if (niveau === 3) { soort = rng() < 0.5 ? 'kopie' : 'loodrecht'; ref = Math.round(rng.tussen(5, 175)); }
    else if (niveau === 4) { soort = 'hoek'; doel = rng.kies(GENOEMD4); }
    else if (rng() < 0.5) { soort = rng() < 0.5 ? 'kopie' : 'loodrecht'; ref = Math.round(rng.tussen(5, 175)); verberg = true; }
    else { soort = 'hoek'; do { doel = Math.round(rng.tussen(7, 173)); } while (doel % 15 === 0); }
    if (soort === 'kopie') doel = ref;
    else if (soort === 'loodrecht') doel = mod180(ref + 90);

    const o = { niveau, soort, ref, doel, verberg, emax: EMAX[niveau], m, w: vlak.w, h: vlak.h };
    if (verberg) o.verbergNa = 2000;
    if (soort === 'hoek') {
      o.start = { x: vlak.w * 0.45, y: vlak.h * 0.68 };
      o.hulpLen = m * 0.32;
    } else {
      o.start = { x: vlak.w * 0.6, y: vlak.h * 0.6 };
      const c = { x: vlak.w * 0.26, y: vlak.h * 0.6 }, r = richting(ref), half = m * 0.17;
      o.refLijn = { x1: c.x - r.x * half, y1: c.y - r.y * half, x2: c.x + r.x * half, y2: c.y + r.y * half };
    }
    o.zin = soort === 'kopie' ? 'Teken evenwijdig' : soort === 'loodrecht' ? 'Teken loodrecht' : 'Teken ' + doel + '°';
    return o;
  }

  function lijn(ctx, x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function tekenZin(ctx, o, vlak, extra) {
    const px = Math.round(H.clamp(o.m * 0.05, 16, 34));
    ctx.save();
    ctx.font = '600 ' + px + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = vlak.kleur.tekst;
    ctx.fillText(o.zin + (extra || ''), vlak.w / 2, vlak.h * 0.08);
    ctx.restore();
  }

  function stip(ctx, o, vlak) {
    ctx.save();
    ctx.fillStyle = vlak.kleur.accent;
    ctx.beginPath();
    ctx.arc(o.start.x, o.start.y, Math.max(7, o.m * 0.014), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function teken(ctx, o, vlak, info) {
    const verborgen = !!(info && info.verborgen && o.verberg);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = vlak.kleur.hulp;
    if (o.soort === 'hoek') {
      const s = o.start;
      lijn(ctx, s.x, s.y, s.x + o.hulpLen, s.y);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, o.m * 0.12, 0, -o.doel * RAD, true);
      ctx.stroke();
    } else if (!verborgen) {
      const l = o.refLijn;
      lijn(ctx, l.x1, l.y1, l.x2, l.y2);
    }
    ctx.restore();
    stip(ctx, o, vlak);
    tekenZin(ctx, o, vlak, verborgen ? ' (uit je hoofd)' : '');
  }

  function isKlaar() { return true; }

  // Hoek van een stuk punten (graden, wiskundig, 0..180) via PCA.
  const hoekVan = (pts) => mod180(-H.lijnFit(pts).hoek / RAD);

  function nakijken(o, streken) {
    const ruw = streken[streken.length - 1].punten;
    const L = H.lengte(ruw);
    if (ruw.length < 8 || L < 40) return { ongeldig: 'Te kort, trek een langere lijn.' };

    const pts = H.herbemonster(ruw, 3);
    const n = pts.length;
    const kern = pts.slice(Math.floor(n * 0.1), Math.max(Math.floor(n * 0.1) + 3, Math.ceil(n * 0.95)));
    const fit = H.lijnFit(kern);
    const gemeten = mod180(-fit.hoek / RAD);
    const e = H.lijnHoekVerschil(gemeten * RAD, o.doel * RAD);
    const fout = ((gemeten - o.doel + 270) % 180 + 180) % 180 - 90; // gesigneerd, tegen de klok in = +
    const steiler = Math.abs(Math.sin(gemeten * RAD)) > Math.abs(Math.sin(o.doel * RAD));

    // Rechtheid
    let maxAfw = 0;
    for (const p of kern) maxAfw = Math.max(maxAfw, Math.abs(H.lijnAfstand(p, { x: fit.mx, y: fit.my }, fit.dx, fit.dy)));
    const afw = maxAfw / L;

    // Start
    const dStart = H.afstand(ruw[0], o.start);
    const startRel = dStart / L;

    // Buiging: eerste 30% t.o.v. laatste 30%
    const k30 = Math.max(3, Math.floor(n * 0.3));
    const buig = n >= 8 ? H.lijnHoekVerschil(hoekVan(pts.slice(0, k30)) * RAD, hoekVan(pts.slice(n - k30)) * RAD) : 0;

    const sv = H.snelheden(ruw);
    const traag = sv.length > 0 && H.mediaan(sv) < 0.0012 * o.m;

    const A = H.lin(e, 1.5, o.emax);
    const R = H.lin(afw, 0.012, 0.06);
    const S = H.lin(dStart, 0.02 * L, 0.15 * L);
    const metStart = o.niveau > 1;
    const wA = metStart ? 0.7 : 0.78, wR = metStart ? 0.2 : 0.22, wS = metStart ? 0.1 : 0;
    const score = Math.round(100 * (wA * A + wR * R + wS * S));

    // Tips
    const kant = Math.abs(fout) > 4 ? Math.sign(fout) : 0;
    const steeds = kant !== 0 && vorige.length >= 2 && vorige.slice(-2).every((v) => v === kant);
    vorige.push(kant);
    if (vorige.length > 6) vorige.shift();

    let tip = '';
    if (o.soort === 'loodrecht' && H.lijnHoekVerschil(gemeten * RAD, o.ref * RAD) < 6) {
      tip = 'Je tekende evenwijdig in plaats van loodrecht.';
    } else {
      const kand = [];
      if (Math.abs(fout) > 4) {
        const t = steiler ? 'Je lijn is te steil. Maak hem vlakker.' : 'Je lijn is te vlak. Maak hem steiler.';
        kand.push([wA * (1 - A), steeds ? 'Je wijkt steeds dezelfde kant op: ' + t.charAt(0).toLowerCase() + t.slice(1) : t]);
      }
      if (buig > 6) kand.push([0.35 + 0.65 * Math.min(1, (buig - 6) / 10), 'Je buigt aan het einde af. Blijf je doel aankijken en trek door.']);
      if (R < 0.6) {
        kand.push([wR * (1 - R) + (traag ? 0.05 : 0),
          traag ? 'Trek in één vloeiende, snelle beweging.' : 'Je lijn wiebelt. Trek vanuit je schouder, niet je pols.']);
      }
      if (metStart && S < 0.5) kand.push([wS * (1 - S), 'Begin precies op de stip.']);
      kand.sort((a, b) => b[0] - a[0]);
      tip = kand.length ? kand[0][1] : (score >= 85 ? 'Scherp gezien, mooie rechte lijn.' : 'Bijna. Let op hoek en rechtheid.');
    }

    return { score, tip, e, fout, gemeten, fit: { mx: fit.mx, my: fit.my, dx: fit.dx, dy: fit.dy }, lengte: L, A, R, S, buig };
  }

  const HALF = 0.36;

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const m = o.m, s = o.start, d = richting(o.doel), half = m * HALF;
    ctx.save();
    ctx.lineCap = 'round';
    if (o.verberg && o.refLijn) {
      ctx.strokeStyle = vlak.kleur.hulpZacht;
      ctx.lineWidth = 3;
      const l = o.refLijn;
      lijn(ctx, l.x1, l.y1, l.x2, l.y2);
    }
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 2.5;
    lijn(ctx, s.x - d.x * half, s.y - d.y * half, s.x + d.x * half, s.y + d.y * half);
    ctx.setLineDash([]);
    const groot = u.e > o.emax / 2;
    if (groot) {
      const f = u.fit, h2 = u.lengte / 2;
      ctx.strokeStyle = vlak.kleur.fout;
      ctx.lineWidth = 1.5;
      lijn(ctx, f.mx - f.dx * h2, f.my - f.dy * h2, f.mx + f.dx * h2, f.my + f.dy * h2);
    }
    // Hoekfout als tekst aan het uiteinde van de doellijn
    const px = Math.round(H.clamp(m * 0.035, 13, 24));
    ctx.font = '600 ' + px + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let ex = s.x + d.x * (half + px * 1.6), ey = s.y + d.y * (half + px * 1.6);
    if (ex < px * 2 || ex > vlak.w - px * 2 || ey < px * 2 || ey > vlak.h - px * 2) {
      ex = s.x - d.x * (half + px * 1.6); ey = s.y - d.y * (half + px * 1.6);
    }
    ex = H.clamp(ex, px * 2, vlak.w - px * 2);
    ey = H.clamp(ey, px * 2, vlak.h - px * 2);
    ctx.fillStyle = groot ? vlak.kleur.fout : vlak.kleur.tekst;
    ctx.fillText('fout ' + (Math.round(u.e * 10) / 10) + '°', ex, ey);
    ctx.restore();
  }

  // Lege plek weg van de lijnen: kies het rasterpunt met de grootste afstand tot alle lijnen.
  function scorePlek(o, vlak) {
    const m = o.m, s = o.start, d = richting(o.doel), half = m * HALF;
    const segs = [[{ x: s.x - d.x * half, y: s.y - d.y * half }, { x: s.x + d.x * half, y: s.y + d.y * half }]];
    if (o.refLijn) segs.push([{ x: o.refLijn.x1, y: o.refLijn.y1 }, { x: o.refLijn.x2, y: o.refLijn.y2 }]);
    if (o.soort === 'hoek') segs.push([s, { x: s.x + o.hulpLen, y: s.y }]);
    let beste = { x: vlak.w / 2, y: vlak.h / 2 }, bd = -1;
    for (let i = 0; i <= 6; i++) for (let j = 0; j <= 4; j++) {
      const p = { x: vlak.w * (0.2 + 0.6 * i / 6), y: vlak.h * (0.28 + 0.6 * j / 4) };
      let dm = Infinity;
      for (const sg of segs) dm = Math.min(dm, H.segmentAfstand(p, sg[0], sg[1]));
      dm = Math.min(dm, H.afstand(p, s));
      if (dm > bd) { bd = dm; beste = p; }
    }
    return beste;
  }

  Tekentrainer.registreer({
    id: 'hoeken',
    naam: 'Hoekjager',
    uitleg: 'Trek vanaf de stip in één snelle beweging een rechte lijn in de gevraagde richting.',
    fundament: 'Richting en hoek schatten en in één beweging uitvoeren; de basis voor perspectief en lijnen die kloppen.',
    meerdereStreken: false,
    toonUitslag: 1600,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();

<script>
/* oefeningen/arcering.js */
// Arceerveld: vul een vorm met evenwijdige streken (gelijke hoek, afstand en druk).
(function () {
  const H = window.Hulp;
  const RAD = Math.PI / 180;
  const MIN_STREKEN = 5, MAX_STREKEN = 20;
  const CEL = 8;           // px: rasterstap voor dekking
  const GRENS = 6;         // px buiten de vorm = "buiten"

  // Per niveau: vorm(en), hoeken (graden), afstand als fractie van de vormdiameter,
  // of de voorbeeldlijnen blijven staan, drempelfactor, soort (const/verloop/kruis).
  const NIVEAUS = {
    1: { vormen: ['vierkant'], hoeken: [45], d: 0.14, blijf: true, f: 1, soort: 'const' },
    2: { vormen: ['cirkel'], hoeken: [0, 30, 45, 60, 90], d: 0.11, blijf: false, f: 1, soort: 'const' },
    3: { vormen: ['blob'], hoeken: null, d: 0.085, blijf: false, f: 0.8, soort: 'const' },
    4: { vormen: ['vierkant', 'cirkel'], hoeken: [0, 30, 45, 60, 90, 120, 135, 150], d: 0.11, blijf: false, f: 1, soort: 'verloop' },
    5: { vormen: ['vierkant', 'cirkel', 'blob'], hoeken: [0, 30, 45, 60, 90, 120], d: 0.125, blijf: false, f: 0.7, soort: 'kruis' },
  };

  // ---------- vorm ----------
  function blobR(o, phi) {
    return o.R * (1 + o.a1 * Math.cos(2 * phi + o.p1) + o.a2 * Math.cos(3 * phi + o.p2));
  }
  // Afstand tot de rand in px; > 0 = buiten, <= 0 = binnen (bij benadering voor de blob).
  function buiten(o, x, y) {
    const dx = x - o.cx, dy = y - o.cy;
    if (o.vorm === 'vierkant') {
      const qx = Math.abs(dx) - o.R, qy = Math.abs(dy) - o.R;
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0);
    }
    if (o.vorm === 'cirkel') return Math.hypot(dx, dy) - o.R;
    return Math.hypot(dx, dy) - blobR(o, Math.atan2(dy, dx));
  }
  function pad(ctx, o) {
    ctx.beginPath();
    if (o.vorm === 'vierkant') ctx.rect(o.cx - o.R, o.cy - o.R, 2 * o.R, 2 * o.R);
    else if (o.vorm === 'cirkel') ctx.arc(o.cx, o.cy, o.R, 0, Math.PI * 2);
    else {
      for (let i = 0; i <= 120; i++) {
        const f = i / 120 * Math.PI * 2, r = blobR(o, f);
        const x = o.cx + r * Math.cos(f), y = o.cy + r * Math.sin(f);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
    }
  }

  // ---------- opgave ----------
  function nieuweOpgave(niveau, rng, vlak) {
    const n = NIVEAUS[niveau];
    const half = Math.min(vlak.w * 0.40, vlak.h * 0.38);
    const vorm = rng.kies(n.vormen);
    const o = {
      niveau, vorm, cx: vlak.w / 2, cy: vlak.h * 0.53, f: n.f, soort: n.soort, blijf: n.blijf,
      verbergNa: n.blijf ? 0 : 3000,
    };
    if (vorm === 'blob') {
      o.a1 = rng.tussen(0.07, 0.11); o.a2 = rng.tussen(0.05, 0.09);
      o.p1 = rng.tussen(0, 6.28); o.p2 = rng.tussen(0, 6.28);
      o.R = half / (1 + o.a1 + o.a2);
    } else o.R = half;
    o.D = 2 * o.R;
    const d = n.d * o.D;
    const hoek = (n.hoeken ? rng.kies(n.hoeken) : Math.round(rng.tussen(0, 36)) * 5) * RAD;
    if (n.soort === 'kruis') {
      const verschil = rng.kies([30, 45, 60, 75, 90]) * RAD;
      o.lagen = [{ hoek, d }, { hoek: hoek + verschil, d }];
    } else if (n.soort === 'verloop') {
      const kant = rng.kies([-1, 1]);
      let g = [];
      const dA = 1.55 * d, dB = 0.55 * d;
      // aantal gaten zodat de som ~ 92% van de diameter is
      let m = 2;
      while (m < 40 && m * (dA + dB) / 2 < 0.92 * o.D) m++;
      for (let j = 0; j < m; j++) g.push(dA + (dB - dA) * j / (m - 1));
      const som = g.reduce((s, v) => s + v, 0);
      g = g.map((v) => v * 0.92 * o.D / som);
      if (kant < 0) g.reverse();
      o.lagen = [{ hoek, d: H.gemiddelde(g), verloop: { kant, gaten: g } }];
    } else o.lagen = [{ hoek, d }];
    // Posities (loodrecht op de laag) van de voorbeeldlijnen.
    for (const l of o.lagen) {
      if (l.verloop) {
        l.voorbeeld = [-0.46 * o.D];
        for (const v of l.verloop.gaten) l.voorbeeld.push(l.voorbeeld[l.voorbeeld.length - 1] + v);
        l.ideaal = l.voorbeeld;
      } else {
        l.voorbeeld = [-l.d, 0, l.d];
        const k = Math.floor(0.5 * o.D / l.d);
        l.ideaal = [];
        for (let j = -k; j <= k; j++) l.ideaal.push(j * l.d);
      }
    }
    return o;
  }

  function lijnen(ctx, o, laag, posities) {
    const ux = Math.cos(laag.hoek), uy = Math.sin(laag.hoek), L = o.D;
    ctx.beginPath();
    for (const c of posities) {
      const px = o.cx - uy * c, py = o.cy + ux * c;
      ctx.moveTo(px - ux * L, py - uy * L);
      ctx.lineTo(px + ux * L, py + uy * L);
    }
    ctx.stroke();
  }

  function teken(ctx, o, vlak, info) {
    ctx.save();
    pad(ctx, o);
    ctx.fillStyle = vlak.kleur.hulpZacht;
    ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (!info.verborgen) {
      pad(ctx, o);
      ctx.clip();
      ctx.strokeStyle = vlak.kleur.accent;
      ctx.lineWidth = 2.5;
      for (const l of o.lagen) lijnen(ctx, o, l, l.voorbeeld);
    }
    ctx.restore();
  }

  // ---------- nakijken ----------
  const wrap = (rad) => { let d = rad % Math.PI; if (d > Math.PI / 2) d -= Math.PI; if (d <= -Math.PI / 2) d += Math.PI; return d; };

  function geldigeStreken(o, streken) {
    const uit = [];
    streken.forEach((s, idx) => {
      const ruw = s.punten;
      if (!ruw || ruw.length < 2) return;
      const len = H.lengte(ruw);
      if (len < 0.15 * o.D) return; // tikjes
      const pts = H.herbemonster(ruw, 4);
      if (pts.length < 3) return;
      const fit = H.lijnFit(pts);
      let maxAfw = 0;
      for (const p of pts) maxAfw = Math.max(maxAfw, Math.abs(H.lijnAfstand(p, { x: fit.mx, y: fit.my }, fit.dx, fit.dy)));
      const a = ruw[0], b = ruw[ruw.length - 1];
      uit.push({
        idx, pts, len, hoek: fit.hoek, r: maxAfw / len,
        mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
        dx: b.x - a.x, dy: b.y - a.y,
        druk: H.gemiddelde(ruw.map((p) => (typeof p.p === 'number' ? p.p : 0.5))),
      });
    });
    return uit;
  }

  function regressie(ys) {
    const m = ys.length, xm = (m - 1) / 2, ym = H.gemiddelde(ys);
    let sxy = 0, sxx = 0;
    for (let j = 0; j < m; j++) { sxy += (j - xm) * (ys[j] - ym); sxx += (j - xm) ** 2; }
    const b = sxx ? sxy / sxx : 0, a = ym - b * xm;
    return { a, b, fit: (j) => a + b * j };
  }

  function analyseLaag(o, laag, st, cellen) {
    const f = o.f;
    const L = (x, g, s) => H.lin(x, g * f, s * f);
    const res = { n: st.length, fout: new Set() };
    if (st.length < 3) { res.leeg = true; res.hoekScore = res.afstandScore = res.rechtScore = res.dekScore = 0; res.dek = 0; res.tegen = 0; res.onbedekt = cellen.map(() => true); return res; }

    const diffs = st.map((s) => wrap(s.hoek - laag.hoek) / RAD);
    const sdHoek = H.sd(diffs), gemDiff = H.gemiddelde(diffs);
    res.sdHoek = sdHoek; res.gemDiff = gemDiff;
    res.hoekScore = 100 * (0.5 * L(sdHoek, 2, 10) + 0.5 * L(Math.abs(gemDiff), 3, 15));
    st.forEach((s, i) => { if (Math.abs(diffs[i]) > 6) res.fout.add(s.idx); });

    // Afstanden loodrecht op de gemiddelde hoek.
    const th = laag.hoek + gemDiff * RAD, nx = -Math.sin(th), ny = Math.cos(th);
    const gesorteerd = st.map((s) => ({ s, q: s.mid.x * nx + s.mid.y * ny })).sort((a, b) => a.q - b.q);
    const gaten = [];
    for (let i = 1; i < gesorteerd.length; i++) gaten.push(gesorteerd[i].q - gesorteerd[i - 1].q);
    const mu = H.gemiddelde(gaten);
    res.mu = mu; res.doel = laag.d;
    const reg = regressie(gaten), m = gaten.length;
    res.cv = mu > 0 ? H.sd(gaten) / mu : 1;
    let ref;
    if (laag.verloop) {
      const kant = laag.verloop.kant;
      const f0 = reg.fit(0), f1 = reg.fit(m - 1);
      const groot = kant > 0 ? f0 : f1, klein = kant > 0 ? f1 : f0;
      res.verloopF = groot > 0 ? (groot - klein) / groot : 0;
      const resid = gaten.map((g, j) => g - reg.fit(j));
      res.residCv = mu > 0 ? H.sd(resid) / mu : 1;
      res.afstandScore = 100 * (0.5 * L(res.residCv, 0.10, 0.40) + 0.5 * H.lin(res.verloopF, 0.4, 0.05));
      ref = (j) => Math.max(1e-6, reg.fit(j));
    } else {
      res.afwDoel = Math.abs(mu - laag.d) / laag.d;
      res.afstandScore = 100 * (0.6 * L(res.cv, 0.10, 0.40) + 0.4 * L(res.afwDoel, 0.15, 0.5));
      const f0 = reg.fit(0), f1 = reg.fit(m - 1), groot = Math.max(f0, f1), klein = Math.min(f0, f1);
      res.trend = m >= 4 && groot > 0 ? (groot - klein) / groot : 0;
      const resid = gaten.map((g, j) => g - reg.fit(j));
      res.residCv = mu > 0 ? H.sd(resid) / mu : 1;
      const med = H.mediaan(gaten);
      ref = () => med;
    }
    for (let j = 0; j < m; j++) {
      const r = ref(j);
      if (Math.abs(gaten[j] - r) / r > 0.4) res.fout.add(gesorteerd[j + 1].s.idx);
    }

    res.r = H.gemiddelde(st.map((s) => s.r));
    res.rechtScore = 100 * L(res.r, 0.02, 0.08);

    // Richting: tegen de meerderheid in.
    const ux = Math.cos(laag.hoek), uy = Math.sin(laag.hoek);
    const tekens = st.map((s) => (s.dx * ux + s.dy * uy >= 0 ? 1 : -1));
    const pos = tekens.filter((t) => t > 0).length;
    res.tegen = Math.min(pos, st.length - pos);

    // Dekking.
    const tol = laag.verloop
      ? 0.5 * Math.min(Math.max(...gaten), 1.2 * Math.max(...laag.verloop.gaten))
      : 0.5 * Math.min(mu, 1.5 * laag.d);
    res.onbedekt = cellen.map(([x, y]) => {
      for (const s of st) if (H.polyAfstand({ x, y }, s.pts) <= tol) return false;
      return true;
    });
    res.dek = 1 - res.onbedekt.filter(Boolean).length / Math.max(1, cellen.length);
    return res;
  }

  function nakijken(o, streken) {
    const st = geldigeStreken(o, streken);
    if (st.length < MIN_STREKEN) return { ongeldig: 'Te weinig streken: vul de vorm met minstens ' + MIN_STREKEN + ' lijnen.' };

    // Raster van cellen binnen de vorm.
    const cellen = [];
    for (let y = o.cy - o.R; y <= o.cy + o.R; y += CEL)
      for (let x = o.cx - o.R; x <= o.cx + o.R; x += CEL)
        if (buiten(o, x, y) <= 0) cellen.push([x, y]);

    // Lagen toewijzen op dichtstbijzijnde doelhoek (bij cross-hatching twee groepen).
    const groepen = o.lagen.map(() => []);
    for (const s of st) {
      let best = 0, bd = Infinity;
      o.lagen.forEach((l, i) => { const d = H.lijnHoekVerschil(s.hoek, l.hoek); if (d < bd) { bd = d; best = i; } });
      groepen[best].push(s);
    }
    const lagen = o.lagen.map((l, i) => analyseLaag(o, l, groepen[i], cellen));
    const gem = (k) => H.gemiddelde(lagen.map((l) => l[k]));

    // Buiten de vorm: aandeel punten > GRENS px buiten.
    let tot = 0, bui = 0;
    for (const s of st) for (const p of s.pts) { tot++; if (buiten(o, p.x, p.y) > GRENS) bui++; }
    const buitenPct = 100 * bui / Math.max(1, tot);
    const dek = gem('dek');
    const dekScore = Math.max(0, 100 * H.lin(dek, 0.9, 0.5) - 3 * buitenPct) * (lagen.every((l) => l.leeg) ? 0 : 1);
    const dekFinal = lagen.some((l) => l.leeg) ? Math.min(dekScore, 100 * H.lin(dek, 0.9, 0.5)) : dekScore;

    // Druk (muis: constant 0.5, dus CV 0).
    const drukken = st.map((s) => s.druk);
    const mp = H.gemiddelde(drukken);
    const cvDruk = mp > 0 ? H.sd(drukken) / mp : 0;
    const drukScore = 100 * H.lin(cvDruk, 0.15, 0.5);

    const tegen = lagen.reduce((s, l) => s + l.tegen, 0);
    const straf = Math.min(15, 5 * tegen);

    const raw = 0.30 * gem('hoekScore') + 0.30 * gem('afstandScore') + 0.15 * gem('rechtScore') + 0.15 * dekFinal + 0.10 * drukScore - straf;
    const score = Math.round(H.clamp(raw, 0, 100));

    // Gemarkeerde (foute) streken en onbedekte cellen.
    const fout = new Set();
    lagen.forEach((l) => l.fout.forEach((i) => fout.add(i)));
    const onbedekt = [];
    cellen.forEach((c, i) => { if (lagen.some((l) => l.onbedekt[i])) onbedekt.push(c); });

    const u = { score, fout: Array.from(fout), onbedekt, buitenPct, dek, cvDruk, tegen };
    u.tip = tip(o, lagen, u);
    return u;
  }

  function tip(o, lagen, u) {
    const geldig = lagen.filter((l) => !l.leeg);
    if (geldig.length < lagen.length) return 'Teken beide lagen: minstens 3 lijnen onder elke hoek.';
    const max = (k) => Math.max(...geldig.map((l) => l[k] || 0));
    const kand = [];
    const sd = max('sdHoek');
    if (sd > 6) kand.push([sd / 6, 'Je hoek schommelt; beweeg vanuit je schouder of draai je scherm.']);
    const dev = Math.max(...geldig.map((l) => Math.abs(l.gemDiff)));
    if (dev > 8) kand.push([dev / 8 * 0.9, 'Je hoek wijkt af van het voorbeeld; kijk goed naar de schuine lijnen.']);
    for (const l of geldig) {
      if (l.verloopF !== undefined) {
        if (l.verloopF < 0.2) kand.push([1 + (0.2 - l.verloopF) * 5, 'Laat de afstand steeds kleiner worden naar één kant.']);
        if (l.residCv > 0.25) kand.push([l.residCv / 0.25, 'Je afstanden lopen niet gelijkmatig af; kijk naar de ruimte tussen de lijnen.']);
      } else {
        if (l.trend > 0.3 && l.residCv < 0.25) kand.push([l.trend / 0.3 * 1.1, 'Je lijnen kruipen steeds dichter naar elkaar toe.']);
        else if (l.cv > 0.25) kand.push([l.cv / 0.25, 'Je afstanden lopen uiteen; kijk naar de ruimte tussen de lijnen.']);
        if (l.afwDoel > 0.3) kand.push([l.afwDoel / 0.3 * 0.8, l.mu > l.doel
          ? 'Je lijnen staan te ver uit elkaar; zet ze dichter bij elkaar.'
          : 'Je lijnen staan te dicht op elkaar; geef meer ruimte.']);
      }
    }
    const r = max('r');
    if (r > 0.05) kand.push([r / 0.05, 'Je lijnen buigen; trek ze in één snelle beweging.']);
    if (u.buitenPct > 5) kand.push([u.buitenPct / 5, 'Je gaat buiten de vorm; stop je streek bij de rand.']);
    else if (u.dek < 0.8) kand.push([0.8 / Math.max(u.dek, 0.05), 'Je stopt te vroeg; vul de hele vorm.']);
    if (u.cvDruk > 0.35) kand.push([u.cvDruk / 0.35, 'Houd je druk gelijk.']);
    const slecht = kand.filter((k) => k[0] >= 1).sort((a, b) => b[0] - a[0]);
    if (slecht.length) return slecht[0][1];
    return u.score >= 85 ? 'Mooie, gelijkmatige arcering.' : 'Houd hoek en afstand overal gelijk.';
  }

  // ---------- uitslag ----------
  function tekenUitslag(ctx, o, streken, u, vlak) {
    ctx.save();
    pad(ctx, o);
    ctx.clip();
    // Onbedekte delen licht gemarkeerd.
    ctx.fillStyle = vlak.kleur.fout;
    ctx.globalAlpha = 0.16;
    for (const [x, y] of u.onbedekt) ctx.fillRect(x - CEL / 2, y - CEL / 2, CEL, CEL);
    ctx.globalAlpha = 1;
    // Doelhoek als dunne lijnen.
    ctx.strokeStyle = vlak.kleur.goed;
    ctx.lineWidth = 1.5;
    for (const l of o.lagen) lijnen(ctx, o, l, l.verloop ? l.ideaal : l.voorbeeld);
    ctx.restore();
    // Streken met afwijkende hoek of afstand.
    ctx.strokeStyle = vlak.kleur.fout;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.8;
    for (const i of u.fout) {
      const p = streken[i] && streken[i].punten;
      if (!p || p.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(p[0].x, p[0].y);
      for (let k = 1; k < p.length; k++) ctx.lineTo(p[k].x, p[k].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  Tekentrainer.registreer({
    id: 'arcering',
    naam: 'Arcering',
    uitleg: 'Vul de vorm met evenwijdige lijnen: zelfde hoek, afstand en druk als het voorbeeld.',
    fundament: 'Ritme en consistentie in evenwijdige lijnen; de basis voor schaduw, textuur en toon.',
    meerdereStreken: true,
    stilNa: 1500,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar: (o, streken) => geldigeStreken(o, streken).length >= MAX_STREKEN,
    nakijken,
    tekenUitslag,
    scorePlek: (o) => ({ x: o.cx, y: o.cy }),
  });
})();

</script>
<script>
/* oefeningen/proporties.js */
// Deel & Kopieer: meten op het oog. Een lijn of vlak eerlijk verdelen en lengtes herhalen.
(function () {
  const H = window.Hulp;
  const GRAAD = Math.PI / 180;
  const TOL = { 1: 0.15, 2: 0.15, 3: 0.12, 4: 0.10, 5: 0.10 };
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  // ---------- opgave ----------

  function kiesSoort(niveau, rng) {
    const schuin = (a) => rng.tussen(-a, a);
    const gelijk = (n) => ({ soort: 'verdeel', fracs: Array.from({ length: n - 1 }, (_, i) => (i + 1) / n), gelijk: true });
    switch (niveau) {
      case 1: return Object.assign(gelijk(2), { hoek: 0 });
      case 2:
        return rng() < 0.55 ? Object.assign(gelijk(3), { hoek: 0 }) : { soort: 'kopieer', k: 1, hoek: 0 };
      case 3: {
        const hoek = rng.kies([0, 90, schuin(35)]);
        return rng() < 0.6 ? Object.assign(gelijk(rng.kies([4, 5, 5])), { hoek }) : { soort: 'kopieer', k: rng.kies([2, 2, 0.5]), hoek };
      }
      case 4: {
        const r = rng();
        const hoek = rng.kies([0, 90, schuin(25)]);
        if (r < 0.4) {
          const as = rng.kies([0, 90]);
          return Object.assign(gelijk(rng.kies([2, 3, 4])), { soort: 'rechthoek', hoek: as, zijde: as === 0 ? 'breedte' : 'hoogte' });
        }
        if (r < 0.7) return Object.assign(gelijk(rng.kies([3, 4, 5])), { hoek });
        return { soort: 'kopieer', k: rng.kies([1, 2, 1.5]), hoek };
      }
      default: {
        const hoek = rng() < 0.15 ? 90 : rng.tussen(-70, 70);
        const r = rng();
        if (r < 0.55) {
          const ratio = rng.kies([[2, 3], [3, 5], [2, 3]]);
          const s = ratio[0] + ratio[1];
          return { soort: rng() < 0.3 ? 'rechthoek' : 'verdeel', fracs: [ratio[0] / s], gelijk: false, ratio, hoek, zijde: 'dikke zijde' };
        }
        return { soort: 'kopieer', k: rng.kies([1.5, 1.5, 0.5, 2]), hoek };
      }
    }
  }

  function nieuweOpgave(niveau, rng, vlak) {
    const sp = kiesSoort(niveau, rng);
    const w = vlak.w, h = vlak.h, m = Math.min(w, h);
    const th = sp.hoek * GRAAD;
    const u = { x: Math.cos(th), y: Math.sin(th) };
    let v = { x: -u.y, y: u.x };
    if (v.y < -1e-9 || (Math.abs(v.y) < 1e-9 && v.x < 0)) v = { x: -v.x, y: -v.y };
    if (Math.abs(u.x) < 1e-9) u.x = 0;
    if (Math.abs(v.x) < 1e-9) v.x = 0;

    // Lokale uitgebreidheid (in eenheden van L): langs u en langs v.
    const r = sp.soort === 'rechthoek' ? 0.5 + rng() * 0.35 : 0;
    const gap = 0.3;
    const a1 = sp.soort === 'kopieer' ? Math.max(1, sp.k) : 1;
    const b1 = sp.soort === 'kopieer' ? gap : r;
    const hoeken = [[0, 0], [a1, 0], [a1, b1], [0, b1]].map(([a, b]) => ({ x: a * u.x + b * v.x, y: a * u.y + b * v.y }));
    const bx0 = Math.min(...hoeken.map((p) => p.x)), bx1 = Math.max(...hoeken.map((p) => p.x));
    const by0 = Math.min(...hoeken.map((p) => p.y)), by1 = Math.max(...hoeken.map((p) => p.y));

    const pad = 0.1 * m;
    const vx0 = 0.05 * w, vx1 = 0.95 * w, vy0 = 0.17 * h, vy1 = 0.95 * h;
    const Lmax = Math.min((vx1 - vx0 - 2 * pad) / Math.max(bx1 - bx0, 1e-6), (vy1 - vy0 - 2 * pad) / Math.max(by1 - by0, 1e-6));
    const L = Math.min(Lmax, 1.3 * m) * rng.tussen(0.75, 0.97);
    const vrijX = Math.max(0, vx1 - vx0 - 2 * pad - (bx1 - bx0) * L);
    const vrijY = Math.max(0, vy1 - vy0 - 2 * pad - (by1 - by0) * L);
    const A = {
      x: vx0 + pad + rng() * vrijX - bx0 * L,
      y: vy0 + pad + rng() * vrijY - by0 * L,
    };
    const B = { x: A.x + u.x * L, y: A.y + u.y * L };
    const Q = r * L;

    const o = {
      soort: sp.soort, niveau, A, B, u, v, L, Q, hoek: sp.hoek, tol: TOL[niveau],
      bbox: { x0: vx0 + 0, x1: vx1, y0: 0, y1: 0 },
    };
    o.bbox = {
      x0: A.x + bx0 * L - pad, x1: A.x + bx1 * L + pad,
      y0: A.y + by0 * L - pad, y1: A.y + by1 * L + pad,
    };
    if (sp.soort === 'kopieer') {
      o.k = sp.k;
      o.T = sp.k * L;
      o.S = { x: A.x + v.x * gap * L, y: A.y + v.y * gap * L };
      o.E = { x: o.S.x + u.x * o.T, y: o.S.y + u.y * o.T };
    } else {
      o.fracs = sp.fracs;
      o.gelijk = sp.gelijk;
      o.ratio = sp.ratio;
      o.zijde = sp.zijde;
    }
    if (niveau === 4) o.verbergNa = 3000;
    o.tekst = tekstVoor(o);
    return o;
  }

  function tekstVoor(o) {
    if (o.soort === 'kopieer') {
      if (o.k === 1) {
        const ah = Math.abs(o.hoek);
        return 'Teken dezelfde lengte ' + (ah < 10 ? 'eronder' : ah === 90 ? 'ernaast' : 'evenwijdig') + ', vanaf de stip';
      }
      const w = o.k === 2 ? 'een lijn van 2× deze lengte' : o.k === 0.5 ? 'een lijn van de helft van deze lengte' : 'een lijn van 1,5× deze lengte';
      return 'Teken ' + w + ', vanaf de stip';
    }
    const N = o.fracs.length;
    const wat = o.soort === 'rechthoek' ? 'de ' + o.zijde : 'de lijn';
    if (!o.gelijk) return 'Zet 1 streepje dat ' + wat + ' verdeelt in ' + o.ratio[0] + ' : ' + o.ratio[1];
    if (N === 1) return 'Zet 1 streepje dat ' + wat + ' in 2 gelijke delen verdeelt';
    return 'Zet ' + N + ' streepjes die ' + wat + ' in ' + (N + 1) + ' gelijke delen verdelen';
  }

  // ---------- tekenen ----------

  const punt = (o, a, b) => ({ x: o.A.x + o.u.x * a + o.v.x * b, y: o.A.y + o.u.y * a + o.v.y * b });

  function lijn(ctx, p, q) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }

  function tick(ctx, o, P, half) {
    lijn(ctx, { x: P.x - o.v.x * half, y: P.y - o.v.y * half }, { x: P.x + o.v.x * half, y: P.y + o.v.y * half });
  }

  function tekenOpdracht(ctx, o, vlak) {
    let px = Math.round(H.clamp(Math.min(vlak.w, vlak.h) * 0.055, 14, 26));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '600 ' + px + 'px ' + FONT;
    while (px > 11 && ctx.measureText(o.tekst).width > vlak.w * 0.94) { px--; ctx.font = '600 ' + px + 'px ' + FONT; }
    ctx.fillStyle = vlak.kleur.tekst;
    ctx.fillText(o.tekst, vlak.w / 2, Math.max(8, vlak.h * 0.035));
  }

  // Referentie (lijn/rechthoek); bij verborgen alleen de eindmarkeringen van een verdeel-opgave.
  function tekenReferentie(ctx, o, vlak, verborgen) {
    const m = Math.min(vlak.w, vlak.h);
    const tk = Math.max(8, 0.035 * m);
    ctx.strokeStyle = vlak.kleur.hulp;
    ctx.lineCap = 'round';
    if (o.soort === 'kopieer') {
      if (!verborgen) {
        ctx.lineWidth = 3;
        lijn(ctx, o.A, o.B);
        ctx.lineWidth = 2.5;
        tick(ctx, o, o.A, tk);
        tick(ctx, o, o.B, tk);
      }
      return;
    }
    if (o.soort === 'rechthoek' && !verborgen) {
      ctx.lineWidth = 2;
      const c = [punt(o, 0, 0), punt(o, o.L, 0), punt(o, o.L, o.Q), punt(o, 0, o.Q)];
      ctx.beginPath();
      ctx.moveTo(c[0].x, c[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
      ctx.closePath();
      ctx.stroke();
    }
    if (!verborgen) { ctx.lineWidth = o.soort === 'rechthoek' ? 3.5 : 3; lijn(ctx, o.A, o.B); }
    ctx.lineWidth = 3;
    const h = o.soort === 'rechthoek' ? Math.max(tk, 0.5 * o.Q * 0.35) : tk * 1.3;
    tick(ctx, o, o.A, h);
    tick(ctx, o, o.B, h);
  }

  function teken(ctx, o, vlak, info) {
    tekenOpdracht(ctx, o, vlak);
    tekenReferentie(ctx, o, vlak, !!(info && info.verborgen));
    if (o.soort === 'kopieer') {
      const r = Math.max(5, 0.014 * Math.min(vlak.w, vlak.h));
      ctx.fillStyle = vlak.kleur.accent;
      ctx.beginPath();
      ctx.arc(o.S.x, o.S.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- nakijken ----------

  // Streken die een markering zijn: kort langs de as. Positie = zwaartepunt op de as (px vanaf A).
  function markeringen(o, streken) {
    const uit = [];
    for (const st of streken) {
      const pts = st.punten;
      if (!pts || !pts.length) continue;
      const pad = H.lengte(pts);
      const rs = pts.length > 1 && pad > 0 ? H.herbemonster(pts, 2) : pts;
      const pr = rs.map((q) => (q.x - o.A.x) * o.u.x + (q.y - o.A.y) * o.u.y);
      const span = Math.max(...pr) - Math.min(...pr);
      if (span <= 0.12 * o.L && pad <= 0.12 * o.L + 1.6 * o.Q) uit.push({ p: H.gemiddelde(pr) });
    }
    uit.sort((a, b) => a.p - b.p);
    return uit;
  }

  function nakijkenVerdeel(o, streken) {
    const N = o.fracs.length, L = o.L;
    const mk = markeringen(o, streken);
    if (!mk.length) return { ongeldig: 'Zet kleine streepjes dwars op de lijn.' };
    const ideaal = o.fracs.map((f) => f * L);
    const juist = mk.length === N;
    let paren;
    if (juist) paren = ideaal.map((id, i) => ({ ideal: id, p: mk[i].p }));
    else {
      const gebruikt = new Set();
      paren = ideaal.map((id) => {
        let best = -1, bd = Infinity;
        mk.forEach((x, j) => { if (!gebruikt.has(j) && Math.abs(x.p - id) < bd) { bd = Math.abs(x.p - id); best = j; } });
        if (best < 0) return { ideal: id, p: null };
        gebruikt.add(best);
        return { ideal: id, p: mk[best].p };
      });
    }
    for (const q of paren) {
      q.d = q.p === null ? null : (q.p - q.ideal) / L;
      q.e = q.p === null ? 0.1 : Math.abs(q.d);
      q.s = 100 * H.lin(q.e, 0.005, o.tol);
    }
    let score = H.gemiddelde(paren.map((q) => q.s)) - (juist ? 0 : 30);
    score = Math.round(H.clamp(score, 0, 100));

    let tip;
    if (!juist) {
      tip = (N === 1 ? 'Het moet 1 streepje zijn' : 'Het moeten ' + N + ' streepjes zijn') + ', je zette er ' + mk.length + '.';
    } else if (score >= 90) {
      tip = 'Goed gezien.';
    } else {
      tip = verdeelTip(o, paren, L);
    }
    return { score, tip, soort: 'verdeel', paren, aantal: mk.length };
  }

  function verdeelTip(o, paren, L) {
    const N = paren.length;
    const pos = paren.map((q) => q.p);
    if (o.gelijk && N >= 2) {
      const ideaalDeel = L / (N + 1);
      const laatste = L - pos[N - 1];
      if ((laatste - ideaalDeel) / ideaalDeel < -0.15) return 'Het laatste deel wordt kleiner; verdeel eerst in het midden.';
    }
    if (o.gelijk && N >= 2) {
      const naar = [];
      for (const q of paren) {
        const richting = Math.sign(L / 2 - q.ideal);
        if (Math.abs(q.ideal - L / 2) > 0.05 * L) naar.push((q.p - q.ideal) * richting / L);
      }
      if (naar.length >= 2 && naar.every((x) => x > 0.01) && H.gemiddelde(naar) > 0.03) return 'Je streepjes liggen te dicht bij het midden.';
    }
    const delen = [];
    let vorig = 0, vorigIdeaal = 0;
    for (const q of paren) {
      delen.push(((q.p - vorig) - (q.ideal - vorigIdeaal)) / (q.ideal - vorigIdeaal));
      vorig = q.p; vorigIdeaal = q.ideal;
    }
    const gem = H.gemiddelde(delen);
    if (gem > 0.08) return 'Je maakt het stuk te lang. Vergelijk met de referentie.';
    if (gem < -0.08) return 'Je maakt het stuk te kort. Vergelijk met de referentie.';
    return o.gelijk ? 'Vergelijk de delen met elkaar; ze moeten even lang zijn.' : 'Schat de verhouding nog eens: vergelijk het korte en het lange stuk.';
  }

  function nakijkenKopieer(o, streken) {
    const pts = streken[streken.length - 1].punten;
    if (pts.length < 2 || H.lengte(pts) < 0.15 * o.T) return { ongeldig: 'Te kort, probeer opnieuw.' };
    const a = pts[0], b = pts[pts.length - 1];
    const vx = b.x - a.x, vy = b.y - a.y;
    let M = vx * o.u.x + vy * o.u.y;
    const teken = M < 0 ? -1 : 1;
    M = Math.abs(M);
    const verschil = Math.hypot(vx, vy);
    const alfa = verschil > 0 ? Math.atan2(Math.abs(vx * o.u.y - vy * o.u.x), M) / GRAAD : 90;
    const signed = (M - o.T) / o.T;
    const e = Math.abs(signed);
    const strafRichting = 2 * Math.max(0, alfa - 3);
    const score = Math.round(H.clamp(100 * H.lin(e, 0.005, o.tol) - strafRichting, 0, 100));
    let tip;
    if (score >= 90) tip = 'Goed gezien.';
    else if (Math.abs(signed) > 0.08) tip = 'Je maakt het stuk te ' + (signed < 0 ? 'kort' : 'lang') + '. Vergelijk met de referentie.';
    else if (alfa > 8) tip = 'Je lijn loopt scheef. Houd dezelfde richting als de referentie.';
    else tip = 'Bijna: vergelijk de lengte nog eens met de referentie.';
    return { score, tip, soort: 'kopieer', M, signed, alfa, teken };
  }

  function nakijken(o, streken) {
    if (o.soort === 'kopieer') return nakijkenKopieer(o, streken);
    return nakijkenVerdeel(o, streken);
  }

  function isKlaar(o, streken) {
    if (o.soort === 'kopieer') return streken.length >= 1;
    return markeringen(o, streken).length >= o.fracs.length;
  }

  // ---------- uitslag ----------

  function pct(d) { const x = Math.round(d * 100); return (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x) + '%'; }

  function label(ctx, vlak, tekst, P, kleur) {
    const px = Math.round(H.clamp(Math.min(vlak.w, vlak.h) * 0.032, 11, 18));
    ctx.font = '700 ' + px + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = vlak.kleur.papier || 'transparent';
    ctx.strokeText(tekst, P.x, P.y);
    ctx.fillStyle = kleur;
    ctx.fillText(tekst, P.x, P.y);
  }

  function tekenUitslag(ctx, o, streken, u, vlak) {
    const m = Math.min(vlak.w, vlak.h);
    ctx.save();
    if (o.niveau === 4) { ctx.globalAlpha = 0.45; tekenReferentie(ctx, o, vlak, false); ctx.globalAlpha = 1; }
    ctx.lineCap = 'round';
    if (u.soort === 'verdeel') {
      const half = o.soort === 'rechthoek' ? null : 0.06 * m;
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 2.5;
      for (const q of u.paren) {
        const P = punt(o, q.ideal, 0);
        if (half === null) lijn(ctx, punt(o, q.ideal, -0.03 * m), punt(o, q.ideal, o.Q + 0.03 * m));
        else tick(ctx, o, P, half);
      }
      ctx.setLineDash([]);
      const buiten = (o.soort === 'rechthoek' ? 0.03 * m : half) + 0.04 * m;
      for (const q of u.paren) {
        if (q.p === null) continue;
        const slecht = q.e > o.tol / 2;
        const kl = slecht ? vlak.kleur.fout : vlak.kleur.goed;
        if (slecht) {
          ctx.strokeStyle = vlak.kleur.fout;
          ctx.lineWidth = 4;
          lijn(ctx, punt(o, q.ideal, 0), punt(o, q.p, 0));
        }
        ctx.fillStyle = kl;
        const P = punt(o, q.p, 0);
        ctx.beginPath();
        ctx.arc(P.x, P.y, 5, 0, Math.PI * 2);
        ctx.fill();
        if (slecht) label(ctx, vlak, pct(q.d), punt(o, q.p, -buiten), vlak.kleur.fout);
      }
    } else {
      const S = o.S, E = o.E;
      const tk = Math.max(8, 0.035 * m);
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = vlak.kleur.goed;
      ctx.lineWidth = 3;
      lijn(ctx, S, E);
      ctx.setLineDash([]);
      ctx.lineWidth = 3;
      tick(ctx, o, E, tk);
      const slecht = Math.abs(u.signed) > o.tol / 2;
      const Ep = { x: S.x + o.u.x * u.M, y: S.y + o.u.y * u.M };
      if (slecht) {
        ctx.strokeStyle = vlak.kleur.fout;
        ctx.lineWidth = 5;
        lijn(ctx, E, Ep);
      }
      ctx.fillStyle = slecht ? vlak.kleur.fout : vlak.kleur.goed;
      ctx.beginPath();
      ctx.arc(Ep.x, Ep.y, 5, 0, Math.PI * 2);
      ctx.fill();
      if (slecht) label(ctx, vlak, pct(u.signed), { x: E.x + o.v.x * 0.07 * m, y: E.y + o.v.y * 0.07 * m }, vlak.kleur.fout);
      if (u.alfa > 8) label(ctx, vlak, Math.round(u.alfa) + '° scheef', { x: S.x + o.v.x * 0.07 * m, y: S.y + o.v.y * 0.07 * m }, vlak.kleur.fout);
    }
    ctx.restore();
  }

  // Lege plek boven of onder de opgave (anders links/rechts ervan).
  function scorePlek(o, vlak) {
    const b = o.bbox, m = Math.min(vlak.w, vlak.h);
    const top0 = 0.13 * vlak.h;
    const boven = b.y0 - top0, onder = vlak.h - b.y1;
    if (Math.max(boven, onder) >= 0.2 * m) {
      return boven >= onder
        ? { x: vlak.w / 2, y: top0 + boven / 2 }
        : { x: vlak.w / 2, y: b.y1 + onder / 2 };
    }
    const links = b.x0, rechts = vlak.w - b.x1;
    if (Math.max(links, rechts) >= 0.25 * vlak.w) {
      return links >= rechts ? { x: links / 2, y: vlak.h / 2 } : { x: b.x1 + rechts / 2, y: vlak.h / 2 };
    }
    return { x: vlak.w / 2, y: boven >= onder ? top0 + Math.max(boven, 0) / 2 : b.y1 + Math.max(onder, 0) / 2 };
  }

  Tekentrainer.registreer({
    id: 'proporties',
    naam: 'Proporties',
    uitleg: 'Verdeel lijnen en vlakken eerlijk en kopieer lengtes, op het oog.',
    fundament: 'Meten op het oog: elke goede tekening begint met proporties.',
    meerdereStreken: true,
    stilNa: 1500,
    toonUitslag: 2200,
    nieuweOpgave,
    teken,
    isKlaar,
    nakijken,
    tekenUitslag,
    scorePlek,
  });
})();
