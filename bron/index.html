<meta charset="utf-8">
<title>S Pen Tekentrainer</title>
<meta name="theme-color" content="#e4e8ec">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
  /* Opzet: menu als schetsboek-index (groepen, kaarten met niveau-streepjes);
     tekenscherm met een compacte tweeregelige balk en een zo groot mogelijk vel. */
  :root {
    --bg: #e4e8ec; --paper: #fafbfb; --fg: #181c22; --fg-soft: #56606c; --line: #c3cad2;
    --accent: #b02a66; --good: #0063b3; --warn: #9a6200; --bad: #cc4a05;
    --guide: #7a8694; --guide-soft: #c9d0d8; --ink: #11141a;
    --kaart: #f4f6f8; --kaart-rand: #b9c1ca; --knop-tekst: #ffffff;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    color-scheme: light;
    height: 100%;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #101317; --paper: #1a1e24; --fg: #e9ecef; --fg-soft: #9ba5b1; --line: #343b44;
    --accent: #f08cb4; --good: #5db8f5; --warn: #f0c040; --bad: #ff8a4a;
    --guide: #7d8997; --guide-soft: #38414c; --ink: #f5f6f8;
    --kaart: #171b20; --kaart-rand: #3a424c; --knop-tekst: #101317; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #101317; --paper: #1a1e24; --fg: #e9ecef; --fg-soft: #9ba5b1; --line: #343b44;
    --accent: #f08cb4; --good: #5db8f5; --warn: #f0c040; --bad: #ff8a4a;
    --guide: #7d8997; --guide-soft: #38414c; --ink: #f5f6f8;
    --kaart: #171b20; --kaart-rand: #3a424c; --knop-tekst: #101317; color-scheme: dark; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- menu ---- */
  #menu { max-width: 820px; margin: 0 auto; min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(36px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #menu header { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; margin-bottom: 22px; }
  #menu .kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); margin: 0 0 4px; }
  #menu h1 { font-size: 1.75rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  #menu p.sub { color: var(--fg-soft); margin: 0; font-size: 0.95rem; line-height: 1.4; max-width: 46ch; }
  .groep { margin: 0 0 24px; }
  .groep h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 0.8rem; font-weight: 500;
    font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); }
  .groep h2::after { content: ""; flex: 1; border-top: 1px dashed var(--kaart-rand); transform: translateY(-3px); }
  .groep h2 small { font-size: inherit; color: var(--fg-soft); order: 3; }
  .groep .rij { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .kaart { position: relative; text-align: left; background: var(--kaart); border: 1px solid var(--kaart-rand); border-radius: 4px 14px 4px 14px;
    padding: 12px 14px 12px; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 4px; min-height: 108px; align-content: start;
    transition: transform .12s ease, border-color .12s ease; }
  .kaart:hover { border-color: var(--fg); }
  .kaart:active { transform: translateY(1px); }
  .kaart b { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .kaart .fund { grid-column: 1 / -1; color: var(--fg-soft); font-size: 0.86rem; line-height: 1.35; }
  .kaart .ico { width: 30px; height: 30px; color: var(--fg); grid-row: 1; grid-column: 2; }
  .kaart .onder { grid-column: 1 / -1; margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 0.74rem; color: var(--fg-soft); }
  .niv { display: inline-flex; gap: 3px; align-items: flex-end; }
  .niv i { display: block; width: 7px; background: var(--guide-soft); border: 1px solid var(--guide); border-radius: 1px; }
  .niv i:nth-child(1) { height: 7px; } .niv i:nth-child(2) { height: 10px; } .niv i:nth-child(3) { height: 13px; }
  .niv i:nth-child(4) { height: 16px; } .niv i:nth-child(5) { height: 19px; }
  .niv i.aan { background: var(--fg); border-color: var(--fg); }
  .kaart .cijfers { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
  .kaart .cijfers em { font-style: normal; color: var(--fg-soft); }
  #instellingen { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--fg-soft); font-size: 0.88rem; display: flex; gap: 10px; align-items: center; }
  #instellingen input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  #instellingen label { padding: 6px 0; }

  /* ---- tekenscherm ---- */
  #oefening { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--bg); }
  #balk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto; align-items: center; gap: 4px 6px;
    padding: calc(5px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 5px max(8px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--kaart-rand); background: var(--bg); }
  #balk button:not(.uitleg) { padding: 0; min-width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.15rem; line-height: 1; background: var(--kaart); border-color: var(--kaart-rand); }
  #balk .titel { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  #balk .stand { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.74rem; color: var(--fg-soft); text-align: center; min-width: 4.4em; line-height: 1.15; }
  #balk .stand b { display: block; font-size: 0.9rem; color: var(--fg); font-weight: 500; }
  #balk .uitleg { background: none; border: 0; grid-column: 1 / -1; margin: 0; padding: 0 4px; color: var(--fg-soft); font-size: 0.86rem; line-height: 1.3; text-align: left; border: 0; border-radius: 0; height: auto; min-height: 0; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #balk .uitleg.open { -webkit-line-clamp: unset; display: block; }
  #vlak { flex: 1; position: relative; background: var(--paper); min-height: 0; }
  #vlak canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #melding { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); max-width: 90%; text-align: center;
    padding: 7px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #melding.zicht { opacity: 1; }
  #klaar { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--knop-tekst);
    border: 0; border-radius: 4px 16px 4px 16px; min-width: 112px; min-height: 52px; padding: 0 24px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #klaar:active { transform: translateY(1px); box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { #melding, .kaart { transition: none; } }
</style>

<section id="menu">
  <header>
    <p class="kicker">Schetsboek &middot; 11 oefeningen</p>
    <h1>S Pen Tekentrainer</h1>
    <p class="sub">Korte oefeningen voor een sterke basis. Elke streek wordt meteen nagekeken en het niveau groeit mee.</p>
  </header>
  <div id="lijst"></div>
  <div id="instellingen">
    <input type="checkbox" id="vingerAan"><label for="vingerAan">Ook met vinger of muis tekenen (om te testen)</label>
  </div>
</section>

<section id="oefening" hidden>
  <div id="balk">
    <button id="terug" aria-label="Terug naar menu">&larr;</button>
    <span class="titel" id="oTitel"></span>
    <button id="nivMin" aria-label="Niveau omlaag">&minus;</button>
    <span class="stand" id="oStand"></span>
    <button id="nivPlus" aria-label="Niveau omhoog">+</button>
    <button id="volScherm" aria-label="Volledig scherm"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button>
    <button class="uitleg" id="oUitleg" type="button" aria-label="Uitleg, tik om uit te klappen"></button>
  </div>
  <div id="vlak">
    <canvas id="doek"></canvas>
    <div id="melding"></div>
    <button id="klaar" hidden>Klaar</button>
  </div>
</section>

<script src="hulp.js"></script>
<script>
// ---------- register ----------
window.Tekentrainer = { oefeningen: [], registreer(o) { this.oefeningen.push(o); } };
</script>
<script src="oefeningen/ellipsen.js"></script>
<script src="oefeningen/lijnen.js"></script>
<script src="oefeningen/cirkels.js"></script>
<script src="oefeningen/curves.js"></script>
<script src="oefeningen/slingerlijn.js"></script>
<script src="oefeningen/hoeken.js"></script>
<script src="oefeningen/arcering.js"></script>
<script src="oefeningen/proporties.js"></script>
<script src="oefeningen/perspectief.js"></script>
<script src="oefeningen/dozen.js"></script>
<script src="oefeningen/geheugen.js"></script>
<script>
(function () {
  const H = window.Hulp;
  const $ = (id) => document.getElementById(id);
  const doek = $('doek'), ctx = doek.getContext('2d');

  // ---------- opslag (alleen gemak op dit apparaat) ----------
  const opslag = {
    lees(k, d) { try { const v = localStorage.getItem('tt.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    schrijf(k, v) { try { localStorage.setItem('tt.' + k, JSON.stringify(v)); } catch (e) { /* geen opslag */ } },
  };
  const stand = (id) => opslag.lees('stand.' + id, { niveau: 1, scores: [], sindsWissel: 0, beste: 0 });

  // ---------- thema-kleuren voor de canvas ----------
  function kleuren() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    return { hulp: v('--guide'), hulpZacht: v('--guide-soft'), accent: v('--accent'), goed: v('--good'),
      fout: v('--bad'), tekst: v('--fg'), tekstZacht: v('--fg-soft'), inkt: v('--ink'), papier: v('--paper'), waarschuwing: v('--warn') };
  }

  // ---------- menu ----------
  const GROEPEN = [
    { naam: 'Lijnen & vormen', ids: ['lijnen', 'curves', 'slingerlijn', 'cirkels', 'ellipsen'] },
    { naam: 'Meten & richting', ids: ['hoeken', 'proporties', 'perspectief', 'dozen'] },
    { naam: 'Oog & hand', ids: ['arcering', 'geheugen'] },
  ];
  const SVGNS = 'http://www.w3.org/2000/svg';
  const ICONEN = {
    lijnen: 'M4 24 L26 6',
    curves: 'M3 22 C9 2 15 2 16 15 S24 28 27 8',
    slingerlijn: 'M3 15 C6 6 9 6 12 15 S18 24 21 15 S25 6 28 15',
    cirkels: 'M15 4a11 11 0 1 0 .01 0',
    ellipsen: 'M15 7 C25 7 28 12 28 15 S25 23 15 23 S2 18 2 15 S5 7 15 7',
    hoeken: 'M5 25 L5 5 M5 25 L26 25 M5 17 A8 8 0 0 1 13 25',
    proporties: 'M5 6 H25 M5 24 H25 M15 6 V24 M10 12 H20',
    perspectief: 'M3 25 L15 8 L27 25 M9 25 L15 8 L21 25 M3 25 H27',
    dozen: 'M5 11 L15 6 L25 11 L25 22 L15 27 L5 22 Z M5 11 L15 16 L25 11 M15 16 V27',
    arcering: 'M6 24 L14 6 M12 24 L20 6 M18 24 L26 6 M4 17 L9 6',
    geheugen: 'M4 15 C9 7 21 7 26 15 C21 23 9 23 4 15 M15 11a4 4 0 1 0 .01 0',
  };
  function ikoon(id) {
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 30 30');
    svg.setAttribute('class', 'ico');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.8');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', ICONEN[id] || 'M5 15 H25');
    svg.appendChild(p);
    return svg;
  }
  function kaart(o) {
    const s = stand(o.id);
    const laatste = s.scores.slice(-10);
    const b = document.createElement('button');
    b.className = 'kaart';
    b.type = 'button';
    const naam = document.createElement('b'); naam.textContent = o.naam;
    const fund = document.createElement('span'); fund.className = 'fund'; fund.textContent = o.fundament;
    const onder = document.createElement('span'); onder.className = 'onder';
    const niv = document.createElement('span'); niv.className = 'niv';
    niv.setAttribute('role', 'img'); niv.setAttribute('aria-label', 'Niveau ' + s.niveau + ' van 5');
    for (let i = 1; i <= 5; i++) { const t = document.createElement('i'); if (i <= s.niveau) t.className = 'aan'; niv.appendChild(t); }
    const cijfers = document.createElement('span'); cijfers.className = 'cijfers';
    if (laatste.length) { cijfers.innerHTML = '<em>gem.</em> ' + Math.round(H.gemiddelde(laatste)) + ' &middot; <em>beste</em> ' + s.beste; }
    else { cijfers.textContent = 'nog niet geoefend'; cijfers.style.color = 'var(--fg-soft)'; }
    onder.append(niv, cijfers);
    b.append(naam, ikoon(o.id), fund, onder);
    b.addEventListener('click', () => start(o));
    return b;
  }
  function toonMenu() {
    huidig = null;
    $('oefening').hidden = true;
    $('menu').hidden = false;
    const lijst = $('lijst');
    lijst.innerHTML = '';
    const alle = Tekentrainer.oefeningen.slice();
    const gebruikt = new Set();
    const groepen = GROEPEN.map((g) => ({ naam: g.naam, items: g.ids.map((id) => alle.find((o) => o.id === id)).filter(Boolean) }));
    groepen.forEach((g) => g.items.forEach((o) => gebruikt.add(o.id)));
    const rest = alle.filter((o) => !gebruikt.has(o.id));
    if (rest.length) groepen.push({ naam: 'Overig', items: rest });
    groepen.forEach((g, gi) => {
      if (!g.items.length) return;
      const sec = document.createElement('section');
      sec.className = 'groep';
      const h = document.createElement('h2');
      h.textContent = String(gi + 1).padStart(2, '0') + ' ' + g.naam;
      const rij = document.createElement('div');
      rij.className = 'rij';
      g.items.forEach((o) => rij.appendChild(kaart(o)));
      sec.append(h, rij);
      lijst.appendChild(sec);
    });
  }
  $('vingerAan').checked = opslag.lees('vinger', false);
  $('vingerAan').addEventListener('change', (e) => opslag.schrijf('vinger', e.target.checked));

  // ---------- oefening ----------
  let huidig = null;   // { o, s, opgave, streken, fase, start, uitslag, actief }
  let vlak = { w: 1, h: 1, pxPerMm: 96 / 25.4, kleur: kleuren() };
  const rng = H.maakRng(Date.now());

  function start(o) {
    $('menu').hidden = true;
    $('oefening').hidden = false;
    $('oTitel').textContent = o.naam;
    $('oUitleg').textContent = o.uitleg;
    $('oUitleg').classList.remove('open');
    $('klaar').hidden = !o.meerdereStreken;
    huidig = { o, s: stand(o.id), streken: [], fase: 'tekenen' };
    maat();
    nieuweOpgave();
  }

  function nieuweOpgave() {
    const h = huidig;
    clearTimeout(h.verbergTimer);
    h.streken = [];
    h.actief = null;
    h.uitslag = null;
    h.fase = 'tekenen';
    h.verborgen = false;
    h.opgave = h.o.nieuweOpgave(h.s.niveau, rng, vlak);
    window.__tt = h;
    h.start = performance.now();
    if (h.opgave.verbergNa) h.verbergTimer = setTimeout(() => { h.verborgen = true; teken(); }, h.opgave.verbergNa);
    werkStand();
    teken();
  }

  function werkStand() {
    const s = huidig.s, laatste = s.scores.slice(-5);
    $('oStand').innerHTML = '<b>Niv. ' + s.niveau + '</b>' + (laatste.length ? 'gem. ' + Math.round(H.gemiddelde(laatste)) : 'nieuw');
  }

  function zetNiveau(n, tekst) {
    const s = huidig.s;
    n = H.clamp(n, 1, 5);
    if (n === s.niveau) return;
    s.niveau = n;
    s.sindsWissel = 0;
    opslag.schrijf('stand.' + huidig.o.id, s);
    melding(tekst || 'Niveau ' + n);
    werkStand();
  }
  $('nivMin').addEventListener('click', () => { zetNiveau(huidig.s.niveau - 1); nieuweOpgave(); });
  $('nivPlus').addEventListener('click', () => { zetNiveau(huidig.s.niveau + 1); nieuweOpgave(); });
  $('oUitleg').addEventListener('click', (e) => e.currentTarget.classList.toggle('open'));
  $('terug').addEventListener('click', toonMenu);
  $('volScherm').addEventListener('click', () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  });

  let meldTimer = 0;
  function melding(t) {
    const m = $('melding');
    m.textContent = t;
    m.classList.add('zicht');
    clearTimeout(meldTimer);
    meldTimer = setTimeout(() => m.classList.remove('zicht'), 1600);
  }

  function nakijken() {
    const h = huidig;
    if (!h || h.fase !== 'tekenen' || !h.streken.length) return;
    let u;
    try { u = h.o.nakijken(h.opgave, h.streken, vlak); }
    catch (e) { console.error(e); u = { ongeldig: 'Er ging iets mis bij het nakijken.' }; }
    if (u && !u.ongeldig && !Number.isFinite(u.score)) { console.error('Ongeldige score', u); u = { ongeldig: 'Er ging iets mis bij het nakijken.' }; }
    if (!u || u.ongeldig) {
      melding((u && u.ongeldig) || 'Probeer opnieuw');
      h.streken = [];
      teken();
      return;
    }
    u.score = Math.round(H.clamp(u.score, 0, 100));
    h.uitslag = u;
    h.fase = 'uitslag';
    h.uitslagT = performance.now();

    const s = h.s;
    s.scores.push(u.score);
    if (s.scores.length > 200) s.scores.shift();
    s.sindsWissel++;
    s.beste = Math.max(s.beste || 0, u.score);
    const l5 = s.scores.slice(-5), l3 = s.scores.slice(-3);
    let wissel = 0;
    if (s.sindsWissel >= 5 && H.gemiddelde(l5) >= 80 && s.niveau < 5) wissel = 1;
    else if (s.sindsWissel >= 3 && l3.every((x) => x < 45) && s.niveau > 1) wissel = -1;
    opslag.schrijf('stand.' + h.o.id, s);
    teken();
    setTimeout(() => {
      if (huidig !== h) return;
      if (wissel) zetNiveau(s.niveau + wissel, wissel > 0 ? 'Niveau omhoog: ' + (s.niveau + 1) : 'Even een niveau terug: ' + (s.niveau - 1));
      nieuweOpgave();
    }, h.o.toonUitslag || 1400);
    werkStand();
  }
  $('klaar').addEventListener('click', nakijken);

  // ---------- tekenen ----------
  function maat() {
    const r = $('vlak').getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    doek.width = Math.round(r.width * dpr);
    doek.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vlak = { w: r.width, h: r.height, pxPerMm: 96 / 25.4, kleur: kleuren() };
  }

  function tekenStreek(st) {
    const p = st.punten;
    ctx.strokeStyle = vlak.kleur.inkt;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (p.length === 1) { ctx.fillStyle = vlak.kleur.inkt; ctx.beginPath(); ctx.arc(p[0].x, p[0].y, 1.5, 0, 7); ctx.fill(); return; }
    for (let i = 1; i < p.length; i++) {
      ctx.lineWidth = 1.2 + 2.6 * ((p[i].p || 0.5) + (p[i - 1].p || 0.5)) / 2;
      ctx.beginPath();
      ctx.moveTo(p[i - 1].x, p[i - 1].y);
      ctx.lineTo(p[i].x, p[i].y);
      ctx.stroke();
    }
  }

  function rondRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function breek(tekst, maxB) {
    const regels = []; let r = '';
    for (const w of String(tekst).split(/\s+/)) {
      const t = r ? r + ' ' + w : w;
      if (r && ctx.measureText(t).width > maxB) { regels.push(r); r = w; } else r = t;
    }
    if (r) regels.push(r);
    return regels.slice(0, 3);
  }
  function tekenScore(u) {
    const plek = huidig.o.scorePlek ? huidig.o.scorePlek(huidig.opgave, vlak) : { x: vlak.w / 2, y: vlak.h / 2 };
    const sterk = u.score >= 80, matig = u.score >= 60;
    const k = sterk ? vlak.kleur.goed : matig ? vlak.kleur.waarschuwing : vlak.kleur.fout;
    const woord = sterk ? 'Sterk' : matig ? 'Bijna' : 'Oefen door';
    const fam = getComputedStyle(document.body).fontFamily;
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono') || fam;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t = reduced ? 1 : H.clamp((performance.now() - (huidig.uitslagT || 0)) / 380, 0, 1);
    const e = 1 - Math.pow(1 - t, 3);
    const grootte = Math.round(H.clamp(Math.min(vlak.w, vlak.h) * 0.13, 38, 84));
    const tf = Math.round(H.clamp(grootte * 0.3, 13, 20));
    const maxB = Math.min(vlak.w * 0.84, 340);
    ctx.save();
    ctx.font = '500 ' + tf + 'px ' + fam;
    const regels = u.tip ? breek(u.tip, maxB - 28) : [];
    const lh = tf * 1.3;
    const cw = Math.max(regels.reduce((m, r) => Math.max(m, ctx.measureText(r).width), 0) + 28, grootte * 2.2, 120);
    const ch = 8 + grootte + 20 + (regels.length ? regels.length * lh + 14 : 0) + 6;
    const cx = H.clamp(plek.x, cw / 2 + 8, Math.max(cw / 2 + 8, vlak.w - cw / 2 - 8));
    const cy = H.clamp(plek.y, ch / 2 + 8, Math.max(ch / 2 + 8, vlak.h - ch / 2 - 8));
    ctx.translate(cx, cy + (1 - e) * 10);
    ctx.scale(0.92 + 0.08 * e, 0.92 + 0.08 * e);
    rondRect(-cw / 2, -ch / 2, cw, ch, 12);
    ctx.globalAlpha = 0.94 * e; ctx.fillStyle = vlak.kleur.papier; ctx.fill();
    ctx.globalAlpha = e; ctx.lineWidth = 2.5; ctx.strokeStyle = k; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let y = -ch / 2 + 8 + grootte / 2;
    ctx.font = '800 ' + grootte + 'px ' + fam;
    ctx.fillStyle = k;
    ctx.fillText(String(u.score), 0, y);
    y += grootte / 2 + 12;
    ctx.font = '500 ' + Math.max(11, Math.round(tf * 0.8)) + 'px ' + mono;
    ctx.fillStyle = vlak.kleur.tekstZacht;
    ctx.fillText(woord.toUpperCase(), 0, y);
    if (regels.length) {
      y += 10 + lh / 2 + 4;
      ctx.font = '500 ' + tf + 'px ' + fam;
      ctx.fillStyle = vlak.kleur.tekst;
      regels.forEach((r, i) => ctx.fillText(r, 0, y + i * lh));
    }
    ctx.restore();
  }

  function teken() {
    const h = huidig;
    if (!h) return;
    ctx.clearRect(0, 0, vlak.w, vlak.h);
    const info = { nu: performance.now(), sinds: performance.now() - h.start, verborgen: h.verborgen, streken: h.streken };
    try { h.o.teken(ctx, h.opgave, vlak, info); } catch (e) { console.error(e); }
    for (const st of h.streken) tekenStreek(st);
    if (h.actief) tekenStreek(h.actief);
    if (h.fase === 'uitslag' && h.uitslag) {
      try { h.o.tekenUitslag && h.o.tekenUitslag(ctx, h.opgave, h.streken, h.uitslag, vlak); } catch (e) { console.error(e); }
      tekenScore(h.uitslag);
    }
  }

  (function lus() {
    if (huidig && huidig.opgave && ((huidig.opgave.animeer && huidig.fase === 'tekenen') || (huidig.fase === 'uitslag' && performance.now() - (huidig.uitslagT || 0) < 450))) teken();
    requestAnimationFrame(lus);
  })();

  // ---------- invoer ----------
  const magTekenen = (e) => e.pointerType === 'pen' || $('vingerAan').checked;
  let stilTimer = 0;

  function punt(e) {
    const r = doek.getBoundingClientRect();
    const p = e.pointerType === 'pen' ? e.pressure : 0.5;
    return { x: e.clientX - r.left, y: e.clientY - r.top, p, t: e.timeStamp };
  }

  doek.addEventListener('pointerdown', (e) => {
    if (!huidig || huidig.fase !== 'tekenen' || !magTekenen(e)) return;
    e.preventDefault();
    clearTimeout(stilTimer);
    doek.setPointerCapture(e.pointerId);
    huidig.actief = { punten: [punt(e)], id: e.pointerId };
    teken();
  });
  doek.addEventListener('pointermove', (e) => {
    const a = huidig && huidig.actief;
    if (!a || a.id !== e.pointerId) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) a.punten.push(punt(ev));
    teken();
  });
  function einde(e) {
    const h = huidig, a = h && h.actief;
    if (!a || a.id !== e.pointerId) return;
    a.punten.push(punt(e));
    h.actief = null;
    h.streken.push({ punten: a.punten });
    teken();
    const klaar = h.o.isKlaar ? h.o.isKlaar(h.opgave, h.streken) : !h.o.meerdereStreken;
    if (klaar) nakijken();
    else if (h.o.stilNa) stilTimer = setTimeout(nakijken, h.o.stilNa);
  }
  doek.addEventListener('pointerup', einde);
  doek.addEventListener('pointercancel', einde);
  window.addEventListener('contextmenu', (e) => { if (huidig) e.preventDefault(); });

  window.addEventListener('resize', () => { if (huidig) { maat(); nieuweOpgave(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { vlak.kleur = kleuren(); teken(); });

  toonMenu();
})();
</script>
